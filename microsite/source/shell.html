<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everlit · Executive brief</title>
<meta name="description" content="Everlit: executive brief, how it works, and the product, in one offline file.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="everlit-icon.svg">
<style>
:root{
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --bg:#f6f7f9; --surface:#ffffff; --surface-3:#e9eef5; --fg:#0f172a; --muted:#64748b; --border:#e2e8f0; --border-strong:#cbd5e1;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-fg:#ffffff; --accent-soft:rgba(79,70,229,.08);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -8px rgba(15,23,42,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#111827; --surface-3:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --border:#1f2937; --border-strong:#334155;
  --accent:#818cf8; --accent-hover:#a5b4fc; --accent-fg:#0b1120; --accent-soft:rgba(129,140,248,.12); --shadow:0 8px 24px -8px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111827; --surface-3:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --border:#1f2937; --border-strong:#334155;
  --accent:#818cf8; --accent-hover:#a5b4fc; --accent-fg:#0b1120; --accent-soft:rgba(129,140,248,.12); --shadow:0 8px 24px -8px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;white-space:nowrap}
.brand img{width:24px;height:24px;border-radius:6px;display:block}
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3);margin:0 auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap;transition:background-color 150ms ease,color 150ms ease}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.right{display:flex;align-items:center;gap:4px}
.tour{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:550;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.tour:hover{background:var(--accent-hover)}
.tour:active,.ib:active{transform:scale(.97)}
.ib{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--muted);transition:transform 160ms var(--ease-out),background-color 150ms ease}
.ib:hover{background:var(--surface-3);color:var(--fg)}
.menu{position:absolute;top:44px;right:10px;min-width:260px;padding:6px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);transform-origin:top right;transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out)}
.menu[hidden]{display:block;opacity:0;transform:scale(.97);pointer-events:none;visibility:hidden}
.menu label{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.menu label:hover{background:var(--surface-3)}
.menu input{margin:2px 0 0;accent-color:var(--accent)}
.menu small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .meta{padding:6px 10px;color:var(--muted);font-size:12px}
.stage{position:fixed;inset:48px 0 0 0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.stage iframe[hidden]{display:none}
.tabs .ts{display:none}
@media (max-width:720px){.brand span,.tour span{display:none}.tour{padding:0 10px}.bar{gap:8px;padding:0 8px}}
@media (max-width:480px){#themeBtn{display:none}.tabs button{padding:5px 9px}.tabs .tl{display:none}.tabs .ts{display:inline}.bar{gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="everlit-icon.svg" alt=""><span>Everlit</span></div>
  <nav class="tabs" role="tablist" aria-label="Views"><!--TABS--></nav>
  <div class="right">
    <button class="tour" id="tourBtn" type="button" title="A guided, self-running tour of the product"><svg class="i" viewBox="0 0 24 24"><path d="M6 4v16l14-8z"/></svg><span>3-minute tour</span></button>
    <button class="ib" id="themeBtn" type="button" aria-label="Theme"></button>
    <button class="ib" id="moreBtn" type="button" aria-label="More options" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
  <div class="menu" id="menu" hidden role="menu">
    <label><input type="checkbox" id="roadmapChk"><span>Show roadmap badges<small>Marks capabilities planned for Phase 2 and Phase 3 of the rollout.</small></span></label>
    <hr>
    <div class="meta">Runs entirely offline · one file</div>
  </div>
</header>
<main class="stage" id="stage"></main>
<!--VIEWS-->
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const VIEWS = ["executive", "overview", "product"];
const TITLES = { executive: "Executive brief", overview: "How it works", product: "Product" };
const frames = {}, ready = {}, pending = {};
const store = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
let roadmap = store.get("everlit-roadmap") === "on";
let theme = store.get("everlit-theme") || "system";
let current = null;

const post = (v, msg) => { if (ready[v]) frames[v].contentWindow.postMessage(msg, "*"); else (pending[v] = pending[v] || []).push(msg); };
const broadcast = msg => Object.keys(frames).forEach(v => post(v, msg));

function frame(v) {
  if (frames[v]) return frames[v];
  const f = document.createElement("iframe");
  f.title = TITLES[v]; f.id = "view-" + v; f.hidden = true;
  f.addEventListener("load", () => {
    ready[v] = true;
    f.contentWindow.postMessage({ everlit: "roadmap", on: roadmap }, "*");
    f.contentWindow.postMessage({ everlit: "theme", mode: theme }, "*");
    (pending[v] || []).splice(0).forEach(m => f.contentWindow.postMessage(m, "*"));
  });
  f.srcdoc = JSON.parse(document.getElementById("src-" + v).textContent);
  $("#stage").append(f);
  return frames[v] = f;
}

function show(v, push) {
  if (!VIEWS.includes(v)) v = "executive";
  frame(v);
  VIEWS.forEach(x => { if (frames[x]) frames[x].hidden = x !== v; const t = document.getElementById("tab-" + x); t.setAttribute("aria-selected", String(x === v)); t.tabIndex = x === v ? 0 : -1; });
  document.title = "Everlit · " + TITLES[v];
  current = v;
  if (push !== false && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = (VIEWS.indexOf(current) + (e.key === "ArrowRight" ? 1 : VIEWS.length - 1)) % VIEWS.length;
  show(VIEWS[i]); document.getElementById("tab-" + VIEWS[i]).focus();
});
addEventListener("hashchange", () => show(location.hash.slice(1), false));

function startTour() { show("product"); post("product", { everlit: "tour" }); }
$("#tourBtn").addEventListener("click", startTour);

/* roadmap badges */
const chk = $("#roadmapChk");
function setRoadmap(on) { roadmap = !!on; chk.checked = roadmap; store.set("everlit-roadmap", roadmap ? "on" : "off"); broadcast({ everlit: "roadmap", on: roadmap }); }
chk.checked = roadmap;
chk.addEventListener("change", () => setRoadmap(chk.checked));

/* theme: system → light → dark, shared with every view */
const ICONS = { system: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>', light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>', dark: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' };
function applyTheme(t, tell) {
  theme = ["system", "light", "dark"].includes(t) ? t : "system";
  if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = theme;
  $("#themeBtn").innerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS[theme]}</svg>`;
  $("#themeBtn").setAttribute("aria-label", `Theme: ${theme}. Click to change`);
  store.set("everlit-theme", theme);
  if (tell) broadcast({ everlit: "theme", mode: theme });
}
applyTheme(theme, false);
$("#themeBtn").addEventListener("click", () => applyTheme(["system", "light", "dark"][(["system", "light", "dark"].indexOf(theme) + 1) % 3], true));

/* menu */
const menu = $("#menu"), more = $("#moreBtn");
const openMenu = o => { menu.hidden = !o; more.setAttribute("aria-expanded", String(o)); };
more.addEventListener("click", e => { e.stopPropagation(); openMenu(menu.hidden); });
document.addEventListener("click", e => { if (!menu.contains(e.target)) openMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") openMenu(false); });
addEventListener("blur", () => openMenu(false));

/* messages from the views */
addEventListener("message", e => {
  const d = e.data || {}; if (!d.everlit || !Object.values(frames).some(f => f.contentWindow === e.source)) return;
  if (d.everlit === "view") { show(d.view); if (d.tour) post("product", { everlit: "tour" }); else if (d.anchor) post(d.view, { everlit: "anchor", id: d.anchor }); }
  else if (d.everlit === "tour") startTour();
  else if (d.everlit === "roadmap") setRoadmap(d.on);
  else if (d.everlit === "theme") { applyTheme(d.mode, false); Object.keys(frames).forEach(v => { if (frames[v].contentWindow !== e.source) post(v, { everlit: "theme", mode: theme }); }); }
});

window.__shell = { show, frames, setRoadmap, startTour };
show(location.hash.slice(1) || "executive");
})();
</script>
</body>
</html>
