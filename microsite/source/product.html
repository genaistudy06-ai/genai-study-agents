<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everlit — Vulnerability Management</title>
<link rel="icon" type="image/svg+xml" href="everlit-icon.svg">
<meta name="description" content="Everlit: context-aware vulnerability management, from entitlements to a verified fix.">
<meta name="color-scheme" content="light dark">
<style>
/* ---------------------------------------------------------------- tokens: mirror src/app/globals.css */
:root{
  color-scheme:light;
  --background:#f6f7f9; --surface:#ffffff; --foreground:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --hover:#f1f5f9; --subtle:#f8fafc; --track:#f1f5f9;
  --ease-out-strong:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --indigo:#4f46e5; --indigo-hover:#4338ca; --indigo-text:#4338ca; --indigo-soft:#eef2ff; --indigo-bar:#6366f1;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,Menlo,monospace;
  --rose-bg:#fff1f2; --rose-tx:#be123c; --rose-rg:rgba(225,29,72,.2); --rose-dot:#f43f5e;
  --orange-bg:#fff7ed; --orange-tx:#c2410c; --orange-rg:rgba(234,88,12,.2); --orange-dot:#f97316;
  --amber-bg:#fffbeb; --amber-tx:#b45309; --amber-rg:rgba(217,119,6,.2); --amber-dot:#f59e0b;
  --slate-bg:#f1f5f9; --slate-tx:#475569; --slate-rg:rgba(100,116,139,.2); --slate-dot:#94a3b8;
  --emerald-bg:#ecfdf5; --emerald-tx:#047857; --emerald-rg:rgba(5,150,105,.2);
  --blue-bg:#eff6ff; --blue-tx:#1d4ed8; --blue-rg:rgba(37,99,235,.2);
  --violet-bg:#f5f3ff; --violet-tx:#6d28d9; --violet-rg:rgba(124,58,237,.2);
  --console:#0b1120;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --background:#0b1120; --surface:#111827; --foreground:#e2e8f0; --muted:#94a3b8; --border:#1f2937;
    --hover:rgba(255,255,255,.05); --subtle:rgba(255,255,255,.04); --track:rgba(255,255,255,.06);
    --indigo-text:#818cf8; --indigo-soft:rgba(99,102,241,.12); --indigo-bar:#6366f1;
    --rose-bg:rgba(244,63,94,.1); --rose-tx:#fb7185; --rose-rg:rgba(244,63,94,.3);
    --orange-bg:rgba(249,115,22,.1); --orange-tx:#fb923c; --orange-rg:rgba(249,115,22,.3);
    --amber-bg:rgba(245,158,11,.1); --amber-tx:#fbbf24; --amber-rg:rgba(245,158,11,.3);
    --slate-bg:rgba(100,116,139,.1); --slate-tx:#94a3b8; --slate-rg:rgba(100,116,139,.3);
    --emerald-bg:rgba(16,185,129,.1); --emerald-tx:#34d399; --emerald-rg:rgba(16,185,129,.3);
    --blue-bg:rgba(59,130,246,.1); --blue-tx:#60a5fa; --blue-rg:rgba(59,130,246,.3);
    --violet-bg:rgba(139,92,246,.1); --violet-tx:#a78bfa; --violet-rg:rgba(139,92,246,.3);
    --console:#060a14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:#0b1120; --surface:#111827; --foreground:#e2e8f0; --muted:#94a3b8; --border:#1f2937;
  --hover:rgba(255,255,255,.05); --subtle:rgba(255,255,255,.04); --track:rgba(255,255,255,.06);
  --indigo-text:#818cf8; --indigo-soft:rgba(99,102,241,.12); --indigo-bar:#6366f1;
  --rose-bg:rgba(244,63,94,.1); --rose-tx:#fb7185; --rose-rg:rgba(244,63,94,.3);
  --orange-bg:rgba(249,115,22,.1); --orange-tx:#fb923c; --orange-rg:rgba(249,115,22,.3);
  --amber-bg:rgba(245,158,11,.1); --amber-tx:#fbbf24; --amber-rg:rgba(245,158,11,.3);
  --slate-bg:rgba(100,116,139,.1); --slate-tx:#94a3b8; --slate-rg:rgba(100,116,139,.3);
  --emerald-bg:rgba(16,185,129,.1); --emerald-tx:#34d399; --emerald-rg:rgba(16,185,129,.3);
  --blue-bg:rgba(59,130,246,.1); --blue-tx:#60a5fa; --blue-rg:rgba(59,130,246,.3);
  --violet-bg:rgba(139,92,246,.1); --violet-tx:#a78bfa; --violet-rg:rgba(139,92,246,.3);
  --console:#060a14;
}

/* ---------------------------------------------------------------- base */
*,*::before,*::after{box-sizing:border-box;border-color:var(--border)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:not(:disabled),.press{transition:color 150ms var(--ease-out-strong),background-color 150ms var(--ease-out-strong),border-color 150ms var(--ease-out-strong),box-shadow 150ms var(--ease-out-strong),transform 150ms var(--ease-out-strong)}
button:not(:disabled):not([data-no-press]):active,.press:active{transform:scale(.97)}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--mono);font-size:12px}
[hidden]{display:none !important}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:14px;height:14px}.i-lg{width:20px;height:20px}.i-xl{width:24px;height:24px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 40%,transparent);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}
@media (pointer:coarse){input,select,textarea{font-size:16px}}

/* ---------------------------------------------------------------- shell (AppShell + Sidebar) */
.shell{display:flex;min-height:100vh}
.sidebar{display:flex;flex-direction:column;width:256px;height:100dvh;flex:none;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:0}
.sb-brand{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border)}
.sb-brand > .i{color:var(--indigo);width:24px;height:24px}
.sb-brand p{font-size:14px;font-weight:600;line-height:1.2}
.sb-brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.sb-nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.sb-link{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);transition:background-color 150ms ease,color 150ms ease}
.sb-link:hover{background:var(--hover);color:var(--foreground)}
.sb-link.active{background:var(--indigo-soft);color:var(--indigo-text)}
.sb-link .tag{margin-left:auto;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;color:var(--violet-tx);background:var(--violet-bg);box-shadow:inset 0 0 0 1px var(--violet-rg)}
.sb-sep{height:1px;background:var(--border);margin:8px 4px}
.sb-foot{border-top:1px solid var(--border);padding:12px;position:relative}
.sb-user{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;width:100%;text-align:left}
.sb-user:hover{background:var(--hover)}
.avatar{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border-radius:50%;background:#e0e7ff;color:#4338ca;font-size:12px;font-weight:600}
:root[data-theme="dark"] .avatar{background:rgba(99,102,241,.2);color:#a5b4fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .avatar{background:rgba(99,102,241,.2);color:#a5b4fc}}
.sb-user .who{min-width:0;flex:1}
.sb-user .who p{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-note{margin-top:8px;padding:0 4px;font-size:11px;line-height:1.35;color:var(--muted)}
.more-kpis{margin-top:12px}
.more-kpis>summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--foreground);padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);list-style:none}
.more-kpis>summary::-webkit-details-marker{display:none}
.more-kpis>summary::before{content:"▸";color:var(--muted);transition:transform 150ms ease}
.more-kpis[open]>summary::before{transform:rotate(90deg)}
.more-kpis[open]>summary{margin-bottom:12px}
@media print{.more-kpis>summary{display:none}}
.menu{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px -8px rgba(15,23,42,.25);padding:6px;z-index:60;transform-origin:50% 100%;animation:pop 160ms var(--ease-out-strong)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
.menu .mh{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;font-size:13px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button .r{margin-left:auto;font-size:11px;color:var(--muted)}
.menu .avatar{width:24px;height:24px;font-size:10px}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.main{min-width:0;flex:1;overflow-x:hidden}
.page{max-width:1280px;margin:0 auto;padding:32px 24px}
@media (min-width:640px){.page{padding:32px}}
.topbar{display:none}
.scrim{display:none}
@media (max-width:767px){
  .topbar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}
  .topbar > .i{color:var(--indigo)}
  .topbar button .i{color:var(--foreground);width:20px;height:20px}
  .topbar p{font-size:14px;font-weight:600}
  .main{padding-top:56px}
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%);transition:transform 250ms var(--ease-drawer)}
  .shell.nav-open .sidebar{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity 250ms var(--ease-drawer)}
  .shell.nav-open .scrim{opacity:1;pointer-events:auto}
}

/* ---------------------------------------------------------------- primitives (Card, StatTile, Badge, Pill) */
.stack > * + *{margin-top:24px}
.stack-lg > * + *{margin-top:32px}
.stack-sm > * + *{margin-top:12px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px}
.ph h1{font-size:20px;font-weight:600;line-height:1.4}
.ph p.sub{margin-top:4px;font-size:14px;color:var(--muted);max-width:720px}
.back{font-size:14px;font-weight:500;color:var(--muted)}
.back:hover{color:var(--foreground)}
.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.card.pad{padding:20px}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.ch h3{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.ch p{margin-top:2px;font-size:12px;color:var(--muted)}
.help{display:inline-flex;color:var(--muted);cursor:help}
.help .i{width:14px;height:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lg2,.lg3{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.lg2{grid-template-columns:repeat(2,minmax(0,1fr))}.lg3{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}}
.stat .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat .val{margin-top:8px;font-size:24px;font-weight:600}
.stat .sl{margin-top:4px;font-size:12px;color:var(--muted)}
.stat .sl.up{color:#059669}.stat .sl.down{color:#e11d48}
.kpi{position:relative;overflow:hidden;--k:#94a3b8;--kbg:var(--slate-bg)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.kpi.k-good{--k:#059669;--kbg:var(--emerald-bg)}.kpi.k-warn{--k:#d97706;--kbg:var(--amber-bg)}.kpi.k-crit{--k:#e11d48;--kbg:var(--rose-bg)}.kpi.k-info{--k:#4f46e5;--kbg:var(--indigo-soft)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kchip{display:inline-flex;align-items:center;gap:4px;flex:none;max-width:60%;padding:2px 8px 2px 6px;border-radius:999px;background:var(--kbg);color:var(--foreground);font-size:11px;font-weight:600;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kchip .i{width:13px;height:13px;color:var(--k);flex:none;stroke-width:2.5}
.kpi .sl{color:var(--muted)}
.kmeter{position:relative;height:6px;margin-top:10px;border-radius:999px;background:color-mix(in srgb,var(--k) 18%,transparent)}
.kmeter>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--k);min-width:4px}
.kmeter>b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--foreground)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.k-good{--k:#10b981}:root:not([data-theme="light"]) .kpi.k-warn{--k:#f59e0b}:root:not([data-theme="light"]) .kpi.k-crit{--k:#f43f5e}:root:not([data-theme="light"]) .kpi.k-info{--k:#818cf8}}
:root[data-theme="dark"] .kpi.k-good{--k:#10b981}:root[data-theme="dark"] .kpi.k-warn{--k:#f59e0b}:root[data-theme="dark"] .kpi.k-crit{--k:#f43f5e}:root[data-theme="dark"] .kpi.k-info{--k:#818cf8}
@media (forced-colors:active){.kpi::before,.kmeter>i{background:CanvasText}}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.badge .d{width:6px;height:6px;border-radius:50%}
.t-rose{background:var(--rose-bg);color:var(--rose-tx);box-shadow:inset 0 0 0 1px var(--rose-rg)}
.t-orange{background:var(--orange-bg);color:var(--orange-tx);box-shadow:inset 0 0 0 1px var(--orange-rg)}
.t-amber{background:var(--amber-bg);color:var(--amber-tx);box-shadow:inset 0 0 0 1px var(--amber-rg)}
.t-slate,.t-neutral{background:var(--slate-bg);color:var(--slate-tx);box-shadow:inset 0 0 0 1px var(--slate-rg)}
.t-emerald{background:var(--emerald-bg);color:var(--emerald-tx);box-shadow:inset 0 0 0 1px var(--emerald-rg)}
.t-blue{background:var(--blue-bg);color:var(--blue-tx);box-shadow:inset 0 0 0 1px var(--blue-rg)}
.t-violet{background:var(--violet-bg);color:var(--violet-tx);box-shadow:inset 0 0 0 1px var(--violet-rg)}
.kev{display:inline-flex;align-items:center;border-radius:999px;background:#e11d48;color:#fff;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.link{color:var(--indigo);font-weight:500}
.link:hover{text-decoration:underline}
:root[data-theme="dark"] .link{color:#818cf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:#818cf8}}
.muted{color:var(--muted)}
.xs{font-size:12px}.sm{font-size:14px}
.fw5{font-weight:500}.fw6{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divide > * + *{border-top:1px solid var(--border)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.btn-indigo{background:var(--indigo);color:#fff}.btn-indigo:hover:not(:disabled){background:var(--indigo-hover)}
.btn-emerald{background:#059669;color:#fff}.btn-emerald:hover:not(:disabled){background:#047857}
.btn-blue{background:#2563eb;color:#fff}.btn-blue:hover:not(:disabled){background:#1d4ed8}
.btn-violet{background:#7c3aed;color:#fff}.btn-violet:hover:not(:disabled){background:#6d28d9}
.btn-outline{border-color:var(--border);color:var(--foreground);background:transparent}.btn-outline:hover:not(:disabled){background:var(--hover)}
.btn-xs{padding:4px 10px;font-size:12px}
.btn-lg{padding:8px 16px}
.fl{display:block;margin-bottom:4px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.inp,.sel,.ta{height:36px;border-radius:8px;border:1px solid var(--border);background:var(--background);padding:0 10px;font-size:14px;color:var(--foreground)}
.ta{height:auto;padding:10px 12px;font-family:var(--mono);font-size:12px;width:100%;resize:vertical;line-height:1.55}
.inp:focus,.sel:focus,.ta:focus{outline:none;box-shadow:0 0 0 2px #6366f1}
.inp:disabled,.sel:disabled{opacity:.6;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;font-size:14px}
.seg button{border-radius:6px;padding:4px 12px;color:var(--muted)}
.seg button.on{background:var(--indigo);color:#fff}
.chk{width:16px;height:16px;accent-color:var(--indigo)}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{flex:none;width:36px;height:20px;border-radius:999px;background:#cbd5e1;position:relative;transition:background-color 200ms ease}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform 200ms var(--ease-out-strong)}
.switch input:checked + .tr{background:var(--indigo)}
.switch input:checked + .tr::after{transform:translateX(16px)}
.switch input:focus-visible + .tr{outline:2px solid var(--indigo);outline-offset:2px}
.switch input:disabled + .tr{opacity:.5}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
table.t th{padding:12px 16px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
table.t td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle}
table.t.compact th{padding:0 16px 8px 0}
table.t.compact td{padding:8px 16px 8px 0}
table.t tbody tr.hov:hover{background:var(--subtle)}
.flink{font-weight:500;color:var(--foreground)}
.flink:hover{color:var(--indigo);text-decoration:underline}
.meta{margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px;border-bottom:1px solid var(--border)}
.tfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* bars, score rows, charts */
.bar{height:8px;flex:1;overflow:hidden;border-radius:999px;background:var(--track)}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--indigo-bar);transition:width 300ms var(--ease-out-strong)}
.bar.thin{height:6px}
.sr .top{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:4px}
.sr .top span:first-child{color:var(--muted);word-break:break-word}
.sr .top span:last-child{flex:none;font-weight:500}
.chart{width:100%;height:140px;display:block;overflow:visible}
.chart .grid-l{stroke:var(--border);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* callouts */

.callout .h{font-weight:500}
.callout .s{margin-top:4px;font-size:12px;opacity:.85;word-break:break-word}
.c-blue{border-color:#bfdbfe;background:#eff6ff;color:#1e40af}
.c-emerald{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}
.c-amber{border-color:#fde68a;background:#fffbeb;color:#92400e}
.c-rose{border-color:#fecdd3;background:#fff1f2;color:#9f1239}
.c-slate{border-color:#cbd5e1;background:#f8fafc;color:#334155}
.c-violet{border-color:#ddd6fe;background:#f5f3ff;color:#5b21b6}
:root[data-theme="dark"] .c-blue{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.1);color:#60a5fa}
:root[data-theme="dark"] .c-emerald{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1);color:#34d399}
:root[data-theme="dark"] .c-amber{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fbbf24}
:root[data-theme="dark"] .c-rose{border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.1);color:#fb7185}
:root[data-theme="dark"] .c-slate{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#cbd5e1}
:root[data-theme="dark"] .c-violet{border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.1);color:#a78bfa}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .c-blue{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.1);color:#60a5fa}
  :root:not([data-theme="light"]) .c-emerald{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1);color:#34d399}
  :root:not([data-theme="light"]) .c-amber{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fbbf24}
  :root:not([data-theme="light"]) .c-rose{border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.1);color:#fb7185}
  :root:not([data-theme="light"]) .c-slate{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#cbd5e1}
  :root:not([data-theme="light"]) .c-violet{border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.1);color:#a78bfa}
}
.gate{display:flex;align-items:center;gap:12px;border:1px solid;border-radius:8px;padding:16px}
.gate .i{width:20px;height:20px}
.gate p.h{font-weight:600}
.gate p.s{font-size:12px;opacity:.8}
.box{border-radius:8px;background:var(--subtle);padding:12px;font-size:12px}
.reveal{animation:rv 200ms var(--ease-out-strong)}
@keyframes rv{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* field (dl) */
.f dt{font-size:12px;color:var(--muted)}
.f dd{margin-top:2px;font-weight:500}
.fields > * + *{margin-top:12px}

/* scan progress */
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.step .sd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center}
.step.done{color:var(--foreground)}
.step.done .sd{border-color:#059669;background:#059669;color:#fff}
.step.run .sd{border-color:var(--indigo);border-top-color:transparent;animation:spin .7s linear infinite}
.step .sd .i{width:11px;height:11px;stroke-width:3}
.step + .step::before{content:"";width:16px;height:1px;background:var(--border);margin-right:2px}
.chain{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:flex-start;margin-bottom:4px}
.chain .step{align-items:flex-start}.chain .step > span:last-child{display:flex;flex-direction:column;line-height:1.35}
.chain .step small{font-size:11px;color:var(--muted);font-weight:400}
.step.fail{color:var(--foreground)}.step.fail .sd{border-color:#e11d48;background:#e11d48;color:#fff}
.chain .step + .step::before{margin-top:9px}
.receipt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.receipt > div{border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.receipt .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.receipt .v{font-weight:600;margin-top:2px}
.prc{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.prc .ph2{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--subtle);border-bottom:1px solid var(--border);font-size:13px}
.prc .pb{padding:12px;font-size:13px}
.prc ul{margin:6px 0 0 18px;list-style:disc}

@keyframes spin{to{transform:rotate(360deg)}}

/* abbreviations: dotted underline on the first use per page, tooltip on every use */
abbr{text-decoration:none;cursor:help}
abbr.ab1{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px;text-decoration-thickness:1px}
.btn abbr.ab1,button abbr.ab1,h1 abbr.ab1,h2 abbr.ab1,.nav abbr.ab1,.sb-link abbr.ab1{text-decoration:none}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 24px;margin:0}
.gloss div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;min-width:0}
.gloss dt{flex:0 0 72px;font-weight:600}
.gloss dd{margin:0;color:var(--muted);min-width:0}
/* AI review (PR gate) */
.ai-box{border:1px dashed var(--violet-rg);background:var(--violet-bg);border-radius:12px;padding:16px}
.ai-box .fw6 .i{color:var(--violet-tx)}
.ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--violet-tx);background:var(--surface);box-shadow:inset 0 0 0 1px var(--violet-rg);white-space:nowrap}
.ai-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;list-style:none}
.ai-item.done{opacity:.6}
.ai-code{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
.ai-code.fix{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.06)}
/* data sources */
.feeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.feed{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;color:inherit;text-decoration:none;background:var(--surface)}
a.feed{transition:border-color 150ms ease}
@media (hover:hover) and (pointer:fine){a.feed:hover{border-color:var(--indigo)}}
.feed .dot{width:8px;height:8px;border-radius:999px;background:#10b981;flex:none}
.feed .dot.warn{background:#f59e0b}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.srcic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--indigo-soft);color:var(--indigo-text);flex:none}
.lbl2{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;counter-reset:p}
.pipe li{position:relative;display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px}
.pipe .pn{font-size:11px;font-weight:600;color:var(--muted)}
/* agents */
.preview{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--violet-tx);background:var(--violet-bg);box-shadow:inset 0 0 0 1px var(--violet-rg)}
.agents{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.agents{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ag{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface);transition:border-color 200ms ease,box-shadow 200ms ease,opacity 200ms ease}
.ag .an{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.ag .as{margin-top:2px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.ag[data-s="queued"]{opacity:.6}
.ag[data-s="run"]{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.ag[data-s="run"] .as{color:#7c3aed}
.ag[data-s="done"] .as{color:#059669}
.ag[data-s="fail"]{border-color:#fda4af}.ag[data-s="fail"] .as{color:#e11d48}
.ag[data-s="skip"]{opacity:.4}
.ag .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
.console{margin-top:8px;border-radius:8px;background:var(--console);color:#cbd5e1;font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:10px 12px;max-height:240px;overflow:auto}
.console div{display:grid;grid-template-columns:64px 1fr;gap:8px}
.console div:last-child{animation:rv 180ms var(--ease-out-strong)}
.console .w{color:#94a3b8}
.console .ok{color:#86efac}.console .err{color:#fda4af}.console .warn{color:#fcd34d}.console .dim{color:#64748b}

/* toasts */
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#0f172a;color:#f8fafc;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:tin 220ms var(--ease-out-strong);pointer-events:auto;max-width:min(92vw,520px)}
.toast .i{color:#34d399}
.toast.err .i{color:#fb7185}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity 160ms ease,transform 160ms ease}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--background)}
.login .box2{width:100%;max-width:384px}
.login .lh{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:24px}
.login .lh > .i{width:36px;height:36px;color:var(--indigo)}
.login .lh h1{font-size:18px;font-weight:600}
.persona{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;border:1px solid var(--border);background:var(--surface)}
.persona:hover{border-color:#a5b4fc;background:var(--indigo-soft)}
.persona .who{flex:1;min-width:0}
.persona .who b{display:block;font-size:13px;font-weight:600}
.persona .who span{display:block;font-size:12px;color:var(--muted)}
.plist > * + *{margin-top:6px}

/* guide */
.gbtn{position:fixed;right:16px;bottom:16px;z-index:70;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:#0f172a;color:#fff;font-size:13px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
:root[data-theme="dark"] .gbtn{background:#e2e8f0;color:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gbtn{background:#e2e8f0;color:#0f172a}}
.gpanel{position:fixed;right:16px;bottom:16px;z-index:70;width:min(380px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 100px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px -20px rgba(15,23,42,.45);transform-origin:100% 100%;animation:pop 180ms var(--ease-out-strong)}
.gpanel .gh{padding:14px 16px;border-bottom:1px solid var(--border)}
.gpanel .gh b{font-size:14px}
.gpanel .gb{overflow-y:auto;padding:8px}
.story{border-radius:10px;padding:10px}
.story + .story{margin-top:2px}
.story:hover{background:var(--subtle)}
.story .st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}

.story .sd2{margin:4px 0 0 28px;font-size:12px;color:var(--muted)}

.tour{animation:tour 1.6s var(--ease-out-strong) 2}
@keyframes tour{0%{box-shadow:0 0 0 0 rgba(99,102,241,.55)}100%{box-shadow:0 0 0 12px rgba(99,102,241,0)}}

.fn-bar{height:28px;border-radius:6px;background:var(--track);overflow:hidden}
.fn-bar i{display:block;height:100%;border-radius:6px;background:var(--indigo-bar);transition:width 400ms var(--ease-out-strong)}
.fn-row:nth-child(2) .fn-bar i{background:#f97316}
.fn-row:nth-child(3) .fn-bar i{background:#e11d48}
.fn-row .n{font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.fn-note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

.tcap{position:fixed;z-index:81;left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px -20px rgba(15,23,42,.5);padding:14px 16px 12px;animation:pop 200ms var(--ease-out-strong)}
.tcap .tk{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo-text)}
.tcap h4{margin:6px 0 0;font-size:15px;font-weight:600}
.tcap p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.tcap .tprog{height:3px;border-radius:3px;background:var(--track);margin-top:12px;overflow:hidden}
.tcap .tprog i{display:block;height:100%;width:0;background:var(--indigo-bar)}
.tcap .tprog i.run{animation:tprog linear forwards}
.tcap.paused .tprog i{animation-play-state:paused}
@keyframes tprog{from{width:0}to{width:100%}}
.tcap .tb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.tcap .tdots{display:flex;gap:4px}
.tcap .tdots span{width:6px;height:6px;border-radius:50%;background:var(--border)}
.tcap .tdots span.on{background:var(--indigo-bar)}
.sso-or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.sso-or::before,.sso-or::after{content:"";flex:1;height:1px;background:var(--border)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
  button:active,.press:active{transform:none !important}
}
@media print{.sidebar,.topbar,.gbtn,.gpanel,.toasts,.tring,.tcap{display:none !important}}

/* noise-reduction funnel: open findings → what policy says to act on → what to fix this week */
function funnelStages(open) {
  const act = open.filter(o => o.c.action === "auto_pr" || o.c.action === "pr_review");
  const week = act.filter(o => o.c.sev === "critical" || o.f.kev || (o.c.due - Date.now()) / D < 7);
  // the same number of findings picked by CVSS alone: how many can wait, how many urgent ones it misses
  const byCvss = open.slice().sort((a, b) => (b.f.cvss ?? 0) - (a.f.cvss ?? 0)).slice(0, week.length);
  const canWait = byCvss.filter(o => !week.includes(o)).length, missed = week.filter(o => !byCvss.includes(o)).length;
  return { total: open.length, act: act.length, week: week.length, canWait, missed };
}
function funnelCard(open, canF, team) {
  const st = funnelStages(open), pct = n => st.total ? Math.max(2, Math.round((n / st.total) * 100)) : 0;
  const row = (label, sub, n, href) => { const inner = `<span class="fl2">${label}<small>${sub}</small></span><span class="fn-bar"><i style="width:${pct(n)}%"></i></span><span class="n">${n}</span>`; return canF && href ? `<a class="fn-row" href="${href}" style="text-decoration:none;color:inherit">${inner}</a>` : `<div class="fn-row">${inner}</div>`; };
  return card(ch("From alerts to action", `How Everlit narrows ${team ? "the team's" : "every"} open finding down to the work that matters this week`, "", "Act on = the policy action is auto-fix PR or PR review (priority 60 or higher). Fix this week = of those, critical priority, known exploited, or due within 7 days.") +
    `<div class="funnel">${row("Open findings", "everything the scanners report", st.total, "#/findings")}${row("Policy says act", "priority 60+ · fix PR or review", st.act, "#/findings?severity=high")}${row("Fix this week", "critical, known exploited, or due in 7 days", st.week, "#/findings?due=week")}</div>
    <p class="fn-note">${ic("gauge", "i-sm")}<span>${st.week ? `If this week's ${st.week} were picked by CVSS alone, <b>${st.canWait}</b> of them would be findings that can wait, and <b>${st.missed}</b> that can't (known exploited, overdue or critical here) would be left out.` : "Nothing needs fixing this week."} Priority adds exploit evidence, import evidence, exposure and criticality to severity.</span></p>`, "", "funnel");
}
function scanTable(scans, full) {
  return `<div class="tw"><table class="t compact"><thead><tr><th>Repo</th><th>Type</th>${full ? "<th>Trigger</th><th>Actor</th>" : ""}<th>Status</th><th>Coverage</th><th>Findings</th><th>Started</th></tr></thead><tbody>
    ${scans.map(s => `<tr><td class="fw5">${esc(repoById(s.repoId)?.name || "—")}</td><td class="muted">${s.type === "pr_gate" ? `PR gate${s.verdict ? ` · ${esc(s.verdict.replace(/_/g, " "))}` : ""}` : "Baseline"}</td>${full ? `<td class="muted">${esc(s.trigger)}</td><td class="muted">${esc(userName(s.actor))}</td>` : ""}<td>${pill(s.status, scanTone(s.status), s.reason || "")}</td><td>${s.coverage ? pill(`${covPct(s.coverage)}%`, covPct(s.coverage) === 100 ? "emerald" : "amber", `${s.coverage.checked} of ${s.coverage.deps} dependencies checked · ${s.coverage.manifests.length} manifest${s.coverage.manifests.length === 1 ? "" : "s"}`) : `<span class="xs muted">—</span>`}</td><td>${s.findingCount} <span class="muted">(${s.newFindingCount} new${s.closedCount ? `, ${s.closedCount} closed` : ""})</span></td><td class="muted">${fmtDT(s.startedAt)}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No scans yet. Onboard a repo to get started.</td></tr>`}

function viewFindings(q) {

  let rows = visibleFindings().map(f => ({ f, c: calc(f), r: repoById(f.repoId) }));
  const term = (q.get("q") || "").toLowerCase();
  const now = Date.now();
  rows = rows.filter(({ f, c, r }) =>
    (status === "all" || f.status === status) &&
    (!q.get("severity") || c.sev === q.get("severity")) &&
    (!team || r.owningTeam === team) &&
    (!q.get("repoId") || r.id === q.get("repoId")) &&
    (!q.get("kev") || f.kev) &&
    (!q.get("reachable") || String(f.reachable) === q.get("reachable")) &&
    (q.get("assignee") !== "me" || f.assignee === u.email) && (q.get("assignee") !== "none" || !f.assignee) &&
    (q.get("due") !== "overdue" || (f.status === "open" && c.due < now)) &&
    (q.get("due") !== "week" || (f.status === "open" && (c.due - now) / D >= 0 && (c.due - now) / D < 7)) &&
    (!term || `${f.pkg} ${f.cve} ${f.title}`.toLowerCase().includes(term)));
  rows.sort((a, b) => (b.f.kev - a.f.kev) || (b.c.score - a.c.score) || a.f.firstSeen.localeCompare(b.f.firstSeen));
  const teams = [...new Set(S.repos.map(r => r.owningTeam))];

  const lv = view === "list";

    <div class="ph"><div><h1>Findings</h1><p class="sub">${isTeamScoped(u.role) ? `Findings in ${esc(u.team)}'s repos. ` : ""}${u.role === "engineering_manager" && !q.has("team") ? `Showing ${esc(u.team)} — pick "All teams" to see everyone. ` : ""}Sorted by Everlit priority. Each row shows both the priority and the vulnerability's own CVSS severity.</p></div>
      <div class="row wrap">${can("exportFindings") ? `<button class="btn btn-outline" data-act="export-findings">${ic("download")} Export CSV</button>` : ""}

    <div class="card">
      <div class="filters">
        <div><label class="fl">Search</label><input class="inp" style="width:224px" data-filter="q" placeholder="package, CVE, title" value="${esc(q.get("q") || "")}"></div>
        ${sel("status", "Status", status, [["open", "Open"], ["suppressed", "Suppressed"], ["fixed", "Fixed"], ["accepted_risk", "Accepted risk"], ["false_positive", "False positive"], ["all", "All"]])}
        ${sel("severity", "Priority", q.get("severity") || "", [["", "All"], ["critical", "Critical"], ["high", "High"], ["medium", "Medium"], ["low", "Low"]])}
        ${!isTeamScoped(u.role) ? sel("team", "Team", team, [["", "All teams"], ...teams.map(t => [t, t])]) : ""}
        ${sel("repoId", "Repo", q.get("repoId") || "", [["", "All repos"], ...repos.map(r => [r.id, r.name])])}
        ${sel("due", "Deadline", q.get("due") || "", [["", "Any"], ["overdue", "Overdue"], ["week", "Due within 7 days"]])}

        ${sel("reachable", "Import evidence", q.get("reachable") || "", [["", "All"], ["true", "Import found"], ["false", "None found"]])}
        <a href="#/findings${view === "packages" ? "?view=packages" : ""}" class="sm fw5 muted" style="padding-bottom:8px">Reset</a>

function fixPill(f, refs, run) {
  if (f.status !== "open") return "";
  if (refs.cancelled) return pill("fix cancelled", "neutral", refs.cancelled.reason || "");
  if (refs.closedUnmerged) return pill("PR closed unmerged", "amber", refs.closedUnmerged.note || "");
  if (refs.ciStatus === "no_ci") return pill("no CI reported", "amber", "No CI result after 7 days: open the PR by hand");
  if (refs.prNumber && !refs.merged) return pill(refs.by === "agent" ? "agent PR open" : "fix PR open", "blue");
  if (refs.branchName && !refs.complexReason && !refs.prNumber) return pill("fix branch · awaiting CI", "blue");
  if (refs.complexReason && !(run && run.status === "running")) return pill("complex fix", "violet");
  return "";
}
function findingRows(rows) {
  return `<div class="tw"><table class="t"><thead><tr><th>Priority</th><th>Severity</th><th>Finding</th><th>Repo</th><th>Status</th><th>Deadline</th><th>First seen</th></tr></thead><tbody>
    ${rows.map(({ f, c, r }) => { const run = agentRunFor(f); const refs = f.refs || {}; return `<tr class="hov"><td>${priorityBadge(c.sev, c.score)}</td><td>${cvssBadge(f.cvss)}</td>

      <td class="muted">${esc(r.name)}</td><td>${statusBadge(f.status)}</td><td>${dueBadge(c.due, f.status)}</td><td class="muted">${fmtDate(f.firstSeen)}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">No findings match these filters.</td></tr>`}
  </tbody></table></div><div class="tfoot"><span>${rows.length ? `1–${rows.length} of ${rows.length}` : "0 findings"}</span><span></span></div>`;

function packageRows(rows) {
  const g = new Map();
  rows.forEach(({ f, c }) => { const x = g.get(f.pkg) || { name: f.pkg, n: 0, repos: new Set(), versions: new Set(), max: -1, bucket: "low", fixes: [] }; x.n++; x.repos.add(f.repoId); x.versions.add(f.version); if (c.score > x.max) { x.max = c.score; x.bucket = c.sev; } if (f.fixed) x.fixes.push(f.fixed); g.set(f.pkg, x); });
  const list = [...g.values()].sort((a, b) => b.max - a.max || b.n - a.n);

    <p class="sm muted mt1">${ai.found.length ? `Caught at the source: ${ai.found.length} risky pattern${ai.found.length === 1 ? "" : "s"} in ${ai.lines} added lines. Fixing them in this PR means they never reach ${esc(r.branch)}.` : `No risky patterns found in ${ai.lines} added lines.`}</p>
    ${ai.injections.length ? `<div class="callout c-slate mt2"><p class="s">${ic("shieldCheck", "i-sm")} Instruction-like text on line ${ai.injections.map(x => x.line).join(", ")} of the diff was treated as data. Diff content can't steer the review or the gate.</p></div>` : ""}
    ${ai.found.length ? `<ul class="stack-sm mt3">${items}</ul>` : ""}
    <p class="xs muted mt3">${dep} · only the PR diff was sent · every suggestion cites its diff lines (generic advice is suppressed) · prompt and output logged for audit</p></div>`;
}
let gateExplain = false, gateDispute = null, ovrFormOpen = false;
function gatePanel(res, r) {
  const cfg = { blocked: ["xCircle", "Merge blocked", "c-rose"], pass_with_comments: ["message", "Pass · comments posted", "c-amber"], pass: ["checkCircle", "Pass · no new issues", "c-emerald"], incomplete: ["dashed", "Incomplete · not a security pass", "c-slate"] }[res.gateStatus];
  const chk = checkOf(res, r), u = me();
  const pendingOvr = S.overrides.find(o => o.repoId === r.id && o.pr === res.pr && o.status === "pending");
  const canDispute = can("requestSuppression");
  const grp = (title, list, empty, dispute) => `<div><p class="fl" style="margin-bottom:8px">${title}</p>${list.length ? `<ul class="stack-sm">${list.map(m => { const k = `${m.pkg}|${m.cve}`; return `<li style="border:1px solid var(--border);border-radius:8px;padding:12px"><div class="row between wrap" style="gap:8px"><div class="row" style="gap:12px">${priorityBadge(m.sev, m.score)}<div><p class="fw5">${esc(m.title)}</p><p class="xs muted">${esc(m.pkg)}@${esc(m.version)} · ${esc(m.cve)}${m.fixed ? ` · fixed in ${esc(m.fixed)}` : ""}${m.manifest !== r.manifestFilename ? ` · in ${esc(m.manifest)}` : ""}</p></div></div><div class="row wrap">${cvssBadge(m.cvss)}${m.blocks ? pill("blocks merge", "rose") : ""}${pill(esc(m.action.replace(/_/g, " ")), "blue")}${dispute && m.blocks && canDispute ? `<button class="btn btn-outline btn-xs" data-act="gate-dispute" data-k="${esc(k)}">Dispute</button>` : ""}</div></div>
      ${dispute && gateDispute === k ? `<form class="reveal mt3 stack-sm box" data-submit="gate-dispute" data-k="${esc(k)}"><div><label class="fl">Kind</label><select class="sel" name="kind" style="width:100%">${Object.keys(EXCEPTION_LABELS).map(x => `<option value="${x}">${EXCEPTION_LABELS[x]}</option>`).join("")}</select></div><div><label class="fl">Risk owner</label><select class="sel" name="riskOwner" style="width:100%">${ownersFor(r).map(o => `<option>${esc(o)}</option>`).join("")}</select></div><div><label class="fl">Justification</label><textarea class="ta" name="justification" rows="2" required style="font-family:var(--sans);font-size:13px">Disputing PR #${res.pr} gate verdict: </textarea></div><div><label class="fl">Compensating controls</label><input class="inp" name="controls" style="width:100%" placeholder="What reduces the risk meanwhile?"></div><div class="row"><button class="btn btn-indigo btn-xs" type="submit">Send for review</button><button class="btn btn-outline btn-xs" type="button" data-act="gate-dispute" data-k="">Cancel</button></div><p class="xs muted">A different security reviewer decides. Approved, it counts as accepted on the next run of this PR.</p></form>` : ""}</li>`; }).join("")}</ul>` : `<p class="sm muted">${empty}</p>`}</div>`;
  const lineOf = pkg => { const i = res.text.split("\n").findIndex(l => l.includes(pkg.split(":").pop())); return i < 0 ? 1 : i + 1; };
  const tone = { success: "emerald", neutral: "slate", failure: "rose" }[chk.concl];
  const needOvr = (res.gateStatus === "blocked" || (res.gateStatus === "incomplete" && chk.concl === "failure")) && !chk.ov;
  const cov = res.coverage;
  return `<div class="stack reveal">
    <div class="gate ${cfg[2]}">${ic(cfg[0])}<div><p class="h">${res.newF.length} new (${res.blocking} blocking), ${res.pre.length} pre-existing · ${cfg[1]}</p>${res.ai ? `<p class="s">AI review: ${res.ai.found.length} suggestion${res.ai.found.length === 1 ? "" : "s"} on the code change · advisory, never part of the pass/block decision</p>` : ""}<p class="s">${r.mergeBlocking === "block" ? "This repo always blocks (repo override)." : r.mergeBlocking === "warn" ? "This repo is set to warn only (repo override)." : S.mergeBlockingEnabled ? "Org-wide hard merge-blocking is ON." : "Org-wide hard merge-blocking is OFF (advisory mode): blocking findings are reported but don't fail the check."}</p></div></div>
    ${res.gateStatus === "incomplete" ? `<div class="callout c-amber row" style="gap:10px;align-items:flex-start">${ic("alert")}<span>${res.why === "engine" ? "The scan engine stopped before finishing (3 attempts)." : "OSV.dev did not answer for every package."} Everlit makes no security claim about this change, so the check is <b>${chk.concl === "failure" ? "failure (fail-closed)" : chk.concl}</b>, never a green pass.${chk.concl !== "failure" && blockingFor(r) ? " The org can switch to fail-closed on the Policy page." : ""}</span></div>` : ""}
    <p class="xs muted">${ic("layers", "i-sm")} Manifests in this PR: <b>${cov.manifests.map(esc).join(", ")}</b> · all scanned · compared with merge-base <code>${res.mergeBase}</code>, where this PR branched from ${esc(r.branch)} · policy <span class="mono">v${policyV()}</span></p>
    ${grp("New: introduced by this change (these can block)", res.newF, "No new findings introduced by this change.", res.gateStatus === "blocked")}
    <div class="lg2" data-tour="gate-comment">
      <div class="prc"><div class="ph2">${ic(chk.concl === "success" ? "checkCircle" : chk.concl === "failure" ? "xCircle" : "dashed", "i-sm")}<b>everlit/pr-gate</b><span class="muted">GitHub check run</span><span style="margin-left:auto">${pill(chk.concl, tone)}</span></div><div class="pb"><p class="fw5">${esc(chk.label)}</p>${res.newF.length ? `<p class="xs muted mt2">Annotations</p><ul class="xs">${res.newF.map(m => `<li class="mono">${esc(m.manifest)}:${m.manifest === r.manifestFilename ? lineOf(m.pkg) : 1} · ${esc(m.pkg.split(":").pop())} ${esc(m.version)} · ${esc(m.cve)} · priority ${m.score}${m.fixed ? ` · use ≥ ${esc(m.fixed)}` : ""}</li>`).join("")}</ul>` : ""}<p class="xs muted mt2">Re-run from the check on GitHub, or push a new commit.</p></div></div>
      <div class="prc"><div class="ph2">${ic("message", "i-sm")}<b>everlit</b><span class="muted">commented on PR #${res.pr} · updated on every push</span></div><div class="pb"><p class="fw6">${{ blocked: "🔴 Merge blocked", pass_with_comments: "🟡 Pass with comments", pass: "🟢 Pass", incomplete: "⚪ Incomplete: not a security pass" }[res.gateStatus]}</p><ul>
        <li>${res.newF.length} new (${res.blocking} blocking) · ${res.pre.length} pre-existing · ${res.resolved} resolved</li>
        <li>Coverage: ${cov.checked} of ${cov.deps} dependencies · ${cov.manifests.length} manifest${cov.manifests.length === 1 ? "" : "s"} · OSV.dev ${cov.osvComplete ? "✓" : "awaiting"} · EPSS ✓ · KEV synced ${cov.kevAgeHours} h earlier</li>
        <li>Policy v${policyV()} · merge-base ${res.mergeBase}</li>
        ${res.newF.filter(m => m.blocks).map(m => `<li>${esc(m.pkg.split(":").pop())} ${esc(m.version)} · ${esc(m.cve)} · <span class="link">Dispute this verdict →</span></li>`).join("")}
        ${chk.ov ? `<li><b>Override active</b> until ${fmtDT(chk.ov.expiresAt)}, approved by ${esc(roleOfEmail(chk.ov.approvedBy))}. The verdict above is still the real one.</li>` : ""}
      </ul></div></div>
    </div>
    <div class="row wrap" style="gap:8px">
      <button class="btn btn-outline btn-xs" data-act="gate-explain">${ic("sparkles", "i-sm")} ${gateExplain ? "Hide explanation" : "Explain this verdict"}</button>
      ${needOvr && !pendingOvr && can("requestGateOverride") ? `<button class="btn btn-outline btn-xs" data-act="ovr-form">${ic("key", "i-sm")} Request break-glass override…</button>` : ""}
      ${pendingOvr ? `<span class="xs" style="color:var(--amber-tx)">Override requested by ${esc(roleOfEmail(pendingOvr.requestedBy))}: waiting for a different security reviewer.</span>${can("approveGateOverride") && pendingOvr.requestedBy !== u.email ? `<button class="btn btn-emerald btn-xs" data-act="ovr-approve" data-id="${pendingOvr.id}">Approve override</button>` : ""}` : ""}
    </div>
    ${gateExplain ? `<div class="ai-box" data-tour="gate-explain"><div class="row between wrap" style="gap:8px"><p class="fw6 row" style="gap:8px">${ic("sparkles")} Why this verdict</p><span class="ai-tag">AI suggestion · built from the score terms and the matching rule</span></div><ul class="stack-sm mt2 sm">${explainVerdict(res, r).map(t => `<li>${esc(t)}</li>`).join("")}</ul><p class="xs muted mt2">The verdict itself comes from the policy engine; this text only explains it.</p></div>` : ""}
    ${ovrFormOpen && needOvr && !pendingOvr ? `<form class="reveal stack-sm box" data-submit="ovr-request" data-id="${r.id}"><p class="fw5">Break-glass override for PR #${res.pr}</p><div><label class="fl">Reason</label><textarea class="ta" name="reason" rows="2" required style="font-family:var(--sans);font-size:13px" placeholder="Why must this merge before the verdict changes?"></textarea></div><div><label class="fl">Hours (max ${S.gate.overrideMaxHours})</label><input class="inp" name="hours" type="number" min="1" max="${S.gate.overrideMaxHours}" value="24" style="width:120px"></div><div class="row"><button class="btn btn-indigo btn-xs" type="submit">Request override</button><button class="btn btn-outline btn-xs" type="button" data-act="ovr-form">Cancel</button></div><p class="xs muted">A different security engineer or platform owner approves it. It expires on its own and is on the audit record.</p></form>` : ""}
    ${res.ai ? aiPanel(res.ai, r) : ""}
    ${res.acc.length ? grp("New here, but already risk-accepted / suppressed in this repo: not blocking", res.acc, "") : ""}
    ${grp("Pre-existing on the target branch: backlog, never blocks this PR", res.pre, "No pre-existing findings for this manifest.")}
    ${res.resolved ? `<p class="sm" style="color:var(--emerald-tx)">✓ This change removes ${res.resolved} vulnerability finding(s) present on the target branch.</p>` : ""}</div>`;
}

/* ================================================================ scans, exceptions, policy, compliance, audit, integrations, adapters, users */
function viewScans() {
  const ids = new Set(visibleRepos().map(r => r.id));
  const scans = S.scans.filter(s => ids.has(s.repoId)).sort((a, b) => b.startedAt.localeCompare(a.startedAt));
  const hooks = [[0.004, "GitHub", "push", "payments-api", "scan queued"], [0.02, "GitHub App", "check_run.rerequested", "payments-api", "PR gate re-run from the check"], [0.3, "Everlit", "open-PR sweep", "customer-portal", "PR #513 had no Everlit check: gate run"], [1.1, "GitHub", "pull_request.opened", "customer-portal", "PR gate: pass"], [2.4, "GitHub", "push", "order-service", "scan queued"], [3.0, "GitHub", "pull_request.synchronize", "payments-api", "PR gate: pass with comments · 3 AI suggestions"]];
  return `<div class="stack"><div class="ph"><div><h1>Scan history</h1><p class="sub">Every scan run with its trigger, outcome and coverage receipt. A degraded scan is still waiting on a source for some packages, so it never auto-closes anything.</p></div></div>
    ${card(scanTable(scans, true))}
    ${card(ch("Recent webhook deliveries", "Inbound events from connected providers (PR auto-trigger audit trail)") + `<div class="tw"><table class="t compact"><thead><tr><th>Received</th><th>Provider</th><th>Event</th><th>Repo</th><th>Result</th></tr></thead><tbody>
      ${hooks.map(([d, prov, e, rn, res]) => `<tr><td class="muted">${fmtDT(Date.now() - d * D)}</td><td>${prov}</td><td class="mono">${e}</td><td>${rn}</td><td>${pill(res, res.includes("comments") ? "amber" : "emerald")}</td></tr>`).join("")}</tbody></table></div>`)}</div>`;
}
function viewExceptions() {
  const u = me(); const ids = new Set(visibleRepos().map(r => r.id));
  const sups = S.suppressions.filter(s => ids.has(s.repoId));
  const pending = sups.filter(s => s.status === "pending"), rest = sups.filter(s => s.status !== "pending").sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const canApprove = can("approveSuppression"), canRevoke = can("revokeSuppression");
  const fl = s => { const f = S.findings.find(x => x.id === s.findingId); if (!f) return s.advisory ? `<span class="sm fw5">${esc(s.advisory.title)} — ${esc(repoById(s.repoId).name)} · PR #${s.pr}</span>` : ""; const t = `${esc(f.title)} — ${esc(repoById(f.repoId).name)}`; return roleCanSee(u.role, "findings") ? `<a class="link sm" href="#/findings/${f.id}">${t}</a>` : `<span class="sm fw5">${t}</span>`; };
  const meta = s => `${s.source === "pr_dispute" ? pill(`PR dispute · #${s.pr}`, "violet") : ""}${s.flags && s.flags.length ? pill("New approver account", "amber", "Approved by an account created less than 7 days earlier") : ""}`;
  const ownerLine = s => s.riskOwner || s.compensatingControls ? `<p class="xs muted mt1">${s.riskOwner ? `Risk owner: <strong>${esc(s.riskOwner)}</strong>` : ""}${s.riskOwner && s.compensatingControls ? " · " : ""}${s.compensatingControls ? `Controls: ${esc(s.compensatingControls)}` : ""}</p>` : "";
  const tone = { active: "emerald", rejected: "rose", revoked: "neutral", expired: "neutral" };
  return `<div class="stack"><div><h1 style="font-size:20px;font-weight:600">Exceptions</h1><p class="sm muted mt1" style="max-width:720px">Suppressions (max ${EXCEPTION_MAX_DAYS.suppression} days), accepted risk and false-positive calls (max ${EXCEPTION_MAX_DAYS.accepted_risk} days) all follow the same rule: requested by one person, approved by a different security reviewer, with a justification and an expiry — nothing is excepted indefinitely. When one expires, the finding reopens and re-enters the policy engine.</p></div>
    ${card(ch(`Awaiting approval (${pending.length})`, canApprove ? "You can't approve your own requests." : "A security engineer or platform owner approves these.") + (pending.length ? `<ul class="divide">${pending.map(s => `<li class="row between wrap" style="padding:12px 0;align-items:flex-start;gap:12px"><div style="min-width:0;flex:1">${pill(EXCEPTION_LABELS[s.kind], "blue")}${meta(s)} ${fl(s)}<p class="sm mt1">${esc(s.justification)}</p>${ownerLine(s)}<p class="xs muted mt1">Requested by <strong>${esc(userName(s.requestedBy))}</strong> on ${fmtDT(s.createdAt)} for ${s.requestedDays} days</p></div>${canApprove && s.requestedBy !== u.email ? `<div class="row"><button class="btn btn-emerald btn-xs" data-act="sup-approve" data-id="${s.id}" data-tour="approve">Approve</button><button class="btn btn-outline btn-xs" data-act="sup-reject" data-id="${s.id}">Reject</button></div>` : canApprove ? `<div class="row">${pill("your request", "amber")}<button class="btn btn-outline btn-xs" data-act="sup-approve" data-id="${s.id}" title="Try it: the server refuses self-approval">Approve</button></div>` : pill(s.requestedBy === u.email ? "your request" : "pending", "amber")}</li>`).join("")}</ul>` : `<p class="sm muted">Nothing waiting.</p>`))}
    <div class="stack-sm">${rest.map(s => { const d = s.expiresAt ? daysUntil(s.expiresAt) : null; return card(`<div class="row between wrap" style="align-items:flex-start;gap:12px"><div><div class="row wrap">${pill(EXCEPTION_LABELS[s.kind], "blue")}${pill(esc(s.status), tone[s.status] || "neutral")}${s.status === "active" ? pill(`${d}d until expiry`, d < 7 ? "rose" : "neutral") : ""}${meta(s)}</div>
      <p class="sm mt2">${esc(s.justification)}</p>${ownerLine(s)}<p class="xs muted mt1">Requested by <strong>${esc(userName(s.requestedBy))}</strong>${s.approver ? ` · ${s.status === "rejected" ? "rejected" : "approved"} by <strong>${esc(userName(s.approver))}</strong>${s.approvedAt ? ` on ${fmtDT(s.approvedAt)}` : ""}` : ""}${s.status === "active" ? ` · expires ${fmtDT(s.expiresAt)}` : ""}</p>${s.reviewNote ? `<p class="xs muted mt1">Review note: ${esc(s.reviewNote)}</p>` : ""}<div class="mt1">${fl(s)}</div></div>
      ${s.status === "active" && canRevoke ? `<button class="btn btn-outline btn-xs" data-act="sup-revoke" data-id="${s.id}">Revoke</button>` : ""}</div>
      <details class="mt3" style="border-top:1px solid var(--border);padding-top:12px"><summary class="xs fw5 muted" style="cursor:pointer">Audit history (${s.history.length})</summary><ul class="stack-sm mt2">${s.history.map(h => `<li class="xs muted"><span class="fw5" style="color:var(--foreground)">${esc(h.action)}</span> by ${esc(userName(h.actor))} — ${fmtDT(h.at)}${h.note ? ` — ${esc(h.note)}` : ""}</li>`).join("")}</ul></details>`); }).join("")}</div></div>`;
}
function viewPolicy() {
  const ed = can("editPolicy");
  const open = S.findings.filter(f => f.status === "open").map(calc);
  return `<div class="stack"><div class="ph"><div><h1>Policy engine</h1><p class="sub">Rules are data, not hardcoded thresholds. Every finding is re-evaluated against them; edits apply immediately, are audited and create a new policy version.</p></div><div class="row wrap">${pill(`Policy v${policyV()}`, "blue", "Hash of the rules, merge-blocking settings and SLAs. Every scan and gate verdict records it.")}</div></div>
    <div class="lg2">
      ${card(ch("Org-wide merge blocking", "Enable only once the false-positive rate is under 5%. Individual repos can override this.") + `<label class="switch"><input type="checkbox" data-act-change="mb-toggle" ${S.mergeBlockingEnabled ? "checked" : ""} ${ed ? "" : "disabled"}><span class="tr"></span><span class="sm fw5">${S.mergeBlockingEnabled ? "On — blocking findings fail the PR check" : "Off — advisory mode"}</span></label><p class="xs muted mt3">${open.filter(c => c.blocks).length} open findings currently meet a blocking rule.</p>`)}
      ${card(ch("Remediation SLAs", "Days from first seen to the fix deadline, by priority. Known-exploited findings get the tighter of their priority SLA and the KEV SLA.") + `<form class="row wrap" style="gap:12px;align-items:flex-end" data-submit="sla">${Object.keys(S.sla).map(k => `<div><label class="fl">${k === "kev" ? "Known exploited" : titleCase(k)}</label><input class="inp" type="number" min="1" max="3650" name="${k}" value="${S.sla[k]}" style="width:92px" ${ed ? "" : "disabled"}></div>`).join("")}${ed ? `<button class="btn btn-indigo" type="submit">Save SLAs</button>` : ""}</form>`)}
    </div>
    <div class="lg2">
      ${card(ch("When a gate run does not finish", "An incomplete gate never shows a green pass. Choose what happens on repos that enforce blocking.") + `<label class="switch"><input type="checkbox" data-act-change="fc-toggle" ${S.gate.failClosed ? "checked" : ""} ${ed ? "" : "disabled"}><span class="tr"></span><span class="sm fw5">${S.gate.failClosed ? "Fail-closed: an incomplete gate holds the merge" : "Neutral: an incomplete gate is reported, the merge is not held"}</span></label>
        <div class="row wrap mt3" style="gap:8px;align-items:center"><label class="fl" style="margin:0">Break-glass override lasts at most</label><input class="inp" type="number" min="1" max="168" value="${S.gate.overrideMaxHours}" data-act-change="ovr-hours" style="width:80px;height:32px" ${ed ? "" : "disabled"}><span class="sm muted">hours</span></div>
        <p class="xs muted mt3">Overrides are requested from the PR gate, approved by a different security reviewer, expire on their own and keep the real verdict visible on the PR.</p>`, "", "gate-policy")}
      ${card(ch("Guardrails always on") + `<ul class="stack-sm sm">${["Two people for every exception, override and not-affected statement; an approver account created by the requester is refused", "Exceptions always expire: suppressions within 90 days, accepted risk and false positives within 365", "Sessions end after 8 hours, or 30 minutes idle; role changes end every session at once", "AI suggests and explains; the rules on this page decide every verdict"].map(t => `<li class="row" style="align-items:flex-start;gap:8px"><span style="color:#059669;display:inline-flex;margin-top:2px">${ic("shieldCheck", "i-sm")}</span><span>${t}</span></li>`).join("")}</ul>`)}
    </div>
    ${(() => { const a = S.aiReview, rate = a.suggested ? Math.round(a.dismissed / a.suggested * 100) : 0; return card(ch("AI review in the PR gate", "Catches risky code patterns at the source, while the change is still a pull request", rm(3)) + `<div class="lg2" style="gap:24px"><div class="stack-sm">
      <label class="switch"><input type="checkbox" data-act-change="ai-toggle" ${a.enabled ? "checked" : ""} ${ed ? "" : "disabled"}><span class="tr"></span><span class="sm fw5">${a.enabled ? "On: every PR gate run includes an AI review of the diff" : "Off"}</span></label>
      <dl class="fields sm">${field("Mode", `${ic("shieldCheck", "i-sm")} Advisory only. Suggestions never block a merge`)}${field("Model deployment", ed ? `<select class="sel" data-act-change="ai-deploy" style="height:32px;max-width:100%"><option value="self_hosted" ${a.deployment === "self_hosted" ? "selected" : ""}>Self-hosted model (default · no code leaves the network)</option><option value="cloud" ${a.deployment === "cloud" ? "selected" : ""}>Approved cloud model (per-organization opt-in)</option></select>` : esc(a.deployment === "self_hosted" ? "Self-hosted model (default)" : "Approved cloud model (opt-in)"))}${field("What is sent", "Only the PR diff plus minimal surrounding context. Never the whole repository")}</dl></div>
