\"M20 6 9 17l-5-5\"/>\u003c/svg>Advisory mode only: nothing is blocked yet\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Capture baselines in weeks 1–2\u003c/li>\u003c/ul>\n        \u003cdiv class=\"exit\">\u003cb>Exit check:\u003c/b> signal quality proven; targets ratified\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ph\">\u003cdiv class=\"when\">Phase 2 · after pilot exit\u003c/div>\u003ch4>Enforce and expand\u003c/h4>\u003cul>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Turn on merge blocking once false positives are under 5%\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>CI-tested automatic fix PRs\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Jira tickets, executive reporting, access control\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Hand over to the named platform team within 4 weeks\u003c/li>\u003c/ul>\n        \u003cdiv class=\"exit\">\u003cb>Exit check:\u003c/b> more teams onboarded; fix time trending down\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ph\">\u003cdiv class=\"when\">Phase 3 · scale\u003c/div>\u003ch4>Prevent more, automate more\u003c/h4>\u003cul>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>AI review in the PR gate (advisory, self-hosted by default)\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>SDLC agents for complex fixes, with human approval\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Internal package advisories for private code\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Broader scanner and CI coverage\u003c/li>\u003c/ul>\n        \u003cdiv class=\"exit\">\u003cb>Exit check:\u003c/b> auto-fix and backlog targets met; effort sized at pilot exit\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"invest\">\n      \u003cdiv class=\"card inv\">\u003cdiv class=\"label\">Phase 1 build\u003c/div>\u003cdiv class=\"v\">8–12 weeks\u003c/div>\u003cp>3–4 engineers, assembled from proven open-source components. Scope: dependency scanning, scoring, policy, deadlines and the PR gate\u003c/p>\u003c/div>\n      \u003cdiv class=\"card inv\">\u003cdiv class=\"label\">Run cost\u003c/div>\u003cdiv class=\"v\">1–2 FTE\u003c/div>\u003cp>a named platform team for the Phase 1 scope, plus hosting. Each later phase re-sizes the team before it starts\u003c/p>\u003c/div>\n      \u003cdiv class=\"card inv\">\u003cdiv class=\"label\">Later phases\u003c/div>\u003cdiv class=\"v\">Sized at each exit\u003c/div>\u003cp>integrations at 2–4 weeks per module; AI review and agents also add model hosting or usage cost\u003c/p>\u003c/div>\n      \u003cdiv class=\"card inv\">\u003cdiv class=\"label\">Vendor licences\u003c/div>\u003cdiv class=\"v\">Reused\u003c/div>\u003cp>existing scanner contracts plugged in, not duplicated\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"note\">Estimates from the product requirements. Phase 2 and 3 effort, and AI model cost, are sized at the pilot exit once the hosting decision is made. The value model is ready and is filled in with the pilot baseline.\u003c/p>\n    \u003cdiv style=\"margin-top:24px\">\n      \u003cdiv class=\"card pad\">\n        \u003cdiv class=\"label\" style=\"margin-bottom:10px\">Pilot success criteria\u003c/div>\n        \u003cdiv class=\"tw\">\u003ctable class=\"metrics\">\n          \u003cthead>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>How it's computed\u003c/th>\u003cth>Target\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>Time to verified fix\u003c/td>\u003ctd>Median days from first seen to the rescan that confirms the fix\u003c/td>\u003ctd>To ratify in weeks 1–2\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Ownership\u003c/td>\u003ctd>Share of new findings with an assignee within 48 hours\u003c/td>\u003ctd>To ratify\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Gate false-block rate\u003c/td>\u003ctd>Upheld PR disputes ÷ blocked PRs\u003c/td>\u003ctd>To ratify (requirement: under 2%)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Fix PR merge rate\u003c/td>\u003ctd>Merged fix PRs ÷ fix PRs opened\u003c/td>\u003ctd>To ratify\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Coverage\u003c/td>\u003ctd>Dependencies checked ÷ dependencies found, from scan receipts\u003c/td>\u003ctd>To ratify\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Exception renewals\u003c/td>\u003ctd>Exceptions renewed on the same package ÷ exceptions expired\u003c/td>\u003ctd>To ratify\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Developer overrides\u003c/td>\u003ctd>Break-glass requests per 100 blocked PRs\u003c/td>\u003ctd>To ratify\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\u003c/div>\n        \u003cp class=\"note\">Every measure comes from records the product already keeps. Targets are agreed with the pilot team on its own baseline, then fixed before results are read.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ RISKS + DECISIONS -->\n\u003csection class=\"band\" id=\"decisions\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">08\u003c/span> Risks and decisions\u003c/div>\n      \u003ch2 class=\"title\">Designed to fail safe, and what we need from leadership.\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"two\">\n      \u003cdiv class=\"card\" style=\"overflow:hidden\">\n        \u003cdiv class=\"pad\" style=\"padding-bottom:12px\">\u003cdiv class=\"label\">Key risks and how they're handled\u003c/div>\u003c/div>\n        \u003cdiv class=\"risk\">\n          \u003cdiv class=\"rh\">Risk\u003c/div>\u003cdiv class=\"rh\">Safeguard\u003c/div>\n          \u003cdiv>False alarms slow developers down\u003c/div>\u003cdiv>Advisory first; blocking only after false positives are under 5%\u003c/div>\n          \u003cdiv>The platform itself has an outage\u003c/div>\u003cdiv>The PR check shows Incomplete, never a green pass. Repos that enforce blocking can hold the merge, with a security-approved break-glass that expires; on-call is alerted\u003c/div>\n          \u003cdiv>A scanner or data feed is down\u003c/div>\u003cdiv>Nothing is auto-closed, and the coverage receipt shows exactly what is still waiting on a source\u003c/div>\n          \u003cdiv>AI makes a wrong call\u003c/div>\u003cdiv>AI only advises; it cites exact lines; humans approve and merge\u003c/div>\n          \u003cdiv>Vulnerability data is sensitive\u003c/div>\u003cdiv>Self-hosted, role-based access, per-device sessions, rotating encryption keys, a hash-chained audit log\u003c/div>\n          \u003cdiv>Scope grows faster than the team\u003c/div>\u003cdiv>Phase 1 is dependencies only; each later phase is costed and approved at the previous exit\u003c/div>\n          \u003cdiv>The build doesn't deliver\u003c/div>\u003cdiv>Kill criteria agreed up front, then a pure vendor purchase with the requirements already written\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card pad\">\n        \u003cdiv class=\"label\" style=\"margin-bottom:6px\">Decisions we need\u003c/div>\n        \u003col class=\"dec\">\n          \u003cli>\u003cspan class=\"q\">1\u003c/span>\u003cdiv>\u003cb>Fund Phase 1\u003c/b>\u003cspan>3–4 engineers for an 8–12 week build, then a 4–6 week pilot\u003c/span>\u003c/div>\u003c/li>\n          \u003cli>\u003cspan class=\"q\">2\u003c/span>\u003cdiv>\u003cb>Pilot team and repositories\u003c/b>\u003cspan>with the scanner source they use, licensed or built-in\u003c/span>\u003c/div>\u003c/li>\n          \u003cli>\u003cspan class=\"q\">3\u003c/span>\u003cdiv>\u003cb>Deployment and AI model hosting\u003c/b>\u003cspan>air-gapped or cloud, and which model deployment is approved\u003c/span>\u003c/div>\u003c/li>\n          \u003cli>\u003cspan class=\"q\">4\u003c/span>\u003cdiv>\u003cb>First CI platform\u003c/b>\u003cspan>for the pull request gate\u003c/span>\u003c/div>\u003c/li>\n          \u003cli>\u003cspan class=\"q\">5\u003c/span>\u003cdiv>\u003cb>Source of business context\u003c/b>\u003cspan>which service catalog / CMDB holds criticality and ownership\u003c/span>\u003c/div>\u003c/li>\n          \u003cli>\u003cspan class=\"q\">6\u003c/span>\u003cdiv>\u003cb>Targets, deadlines and kill criteria\u003c/b>\u003cspan>the ▲ targets and fix deadlines, ratified before the pilot, and the result that ends it and triggers the buy fallback\u003c/span>\u003c/div>\u003c/li>\n          \u003cli>\u003cspan class=\"q\">7\u003c/span>\u003cdiv>\u003cb>A named platform owner team\u003c/b>\u003cspan>accountable for running it after launch\u003c/span>\u003c/div>\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n    \u003c/div>\n    \u003cdetails class=\"card pad gl\" style=\"margin-top:16px\">\n      \u003csummary>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 6h13\"/>\u003cpath d=\"M8 12h13\"/>\u003cpath d=\"M8 18h13\"/>\u003cpath d=\"M3 6h.01\"/>\u003cpath d=\"M3 12h.01\"/>\u003cpath d=\"M3 18h.01\"/>\u003c/svg> Glossary of abbreviations \u003cspan class=\"muted small\">(hover any abbreviation on this page)\u003c/span>\u003c/summary>\n      \u003cdl class=\"gloss\" id=\"gloss\" data-noabbr>\u003c/dl>\n    \u003c/details>\n  \u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cfooter>\n  \u003cdiv class=\"wrap row\">\n    \u003cspan>Everlit · Executive brief · runs entirely offline\u003c/span>\n    \u003cspan class=\"links\">\u003ca href=\"product.html\">See the product →\u003c/a> &nbsp;·&nbsp; \u003ca href=\"overview.html\">Detailed walkthrough →\u003c/a>\u003c/span>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>\n(() => {\n\"use strict\";\nconst $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];\n\n/* theme: system → light → dark (shared key with overview.html) */\nconst ICONS = { system: '\u003crect width=\"20\" height=\"14\" x=\"2\" y=\"3\" rx=\"2\"/>\u003cpath d=\"M8 21h8\"/>\u003cpath d=\"M12 17v4\"/>', light: '\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2\"/>\u003cpath d=\"M12 20v2\"/>\u003cpath d=\"m4.93 4.93 1.41 1.41\"/>\u003cpath d=\"m17.66 17.66 1.41 1.41\"/>\u003cpath d=\"M2 12h2\"/>\u003cpath d=\"M20 12h2\"/>\u003cpath d=\"m6.34 17.66-1.41 1.41\"/>\u003cpath d=\"m19.07 4.93-1.41 1.41\"/>', dark: '\u003cpath d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"/>' };\nlet mode = \"system\";\ntry { mode = localStorage.getItem(\"everlit-theme\") || \"system\"; } catch (_) {}\nconst btn = $(\"#themeBtn\");\nconst applyTheme = () => {\n  if (mode === \"system\") document.documentElement.removeAttribute(\"data-theme\"); else document.documentElement.setAttribute(\"data-theme\", mode);\n  btn.innerHTML = `\u003csvg class=\"i\" viewBox=\"0 0 24 24\">${ICONS[mode]}\u003c/svg>`; btn.setAttribute(\"aria-label\", `Theme: ${mode}. Click to change`);\n};\napplyTheme();\nbtn.addEventListener(\"click\", () => { mode = [\"system\", \"light\", \"dark\"][([\"system\", \"light\", \"dark\"].indexOf(mode) + 1) % 3]; try { localStorage.setItem(\"everlit-theme\", mode); } catch (_) {} applyTheme(); if (window.parent !== window) window.parent.postMessage({ everlit: \"theme\", mode }, \"*\"); });\naddEventListener(\"everlit:theme\", e => { mode = e.detail.mode; applyTheme(); });\ntry { if (localStorage.getItem(\"everlit-roadmap\") === \"on\") document.documentElement.dataset.roadmap = \"on\"; } catch (_) {}\n\n/* value calculator: formulas are printed on the page */\nconst FTE_HOURS = 1680;\nconst num = id => { const v = parseFloat($(\"#\" + id).value); return Number.isFinite(v) && v >= 0 ? v : 0; };\nconst fmtH = n => Math.round(n).toLocaleString(\"en-US\");\nfunction calcValue() {\n  const cur = ($(\"#cCur\").value || \"\").trim();\n  const money = n => (n \u003c 0 ? \"−\" : \"\") + cur + Math.round(Math.abs(n)).toLocaleString(\"en-US\");\n  const share = Math.min(num(\"cWait\"), 100) / 100, auto = Math.min(num(\"cAuto\"), 100) / 100;\n  const tri = num(\"cFind\") * share * num(\"cTri\") / 60 * 12;\n  const fix = num(\"cElig\") * auto * Math.max(0, num(\"cHrs\") - num(\"cRev\") / 60) * 12;\n  const build = num(\"cBuild\") * 40 * num(\"cCost\") / Math.max(1, num(\"cYears\")), infra = num(\"cInfra\");\n  const hrs = tri + fix, val = hrs * num(\"cCost\"), run = num(\"cRun\") * FTE_HOURS * num(\"cCost\"), net = val - run - build - infra;\n  $(\"#oTri\").textContent = fmtH(tri) + \" h\"; $(\"#oFix\").textContent = fmtH(fix) + \" h\"; $(\"#oHrs\").textContent = fmtH(hrs) + \" h\";\n  $(\"#oFte\").textContent = (hrs / FTE_HOURS).toFixed(1) + \" FTE\"; $(\"#oVal\").textContent = money(val); $(\"#oRunC\").textContent = money(run);\n  $(\"#oBuildC\").textContent = money(build); $(\"#oInfraC\").textContent = money(infra);\n  $(\"#oNet\").textContent = money(net); $(\"#oNet\").classList.toggle(\"pos\", net > 0);\n  $(\"#oNetNote\").textContent = net > 0 ? `${(hrs / FTE_HOURS).toFixed(1)} engineers' worth of time returned each year, after paying for the build, hosting and platform team.` : \"At these inputs the platform costs more than the time it returns. Try our own volumes.\";\n  return { tri, fix, hrs, val, run, build, infra, net };\n}\n$(\"#calcIn\").addEventListener(\"input\", calcValue);\ncalcValue();\nwindow.__calc = calcValue;\n$(\"#printBtn\").addEventListener(\"click\", () => window.print());\n\n/* scroll-spy */\nconst links = $$(\".nav-links a\"), map = new Map(links.map(a => [a.getAttribute(\"href\").slice(1), a]));\nconst io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { links.forEach(a => a.removeAttribute(\"aria-current\")); const a = map.get(e.target.id); if (a) a.setAttribute(\"aria-current\", \"true\"); } }), { rootMargin: \"-45% 0px -50% 0px\" });\n$$(\"main section[id]\").forEach(s => io.observe(s));\n\n/* abbreviations: same glossary as product.html / overview.html */\nconst GLOSSARY = {\n  AI: \"Artificial Intelligence\", CVE: \"Common Vulnerabilities and Exposures\", CVSS: \"Common Vulnerability Scoring System\", EPSS: \"Exploit Prediction Scoring System\",\n  KEV: \"Known Exploited Vulnerabilities (CISA catalog)\", CISA: \"Cybersecurity and Infrastructure Security Agency (US)\", NVD: \"National Vulnerability Database\",\n  NIST: \"National Institute of Standards and Technology (US)\", OSV: \"Open Source Vulnerabilities\", FIRST: \"Forum of Incident Response and Security Teams\",\n  CISO: \"Chief Information Security Officer\", SLA: \"Service Level Agreement (the fix deadline)\", MTTR: \"Mean Time To Remediate\", PR: \"Pull Request\",\n  CI: \"Continuous Integration\", \"CI/CD\": \"Continuous Integration / Continuous Delivery\", SDLC: \"Software Development Life Cycle\", VEX: \"Vulnerability Exploitability eXchange\",\n  CMDB: \"Configuration Management Database\", FTE: \"Full-Time Equivalent (one person's working time)\", \"PCI-DSS\": \"Payment Card Industry Data Security Standard\",\n  SOX: \"Sarbanes-Oxley Act\", FFIEC: \"Federal Financial Institutions Examination Council\",\n  SCA: \"Software Composition Analysis\", SAST: \"Static Application Security Testing\", MSR: \"Mining Software Repositories (academic conference)\",\n};\nconst ABBR_ALIAS = { PRs: \"PR\", SLAs: \"SLA\" };\nconst ABBR_RE = new RegExp(`\\\\b(${[...Object.keys(GLOSSARY), ...Object.keys(ABBR_ALIAS)].sort((a, b) => b.length - a.length).map(k => k.replace(/[-./]/g, \"\\\\$&\")).join(\"|\")})\\\\b`, \"g\");\nconst SKIP = \"scrip var(--fg)}\n.cmpx .us{background:var(--accent-soft)}\n.cmpx thead th.us{color:var(--accent);background:var(--accent-soft)}\n.cmpx small{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.4}\n.cmpx small.plain{margin:0;color:var(--fg-2)}\n.cm{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650}\n.cm::before{content:\"\";width:8px;height:8px;border-radius:50%;flex:none}\n.cm-y{color:var(--good-fg)}.cm-y::before{background:var(--good)}\n.cm-p{color:var(--med-fg)}.cm-p::before{background:var(--med)}\n.cm-n{color:var(--muted)}.cm-n::before{background:transparent;border:1.5px solid var(--faint)}\n.cm-v{color:var(--muted)}.cm-v::before{background:var(--border-strong)}\n.cmpx-note{margin-top:12px;font-size:13px;color:var(--muted);max-width:820px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n/* roadmap badges: hidden unless the viewer turns them on */\n[data-embedded] #themeBtn{display:none}\n:root .rm-badge{display:none;align-items:center;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);font-size:10.5px;font-weight:650;letter-spacing:.02em;line-height:1.5;white-space:nowrap;text-transform:none;vertical-align:1px}\n:root[data-roadmap=\"on\"] .rm-badge{display:inline-flex}\n.cmp-head{margin:56px 0 20px}\n.cmp-head h3{font-size:20px;font-weight:650;letter-spacing:-.01em}\n.cmp-head p{margin-top:6px;color:var(--muted);max-width:720px}\n@media (prefers-reduced-motion:reduce){\n  html{scroll-behavior:auto}\n  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-property:opacity,color,background-color,border-color,box-shadow !important}\n  .js .reveal{transform:none}\n  .agent[data-state=\"run\"] .aicon::after{animation:none}\n}\n@media (forced-colors:active){.sbar .seg-fill{forced-color-adjust:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"sr-only\" href=\"#main\">Skip to content\u003c/a>\n\n\u003c!-- ============================================================ NAV -->\n\u003cheader class=\"nav\" id=\"nav\">\n  \u003cdiv class=\"wrap\">\n    \u003ca class=\"brand\" href=\"#top\" aria-label=\"Everlit home\">\n      \u003cspan class=\"brand-mark\">\u003ci data-i=\"shield\">\u003c/i>\u003c/span> Everlit\n    \u003c/a>\n    \u003cnav class=\"nav-links\" aria-label=\"Sections\">\n      \u003ca href=\"#lifecycle\">Lifecycle\u003c/a>\n      \u003ca href=\"#playground\">Score\u003c/a>\n      \u003ca href=\"#compare\">vs CVSS\u003c/a>\n      \u003ca href=\"#agents\">Agents\u003c/a>\n      \u003ca href=\"#verify\">Verify\u003c/a>\n      \u003ca href=\"#proof\">Proof\u003c/a>\n      \u003ca href=\"#ai\">AI\u003c/a>\n      \u003ca href=\"#portfolio\">Portfolio\u003c/a>\n      \u003ca href=\"#sources\">Sources\u003c/a>\n      \u003ca href=\"#principles\">Principles\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"nav-right\">\n      \u003ca class=\"btn btn-primary btn-sm\" href=\"product.html\">Open the product \u003ci data-i=\"arrowRight\">\u003c/i>\u003c/a>\n      \u003cbutton class=\"icon-btn\" id=\"themeBtn\" type=\"button\" aria-label=\"Theme: system\">\u003ci data-i=\"monitor\">\u003c/i>\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain id=\"main\">\n\u003c!-- ============================================================ HERO -->\n\u003csection class=\"hero\" id=\"top\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv>\n      \u003ca class=\"pill-link reveal\" href=\"#lifecycle\">\u003cspan class=\"tag\">Walkthrough\u003c/span> Follow one finding from scan to verified fix \u003ci data-i=\"arrowRight\">\u003c/i>\u003c/a>\n      \u003ch1 class=\"reveal\" style=\"--i:1\">CVSS says how bad a bug \u003cspan class=\"soft\">could&nbsp;be.\u003c/span> Everlit says what to \u003cspan class=\"accent\">fix&nbsp;first\u003c/span>, then gets it&nbsp;fixed.\u003c/h1>\n      \u003cp class=\"hero-sub reveal\" style=\"--i:2\">Our self-hosted platform for vulnerabilities in the open-source packages our code depends on. It scores every finding with \u003cem>our\u003c/em> context (real-world exploitation, whether our code imports the package, internet exposure, business criticality) and turns that score into policy, merge gates, SLAs and fix PRs.\u003c/p>\n      \u003cdiv class=\"hero-cta reveal\" style=\"--i:3\">\n        \u003ca class=\"btn btn-primary\" href=\"#playground\">\u003ci data-i=\"gauge\">\u003c/i> Try the score playground\u003c/a>\n        \u003ca class=\"btn btn-secondary\" href=\"product.html\">Open the product \u003ci data-i=\"arrowRight\">\u003c/i>\u003c/a>\n        \u003ca class=\"btn btn-ghost\" href=\"#lifecycle\">Walk the lifecycle\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"hero-meta reveal\" style=\"--i:4\">\n        \u003cspan>\u003ci data-i=\"check\">\u003c/i> 8 ecosystems via OSV.dev\u003c/span>\n        \u003cspan>\u003ci data-i=\"check\">\u003c/i> EPSS + CISA KEV enrichment\u003c/span>\n        \u003cspan>\u003ci data-i=\"check\">\u003c/i> Pre-merge PR gate with AI review\u003cspan class=\"rm-badge\" title=\"Planned for Phase 3 of the rollout\">Phase 3\u003c/span>\u003c/span>\n        \u003cspan>\u003ci data-i=\"check\">\u003c/i> CI-gated fix PRs\u003c/span>\n        \u003cspan>\u003ci data-i=\"check\">\u003c/i> SDLC agents for complex fixes\u003cspan class=\"rm-badge\" title=\"Planned for Phase 3 of the rollout\">Phase 3\u003c/span>\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card finding reveal\" style=\"--i:2\" aria-label=\"Example finding\">\n      \u003cdiv class=\"finding-top\">\n        \u003cdiv>\n          \u003ch3>lodash 4.17.15 · command injection\u003c/h3>\n          \u003cdiv class=\"sub mono\">CVE-2021-23337 · payments-api · direct-runtime\u003c/div>\n        \u003c/div>\n        \u003cspan id=\"heroBadge\">\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"versus\">\n        \u003cdiv>\n          \u003cdiv class=\"label\">CVSS alone\u003c/div>\n          \u003cdiv class=\"v-num tnum\">7.2 \u003csmall>/ 10\u003c/small>\u003c/div>\n          \u003cspan id=\"heroCvssBadge\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"win\">\n          \u003cdiv class=\"label\">Everlit priority\u003c/div>\n          \u003cdiv class=\"v-num\" id=\"heroScore\">—\u003c/div>\n          \u003cspan class=\"muted small\">with our context\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"sbar\" id=\"heroBar\" aria-hidden=\"true\">\u003c/div>\n      \u003cdiv class=\"why\" id=\"heroWhy\">\u003c/div>\n      \u003cdiv class=\"finding-foot\" id=\"heroFoot\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PROBLEM -->\n\u003csection class=\"band\" id=\"problem\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">01\u003c/span> The problem\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">Scanners find thousands of issues. Teams fix the wrong ones first.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">Everlit isn't another dependency updater or scanner. We keep the scanners we have; Everlit adds what they leave out: business context, policy, enforcement at the pull request, and fixes that are proven in CI.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"grid-3\">\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:0\">\n        \u003cdiv class=\"ficon\">\u003ci data-i=\"alert\" class=\"i-lg\">\u003c/i>\u003c/div>\n        \u003ch3>Update bots don't know what's exploitable\u003c/h3>\n        \u003cp>Dependency-update bots keep packages current by opening an upgrade PR for every outdated package. None of them says which upgrade closes a vulnerability attackers are using today, or which service it matters for.\u003c/p>\n        \u003cdiv class=\"answer\">\u003ci data-i=\"check\">\u003c/i>\u003cspan>EPSS likelihood and the CISA KEV list feed every score.\u003c/span>\u003c/div>\n      \u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:1\">\n        \u003cdiv class=\"ficon\">\u003ci data-i=\"layers\" class=\"i-lg\">\u003c/i>\u003c/div>\n        \u003ch3>Generic severity ignores our context\u003c/h3>\n        \u003cp>A CVSS 9.8 in a test helper and the same bug in an internet-facing payments API get the same label.\u003c/p>\n        \u003cdiv class=\"answer\">\u003ci data-i=\"check\">\u003c/i>\u003cspan>Import evidence, exposure and criticality reshape priority.\u003c/span>\u003c/div>\n      \u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:2\">\n        \u003cdiv class=\"ficon\">\u003ci data-i=\"gitMerge\" class=\"i-lg\">\u003c/i>\u003c/div>\n        \u003ch3>Post-merge scanning is too late\u003c/h3>\n        \u003cp>By the time a nightly scan flags it, vulnerable code is already on main and heading to production.\u003c/p>\n        \u003cdiv class=\"answer\">\u003ci data-i=\"check\">\u003c/i>\u003cspan>A pre-merge gate blocks only what the PR introduces, and an AI review flags risky code before it reaches main.\u003c/span>\u003c/div>\n      \u003c/article>\n    \u003c/div>\n    \u003cdiv class=\"cmp-head reveal\" id=\"compare-tools\">\n      \u003ch3>How Everlit compares\u003c/h3>\n      \u003cp>Everlit sits on top of the scanners, not in place of them. Update bots keep packages current, scanners find issues, and commercial risk platforms pull findings into one view; Everlit adds our context, the pull request gate and fixes proven by a rescan. It is slower to start and our own team supports it. \u003ca class=\"link\" href=\"executive.html#build\">See the full build-versus-buy comparison →\u003c/a>\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ LIFECYCLE -->\n\u003csection id=\"lifecycle\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">02\u003c/span> End-to-end lifecycle\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">From who's allowed to see it, to proof that it's fixed.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">Follow one finding (lodash in \u003ccode>payments-api\u003c/code>) through ten stages. Switch roles to see exactly what each person, or the SDLC agent, is entitled to do at every step.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"roles reveal\" role=\"radiogroup\" aria-label=\"Viewing as\" id=\"roleChips\">\n      \u003cspan class=\"label\">Viewing as\u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"rail reveal\" role=\"tablist\" aria-label=\"Lifecycle stages\" id=\"rail\">\n      \u003cdiv class=\"rail-line\" aria-hidden=\"true\">\u003cdiv class=\"rail-fill\" id=\"railFill\">\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003cdiv class=\"card stage-main\" id=\"stageMain\" role=\"tabpanel\">\u003c/div>\n      \u003cdiv class=\"card perm\" id=\"stagePerm\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PLAYGROUND -->\n\u003csection class=\"band\" id=\"playground\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head head-row\">\n      \u003cdiv>\n        \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">03\u003c/span> Score playground\u003c/div>\n        \u003ch2 class=\"title reveal\" style=\"--i:1\">One documented number drives everything.\u003c/h2>\n        \u003cp class=\"lede reveal\" style=\"--i:2\">Move the inputs and watch the 0–100 priority, the policy action, the merge gate and the SLA react. This is the exact formula the platform runs.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"presets reveal\" id=\"presets\" aria-label=\"Presets\">\u003c/div>\n\n    \u003cdiv class=\"play\">\n      \u003cform class=\"card controls reveal\" id=\"controls\" onsubmit=\"return false\" aria-label=\"Scoring inputs\">\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-head\">\u003clabel for=\"in-cvss\">CVSS base score\u003c/label>\u003coutput id=\"out-cvss\" for=\"in-cvss\">7.2\u003c/output>\u003c/div>\n          \u003cinput class=\"range\" type=\"range\" id=\"in-cvss\" min=\"0\" max=\"10\" step=\"0.1\" value=\"7.2\">\n          \u003cdiv class=\"ctrl-hint\">How bad the bug could be in theory · worth up to 35 points\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-head\">\u003clabel for=\"in-epss\">Exploit likelihood (EPSS probability)\u003c/label>\u003coutput id=\"out-epss\" for=\"in-epss\">1.2%\u003c/output>\u003c/div>\n          \u003cinput class=\"range\" type=\"range\" id=\"in-epss\" min=\"0\" max=\"100\" step=\"1\" value=\"52\" aria-describedby=\"epssHint\">\n          \u003cdiv class=\"ctrl-hint\" id=\"epssHint\">Chance of exploitation in the next 30 days · 10% or more: 25 · 1–10%: 15 · 0.1–1%: 5 · under 0.1%: 0 points\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-row\">\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"in-kev\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"sw-text\">Known exploited (CISA KEV)\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"ctrl-hint\">Exploited in the wild: full 25 exploit points, +10 bonus, and the 7-day KEV SLA\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-head\">\u003cspan class=\"ctrl-name\" id=\"lbl-reach\">Import evidence\u003c/span>\u003c/div>\n          \u003cdiv class=\"seg\" style=\"--n:3\" data-seg=\"reach\" role=\"radiogroup\" aria-labelledby=\"lbl-reach\">\n            \u003cspan class=\"seg-pill\">\u003c/span>\n            \u003clabel>\u003cinput type=\"radio\" name=\"reach\" value=\"yes\" checked>\u003cspan>Imported\u003c/span>\u003c/label>\n            \u003clabel>\u003cinput type=\"radio\" name=\"reach\" value=\"unknown\">\u003cspan>Unknown\u003c/span>\u003c/label>\n            \u003clabel>\u003cinput type=\"radio\" name=\"reach\" value=\"no\">\u003cspan>Not imported\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"ctrl-hint\">Does our code import the vulnerable package? 15 / 7.5 / 0 points\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-row\">\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"in-net\" checked>\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"sw-text\">Internet-facing service\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"ctrl-hint\">15 points if exposed, 3 if internal\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-head\">\u003cspan class=\"ctrl-name\" id=\"lbl-tier\">Business criticality\u003c/span>\u003c/div>\n          \u003cdiv class=\"seg\" style=\"--n:4\" data-seg=\"tier\" role=\"radiogroup\" aria-labelledby=\"lbl-tier\">\n            \u003cspan class=\"seg-pill\">\u003c/span>\n            \u003clabel>\u003cinput type=\"radio\" name=\"tier\" value=\"critical\" checked>\u003cspan>Critical\u003c/span>\u003c/label>\n            \u003clabel>\u003cinput type=\"radio\" name=\"tier\" value=\"high\">\u003cspan>High\u003c/span>\u003c/label>\n            \u003clabel>\u003cinput type=\"radio\" name=\"tier\" value=\"medium\">\u003cspan>Medium\u003c/span>\u003c/label>\n            \u003clabel>\u003cinput type=\"radio\" name=\"tier\" value=\"low\">\u003cspan>Low\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"ctrl-hint\">Set per repo by security · 10 / 7 / 4 / 0 points\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003cdiv class=\"ctrl-head\">\u003cspan class=\"ctrl-name\" id=\"lbl-scope\">Dependency scope\u003c/span>\u003c/div>\n          \u003cdiv class=\"seg\" style=\"--n:2\" data-seg=\"scope\" role=\"radiogroup\" aria-labelledby=\"lbl-scope\">\n            \u003cspan class=\"seg-pill\">\u003c/span>\n            \u003clabel>\u003cinput type=\"radio\" name=\"scope\" value=\"runtime\" checked>\u003cspan>Runtime\u003c/span>\u003c/label>\n            \u003clabel>\u003cinput type=\"radio\" name=\"scope\" value=\"dev\">\u003cspan>Dev / test only\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cdiv class=\"ctrl-hint\">Dev-only dependencies don't ship, so the total is scaled ×0.6\u003c/div>\n        \u003c/div>\n      \u003c/form>\n\n      \u003cdiv class=\"card result reveal\" style=\"--i:1\">\n        \u003cdiv class=\"score-row\">\n          \u003cdiv>\n            \u003cdiv class=\"label\">Everlit priority\u003c/div>\n            \u003cdiv class=\"hero-fig\" id=\"scoreNum\">84\u003csmall>/100\u003c/small>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"score-meta\">\n            \u003cspan id=\"scoreBadge\">\u003c/span>\n            \u003cdiv class=\"vs-cvss\" id=\"vsCvss\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv aria-live=\"polite\" class=\"sr-only\" id=\"scoreLive\">\u003c/div>\n\n        \u003cdiv>\n          \u003cdiv class=\"ticks\" aria-hidden=\"true\">\n            \u003cspan class=\"tick\" style=\"left:35%\">Medium ≥35\u003c/span>\n            \u003cspan class=\"tick\" style=\"left:60%\">High ≥60\u003c/span>\n            \u003cspan class=\"tick\" style=\"left:80%\">Critical ≥80\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"sbar sbar-lg\" id=\"playBar\" role=\"img\" aria-label=\"Score breakdown\">\u003c/div>\n          \u003cdiv class=\"axis\" aria-hidden=\"true\">\u003cspan>0\u003c/span>\u003cspan>100\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"devnote\" id=\"devNote\" hidden>\u003cspan class=\"sw\">\u003c/span>\u003cspan id=\"devText\">\u003c/span>\u003c/div>\n\n        \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n\n        \u003cdiv>\n          \u003cbutton class=\"linkish\" type=\"button\" id=\"tableToggle\" aria-expanded=\"false\">\u003ci data-i=\"list\">\u003c/i> View as table\u003c/button>\n          \u003cdiv id=\"tableWrap\" hidden style=\"margin-top:12px;overflow-x:auto\">\u003c/div>\n        \u003c/div>\n        \u003cp class=\"small muted\" style=\"margin-top:auto;padding-top:16px;border-top:1px solid var(--border)\">Thresholds match the default policy rules. A finding's bucket picks its action, gate and SLA. Hover a segment to see its rule.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"outcome\" id=\"outcome\">\u003c/div>\n\n    \u003cdetails class=\"policy-edit\" id=\"policyEdit\">\n      \u003csummary>\u003ci data-i=\"sliders\">\u003c/i> Edit policy rules &amp; SLAs \u003ci data-i=\"chevDown\" class=\"chev\">\u003c/i>\u003c/summary>\n      \u003cdiv class=\"policy-grid\">\n        \u003cdiv class=\"card card-pad\" style=\"overflow-x:auto\">\n          \u003cdiv class=\"label\" style=\"margin-bottom:8px\">Policy rules · first match wins\u003c/div>\n          \u003ctable class=\"tbl\" id=\"rulesTbl\">\u003c/table>\n        \u003c/div>\n        \u003cdiv class=\"card card-pad\" style=\"overflow-x:auto\">\n          \u003cdiv class=\"label\" style=\"margin-bottom:8px\">Remediation SLA (days)\u003c/div>\n          \u003ctable class=\"tbl\" id=\"slaTbl\">\u003c/table>\n          \u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" id=\"resetPolicy\" style=\"margin-top:12px\">\u003ci data-i=\"undo\">\u003c/i> Reset to defaults\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/details>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ COMPARE -->\n\u003csection id=\"compare\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head head-row\">\n      \u003cdiv>\n        \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">04\u003c/span> CVSS vs Everlit\u003c/div>\n        \u003ch2 class=\"title reveal\" style=\"--i:1\">Same eight findings. Very different Monday morning.\u003c/h2>\n        \u003cp class=\"lede reveal\" style=\"--i:2\">Rank by CVSS and the team burns a sprint on bugs nobody can reach. Rank by Everlit and the actively exploited, internet-facing ones rise to the top. These are illustrative scenarios.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"cmp-toolbar reveal\" style=\"--i:3\">\n        \u003cdiv class=\"seg\" style=\"--n:2\" data-seg=\"rank\" role=\"radiogroup\" aria-label=\"Rank by\">\n          \u003cspan class=\"seg-pill\">\u003c/span>\n          \u003clabel>\u003cinput type=\"radio\" name=\"rank\" value=\"cvss\" checked>\u003cspan>Rank by CVSS\u003c/span>\u003c/label>\n          \u003clabel>\u003cinput type=\"radio\" name=\"rank\" value=\"everlit\">\u003cspan>Rank by Everlit\u003c/span>\u003c/label>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003col class=\"cmp\" id=\"cmpList\" aria-live=\"polite\">\u003c/ol>\n    \u003cdiv class=\"cmp-legend\">\n      \u003cspan>\u003ci data-i=\"arrowUp\" style=\"color:var(--crit-fg)\">\u003c/i> moved up vs CVSS order\u003c/span>\n      \u003cspan>\u003ci data-i=\"arrowDown\" style=\"color:var(--good-fg)\">\u003c/i> moved down\u003c/span>\n      \u003cspan>\u003ci data-i=\"lock\">\u003c/i> blocks merge under default policy\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ AGENTS -->\n\u003csection class=\"band\" id=\"agents\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">05\u003c/span> SDLC agent squad\u003cspan class=\"rm-badge\" title=\"Planned for Phase 3 of the rollout\">Phase 3\u003c/span>\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">When the fix isn't a one-line bump, agents do the legwork. The owning team makes the call.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">When a fix needs more than a version bump, Everlit routes it to a squad of agents. They plan the change, write it, test it, re-scan it, and hand the owning team a PR with an evidence pack. Agents never approve or merge their own work.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"agent-top\">\n      \u003cdiv>\n        \u003cdiv class=\"label\" style=\"margin-bottom:8px\">Pick a complex fix\u003c/div>\n        \u003cdiv class=\"scen\" id=\"scenChips\" role=\"radiogroup\" aria-label=\"Complex-fix scenario\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctrl-bar\">\n        \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"failToggle\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"sw-text small\">Make it fail\u003c/span>\u003c/label>\n        \u003cbutton class=\"btn btn-secondary btn-sm\" type=\"button\" id=\"playBtn\">\u003ci data-i=\"pause\">\u003c/i> Pause\u003c/button>\n        \u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" id=\"replayBtn\">\u003ci data-i=\"undo\">\u003c/i> Replay\u003c/button>\n        \u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" id=\"skipBtn\">\u003ci data-i=\"skip\">\u003c/i> Skip to end\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"why-human\" id=\"whyHuman\">\u003c/div>\n\n    \u003cdiv class=\"squad\" id=\"squad\">\n      \u003cdiv class=\"retry-arc\" id=\"retryArc\" aria-hidden=\"true\">\n        \u003cdiv class=\"wrap-clip\">\u003csvg viewBox=\"0 0 100 34\" preserveAspectRatio=\"none\">\u003cpath d=\"M98 34 C 98 6, 2 6, 2 34\" vector-effect=\"non-scaling-stroke\"/>\u003c/svg>\u003c/div>\n        \u003cspan class=\"rlabel\" id=\"retryLabel\">tests failed: retry\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"agent-body\">\n      \u003cdiv class=\"console\" aria-label=\"Agent run log\">\n        \u003cdiv class=\"console-head\">\u003cspan class=\"lights\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan id=\"consoleTitle\">everlit-agents · run\u003c/span>\u003c/div>\n        \u003col id=\"consoleLog\" aria-live=\"polite\">\u003c/ol>\n      \u003c/div>\n      \u003cdiv class=\"card\" id=\"handoff\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"guard\">\n      \u003cdiv class=\"card card-pad\">\n        \u003ch4>\u003ci data-i=\"check\" style=\"color:var(--good)\">\u003c/i> The agent identity can\u003c/h4>\n        \u003cul>\n          \u003cli class=\"yes\">\u003ci data-i=\"check\">\u003c/i>Run scans and read findings for repos it's assigned\u003c/li>\n          \u003cli class=\"yes\">\u003ci data-i=\"check\">\u003c/i>Push a fix branch and open a PR\u003c/li>\n          \u003cli class=\"yes\">\u003ci data-i=\"check\">\u003c/i>Comment, attach evidence, request review from the owning team\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card card-pad\">\n        \u003ch4>\u003ci data-i=\"ban\" style=\"color:var(--crit)\">\u003c/i> It can never\u003c/h4>\n        \u003cul>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Approve or merge its own PR\u003c/li>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Approve exceptions or accept risk\u003c/li>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Edit policy, repo exposure or criticality\u003c/li>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Mark a finding fixed. Only a rescan can\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card card-pad\">\n        \u003ch4>\u003ci data-i=\"shield\" style=\"color:var(--accent)\">\u003c/i> Guardrails\u003c/h4>\n        \u003cul>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Runs in a sandbox; at most 3 fix ↔ test attempts, then escalates\u003c/li>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Every step lands in the audit log\u003c/li>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Never reports a success that didn't happen\u003c/li>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Runs on our approved model deployment; code never leaves our network\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ VERIFY -->\n\u003csection id=\"verify\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">06\u003c/span> The final check\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">\"Did the fix actually work?\" Only a rescan gets to say yes.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">After the merge, Everlit reconciles the next scan against what it knew. Pick what the rescan sees; these are the platform's real auto-close rules.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"verify\">\n      \u003cdiv class=\"outcomes\" id=\"outcomes\" role=\"radiogroup\" aria-label=\"Rescan outcome\">\u003c/div>\n      \u003cdiv class=\"card vpanel\" id=\"vpanel\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PROOF -->\n\u003csection class=\"band\" id=\"proof\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">07\u003c/span> Proof you can check\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">Every claim comes with its receipt.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">A dashboard that says \"0 findings\" is only as good as what it looked at. Everlit records what each scan checked, where each score input came from, which policy decided, and who signed off, in a log nobody can quietly edit.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"grid-3\">\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:0\">\u003cdiv class=\"ficon\">\u003ci data-i=\"clipboard\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Coverage receipt on every scan\u003c/h3>\u003cp>Manifests and dependencies checked, whether OSV.dev answered for every package, EPSS and KEV freshness, and the policy version. A finding only auto-closes when coverage is complete.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:1\">\u003cdiv class=\"ficon\">\u003ci data-i=\"sliders\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Every score input labelled\u003c/h3>\u003cp>Each term of the priority score is marked Verified, Inferred, Declared or Default, with a confidence line and the exact arithmetic. A guessed number never looks like a measured one.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:2\">\u003cdiv class=\"ficon\">\u003ci data-i=\"scroll\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Policy versions\u003c/h3>\u003cp>The rules, merge-blocking settings and deadlines are hashed into a version. Scans, gate verdicts and decisions record it, and any version expands back to its exact rules.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:3\">\u003cdiv class=\"ficon\">\u003ci data-i=\"lock\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Tamper-evident audit log\u003c/h3>\u003cp>Each event stores a SHA-256 hash of the event before it. One click verifies the chain; an edited or deleted entry is named exactly. Exports carry the hashes.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:4\">\u003cdiv class=\"ficon\">\u003ci data-i=\"gitMerge\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Verified, not just merged\u003c/h3>\u003cp>Branch, CI, PR, merge, then the rescan that proves it: each step is timestamped. Closed PRs, cancelled fixes and repos that never report CI are shown as what they are.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:5\">\u003cdiv class=\"ficon\">\u003ci data-i=\"users\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Accountable sign-off\u003c/h3>\u003cp>Exceptions, gate overrides and not-affected statements all need a second person. Sessions end after 8 hours or 30 minutes idle, per device, and gate evidence is kept 400 days.\u003c/p>\u003c/article>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ AI -->\n\u003csection id=\"ai\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">08\u003c/span> AI with guardrails\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">AI investigates and explains. The rules decide.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">Every AI feature reads a defined slice of evidence, cites what it used and writes a record of the run. None of them can change a status, a score, a verdict or a deadline.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"grid-4\">\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:0\">\u003cdiv class=\"ficon\">\u003ci data-i=\"search\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Investigate a finding\u003c/h3>\u003cp>Facts with their source, the unknowns said out loud, a recommended next step and a confidence level.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:1\">\u003cdiv class=\"ficon\">\u003ci data-i=\"info\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Explain a verdict\u003c/h3>\u003cp>Why a PR was blocked, in the score's own terms and the rule that matched, with the options to move forward.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:2\">\u003cdiv class=\"ficon\">\u003ci data-i=\"file\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Release notes and CI triage\u003c/h3>\u003cp>What a version bump changes, and whether a failed CI run was caused by the bump.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:3\">\u003cdiv class=\"ficon\">\u003ci data-i=\"sliders\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Rules in plain language\u003c/h3>\u003cp>Describe a rule; the AI drafts it in the engine's own fields and a simulation shows its effect before a person saves it.\u003c/p>\u003c/article>\n    \u003c/div>\n    \u003cdiv class=\"guard\" style=\"margin-top:16px\">\n      \u003cdiv class=\"card card-pad\">\n        \u003ch4>\u003ci data-i=\"check\" style=\"color:var(--good)\">\u003c/i> AI can\u003c/h4>\n        \u003cul>\n          \u003cli class=\"yes\">\u003ci data-i=\"check\">\u003c/i>Read the finding, the PR diff or the history it was asked about\u003c/li>\n          \u003cli class=\"yes\">\u003ci data-i=\"check\">\u003c/i>Draft explanations, summaries, rules and exception text\u003c/li>\n          \u003cli class=\"yes\">\u003ci data-i=\"check\">\u003c/i>Flag weak or repeated exceptions for a person to review\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card card-pad\">\n        \u003ch4>\u003ci data-i=\"ban\" style=\"color:var(--crit)\">\u003c/i> AI can never\u003c/h4>\n        \u003cul>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Change a status, score, verdict or deadline\u003c/li>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Approve exceptions, overrides or VEX statements\u003c/li>\n          \u003cli class=\"no\">\u003ci data-i=\"x\">\u003c/i>Follow instructions found in code, advisories or tickets\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card card-pad\">\n        \u003ch4>\u003ci data-i=\"shield\" style=\"color:var(--accent)\">\u003c/i> Every run\u003c/h4>\n        \u003cul>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Is logged with model deployment, prompt version and the evidence it read\u003c/li>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Treats repository and advisory text as data, never as instructions\u003c/li>\n          \u003cli class=\"dotl\">\u003ci data-i=\"dot\">\u003c/i>Stays inside our approved model deployment and one tenant's data\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PORTFOLIO -->\n\u003csection class=\"band\" id=\"portfolio\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">09\u003c/span> Across the portfolio\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">From one finding to the whole estate.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">The same evidence that ranks one finding also shows where else the package lives, which single upgrade removes the most risk, and what a release shipped with.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"grid-4\">\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:0\">\u003cdiv class=\"ficon\">\u003ci data-i=\"globe\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Blast radius\u003c/h3>\u003cp>Every repo where a vulnerable package lives, with its exposure, criticality and owning team.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:1\">\u003cdiv class=\"ficon\">\u003ci data-i=\"layers\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Remediation plan\u003c/h3>\u003cp>Shared upgrades ranked by the risk they remove across repos, with the patch, minor or major change each needs.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:2\">\u003cdiv class=\"ficon\">\u003ci data-i=\"refresh\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Root causes\u003c/h3>\u003cp>Packages vulnerable in several repos, exceptions renewed again and again, and fixes that need engineering time.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:3\">\u003cdiv class=\"ficon\">\u003ci data-i=\"clipboard\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Release passport\u003c/h3>\u003cp>One file per release: inventory, coverage, verdicts, exceptions with owners, verified fixes and the policy version.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:4\">\u003cdiv class=\"ficon\">\u003ci data-i=\"server\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>SBOMs from CI\u003c/h3>\u003cp>CI posts the CycloneDX or SPDX SBOM of each build, so the scan matches exactly what shipped.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:5\">\u003cdiv class=\"ficon\">\u003ci data-i=\"file\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>VEX with evidence\u003c/h3>\u003cp>Not-affected statements need evidence and a second approver, and flow into every VEX export.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:6\">\u003cdiv class=\"ficon\">\u003ci data-i=\"alert\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>KEV re-scoring\u003c/h3>\u003cp>When CISA lists a CVE, matching findings are re-scored and their deadlines tightened at the next daily sync, with no rescan.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:7\">\u003cdiv class=\"ficon\">\u003ci data-i=\"plug\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Where teams work\u003c/h3>\u003cp>GitHub check runs with annotations, Slack alerts to the owning team, and Jira or ServiceNow records for work that needs a plan.\u003c/p>\u003c/article>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ DATA SOURCES -->\n\u003csection id=\"sources\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">10\u003c/span> Data sources\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">Every finding is built on sources the industry already trusts.\u003c/h2>\n      \u003cp class=\"lede reveal\" style=\"--i:2\">Vulnerability records come from public, industry-standard sources run by government agencies, standards bodies and major open-source security teams. No score rests on a single vendor's opinion.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"grid-3\" id=\"srcGrid\">\u003c/div>\n    \u003cdiv class=\"card card-pad reveal\" style=\"margin-top:16px\">\n      \u003cdiv class=\"label\" style=\"margin-bottom:12px\">How a finding is built\u003c/div>\n      \u003col class=\"pipe\" id=\"pipe\">\u003c/ol>\n    \u003c/div>\n    \u003cdetails class=\"card card-pad gloss-wrap\" style=\"margin-top:16px\">\n      \u003csummary>\u003ci data-i=\"list\">\u003c/i> Glossary: every abbreviation and its full form \u003cspan class=\"muted small\">(or hover any abbreviation on this page)\u003c/span>\u003c/summary>\n      \u003cdl class=\"gloss\" id=\"gloss\" data-noabbr>\u003c/dl>\n    \u003c/details>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PRINCIPLES -->\n\u003csection class=\"band\" id=\"principles\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow reveal\">\u003cspan class=\"num\">11\u003c/span> Principles &amp; people\u003c/div>\n      \u003ch2 class=\"title reveal\" style=\"--i:1\">Built to be trusted by the people who have to sign off.\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"grid-4\">\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:0\">\u003cdiv class=\"ficon\">\u003ci data-i=\"eye\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Never reports what didn't happen\u003c/h3>\u003cp>Degraded scans don't close findings, an incomplete gate is never a green pass, and a PR or ticket is only reported once it really exists.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:1\">\u003cdiv class=\"ficon\">\u003ci data-i=\"users\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Two people, always expiring\u003c/h3>\u003cp>Every exception needs a second reviewer and has a hard expiry: 90 or 365 days.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:2\">\u003cdiv class=\"ficon\">\u003ci data-i=\"plug\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Bring your own scanner\u003c/h3>\u003cp>One finding format behind adapters. New tools plug in without touching the pipeline.\u003c/p>\u003c/article>\n      \u003carticle class=\"card card-pad feature reveal\" style=\"--i:3\">\u003cdiv class=\"ficon\">\u003ci data-i=\"file\" class=\"i-lg\">\u003c/i>\u003c/div>\u003ch3>Audit-ready by default\u003c/h3>\u003cp>A unified audit log, compliance views and CycloneDX VEX export.\u003c/p>\u003c/article>\n    \u003c/div>\n    \u003cdiv class=\"personas\" id=\"personas\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003c!-- ============================================================ FOOTER -->\n\u003cfooter>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"foot-row\">\n      \u003cspan class=\"brand\">\u003cspan class=\"brand-mark\">\u003ci data-i=\"shield\">\u003c/i>\u003c/span> Everlit · product overview\u003c/span>\n      \u003cspan>Runs entirely offline. \u003ca class=\"link\" href=\"product.html\">Open the product →\u003c/a> · \u003ca class=\"link\" href=\"executive.html\">Executive brief →\u003c/a>\u003c/span>\n    \u003c/div>\n    \u003cdetails class=\"formula\">\n      \u003csummary>\u003ci data-i=\"code\">\u003c/i> Show the exact scoring formula\u003c/summary>\n\u003cpre>cvss      = (cvssScore ?? 5) / 10 × 35\nexploit   = kev ? 25 : epss ≥ 10% ? 25 : epss ≥ 1% ? 15 : epss ≥ 0.1% ? 5 : epss known ? 0 : 5\nreach     = unknown ? 7.5 : imported ? 15 : 0\nexposure  = internetFacing ? 15 : 3\ntier      = { critical: 10, high: 7, medium: 4, low: 0 }\nkevBonus  = kev ? 10 : 0\npriority  = round(clamp(0, 100, (cvss + exploit + reach + exposure + tier + kevBonus) × (devScope ? 0.6 : 1)))\nbucket    = ≥80 critical · ≥60 high · ≥35 medium · else low\nSLA days  = { kev: 7, critical: 7, high: 30, medium: 90, low: 180 }, KEV takes the tighter\u003c/pre>\n    \u003c/details>\n  \u003c/div>\n\u003c/footer>\n\n\u003cdiv class=\"tip\" id=\"tip\" role=\"tooltip\">\u003c/div>\n\n\u003cscript>\n/*\n * Logic mirrored from vuln-mgmt-platform. Keep in sync with:\n *   src/lib/scoring.ts      computePriorityScore, weights, defaults\n *   src/lib/types.ts        severityFromScore, EXCEPTION_MAX_DAYS\n *   src/lib/policy.ts       decidePolicy (+ default rules in prisma/seed.ts)\n *   src/lib/sla.ts          DEFAULT_SLA_DAYS, slaDaysFor\n *   src/lib/access.ts       PAGE_ROLES, ACTION_ROLES, roleCan, isTeamScoped\n *   src/lib/remediation.ts  manual(...) reasons, CI-gated PRs\n *   src/lib/reconcile.ts    the four auto-close / reopen rules\n */\n(() => {\n\"use strict\";\ndocument.documentElement.classList.add(\"js\");\nconst reduceMotion = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\n\n/* ---------------------------------------------------------------- icons (lucide-style outlines) */\nconst ICONS = {\n  shield:'\u003cpath d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>',\n  check:'\u003cpath d=\"M20 6 9 17l-5-5\"/>',\n  x:'\u003cpath d=\"M18 6 6 pos their own team owns. Security, platform and engineering managers work across teams.\",\n           \"Vulnerability data is sensitive, so nothing is visible by default.\"],\n    example: \"role: developer · team: Payments Platform → sees payments-api, nothing else\",\n    audit: \"user.role_changed  dev.payments@acme.example → Developer  (by Platform Owner)\",\n    actions: [\"manageUsers\"], pages: true },\n  { icon: \"plug\", short: \"Onboard\", title: \"Onboard repos with their risk context\",\n    body: [\"Pick repos from a connected organization, or bulk-import them all through the org connector: GitHub, GitLab, Bitbucket or Azure DevOps.\",\n           \"Each repo records its owning team, internet exposure and business criticality. That's the context the score uses.\",\n           \"Only security or the platform owner can change exposure or criticality, because doing so re-scores findings.\"],\n    example: \"payments-api · team Payments Platform · internet-facing · tier critical · npm\",\n    audit: \"repo.onboarded  payments-api  (connector: github)\",\n    actions: [\"onboardRepo\", \"importFromConnector\", \"manageConnectors\", \"editRepoRisk\"] },\n  { icon: \"search\", short: \"Scan\", title: \"Scan with OSV, or bring your own scanner\",\n    body: [\"Manifests and lockfiles across 8 ecosystems: npm, PyPI, Maven, Go, RubyGems, NuGet, Cargo, Composer.\",\n           \"Triggered by push webhooks, schedules or on demand, always against the live manifest.\",\n           \"If OSV can't answer for every package, the scan is marked degraded and nothing is silently closed.\"],\n    example: \"scan #1842 · 312 packages · OSV answered 312/312 · 1 new finding\",\n    audit: \"scan.completed  payments-api  (trigger: push)\",\n    actions: [\"scan\", \"exportFindings\"] },\n  { icon: \"layers\", short: \"Enrich\", title: \"Enrich with the signals CVSS ignores\",\n    body: [\"EPSS: the probability of exploitation in the next 30 days, scored in bands (10% or more, const pr = $(\"#presets\");\n  pr.innerHTML = `\u003cspan class=\"label\" style=\"align-self:center;margin-right:4px\">Presets\u003c/span>` +\n    PRESETS.map(x => `\u003cbutton type=\"button\" class=\"preset\" data-preset=\"${x.id}\" aria-pressed=\"false\">${esc(x.label)}\u003c/button>`).join(\"\");\n  pr.addEventListener(\"click\", e => {\n    const b = e.target.closest(\"[data-preset]\"); if (!b) return;\n    const x = PRESETS.find(p => p.id === b.dataset.preset);\n    Object.assign(P, x.p); syncControls(); renderPlay(\"preset\");\n    $$(\".preset\", pr).forEach(el => el.setAttribute(\"aria-pressed\", String(el === b)));\n  });\n  buildBar($(\"#playBar\"), true);\n  $(\"#legend\").innerHTML = SERIES.map(s => `\u003cdiv class=\"legend-item\" data-k=\"${s.k}\">\u003cspan class=\"dot\" style=\"background:${s.c}\">\u003c/span>\u003cspan>${s.name}\u003c/span>\u003cb>0\u003c/b>\u003c/div>`).join(\"\");\n\n  const form = $(\"#controls\");\n  form.addEventListener(\"input\", e => {\n    const t = e.target;\n    if (t.id === \"in-cvss\") P.cvss = Number(t.value);\n    else if (t.id === \"in-epss\") P.epss = posToEpss(Number(t.value));\n    else if (t.id === \"in-kev\") P.kev = t.checked;\n    else if (t.id === \"in-net\") P.net = t.checked;\n    else if (t.name === \"reach\") P.reach = t.value;\n    else if (t.name === \"tier\") P.tier = t.value;\n    else if (t.name === \"scope\") P.scope = t.value;\n    $$(\".preset\").forEach(el => el.setAttribute(\"aria-pressed\", \"false\"));\n    renderPlay(\"input\");\n  });\n  $(\"#tableToggle\").addEventListener(\"click\", e => {\n    const w = $(\"#tableWrap\"), open = w.hidden;\n    w.hidden = !open; e.currentTarget.setAttribute(\"aria-expanded\", String(open));\n    e.currentTarget.lastChild.textContent = open ? \" Hide table\" : \" View as table\";\n  });\n  initPolicyEditor();\n  readHash();\n  syncControls();\n  renderPlay(\"init\");\n}\nfunction syncControls() {\n  const c = $(\"#in-cvss\"), ep = $(\"#in-epss\");\n  c.val  performance.now(), dur = 420;\n  const step = now => {\n    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);\n    el.innerHTML = `${Math.round(from + (to - from) * e)}\u003csmall>/100\u003c/small>`;\n    if (t \u003c 1) countRaf = requestAnimationFrame(step);\n  };\n  countRaf = requestAnimationFrame(step);\n}\nfunction renderOutcome(b) {\n  const sev = b.severityNormalized;\n  const d = decidePolicy(b.priorityScore, RULES);\n  const days = slaDaysFor(sev, P.kev, SLA);\n  const kevApplied = P.kev && SLA.kev \u003c (SLA[sev] ?? SLA.medium);\n  const a = ACTION_TEXT[d.action] || ACTION_TEXT.track_only;\n  const actTone = d.action === \"auto_pr\" ? \"tone-info\" : d.action === \"pr_review\" ? \"tone-warn\" : \"tone-neutral\";\n  $(\"#outcome\").innerHTML = `\n    \u003cdiv class=\"card oc\">\n      \u003cdiv class=\"label\">${ic(\"sliders\")} Policy decision\u003c/div>\n      \u003cdiv class=\"oc-big\">\u003cspan class=\"oc-icon badge ${actTone}\" style=\"height:34px;padding:0\">${ic(d.action === \"track_only\" ? \"list\" : \"pr\")}\u003c/span>${esc(a.t)}\u003c/div>\n      \u003cp>${esc(a.d)}\u003c/p>\n      \u003cdiv class=\"rule\">rule: \"${esc(d.ruleName)}\"\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card oc\">\n      \u003cdiv class=\"label\">${ic(\"gitMerge\")} Pre-merge gate\u003c/div>\n      \u003cdiv class=\"oc-big\">\u003cspan class=\"oc-icon badge ${d.blocksMerge ? \"tone-bad\" : \"tone-good\"}\" style=\"height:34px;padding:0\">${ic(d.blocksMerge ? \"lock\" : \"unlock\")}\u003c/span>${d.blocksMerge ? \"Blocks merge\" : \"Merge allowed\"}\u003c/div>\n      \u003cp>${d.blocksMerge ? \"A PR that introduces this finding can't merge,\" : \"A PR that introduces this gets a comment, not a block,\"} provided org-wide blocking is on and the repo inherits or blocks.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card oc\">\n      \u003cdiv class=\"label\">${ic(\"clock\")} Remediation SLA\u003c/div>\n      \u003cdiv class=\"oc-big\">\u003cspan class=\"oc-icon badge ${days \u003c= 7 ? \"tone-bad\" : days \u003c= 30 ? \"tone-warn\" : \"tone-neutral\"}\" style=\"height:34px;padding:0\">${ic(\"clock\")}\u003c/span>Fix within ${days} day${days === 1 ? \"\" : \"s\"}\u003c/div>\n      \u003cp>Due \u003cb style=\"color:var(--fg)\">${fmtDate(addDays(days))}\u003c/b> if first seen today.${kevApplied ? ` The KEV deadline (${SLA.kev}d) is tighter than the ${sev} bucket (${SLA[sev]}d), so it wins.` : \"\"}\u003c/p>\n    \u003c/div>`;\n  $$(\"#rulesTbl tbody tr\").forEach((tr, i) => tr.classList.toggle(\"hit\", RULES[i] && RULES[i].name === d.ruleName));\n}\nfunction initPolicyEditor() {\n  const rt = $(\"#rulesTbl\"), st = $(\"#slaTbl\");\n  const draw = () => {\n    rt.innerHTML = `\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth class=\"n\">Min score\u003c/th>\u003cth>Action\u003c/th>\u003cth>Blocks\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>` +\n      RULES.map((r, i) => `\u003ctr>\u003ctd>${esc(r.name)}\u003c/td>\u003ctd class=\"n\">\u003cinput class=\"num-in\" type=\"number\" min=\"0\" max=\"100\" value=\"${r.minPriority}\" data-rule=\"${i}\" aria-label=\"Minimum score for ${esc(r.name)}\">\u003c/td>\u003ctd class=\"mono small\">${r.action}\u003c/td>\u003ctd>\u003cinput type=\"checkbox\" ${r.blocksMerge ? \"checked\" : \"\"} data-block=\"${i}\" aria-label=\"${esc(r.name)} blocks merge\">\u003c/td>\u003c/tr>`).join(\"\") + `\u003c/tbody>`;\n    st.innerHTML = `\u003cthead>\u003ctr>\u003cth>Bucket\u003c/th>\u003cth class=\"n\">Days\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>` +\n      Object.keys(SLA).map(k => `\u003ctr>\u003ctd>${k === \"kev\" ? \"Known exploited (KEV)\" : cap(k)}\u003c/td>\u003ctd class=\"n\">\u003cinput class=\"num-in\" type=\"number\" min=\"1\" max=\"3650\" value=\"${SLA[k]}\" data-sla=\"${k}\" aria-label=\"SLA days for ${k}\">\u003c/td>\u003c/tr>`).join(\"\") + `\u003c/tbody>`;\n  };\n  draw();\n  const onEdit = e => {\n    const t = e.target;\n    if (t.dataset.rule) { const v = Math.max(0, Math.min(100, Number(t.value) || 0)); RULES[t.dataset.rule].minPriority = v; }\n    if (t.dataset.block) RULES[t.dataset.block].blocksMerge = t.checked;\n    if (t.dataset.sla) { const v = Math.max(1, Math.min(3650, Math.round(Number(t.value) || 1))); SLA[t.dataset.sla] = v; }\n    renderPlay(\"input\"); renderCompare(); renderHero();\n  };\n  rt.addEventListener(\"input\", onEdit); st.addEventListener(\"input\", onEdit);\n  $(\"#resetPolicy\").addEventListener(\"click\", () => {\n    RULES = DEFAULT_RULES.map(r => ({ ...r })); SLA = { ...DEFAULT_SLA_DAYS };\n    draw(); renderPlay(\"input\"); renderCompare(); renderHero();\n  });\n}\n/* playground state in the URL hash (#play?cvss=…) so a scenario can be reopened; works on file:// */\nfunction writeHash() {\n  const q = `play?cvss=${P.cvss}&epss=${P.epss}&kev=${+P.kev}&reach=${P.reach}&net=${+P.net}&tier=${P.tier}&scope=${P.scope}`;\n  try { history.replaceState(null, \"\", \"#\" + q); } catch (_) {}\n}\nfunction readHash() {\n  if (!location.hash.startsWith(\"#play?\")) return;\n  const q = new URLSearchParams(location.hash.slice(6));\n  const num = (k, lo, hi, d) => { const v = Number(q.get(k)); return Number.isFinite(v) && q.has(k) ? Math.min(hi, Math.max(lo, v)) : d; };\n  P.cvss = round1(num(\"cvss\", 0, 10, P.cvss)); P.epss = Number(num(\"epss\", 0.01, 100, P.epss).toPrecision(3));\n  P.kev = q.get(\"kev\") === \"1\"; P.net = q.get(\"net\") !== \"0\";\n  if ([\"yes\", \"unknown\", \"no\"].includes(q.get(\"reach\"))) P.reach = q.get(\"reach\");\n  if ([\"critical\", \"high\", \"medium\", \"low\"].includes(q.get(\"tier\"))) P.tier = q.get(\"tier\");\n  if ([\"runtime\", \"dev\"].includes(q.get(\"scope\"))) P.scope = q.get(\"scope\");\n  requestAnimationFrame(() => $(\"#playground\").scrollIntoView());\n}\n\n/* ================================================================ COMPARE */\nconst SCEN = [\n  { t: \"Log4Shell remote code execution\", pkg: \"log4j-core 2.14.1 · order-service\", p: { cvss: 10, epss: 94.4, kev: true, reach: \"yes\", net: true, tier: \"critical\", scope: \"runtime\" } },\n  { t: \"Prototype pollution in a test helper\", pkg: \"dev dependency · internal tooling\", p: { cvss: 9.8, epss: 2, kev: false, reach: \"yes\", net: false, tier: \"medium\", scope: \"dev\" } },\n  { t: \"RCE in a package nobody imports\", pkg: \"transitive, not imported · internal-batch-jobs\", p: { cvss: 9.1, epss: 0.05, kev: false, reach: \"no\", net: false, tier: \"low\", scope: \"runtime\" } },\n  { t: \"SSRF in an image library\", pkg: \"import unknown · customer-portal\", p: { cvss: 8.6, epss: 0.5, kev: false, reach: \"unknown\", net: false, tier: \"high\", scope: \"runtime\" } },\n  { t: \"Path traversal in build tooling\", pkg: \"dev dependency · reporting-service\", p: { cvss: 8.1, epss: 0.3, kev: false, reach: \"yes\", net: false, tier: \"medium\", scope: \"dev\" } },\n  { t: \"ReDoS in the request parser\", pkg: \"imported · customer-portal\", p: { cvss: 7.5, epss: 1.6, kev: false, reach: \"yes\", net: true, tier: \"high\", scope: \"runtime\" } },\n  { t: \"Stored XSS, actively exploited\", pkg: \"on CISA KEV · payments-api\", p: { cvss: 6.1, epss: 30, kev: true, reach: \"yes\", net: true, tier: \"critical\", scope: \"runtime\" } },\n  { t: \"Open redirect at the login page\", pkg: \"imported · payments-api\", p: { cvss: 4.7, epss: 0.8, kev: false, reach: \"yes\", net: true, tier: \"critical\", scope: \"runtime\" } },\n].map((s, i) => ({ ...s, id: i }));\nconst PRI_FILL = { critical: \"var(--crit)\", high: \"var(--high)\", medium: \"var(--med)\", low: \"var(--low)\" };\nlet cmpBy = \"cvss\", cmpAutoPlayed = false;\n\nfunction initCompare() {\n  const list = $(\"#cmpList\");\n  list.innerHTML = SCEN.map(s => `\u003cli class=\"cmp-row\" data-id=\"${s.id}\" tabindex=\"0\">\u003c/li>`).join(\"\");\n  $(\"input[name=rank][value=cvss]\").closest(\".seg\").addEventListener(\"change\", e => { cmpBy = e.target.value; cmpAutoPlayed = true; reorderCompare(); });\n  renderCompare();\n  reorderCompare(true);\n}\nfunction cmpData() {\n  return SCEN.map(s => {\n    const b = computePriorityScore(toInput(s.p));\n    const d = decidePolicy(b.priorityScore, RULES);\n    return { ...s, b, d, sla: slaDaysFor(b.severityNormalized, s.p.kev, SLA) };\n  });\n}\nfunction ranks(data) {\n  const byC = [...data].sort((a, b) => b.p.cvss - a.p.cvss || a.id - b.id).map(x => x.id);\n  const byE = [...data].sort((a, b) => b.b.priorityScore - a.b.priorityScore || b.p.cvss - a.p.cvss).map(x => x.id);\n  return { byC, byE };\n}\nfunction renderCompare() {\n  const data = cmpData(), { byC, byE } = ranks(data);\n  data.forEach(x => {\n    const row = $(`.cmp-row[data-id=\"${x.id}\"]`);\n    const rc = byC.indexOf(x.id) + 1, re = byE.indexOf(x.id) + 1;\n    const rank = cmpBy === \"cvss\" ? rc : re;\n    const delta = rc - re;\n    const dHtml = cmpBy === \"everlit\" ? (delta > 0 ? `\u003cspan class=\"delta up\">${ic(\"arrowUp\")}${delta}\u003c/span>` : delta \u003c 0 ? `\u003cspan class=\"delta down\">${ic(\"arrowDown\")}${-delta}\u003c/span>` : `\u003cspan class=\"delta same\">${ic(\"minus\")}\u003c/span>`) : \"\";\n    const cs = cvssSeverity(x.p.cvss), sev = x.b.severityNormalized;\n    row.innerHTML = `\n      \u003cdiv class=\"rank\">\u003cspan>#${rank}\u003c/span>${dHtml}\u003c/div>\n      \u003cdiv class=\"cmp-title\">\u003cb>${esc(x.t)}\u003c/b>\u003cspan>${esc(x.pkg)}\u003c/span>\u003c/div>\n      \u003cdiv class=\"cmp-meta\">\n        \u003cdiv class=\"cmp-cell\">\u003cspan class=\"label\">CVSS\u003c/span>\u003cspan class=\"val\">\u003cb class=\"tnum\">${x.p.cvss.toFixed(1)}\u003c/b>${badge(cs)}\u003c/span>\u003c/div>\n        \u003cdiv class=\"cmp-cell\">\u003cspan class=\"label\">Everlit\u003c/span>\u003cspan class=\"val\">\u003cb class=\"tnum\" style=\"min-width:22px\">${x.b.priorityScore}\u003c/b>\u003cspan class=\"meter\">\u003ci style=\"background:${PRI_FILL[sev]};transform:scaleX(${x.b.priorityScore / 100})\">\u003c/i>\u003c/span>${badge(s
