dvice is suppressed) · prompt and output logged for audit\u003c/p>\u003c/div>`;\n}\nlet gateExplain = false, gateDispute = null, ovrFormOpen = false;\nfunction gatePanel(res, r) {\n  const cfg = { blocked: [\"xCircle\", \"Merge blocked\", \"c-rose\"], pass_with_comments: [\"message\", \"Pass · comments posted\", \"c-amber\"], pass: [\"checkCircle\", \"Pass · no new issues\", \"c-emerald\"], incomplete: [\"dashed\", \"Incomplete · not a security pass\", \"c-slate\"] }[res.gateStatus];\n  const chk = checkOf(res, r), u = me();\n  const pendingOvr = S.overrides.find(o => o.repoId === r.id && o.pr === res.pr && o.status === \"pending\");\n  const canDispute = can(\"requestSuppression\");\n  const grp = (title, list, empty, dispute) => `\u003cdiv>\u003cp class=\"fl\" style=\"margin-bottom:8px\">${title}\u003c/p>${list.length ? `\u003cul class=\"stack-sm\">${list.map(m => { const k = `${m.pkg}|${m.cve}`; return `\u003cli style=\"border:1px solid var(--border);border-radius:8px;padding:12px\">\u003cdiv class=\"row between wrap\" style=\"gap:8px\">\u003cdiv class=\"row\" style=\"gap:12px\">${priorityBadge(m.sev, m.score)}\u003cdiv>\u003cp class=\"fw5\">${esc(m.title)}\u003c/p>\u003cp class=\"xs muted\">${esc(m.pkg)}@${esc(m.version)} · ${esc(m.cve)}${m.fixed ? ` · fixed in ${esc(m.fixed)}` : \"\"}${m.manifest !== r.manifestFilename ? ` · in ${esc(m.manifest)}` : \"\"}\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"row wrap\">${cvssBadge(m.cvss)}${m.blocks ? pill(\"blocks merge\", \"rose\") : \"\"}${pill(esc(m.action.replace(/_/g, \" \")), \"blue\")}${dispute && m.blocks && canDispute ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"gate-dispute\" data-k=\"${esc(k)}\">Dispute\u003c/button>` : \"\"}\u003c/div>\u003c/div>\n      ${dispute && gateDispute === k ? `\u003cform class=\"reveal mt3 stack-sm box\" data-submit=\"gate-dispute\" data-k=\"${esc(k)}\">\u003cdiv>\u003clabel class=\"fl\">Kind\u003c/label>\u003cselect class=\"sel\" name=\"kind\" style=\"width:100%\">${Object.keys(EXCEPTION_LABELS).map(x => `\u003coption value=\"${x}\">${EXCEPTION_LABELS[x]}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\u003cdiv>\u003clabel class=\"fl\">Risk owner\u003c/label>\u003cselect class=\"sel\" name=\"riskOwner\" style=\"width:100%\">${ownersFor(r).map(o => `\u003coption>${esc(o)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\u003cdiv>\u003clabel class=\"fl\">Justification\u003c/label>\u003ctextarea class=\"ta\" name=\"justification\" rows=\"2\" required style=\"font-family:var(--sans);font-size:13px\">Disputing PR #${res.pr} gate verdict: \u003c/textarea>\u003c/div>\u003cdiv>\u003clabel class=\"fl\">Compensating controls\u003c/label>\u003cinput class=\"inp\" name=\"controls\" style=\"width:100%\" placeholder=\"What reduces the risk meanwhile?\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"btn btn-indigo btn-xs\" type=\"submit\">Send for review\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" type=\"button\" data-act=\"gate-dispute\" data-k=\"\">Cancel\u003c/button>\u003c/div>\u003cp class=\"xs muted\">A different security reviewer decides. Approved, it counts as accepted on the next run of this PR.\u003c/p>\u003c/form>` : \"\"}\u003c/li>`; }).join(\"\")}\u003c/ul>` : `\u003cp class=\"sm muted\">${empty}\u003c/p>`}\u003c/div>`;\n  const lineOf = pkg => { const i = res.text.split(\"\\n\").findIndex(l => l.includes(pkg.split(\":\").pop())); return i \u003c 0 ? 1 : i + 1; };\n  const tone = { success: \"emerald\", neutral: \"slate\", failure: \"rose\" }[chk.concl];\n  const needOvr = (res.gateStatus === \"blocked\" || (res.gateStatus === \"incomplete\" && chk.concl === \"failure\")) && !chk.ov;\n  const cov = res.coverage;\n  return `\u003cdiv class=\"stack reveal\">\n    \u003cdiv class=\"gate ${cfg[2]}\">${ic(cfg[0])}\u003cdiv>\u003cp class=\"h\">${res.newF.length} new (${res.blocking} blocking), ${res.pre.length} pre-existing · ${cfg[1]}\u003c/p>${res.ai ? `\u003cp class=\"s\">AI review: ${res.ai.found.length} suggestion${res.ai.found.length === 1 ? \"\" : \"s\"} on the code change · advisory, never part of the pass/block decision\u003c/p>` : \"\"}\u003cp class=\"s\">${r.mergeBlocking === \"block\" ? \"This repo always blocks (repo override).\" : r.mergeBlocking === \"warn\" ? \"This repo is set to warn only (repo override).\" : S.mergeBlockingEnabled ? \"Org-wide hard merge-blocking is ON.\" : \"Org-wide hard merge-blocking is OFF (advisory mode): blocking findings are reported but don't fail the check.\"}\u003c/p>\u003c/div>\u003c/div>\n    ${res.gateStatus === \"incomplete\" ? `\u003cdiv class=\"callout c-amber row\" style=\"gap:10px;align-items:flex-start\">${ic(\"alert\")}\u003cspan>${res.why === \"engine\" ? \"The scan engine stopped before finishing (3 attempts).\" : \"OSV.dev did not answer for every package.\"} Everlit makes no security claim about this change, so the check is \u003cb>${chk.concl === \"failure\" ? \"failure (fail-closed)\" : chk.concl}\u003c/b>, never a green pass.${chk.concl !== \"failure\" && blockingFor(r) ? \" The org can switch to fail-closed on the Policy page.\" : \"\"}\u003c/span>\u003c/div>` : \"\"}\n    \u003cp class=\"xs muted\">${ic(\"layers\", \"i-sm\")} Manifests in this PR: \u003cb>${cov.manifests.map(esc).join(\", \")}\u003c/b> · all scanned · compared with merge-base \u003ccode>${res.mergeBase}\u003c/code>, where this PR branched from ${esc(r.branch)} · policy \u003cspan class=\"mono\">v${policyV()}\u003c/span>\u003c/p>\n    ${grp(\"New: introduced by this change (these can block)\", res.newF, \"No new findings introduced by this change.\", res.gateStatus === \"blocked\")}\n    \u003cdiv class=\"lg2\" data-tour=\"gate-comment\">\n      \u003cdiv class=\"prc\">\u003cdiv class=\"ph2\">${ic(chk.concl === \"success\" ? \"checkCircle\" : chk.concl === \"failure\" ? \"xCircle\" : \"dashed\", \"i-sm\")}\u003cb>everlit/pr-gate\u003c/b>\u003cspan class=\"muted\">GitHub check run\u003c/span>\u003cspan style=\"margin-left:auto\">${pill(chk.concl, tone)}\u003c/span>\u003c/div>\u003cdiv class=\"pb\">\u003cp class=\"fw5\">${esc(chk.label)}\u003c/p>${res.newF.length ? `\u003cp class=\"xs muted mt2\">Annotations\u003c/p>\u003cul class=\"xs\">${res.newF.map(m => `\u003cli class=\"mono\">${esc(m.manifest)}:${m.manifest === r.manifestFilename ? lineOf(m.pkg) : 1} · ${esc(m.pkg.split(\":\").pop())} ${esc(m.version)} · ${esc(m.cve)} · priority ${m.score}${m.fixed ? ` · use ≥ ${esc(m.fixed)}` : \"\"}\u003c/li>`).join(\"\")}\u003c/ul>` : \"\"}\u003cp class=\"xs muted mt2\">Re-run from the check on GitHub, or push a new commit.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"prc\">\u003cdiv class=\"ph2\">${ic(\"message\", \"i-sm\")}\u003cb>everlit\u003c/b>\u003cspan class=\"muted\">commented on PR #${res.pr} · updated on every push\u003c/span>\u003c/div>\u003cdiv class=\"pb\">\u003cp class=\"fw6\">${{ blocked: \"🔴 Merge blocked\", pass_with_comments: \"🟡 Pass with comments\", pass: \"🟢 Pass\", incomplete: \"⚪ Incomplete: not a security pass\" }[res.gateStatus]}\u003c/p>\u003cul>\n        \u003cli>${res.newF.length} new (${res.blocking} blocking) · ${res.pre.length} pre-existing · ${res.resolved} resolved\u003c/li>\n        \u003cli>Coverage: ${cov.checked} of ${cov.deps} dependencies · ${cov.manifests.length} manifest${cov.manifests.length === 1 ? \"\" : \"s\"} · OSV.dev ${cov.osvComplete ? \"✓\" : \"awaiting\"} · EPSS ✓ · KEV synced ${cov.kevAgeHours} h earlier\u003c/li>\n        \u003cli>Policy v${policyV()} · merge-base ${res.mergeBase}\u003c/li>\n        ${res.newF.filter(m => m.blocks).map(m => `\u003cli>${esc(m.pkg.split(\":\").pop())} ${esc(m.version)} · ${esc(m.cve)} · \u003cspan class=\"link\">Dispute this verdict →\u003c/span>\u003c/li>`).join(\"\")}\n        ${chk.ov ? `\u003cli>\u003cb>Override active\u003c/b> until ${fmtDT(chk.ov.expiresAt)}, approved by ${esc(roleOfEmail(chk.ov.approvedBy))}. The verdict above is still the real one.\u003c/li>` : \"\"}\n      \u003c/ul>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row wrap\" style=\"gap:8px\">\n      \u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"gate-explain\">${ic(\"sparkles\", \"i-sm\")} ${gateExplain ? \"Hide explanation\" : \"Explain this verdict\"}\u003c/button>\n      ${needOvr && !pendingOvr && can(\"requestGateOverride\") ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"ovr-form\">${ic(\"key\", \"i-sm\")} Request break-glass override…\u003c/button>` : \"\"}\n      ${pendingOvr ? `\u003cspan class=\"xs\" style=\"color:var(--amber-tx)\">Override requested by ${esc(roleOfEmail(pendingOvr.requestedBy))}: waiting for a different security reviewer.\u003c/span>${can(\"approveGateOverride\") && pendingOvr.requestedBy !== u.email ? `\u003cbutton class=\"btn btn-emerald btn-xs\" data-act=\"ovr-approve\" data-id=\"${pendingOvr.id}\">Approve override\u003c/button>` : \"\"}` : \"\"}\n    \u003c/div>\n    ${gateExplain ? `\u003cdiv class=\"ai-box\" data-tour=\"gate-explain\">\u003cdiv class=\"row between wrap\" style=\"gap:8px\">\u003cp class=\"fw6 row\" style=\"gap:8px\">${ic(\"sparkles\")} Why this verdict\u003c/p>\u003cspan class=\"ai-tag\">AI suggestion · built from the score terms and the matching rule\u003c/span>\u003c/div>\u003cul class=\"stack-sm mt2 sm\">${explainVerdict(res, r).map(t => `\u003cli>${esc(t)}\u003c/li>`).join(\"\")}\u003c/ul>\u003cp class=\"xs muted mt2\">The verdict itself comes from the policy engine; this text only explains it.\u003c/p>\u003c/div>` : \"\"}\n    ${ovrFormOpen && needOvr && !pendingOvr ? `\u003cform class=\"reveal stack-sm box\" data-submit=\"ovr-request\" data-id=\"${r.id}\">\u003cp class=\"fw5\">Break-glass override for PR #${res.pr}\u003c/p>\u003cdiv>\u003clabel class=\"fl\">Reason\u003c/label>\u003ctextarea class=\"ta\" name=\"reason\" rows=\"2\" required style=\"font-family:var(--sans);font-size:13px\" placeholder=\"Why must this merge before the verdict changes?\">\u003c/textarea>\u003c/div>\u003cdiv>\u003clabel class=\"fl\">Hours (max ${S.gate.overrideMaxHours})\u003c/label>\u003cinput class=\"inp\" name=\"hours\" type=\"number\" min=\"1\" max=\"${S.gate.overrideMaxHours}\" value=\"24\" style=\"width:120px\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"btn btn-indigo btn-xs\" type=\"submit\">Request override\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" type=\"button\" data-act=\"ovr-form\">Cancel\u003c/button>\u003c/div>\u003cp class=\"xs muted\">A different security engineer or platform owner approves it. It expires on its own and is on the audit record.\u003c/p>\u003c/form>` : \"\"}\n    ${res.ai ? aiPanel(res.ai, r) : \"\"}\n    ${res.acc.length ? grp(\"New here, but already risk-accepted / suppressed in this repo: not blocking\", res.acc, \"\") : \"\"}\n    ${grp(\"Pre-existing on the target branch: backlog, never blocks this PR\", res.pre, \"No pre-existing findings for this manifest.\")}\n    ${res.resolved ? `\u003cp class=\"sm\" style=\"color:var(--emerald-tx)\">✓ This change removes ${res.resolved} vulnerability finding(s) present on the target branch.\u003c/p>` : \"\"}\u003c/div>`;\n}\n\n/* ================================================================ scans, exceptions, policy, compliance, audit, integrations, adapters, users */\nfunction viewScans() {\n  const ids = new Set(visibleRepos().map(r => r.id));\n  const scans = S.scans.filter(s => ids.has(s.repoId)).sort((a, b) => b.startedAt.localeCompare(a.startedAt));\n  const hooks = [[0.004, \"GitHub\", \"push\", \"payments-api\", \"scan queued\"], [0.02, \"GitHub App\", \"check_run.rerequested\", \"payments-api\", \"PR gate re-run from the check\"], [0.3, \"Everlit\", \"open-PR sweep\", \"customer-portal\", \"PR #513 had no Everlit check: gate run\"], [1.1, \"GitHub\", \"pull_request.opened\", \"customer-portal\", \"PR gate: pass\"], [2.4, \"GitHub\", \"push\", \"order-service\", \"scan queued\"], [3.0, \"GitHub\", \"pull_request.synchronize\", \"payments-api\", \"PR gate: pass with comments · 3 AI suggestions\"]];\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Scan history\u003c/h1>\u003cp class=\"sub\">Every scan run with its trigger, outcome and coverage receipt. A degraded scan is still waiting on a source for some packages, so it never auto-closes anything.\u003c/p>\u003c/div>\u003c/div>\n    ${card(scanTable(scans, true))}\n    ${card(ch(\"Recent webhook deliveries\", \"Inbound events from connected providers (PR auto-trigger audit trail)\") + `\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Received\u003c/th>\u003cth>Provider\u003c/th>\u003cth>Event\u003c/th>\u003cth>Repo\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      ${hooks.map(([d, prov, e, rn, res]) => `\u003ctr>\u003ctd class=\"muted\">${fmtDT(Date.now() - d * D)}\u003c/td>\u003ctd>${prov}\u003c/td>\u003ctd class=\"mono\">${e}\u003c/td>\u003ctd>${rn}\u003c/td>\u003ctd>${pill(res, res.includes(\"comments\") ? \"amber\" : \"emerald\")}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`)}\u003c/div>`;\n}\nfunction viewExceptions() {\n  const u = me(); const ids = new Set(visibleRepos().map(r => r.id));\n  const sups = S.suppressions.filter(s => ids.has(s.repoId));\n  const pending = sups.filter(s => s.status === \"pending\"), rest = sups.filter(s => s.status !== \"pending\").sort((a, b) => b.createdAt.localeCompare(a.createdAt));\n  const canApprove = can(\"approveSuppression\"), canRevoke = can(\"revokeSuppression\");\n  const fl = s => { const f = S.findings.find(x => x.id === s.findingId); if (!f) return s.advisory ? `\u003cspan class=\"sm fw5\">${esc(s.advisory.title)} — ${esc(repoById(s.repoId).name)} · PR #${s.pr}\u003c/span>` : \"\"; const t = `${esc(f.title)} — ${esc(repoById(f.repoId).name)}`; return roleCanSee(u.role, \"findings\") ? `\u003ca class=\"link sm\" href=\"#/findings/${f.id}\">${t}\u003c/a>` : `\u003cspan class=\"sm fw5\">${t}\u003c/span>`; };\n  const meta = s => `${s.source === \"pr_dispute\" ? pill(`PR dispute · #${s.pr}`, \"violet\") : \"\"}${s.flags && s.flags.length ? pill(\"New approver account\", \"amber\", \"Approved by an account created less than 7 days earlier\") : \"\"}`;\n  const ownerLine = s => s.riskOwner || s.compensatingControls ? `\u003cp class=\"xs muted mt1\">${s.riskOwner ? `Risk owner: \u003cstrong>${esc(s.riskOwner)}\u003c/strong>` : \"\"}${s.riskOwner && s.compensatingControls ? \" · \" : \"\"}${s.compensatingControls ? `Controls: ${esc(s.compensatingControls)}` : \"\"}\u003c/p>` : \"\";\n  const tone = { active: \"emerald\", rejected: \"rose\", revoked: \"neutral\", expired: \"neutral\" };\n  return `\u003cdiv class=\"stack\">\u003cdiv>\u003ch1 style=\"font-size:20px;font-weight:600\">Exceptions\u003c/h1>\u003cp class=\"sm muted mt1\" style=\"max-width:720px\">Suppressions (max ${EXCEPTION_MAX_DAYS.suppression} days), accepted risk and false-positive calls (max ${EXCEPTION_MAX_DAYS.accepted_risk} days) all follow the same rule: requested by one person, approved by a different security reviewer, with a justification and an expiry — nothing is excepted indefinitely. When one expires, the finding reopens and re-enters the policy engine.\u003c/p>\u003c/div>\n    ${card(ch(`Awaiting approval (${pending.length})`, canApprove ? \"You can't approve your own requests.\" : \"A security engineer or platform owner approves these.\") + (pending.length ? `\u003cul class=\"divide\">${pending.map(s => `\u003cli class=\"row between wrap\" style=\"padding:12px 0;align-items:flex-start;gap:12px\">\u003cdiv style=\"min-width:0;flex:1\">${pill(EXCEPTION_LABELS[s.kind], \"blue\")}${meta(s)} ${fl(s)}\u003cp class=\"sm mt1\">${esc(s.justification)}\u003c/p>${ownerLine(s)}\u003cp class=\"xs muted mt1\">Requested by \u003cstrong>${esc(userName(s.requestedBy))}\u003c/strong> on ${fmtDT(s.createdAt)} for ${s.requestedDays} days\u003c/p>\u003c/div>${canApprove && s.requestedBy !== u.email ? `\u003cdiv class=\"row\">\u003cbutton class=\"btn btn-emerald btn-xs\" data-act=\"sup-approve\" data-id=\"${s.id}\" data-tour=\"approve\">Approve\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"sup-reject\" data-id=\"${s.id}\">Reject\u003c/button>\u003c/div>` : canApprove ? `\u003cdiv class=\"row\">${pill(\"your request\", \"amber\")}\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"sup-approve\" data-id=\"${s.id}\" title=\"Try it: the server refuses self-approval\">Approve\u003c/button>\u003c/div>` : pill(s.requestedBy === u.email ? \"your request\" : \"pending\", \"amber\")}\u003c/li>`).join(\"\")}\u003c/ul>` : `\u003cp class=\"sm muted\">Nothing waiting.\u003c/p>`))}\n    \u003cdiv class=\"stack-sm\">${rest.map(s => { const d = s.expiresAt ? daysUntil(s.expiresAt) : null; return card(`\u003cdiv class=\"row between wrap\" style=\"align-items:flex-start;gap:12px\">\u003cdiv>\u003cdiv class=\"row wrap\">${pill(EXCEPTION_LABELS[s.kind], \"blue\")}${pill(esc(s.status), tone[s.status] || \"neutral\")}${s.status === \"active\" ? pill(`${d}d until expiry`, d \u003c 7 ? \"rose\" : \"neutral\") : \"\"}${meta(s)}\u003c/div>\n      \u003cp class=\"sm mt2\">${esc(s.justification)}\u003c/p>${ownerLine(s)}\u003cp class=\"xs muted mt1\">Requested by \u003cstrong>${esc(userName(s.requestedBy))}\u003c/strong>${s.approver ? ` · ${s.status === \"rejected\" ? \"rejected\" : \"approved\"} by \u003cstrong>${esc(userName(s.approver))}\u003c/strong>${s.approvedAt ? ` on ${fmtDT(s.approvedAt)}` : \"\"}` : \"\"}${s.status === \"active\" ? ` · expires ${fmtDT(s.expiresAt)}` : \"\"}\u003c/p>${s.reviewNote ? `\u003cp class=\"xs muted mt1\">Review note: ${esc(s.reviewNote)}\u003c/p>` : \"\"}\u003cdiv class=\"mt1\">${fl(s)}\u003c/div>\u003c/div>\n      ${s.status === \"active\" && canRevoke ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"sup-revoke\" data-id=\"${s.id}\">Revoke\u003c/button>` : \"\"}\u003c/div>\n      \u003cdetails class=\"mt3\" style=\"border-top:1px solid var(--border);padding-top:12px\">\u003csummary class=\"xs fw5 muted\" style=\"cursor:pointer\">Audit history (${s.history.length})\u003c/summary>\u003cul class=\"stack-sm mt2\">${s.history.map(h => `\u003cli class=\"xs muted\">\u003cspan class=\"fw5\" style=\"color:var(--foreground)\">${esc(h.action)}\u003c/span> by ${esc(userName(h.actor))} — ${fmtDT(h.at)}${h.note ? ` — ${esc(h.note)}` : \"\"}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/details>`); }).join(\"\")}\u003c/div>\u003c/div>`;\n}\nfunction viewPolicy() {\n  const ed = can(\"editPolicy\");\n  const open = S.findings.filter(f => f.status === \"open\").map(calc);\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Policy engine\u003c/h1>\u003cp class=\"sub\">Rules are data, not hardcoded thresholds. Every finding is re-evaluated against them; edits apply immediately, are audited and create a new policy version.\u003c/p>\u003c/div>\u003cdiv class=\"row wrap\">${pill(`Policy v${policyV()}`, \"blue\", \"Hash of the rules, merge-blocking settings and SLAs. Every scan and gate verdict records it.\")}\u003c/div>\u003c/div>\n    \u003cdiv class=\"lg2\">\n      ${card(ch(\"Org-wide merge blocking\", \"Enable only once the false-positive rate is under 5%. Individual repos can override this.\") + `\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" data-act-change=\"mb-toggle\" ${S.mergeBlockingEnabled ? \"checked\" : \"\"} ${ed ? \"\" : \"disabled\"}>\u003cspan class=\"tr\">\u003c/span>\u003cspan class=\"sm fw5\">${S.mergeBlockingEnabled ? \"On — blocking findings fail the PR check\" : \"Off — advisory mode\"}\u003c/span>\u003c/label>\u003cp class=\"xs muted mt3\">${open.filter(c => c.blocks).length} open findings currently meet a blocking rule.\u003c/p>`)}\n      ${card(ch(\"Remediation SLAs\", \"Days from first seen to the fix deadline, by priority. Known-exploited findings get the tighter of their priority SLA and the KEV SLA.\") + `\u003cform class=\"row wrap\" style=\"gap:12px;align-items:flex-end\" data-submit=\"sla\">${Object.keys(S.sla).map(k => `\u003cdiv>\u003clabel class=\"fl\">${k === \"kev\" ? \"Known exploited\" : titleCase(k)}\u003c/label>\u003cinput class=\"inp\" type=\"number\" min=\"1\" max=\"3650\" name=\"${k}\" value=\"${S.sla[k]}\" style=\"width:92px\" ${ed ? \"\" : \"disabled\"}>\u003c/div>`).join(\"\")}${ed ? `\u003cbutton class=\"btn btn-indigo\" type=\"submit\">Save SLAs\u003c/button>` : \"\"}\u003c/form>`)}\n    \u003c/div>\n    \u003cdiv class=\"lg2\">\n      ${card(ch(\"When a gate run does not finish\", \"An incomplete gate never shows a green pass. Choose what happens on repos that enforce blocking.\") + `\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" data-act-change=\"fc-toggle\" ${S.gate.failClosed ? \"checked\" : \"\"} ${ed ? \"\" : \"disabled\"}>\u003cspan class=\"tr\">\u003c/span>\u003cspan class=\"sm fw5\">${S.gate.failClosed ? \"Fail-closed: an incomplete gate holds the merge\" : \"Neutral: an incomplete gate is reported, the merge is not held\"}\u003c/span>\u003c/label>\n        \u003cdiv class=\"row wrap mt3\" style=\"gap:8px;align-items:center\">\u003clabel class=\"fl\" style=\"margin:0\">Break-glass override lasts at most\u003c/label>\u003cinput class=\"inp\" type=\"number\" min=\"1\" max=\"168\" value=\"${S.gate.overrideMaxHours}\" data-act-change=\"ovr-hours\" style=\"width:80px;height:32px\" ${ed ? \"\" : \"disabled\"}>\u003cspan class=\"sm muted\">hours\u003c/span>\u003c/div>\n        \u003cp class=\"xs muted mt3\">Overrides are requested from the PR gate, approved by a different security reviewer, expire on their own and keep the real verdict visible on the PR.\u003c/p>`, \"\", \"gate-policy\")}\n      ${card(ch(\"Guardrails always on\") + `\u003cul class=\"stack-sm sm\">${[\"Two people for every exception, override and not-affected statement; an approver account created by the requester is refused\", \"Exceptions always expire: suppressions within 90 days, accepted risk and false positives within 365\", \"Sessions end after 8 hours, or 30 minutes idle; role changes end every session at once\", \"AI suggests and explains; the rules on this page decide every verdict\"].map(t => `\u003cli class=\"row\" style=\"align-items:flex-start;gap:8px\">\u003cspan style=\"color:#059669;display:inline-flex;margin-top:2px\">${ic(\"shieldCheck\", \"i-sm\")}\u003c/span>\u003cspan>${t}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>`)}\n    \u003c/div>\n    ${(() => { const a = S.aiReview, rate = a.suggested ? Math.round(a.dismissed / a.suggested * 100) : 0; return card(ch(\"AI review in the PR gate\", \"Catches risky code patterns at the source, while the change is still a pull request\", rm(3)) + `\u003cdiv class=\"lg2\" style=\"gap:24px\">\u003cdiv class=\"stack-sm\">\n      \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" data-act-change=\"ai-toggle\" ${a.enabled ? \"checked\" : \"\"} ${ed ? \"\" : \"disabled\"}>\u003cspan class=\"tr\">\u003c/span>\u003cspan class=\"sm fw5\">${a.enabled ? \"On: every PR gate run includes an AI review of the diff\" : \"Off\"}\u003c/span>\u003c/label>\n      \u003cdl class=\"fields sm\">${field(\"Mode\", `${ic(\"shieldCheck\", \"i-sm\")} Advisory only. Suggestions never block a merge`)}${field(\"Model deployment\", ed ? `\u003cselect class=\"sel\" data-act-change=\"ai-deploy\" style=\"height:32px;max-width:100%\">\u003coption value=\"self_hosted\" ${a.deployment === \"self_hosted\" ? \"selected\" : \"\"}>Self-hosted model (default · no code leaves the network)\u003c/option>\u003coption value=\"cloud\" ${a.deployment === \"cloud\" ? \"selected\" : \"\"}>Approved cloud model (per-organization opt-in)\u003c/option>\u003c/select>` : esc(a.deployment === \"self_hosted\" ? \"Self-hosted model (default)\" : \"Approved cloud model (opt-in)\"))}${field(\"What is sent\", \"Only the PR diff plus minimal surrounding context. Never the whole repository\")}\u003c/dl>\u003c/div>\n      \u003cdiv class=\"stack-sm\">\u003cp class=\"fl\">Last 30 days\u003c/p>\u003cp class=\"sm\">\u003cb>${a.suggested}\u003c/b> suggestions · \u003cb>${a.helpful}\u003c/b> marked helpful · \u003cb>${a.dismissed}\u003c/b> dismissed (${rate}%)\u003c/p>\n      \u003cul class=\"stack-sm xs muted\">\u003cli>• Every suggestion must cite the exact diff lines; generic advice is suppressed\u003c/li>\u003cli>• Diff content is treated as untrusted data and can't trigger actions\u003c/li>\u003cli>• Prompts and outputs are logged for audit\u003c/li>\u003cli>• The dismissal rate feeds a monthly tuning review; blocking is only considered after that\u003c/li>\u003c/ul>\u003c/div>\u003c/div>`, \"\", \"ai-policy\"); })()}\n    ${card(ch(\"Rules\", \"Evaluated in order; first matching threshold wins\") + `\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Rule\u003c/th>\u003cth>Min priority\u003c/th>\u003cth>Action\u003c/th>\u003cth>Blocks merge\u003c/th>\u003cth>Enabled\u003c/th>\u003cth>Open findings matched\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${S.rules.map((rl, i) => `\u003ctr>\u003ctd class=\"muted\">${i + 1}\u003c/td>\u003ctd class=\"fw5\">${esc(rl.name)}${rl.kev || rl.scope ? `\u003cspan class=\"xs muted\" style=\"display:block;font-weight:400\">${rl.kev ? \"or any known-exploited finding\" : \"\"}${rl.kev && rl.scope ? \" · \" : \"\"}${rl.scope === \"internet\" ? \"internet-facing repos only\" : \"\"}\u003c/span>` : \"\"}\u003c/td>\u003ctd>\u003cinput class=\"inp\" type=\"number\" min=\"0\" max=\"100\" value=\"${rl.minPriority}\" data-rule=\"${rl.id}\" data-k=\"minPriority\" style=\"width:80px;height:32px\" ${ed ? \"\" : \"disabled\"}>\u003c/td>\u003ctd>\u003cselect class=\"sel\" data-rule=\"${rl.id}\" data-k=\"action\" style=\"height:32px\" ${ed ? \"\" : \"disabled\"}>${[\"auto_pr\", \"pr_review\", \"track_only\", \"escalate\"].map(a => `\u003coption ${a === rl.action ? \"selected\" : \"\"}>${a}\u003c/option>`).join(\"\")}\u003c/select>\u003c/td>\u003ctd>\u003cinput type=\"checkbox\" class=\"chk\" data-rule=\"${rl.id}\" data-k=\"blocksMerge\" ${rl.blocksMerge ? \"checked\" : \"\"} ${ed ? \"\" : \"disabled\"}>\u003c/td>\u003ctd>\u003cinput type=\"checkbox\" class=\"chk\" data-rule=\"${rl.id}\" data-k=\"enabled\" ${rl.enabled ? \"checked\" : \"\"} ${ed ? \"\" : \"disabled\"}>\u003c/td>\u003ctd>${open.filter(c => c.rule === rl.name).length}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`)}\n    ${policyBuilderCard(ed)}\n    \u003cdiv class=\"lg2\">\n      ${card(ch(\"Policy change log\", \"Every edit, audited, with the version it produced\") + `\u003cul class=\"stack-sm\">${S.policyLog.slice(0, 12).map(p => `\u003cli class=\"xs muted\">\u003cspan class=\"fw5\" style=\"color:var(--foreground)\">${esc(p.what)}\u003c/span> — ${esc(userName(p.actor))} · ${fmtDT(p.at)}${p.v ? ` · \u003cspan class=\"mono\">v${p.v}\u003c/span>` : \"\"}\u003c/li>`).join(\"\")}\u003c/ul>`)}\n      ${card(ch(\"Policy versions\", \"Any version expands back to the exact rules it applied\", \"\", \"Scans, PR gate verdicts and finding decisions record the version they ran under, so an auditor can reconstruct why something was blocked months later.\") + `\u003cul class=\"stack-sm\">${S.policySnapshots.slice(0, 8).map((v, i) => `\u003cli>\u003cdetails>\u003csummary class=\"sm\" style=\"cursor:pointer\">\u003cspan class=\"mono fw5\">v${v.v}\u003c/span>${i === 0 && v.v === policyV() ? ` ${pill(\"current\", \"emerald\")}` : \"\"} \u003cspan class=\"xs muted\">${esc(userName(v.actor))} · ${fmtDT(v.at)}\u003c/span>\u003c/summary>\u003cul class=\"stack-sm xs muted mt2\" style=\"padding-left:12px\">${v.body.rules.map(r => `\u003cli>${esc(r.name)}: priority ≥ ${r.minPriority}${r.kev ? \" or known exploited\" : \"\"}${r.scope ? \" · internet-facing only\" : \"\"} → ${esc(r.action)}${r.blocksMerge ? \" · blocks merge\" : \"\"}${r.enabled ? \"\" : \" · disabled\"}\u003c/li>`).join(\"\")}\u003cli>Org merge blocking ${v.body.mergeBlocking ? \"on\" : \"off\"} · fail-closed ${v.body.failClosed ? \"on\" : \"off\"}\u003c/li>\u003cli>SLA days: ${Object.entries(v.body.sla).map(([k, d]) => `${k} ${d}`).join(\" · \")}\u003c/li>\u003c/ul>\u003c/details>\u003c/li>`).join(\"\")}\u003c/ul>`, \"\", \"versions\")}\n    \u003c/div>\n    ${calibrationCard()}\u003c/div>`;\n}\n/* plain-language policy builder: the AI drafts a rule in the engine's own shape, a simulation shows its effect, a person saves it */\nlet policyDraft = null, policySim = null;\nfunction draftRule(text) {\n  const t = String(text || \"\");\n  const n = (t.match(/(\\d{2,3})\\s*\\+|priority\\s*(?:of\\s*|above\\s*|≥\\s*|>=\\s*)?(\\d{2,3})|(\\d{2,3})\\s*or\\s*(?:more|higher|above)/i) || []).slice(1).find(Boolean);\n  const kev = /known[-\\s]?exploited|\\bkev\\b/i.test(t), internet = /internet[-\\s]?facing|public/i.test(t), block = /\\bblock/i.test(t);\n  const action = /escalat/i.test(t) ? \"escalate\" : /auto|fix pr|automatic/i.test(t) ? \"auto_pr\" : /review/i.test(t) || block ? \"pr_review\" : \"track_only\";\n  const min = Math.max(0, Math.min(100, Number(n || (kev ? 100 : 80))));\n  const name = `${kev ? \"Known exploited\" : `Priority ${min}+`}${kev && n ? ` or ${min}+` : \"\"}${internet ? \" · internet-facing\" : \"\"} — ${action.replace(/_/g, \" \")}${block ? \" + block\" : \"\"}`;\n  return { text: t, name, minPriority: n ? min : kev ? 101 : min, kev, scope: internet ? \"internet\" : \"\", action, blocksMerge: block, enabled: true };\n}\nfunction simulateDraft(d) {\n  const open = S.findings.filter(f => f.status === \"open\");\n  const now = open.map(f => ({ f, c: calc(f) }));\n  const withRule = [{ ...d, id: \"draft\" }, ...enabledRules()];\n  const changed = now.map(({ f, c }) => { const r = repoById(f.repoId); const x = decidePolicy(c.score, withRule, { kev: f.kev, internet: r.internetFacing }); return { f, r, before: c, after: x }; }).filter(x => x.after.ruleName === d.name && (x.after.action !== x.before.action || x.after.blocksMerge !== x.before.blocks));\n  return { matched: now.filter(({ f, c }) => decidePolicy(c.score, [{ ...d }], { kev: f.kev, internet: repoById(f.repoId).internetFacing }).ruleName === d.name).length, changed, newlyBlocking: changed.filter(x => x.after.blocksMerge && !x.before.blocks).length, repos: new Set(changed.map(x => x.r.id)).size };\n}\nfunction policyBuilderCard(ed) {\n  const d = policyDraft, sim = policySim;\n  return card(ch(\"Write a rule in plain language\", \"The AI drafts it in the rule engine's own fields; a simulation shows the effect before anyone saves it\", `\u003cspan class=\"ai-tag\">${ic(\"sparkles\", \"i-sm\")} AI draft\u003c/span>`) +\n    `\u003cform class=\"row wrap\" style=\"gap:8px;align-items:flex-end\" data-submit=\"policy-draft\">\u003cdiv style=\"flex:1;min-width:260px\">\u003clabel class=\"fl\">Describe the rule\u003c/label>\u003cinput class=\"inp\" name=\"text\" style=\"width:100%\" value=\"${esc(d ? d.text : \"Block anything known exploited or priority 85+ on internet-facing repos\")}\" ${ed ? \"\" : \"disabled\"}>\u003c/div>${ed ? `\u003cbutton class=\"btn btn-outline\" type=\"submit\">${ic(\"sparkles\", \"i-sm\")} Draft rule\u003c/button>` : \"\"}\u003c/form>\n    ${d ? `\u003cdiv class=\"box mt3\">\u003cp class=\"fw5\">Draft: ${esc(d.name)}\u003c/p>\u003cdl class=\"grid mt2\" style=\"grid-template-columns:repeat(auto-fit,minmax(140px,1fr))\">${field(\"Min priority\", d.minPriority > 100 ? \"only known exploited\" : String(d.minPriority))}${field(\"Known exploited\", d.kev ? \"always matches\" : \"no extra condition\")}${field(\"Scope\", d.scope ? \"internet-facing repos\" : \"every repo\")}${field(\"Action\", esc(d.action.replace(/_/g, \" \")))}${field(\"Blocks merge\", d.blocksMerge ? \"yes\" : \"no\")}\u003c/dl>\n      \u003cdiv class=\"row wrap mt3\" style=\"gap:8px\">\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"policy-sim\">Simulate against current findings\u003c/button>${sim && ed ? `\u003cbutton class=\"btn btn-indigo btn-xs\" data-act=\"policy-save\">Save as rule 1\u003c/button>` : \"\"}\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"policy-discard\">Discard\u003c/button>\u003c/div>\n      ${sim ? `\u003cdiv class=\"mt3\">\u003cp class=\"sm\">\u003cb>${sim.matched}\u003c/b> open finding${sim.matched === 1 ? \"\" : \"s\"} match this rule · \u003cb>${sim.changed.length}\u003c/b> would change action or blocking · \u003cb>${sim.newlyBlocking}\u003c/b> newly block merges · across ${sim.repos} repo${sim.repos === 1 ? \"\" : \"s\"}\u003c/p>${sim.changed.length ? `\u003cul class=\"stack-sm xs mt2\">${sim.changed.slice(0, 6).map(x => `\u003cli>${esc(x.f.title)} · ${esc(x.r.name)}: ${esc(x.before.action.replace(/_/g, \" \"))}${x.before.blocks ? \" + block\" : \"\"} → \u003cb>${esc(x.after.action.replace(/_/g, \" \"))}${x.after.blocksMerge ? \" + block\" : \"\"}\u003c/b>\u003c/li>`).join(\"\")}\u003c/ul>` : \"\"}\u003c/div>` : `\u003cp class=\"xs muted mt2\">Nothing changes until the simulation is reviewed and the rule is saved by a person.\u003c/p>`}\u003c/div>` : \"\"}`, \"\", \"policy-builder\");\n}\nfunction calibrationCard() {\n  const open = S.findings.filter(f => f.status === \"open\").map(f => ({ f, c: calc(f) }));\n  const kev = open.filter(o => o.f.kev), kevCrit = kev.filter(o => o.c.sev === \"critical\").length;\n  const med = a => { if (!a.length) return null; const x = a.slice().sort((p, q) => p - q); return x.length % 2 ? x[(x.length - 1) / 2] : (x[x.length / 2 - 1] + x[x.length / 2]) / 2; };\n  const rows = [\"critical\", \"high\", \"medium\", \"low\"].map(b => { const g = open.filter(o => o.c.sev === b); return [b, g.length, med(g.map(o => (Date.now() - new Date(o.f.firstSeen)) / D)), g.filter(o => o.f.kev).length]; });\n  return card(ch(\"Score calibration\", \"Does the ranking hold up? Checked against what is exploited and what gets fixed\", \"\", \"Known-exploited findings should rank critical. Higher buckets should be younger, because they are fixed first. Reviewed every quarter against remediation outcomes.\") +\n    `\u003cp class=\"sm\">\u003cb>${kevCrit} of ${kev.length}\u003c/b> open known-exploited findings rank critical.\u003c/p>\u003cdiv class=\"tw mt2\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Open\u003c/th>\u003cth>Median age\u003c/th>\u003cth>Known exploited\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(([b, n, m, k]) => `\u003ctr>\u003ctd>${priorityBadge(b)}\u003c/td>\u003ctd>${n}\u003c/td>\u003ctd>${m == null ? \"—\" : `${m.toFixed(0)} days`}\u003c/td>\u003ctd>${k}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`, \"\", \"calibration\");\n}\nconst CONTROLS = [[\"PCI-DSS\", \"6.3.2\", \"Inventory of bespoke/custom software components and known vulnerabilities\", \"sca\", \"Canonical Finding schema's SBOM + vulnerability identity fields\"], [\"PCI-DSS\", \"6.4.3\", \"Scripts on payment pages are managed and inventoried\", \"sca\", \"Reachability + exposure enrichment for internet-facing services\"], [\"PCI-DSS\", \"11.3.1\", \"Internal and external vulnerability scans performed\", \"all\", \"Scheduled scan runs and scan-run provenance fields\"], [\"SOX\", \"ITGC-CM-01\", \"Change management controls require review before production changes\", \"all\", \"Policy change log and audit trail\"], [\"SOX\", \"ITGC-AC-02\", \"Access controls restrict who can view/modify financial-system data\", \"all\", \"Role-based access on findings and dashboards\"], [\"FFIEC\", \"II.C.20\", \"Third-party / vendor and open-source dependency risk management\", \"sca\", \"SCA adapter layer and internal advisory database\"], [\"FFIEC\", \"II.C.7\", \"Vulnerability and patch management program\", \"all\", \"Auto-remediation pipeline and exception workflow\"]];\nfunction complianceExtras() {\n  const v = verifyChain(S.audit), flagged = S.suppressions.filter(s => s.flags && s.flags.length), vex = S.vex.slice().reverse(), ai = S.aiRuns;\n  const byKind = ai.reduce((a, x) => { a[x.kind] = (a[x.kind] || 0) + 1; return a; }, {});\n  return `\u003cdiv class=\"lg2\">\n    ${card(ch(\"Tamper-evident audit trail\", \"Each event is hash-chained to the one before it\", `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"verify-chain\">${ic(\"hash\", \"i-sm\")} Verify chain\u003c/button>`, \"Each audit event stores the SHA-256 hash of the previous event plus its own fields. Editing or deleting any event breaks every hash after it.\") + `\u003cdiv class=\"row wrap\" style=\"gap:8px\">${v.ok ? pill(`Intact · ${v.total} events`, \"emerald\") : pill(`Broken at event ${v.at} of ${v.total}`, \"rose\")}${v.ok ? `\u003cspan class=\"xs muted mono\">head ${v.head.slice(0, 16)}…\u003c/span>` : \"\"}\u003c/div>${v.ok ? \"\" : `\u003cdiv class=\"callout c-rose mt3\">\u003cp class=\"h\">An audit event was changed after it was written\u003c/p>\u003cp class=\"s\">${esc(fmtDT(v.entry.at))} · ${esc(v.entry.what)}. Exports carry both hashes so an auditor can check it independently.\u003c/p>\u003c/div>`}`, \"\", \"chain\")}\n    ${card(ch(\"Evidence retention\", \"How long each record is kept\") + `\u003cdl class=\"fields sm\">${field(\"Audit log, exception history, policy versions\", \"Never pruned\")}${field(\"PR gate verdicts and coverage receipts\", \"400 days, past an annual audit cycle\")}${field(\"Webhook deliveries\", \"90 days (operational)\")}${field(\"Notifications sent\", \"180 days\")}${field(\"Sessions\", \"Deleted when they end\")}\u003c/dl>`)}\n  \u003c/div>\n  \u003cdiv class=\"lg2\">\n    ${card(ch(\"Release security passports\", \"One evidence file per release: what was checked, what was decided, under which policy\") + `\u003cdiv class=\"row wrap\">${S.repos.map(r => `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"passport\" data-id=\"${r.id}\">${ic(\"fileCheck\", \"i-sm\")} ${esc(r.name)}\u003c/button>`).join(\"\")}\u003c/div>\u003cp class=\"xs muted mt3\">Inventory, coverage receipt, latest gate verdict, active exceptions with owners, verified fixes, policy version and the audit chain head. It states what was checked, not that a release is free of vulnerabilities.\u003c/p>`, \"\", \"passport\")}\n    ${card(ch(\"Separation-of-duties review\", \"Approvals that need a second look\") + (flagged.length ? `\u003cul class=\"stack-sm sm\">${flagged.map(s => { const f = S.findings.find(x => x.id === s.findingId); return `\u003cli>${pill(\"New approver account\", \"amber\")} ${esc(f ? f.title : s.advisory.title)} · approved by ${esc(roleOfEmail(s.approver))} ${fmtDate(s.approvedAt)}\u003c/li>`; }).join(\"\")}\u003c/ul>` : `\u003cp class=\"sm muted\">No flagged approvals. Approvals by accounts the requester created are refused outright; approvals by accounts under 7 days old appear here.\u003c/p>`))}\n  \u003c/div>\n  \u003cdiv class=\"lg2\">\n    ${card(ch(\"VEX statements\", \"Applicability statements published in VEX exports\") + (vex.length ? `\u003cul class=\"stack-sm sm\">${vex.map(x => { const f = S.findings.find(y => y.id === x.findingId); return `\u003cli>${pill(VEX_STATES[x.state], x.status === \"approved\" ? \"emerald\" : x.status === \"pending\" ? \"amber\" : \"neutral\")} ${esc(f ? f.title : \"\")} · ${esc(repoById(x.repoId).name)} · ${esc(x.status)}\u003c/li>`; }).join(\"\")}\u003c/ul>` : `\u003cp class=\"sm muted\">No statements yet. Findings without one export as derived from their status.\u003c/p>`))}\n    ${card(ch(\"AI activity\", \"Every AI run is on the record\") + `\u003cp class=\"sm\">\u003cb>${ai.length}\u003c/b> run${ai.length === 1 ? \"\" : \"s\"} logged${ai.length ? `: ${Object.entries(byKind).map(([k, n]) => `${n} ${k}`).join(\" · \")}` : \"\"}. Each records the model deployment, prompt version and the evidence it read. AI output never changes a status, score or verdict.\u003c/p>${roleCanSee(me().role, \"audit\") ? `\u003ca class=\"link xs mt2\" style=\"display:inline-block\" href=\"#/audit?cat=ai\">Open AI events in the audit log →\u003c/a>` : \"\"}`)}\n  \u003c/div>`;\n}\nfunction viewCompliance() {\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Compliance mapping\u003c/h1>\u003cp class=\"sub\">How platform controls map to the frameworks you're audited against, with the evidence to back them.\u003c/p>\u003c/div>\u003c/div>\n    ${card(ch(\"Evidence\", \"Registers and exports to back the controls below\") + `\u003cdiv class=\"row wrap\">\u003cbutton class=\"btn btn-outline\" data-act=\"export-findings\">${ic(\"download\")} Findings register (CSV)\u003c/button>\u003cbutton class=\"btn btn-outline\" data-act=\"export-exceptions\">${ic(\"download\")} Exceptions register (CSV)\u003c/button>${S.repos.map(r => `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"vex\" data-id=\"${r.id}\">${ic(\"download\", \"i-sm\")} VEX · ${esc(r.name)}\u003c/button>`).join(\"\")}\u003c/div>`)}\n    ${card(`\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Title\u003c/th>\u003cth>Applies to\u003c/th>\u003cth>Platform mapping\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${CONTROLS.map(c => `\u003ctr>\u003ctd class=\"fw5\" style=\"white-space:nowrap\">${c[0]} ${c[1]}\u003c/td>\u003ctd>${esc(c[2])}\u003c/td>\u003ctd>${pill(c[3].toUpperCase())}\u003c/td>\u003ctd class=\"muted\">${esc(c[4])}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`)}\n    ${complianceExtras()}\u003c/div>`;\n}\nfunction viewAudit(q) {\n  const cat = q.get(\"cat\") || \"\";\n  const rows = S.audit.filter(a => !cat || a.category === cat);\n  const cats = [\"finding\", \"exception\", \"override\", \"remediation\", \"agent\", \"ai\", \"policy\", \"repo\", \"scan\", \"integration\", \"user\", \"export\"];\n  const v = verifyChain(S.audit);\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Audit log\u003c/h1>\u003cp class=\"sub\">Who changed what, across repos, users, findings, exceptions, policy and exports. Every event is hash-chained to the one before it.\u003c/p>\u003c/div>\u003cdiv class=\"row wrap\">${v.ok ? pill(`Chain intact · ${v.total} events`, \"emerald\") : pill(`Chain broken at event ${v.at}`, \"rose\")}\u003cbutton class=\"btn btn-outline\" data-act=\"verify-chain\">${ic(\"hash\")} Verify chain\u003c/button>\u003cbutton class=\"btn btn-outline\" data-act=\"export-audit\">${ic(\"download\")} Export CSV\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"filters\">\u003cdiv>\u003clabel class=\"fl\">Category\u003c/label>\u003cselect class=\"sel\" data-filter=\"cat\">\u003coption value=\"\">All\u003c/option>${cats.map(c => `\u003coption ${c === cat ? \"selected\" : \"\"}>${c}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\u003c/div>\n    \u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Who\u003c/th>\u003cth>Category\u003c/th>\u003cth>What\u003c/th>\u003cth>Repo\u003c/th>\u003cth>Hash\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.slice(0, 200).map(a => `\u003ctr class=\"hov\">\u003ctd class=\"muted\" style=\"white-space:nowrap\">${fmtDT(a.at)}\u003c/td>\u003ctd>${esc(userName(a.actor))}\u003c/td>\u003ctd>${pill(esc(a.category), a.category === \"agent\" || a.category === \"ai\" ? \"violet\" : a.category === \"override\" ? \"amber\" : \"neutral\")}\u003c/td>\u003ctd>${esc(a.what)}\u003c/td>\u003ctd class=\"muted\">${a.repoId ? esc(repoById(a.repoId)?.name || \"—\") : \"—\"}\u003c/td>\u003ctd class=\"mono xs muted\" title=\"${esc(a.hash || \"\")}\">${esc((a.hash || \"\").slice(0, 8))}\u003c/td>\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"6\" class=\"empty\">No events.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/div>`;\n}\nlet intForm = null;\nfunction viewIntegrations() {\n  const C = [[\"Single sign-on (SAML / OIDC)\", \"Microsoft Entra ID · acme.example\", \"connected\", \"Everyone signs in with company SSO. Roles and teams follow directory groups, and leavers lose access as soon as their directory account is disabled.\"], [\"GitHub\", \"acme (github.com)\", \"connected\", \"Repos linked · webhooks verified · last delivery 5 min ago\"], [\"GitHub App\", \"Everlit for acme · installed per repo\", \"connected\", \"Posts check runs with annotations on the manifest line and a re-run button, with only the scopes each repo needs\"], [\"Slack\", \"acme.slack.com · #sec-alerts\", \"connected\", \"Known-exploited findings, blocked PRs, override requests and expiring exceptions go to the owning team's channel\"], [\"ServiceNow\", \"—\", \"not_connected\", \"Opens a change record for complex fixes and a review task before accepted risk expires\"], [\"SBOM upload (CI)\", \"everlit.acme.example/api/sbom\", \"connected\", \"CI posts the CycloneDX or SPDX SBOM of each build, so Everlit scans exactly what shipped\"], [\"GitLab\", \"—\", \"not_connected\", \"Group access token + webhook\"], [\"Bitbucket\", \"—\", \"not_connected\", \"App password + webhook\"], [\"Azure DevOps\", \"—\", \"not_connected\", \"PAT with Code (read & write) + service hook\"], [\"Jira\", \"jira.acme.example\", \"connected\", \"Complex fixes open a ticket in the owning team's project and link back to the finding\"], [\"Email (SMTP)\", \"smtp.acme.example\", \"connected\", \"Notifications on new critical findings and exception decisions\"]];\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Integrations\u003c/h1>\u003cp class=\"sub\">Connect your identity provider and git providers, so people sign in with company accounts and Everlit can read manifests, auto-trigger the PR gate and push fix branches.\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"grid\" style=\"grid-template-columns:repeat(auto-fill,minmax(280px,1fr))\">${C.map(([n, h, s0, d]) => { const s = S.connected[n] ? \"connected\" : s0; return card(`\u003cdiv class=\"row between\">\u003cp class=\"fw6\">${n}${/^Single sign-on/.test(n) ? rm(2) : \"\"}\u003c/p>${pill(s === \"connected\" ? \"Connected\" : \"Not connected\", s === \"connected\" ? \"emerald\" : \"neutral\")}\u003c/div>\u003cp class=\"xs muted mt1\">${esc(h)}\u003c/p>\u003cp class=\"sm mt3\">${esc(d)}\u003c/p>\u003cdiv class=\"mt4\">${s === \"connected\" ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"toast\" data-msg=\"${n}: connection OK\">Test connection\u003c/button>` : intForm === n ? `\u003cform class=\"stack-sm\" data-submit=\"int-save\" data-n=\"${n}\">\u003clabel class=\"fl\">Access token\u003c/label>\u003cinput class=\"inp\" name=\"token\" type=\"password\" required placeholder=\"Paste a token with the scopes above\" style=\"width:100%\" autocomplete=\"off\">\u003cdiv class=\"row\">\u003cbutton class=\"btn btn-indigo btn-xs\" type=\"submit\">Save &amp; verify\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" type=\"button\" data-act=\"int-connect\" data-n=\"\">Cancel\u003c/button>\u003c/div>\u003c/form>` : `\u003cbutton class=\"btn btn-indigo btn-xs\" data-act=\"int-connect\" data-n=\"${n}\">Connect\u003c/button>`}\u003c/div>`); }).join(\"\")}\u003c/div>\n    ${card(ch(\"Credential encryption\", \"Connector tokens and webhook secrets are encrypted at rest with a rotating key\", can(\"rotateKeys\") ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"rotate-keys\">${ic(\"key\", \"i-sm\")} Rotate key and re-encrypt\u003c/button>` : \"\", \"Each secret records which key encrypted it. Rotating makes a new key active, re-encrypts every secret with it, and keeps older keys for decryption only until nothing uses them.\") + `\u003cdl class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(160px,1fr))\">${field(\"Active key\", `\u003cspan class=\"mono\">${esc(S.keyRing.active)}\u003c/span>`)}${field(\"Decrypt-only\", S.keyRing.retired.map(k => `\u003cspan class=\"mono\">${esc(k)}\u003c/span>`).join(\", \") || \"—\")}${field(\"Last rotated\", fmtDT(S.keyRing.rotatedAt))}${field(\"Algorithm\", \"AES-256-GCM\")}\u003c/dl>`, \"\", \"keys\")}\n    ${card(ch(\"What each connector needs from the repo side\") + `\u003cul class=\"stack-sm sm\">\u003cli>• Read access to manifests and lockfiles on the default branch\u003c/li>\u003cli>• Webhooks for push and pull_request events (PR gate auto-trigger)\u003c/li>\u003cli>• Write access to branches and PRs, only if you want CI-gated fix PRs\u003c/li>\u003c/ul>`)}\u003c/div>`;\n}\nfunction viewAdapters() {\n  const A2 = [[\"OSV.dev + FIRST.org EPSS (built-in SCA)\", \"SCA\", true], [\"Snyk\", \"SCA / Container / IaC\", false], [\"Checkmarx\", \"SAST\", false], [\"JFrog Xray\", \"SCA (Artifactory-scoped)\", false], [\"Veracode\", \"SAST / SCA\", false], [\"SonarQube / SonarCloud\", \"SAST / code quality\", false], [\"Semgrep\", \"SAST (built-in fallback)\", false], [\"Trivy\", \"SCA / container / IaC (fallback)\", false], [\"GitHub Advanced Security\", \"SAST / SCA / secrets\", false], [\"Wiz / Prisma Cloud\", \"Cloud posture / container / IaC\", false], [\"TruffleHog / GitLeaks\", \"Secrets detection\", false]];\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Adapters\u003c/h1>\u003cp class=\"sub\">Bring your own scanner. Every tool maps into one canonical finding format behind the same interface, so adding one doesn't touch the pipeline.\u003c/p>\u003c/div>\u003c/div>\n    ${card(`\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Adapter\u003c/th>\u003cth>Category\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${A2.map(([n, c, on]) => `\u003ctr>\u003ctd class=\"fw5\">${esc(n)}\u003c/td>\u003ctd class=\"muted\">${esc(c)}\u003c/td>\u003ctd>${pill(on ? \"Connected\" : \"Not connected\", on ? \"emerald\" : \"neutral\")}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`)}\u003c/div>`;\n}\nconst INTEL = [\n  { k: \"osv\", short: \"OSV.dev\", name: \"OSV.dev\", full: \"Open Source Vulnerabilities database\", icon: \"database\", feed: true, by: \"Google · open source, OpenSSF OSV schema\", url: \"https://osv.dev\",\n    use: \"Matches every dependency version against exact affected and fixed version ranges. Aggregates the GitHub Advisory Database, PyPA, Go, RustSec and other ecosystem databases.\",\n    trust: \"Open, publicly auditable data in an OpenSSF format that ecosystem maintainers publish to directly. It is the database behind Google's OSV-Scanner.\", cadence: \"Queried live on every scan\" },\n  { k: \"ghsa\", short: \"GitHub Advisories\", name: \"GitHub Advisory Database\", full: \"GitHub Security Advisories (GHSA)\", icon: \"shieldCheck\", feed: true, by: \"GitHub security team\", url: \"https://github.com/advisories\",\n    use: \"Reviewed, package-level advisories (GHSA IDs) with affected and patched versions, received through OSV.\",\n    trust: \"Curated by GitHub's security team. It is the same data behind GitHub's own security alerts.\", cadence: \"Through OSV on every scan\" },\n  { k: \"nvd\", short: \"NVD\", name: \"CVE Program · NIST NVD\", full: \"Common Vulnerabilities and Exposures · National Vulnerability Database\", icon: \"landmark\", feed: true, by: \"CVE: MITRE, sponsored by CISA · NVD: NIST (US government)\", url: \"https://nvd.nist.gov\",\n    use: \"Canonical CVE identifiers, references and a CVSS cross-check for every finding.\",\n    trust: \"CVE IDs are the common language of vendors, scanners and regulators; the NVD is the US government's reference vulnerability database.\", cadence: \"Linked on every finding\" },\n  { k: \"kev\", short: \"CISA KEV\", name: \"CISA Known Exploited Vulnerabilities\", full: \"KEV catalog\", icon: \"alert\", feed: true, by: \"US Cybersecurity and Infrastructure Security Agency\", url: \"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\", label: \"cisa.gov/kev\",\n    use: \"Flags vulnerabilities confirmed exploited in the wild: full exploitability points, a +10 bonus and the 7-day fix deadline.\",\n    trust: \"Binding Operational Directive 22-01 makes fixing KEV entries mandatory for US federal civilian agencies. Widely used as the industry's fix-first list.\", cadence: \"Synced daily\" },\n  { k: \"epss\", short: \"FIRST EPSS\", name: \"Exploit Prediction Scoring System\", full: \"EPSS\", icon: \"gauge\", feed: true, by: \"FIRST (Forum of Incident Response and Security Teams)\", url: \"https://www.first.org/epss/\",\n    use: \"Probability that a CVE is exploited in the next 30 days. Its band (10% or more, 1–10%, 0.1–1%, under 0.1%) sets the exploitability points when a CVE isn't on the KEV list.\",\n    trust: \"A data-driven model from the same standards body that maintains CVSS, recalculated daily.\", cadence: \"Synced daily\" },\n  { k: \"cvss\", short: \"CVSS\", name: \"CVSS v3.1\", full: \"Common Vulnerability Scoring System\", icon: \"scroll\", feed: false, by: \"FIRST standard\", url: \"https://www.first.org/cvss/\",\n    use: \"Base severity, parsed from each advisory's CVSS vector. Worth up to 35 of the 100 priority points.\",\n    trust: \"The industry-standard severity scale used by NVD, vendors and auditors.\", cadence: \"From each advisory\" },\n];\nfunction feedSyncAt() { const t = new Date(); t.setHours(2, 5, 0, 0); if (t > Date.now()) t.setDate(t.getDate() - 1); return t; }\nfunction feedStatus(x) {\n  if (S.ui.osvOutage && (x.k === \"osv\" || x.k === \"ghsa\")) return { ok: false, label: \"Degraded · timeouts on last scan\" };\n  const last = x.k === \"osv\" || x.k === \"ghsa\" ? (S.scans.map(s => s.startedAt).sort().at(-1) || feedSyncAt()) : feedSyncAt();\n  return { ok: true, label: `Healthy · ${x.k === \"nvd\" ? \"linked\" : \"synced\"} ${fmtDT(last)}` };\n}\nfunction viewIntel() {\n  const steps = [[\"upload\", \"Manifest + lockfile\", \"read from the default branch\"], [\"database\", \"OSV match\", \"exact affected / fixed ranges\"], [\"landmark\", \"CVE · NVD\", \"identity, references, CVSS\"], [\"gauge\", \"EPSS + KEV\", \"exploit likelihood and evidence\"], [\"search\", \"Import evidence\", \"is the package used in code?\"], [\"shieldAlert\", \"Priority 0–100\", \"context-aware score\"], [\"scroll\", \"Policy + SLA\", \"action, gate and deadline\"]];\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Data sources\u003c/h1>\u003cp class=\"sub\">Every finding is built from public, industry-standard sources run by government agencies, standards bodies and major open-source security teams. No score rests on a single vendor's opinion.\u003c/p>\u003c/div>\u003c/div>\n    ${card(ch(\"Feed health\", \"Status of each source as of the latest sync\") + `\u003cdiv class=\"feeds\">${INTEL.filter(x => x.feed).map(x => { const st = feedStatus(x); return `\u003cdiv class=\"feed\">\u003cspan class=\"row\" style=\"gap:8px\">${ic(x.icon, \"i-sm\")}\u003cspan class=\"fw5 sm\">${esc(x.short)}\u003c/span>\u003c/span>\u003cspan class=\"row xs\" style=\"gap:6px\">\u003cspan class=\"dot ${st.ok ? \"ok\" : \"warn\"}\">\u003c/span>${esc(st.label)}\u003c/span>\u003cspan class=\"xs muted\">${esc(x.cadence)}\u003c/span>\u003c/div>`; }).join(\"\")}\u003c/div>`)}\n    \u003cdiv class=\"srcgrid\">${INTEL.map(x => card(`\u003cdiv class=\"row\" style=\"gap:10px;align-items:flex-start\">\u003cspan class=\"srcic\">${ic(x.icon)}\u003c/span>\u003cdiv style=\"min-width:0\">\u003cp class=\"fw6\">${esc(x.name)}\u003c/p>\u003cp class=\"xs fw5\" data-noabbr>${esc(x.full)}\u003c/p>\u003cp class=\"xs muted\">${esc(x.by)}\u003c/p>\u003c/div>\u003c/div>\n      \u003cp class=\"lbl2 mt3\">What Everlit uses it for\u003c/p>\u003cp class=\"sm\">${esc(x.use)}\u003c/p>\n      \u003cp class=\"lbl2 mt3\">Why it's trusted\u003c/p>\u003cp class=\"sm\">${esc(x.trust)}\u003c/p>\n      \u003cdiv class=\"row between mt3\" style=\"border-top:1px solid var(--border);padding-top:10px\">\u003cspan class=\"xs muted\">${esc(x.cadence)}\u003c/span>\u003ca class=\"link xs\" href=\"${x.url}\" target=\"_blank\" rel=\"noopener noreferrer\">${esc(x.label || x.url.replace(/^https:\\/\\/(www\\.)?/, \"\").replace(/\\/$/, \"\"))} ↗\u003c/a>\u003c/div>`, \"src\")).join(\"\")}\u003c/div>\n    \u003cdiv class=\"lg2\">\n      ${card(ch(\"KEV updates\", \"When CISA lists a CVE, matching open findings are re-scored at the next daily sync, with no rescan\", \"\", \"Each catalog change is matched against every open finding's CVE IDs. Priority and deadline update in place, and the change lands in the finding's history and the audit log.\") + `\u003cul class=\"stack-sm sm\">${S.kevEvents.map(e => `\u003cli>\u003cspan class=\"fw5\">${fmtDT(e.at)}\u003c/span>\u003cspan class=\"xs muted\" style=\"display:block\">${esc(e.what)}\u003c/span>\u003c/li>`).join(\"\")}\u003cli>\u003cspan class=\"fw5\">${fmtDT(feedSyncAt())}\u003c/span>\u003cspan class=\"xs muted\" style=\"display:block\">Daily sync · no catalog change touched an open finding\u003c/span>\u003c/li>\u003c/ul>`, \"\", \"kev-events\")}\n      ${card(ch(\"Inventory inputs\", \"Where the list of components comes from\") + `\u003cul class=\"stack-sm sm\">${[[\"upload\", \"Manifests and lockfiles\", \"read from the default branch and from every manifest a PR touches\"], [\"fileCheck\", \"SBOMs from CI\", \"CycloneDX or SPDX posted by the build, so the scan matches what shipped\"], [\"refresh\", \"Advisory changes\", `the ${new Set(S.findings.map(f => f.cve)).size} advisories behind current findings are re-checked against OSV.dev's modified date on every scan`]].map(([i, t, d]) => `\u003cli class=\"row\" style=\"align-items:flex-start;gap:8px\">\u003cspan class=\"muted\" style=\"display:inline-flex;margin-top:2px\">${ic(i, \"i-sm\")}\u003c/span>\u003cspan>\u003cb>${t}\u003c/b>\u003cspan class=\"xs muted\" style=\"display:block\">${d}\u003c/span>\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>`)}\n    \u003c/div>\n    ${card(ch(\"How a finding is built\", \"From the code in your repo to a prioritized, deadline-bearing finding\") + `\u003col class=\"pipe\">${steps.map(([i, t, d], n) => `\u003cli>\u003cspan class=\"pn\">${n + 1}\u003c/span>\u003cspan class=\"row\" style=\"gap:6px\">${ic(i, \"i-sm\")}\u003cb>${t}\u003c/b>\u003c/span>\u003cspan class=\"xs muted\">${d}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ol>`)}\n    \u003cdiv class=\"lg2\">\n      ${card(ch(\"Accuracy safeguards\") + `\u003cul class=\"stack-sm sm\">${[\"A finding only auto-closes when every package got an answer from the sources. A partial scan never hides a vulnerability.\", \"If a source is unreachable, the PR gate reports Incomplete, never a green pass. Repos that enforce blocking can hold the merge (fail-closed).\", \"Every finding records its sources and the database freshness at scan time (see Provenance on each finding).\", \"Exceptions need a second person and always expire, so suppressed findings come back for review.\"].map(t => `\u003cli class=\"row\" style=\"align-items:flex-start;gap:8px\">\u003cspan style=\"color:#059669;display:inline-flex;margin-top:2px\">${ic(\"check\", \"i-sm\")}\u003c/span>\u003cspan>${t}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>`)}\n      ${card(ch(\"Bring your own scanner\") + `\u003cp class=\"sm\">Already licensed Snyk, Checkmarx, JFrog Xray, Veracode or GitHub Advanced Security? Their findings map into the same canonical format and get the same scoring, policy and SLA treatment, de-duplicated against the sources above.\u003c/p>${roleCanSee(me().role, \"adapters\") ? `\u003ca class=\"link xs mt3\" style=\"display:inline-block\" href=\"#/adapters\">Manage adapters →\u003c/a>` : \"\"}`)}\n    \u003c/div>\n    ${card(ch(\"Glossary\", \"Every abbreviation used in Everlit. Hover any abbreviation in the app to see its full form.\") + `\u003cdl class=\"gloss\" data-noabbr>${Object.entries(GLOSSARY).sort((a, b) => a[0].localeCompare(b[0], \"en\", { sensitivity: \"base\" })).map(([k, v]) => `\u003cdiv>\u003cdt>${esc(k)}\u003c/dt>\u003cdd>${esc(v)}\u003c/dd>\u003c/div>`).join(\"\")}\u003c/dl>`, \"\", \"glossary\")}\n    \u003c/div>`;\n}\nfunction viewUsers() {\n  return `\u003cdiv our-exit\">Exit tour\u003c/button>\u003c/div>\u003c/div>\u003c/div>`;\n  abbrify($(\"#tour\"));\n}\nfunction endTour(silent) {\n  if (!tour) return;\n  clearTimeout(tour.timer); clearTimeout(runTimer); clearInterval(tour.follow);\n  const t = tour; tour = null;\n  S = JSON.parse(t.snap); S.ui.guideOpen = t.guide;\n  scanProg = null; gateResult = null; inlineForm = null; aiDismissOpen = null; menuOpen = false; gateExplain = false; gateDispute = null; ovrFormOpen = false; investOpen = null;\n  save(); $(\"#tour\").innerHTML = \"\";\n  if (silent) return;\n  if (location.hash === t.hash) render(); else location.hash = t.hash || \"#/login\";\n  tickRuns();\n}\naddEventListener(\"resize\", () => { if (tour && tour.i \u003c TOUR.length) placeRing(); });\ndocument.addEventListener(\"keydown\", e => { if (tour && e.key === \"Escape\") { e.stopImmediatePropagation(); endTour(); } }, true);\naddEventListener(\"everlit:tour\", () => startTour());\n\n/* ================================================================ boot */\nconst tourOnBoot = location.hash === \"#tour\";\nif (!location.hash || tourOnBoot) history.replaceState(null, \"\", S.session ? \"#/dashboard\" : \"#/login\");\nrender();\ntickRuns();\nif (tourOnBoot) startTour();\nwindow.__everlit = { get state() { return S; }, get tour() { return tour; }, TOUR, calc, computePriorityScore, scanRepo, runGate, funnelStages, startTour, endTour, setRoadmap };\n(() => {\n  const base = { cvssScore: 9.8, epss: 0.02, kev: false, reachable: true, reachabilityKnown: true, internetFacing: true, criticalityTier: \"critical\" };\n  console.assert(computePriorityScore({ ...base, dependencyScope: \"direct-runtime\" }).severityNormalized === \"critical\", \"runtime 9.8 on a critical internet-facing repo → critical\");\n  console.assert(computePriorityScore({ ...base, internetFacing: false, criticalityTier: \"low\", epss: 0.003 }).severityNormalized === \"medium\", \"same CVE in an internal low-tier tool → medium\");\n  console.assert(computePriorityScore({ ...base, dependencyScope: \"direct-dev\" }).severityNormalized === \"medium\", \"dev 9.8 → medium\");\n  console.assert(classifyBump(\"8.5.1\", \"9.0.0\") === \"major\" && classifyBump(\"4.17.15\", \"4.17.21\") === \"patch\", \"classifyBump\");\n})();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const VIEWS = ["executive", "overview", "product"];
const TITLES = { executive: "Executive brief", overview: "How it works", product: "Product" };
const frames = {}, ready = {}, pending = {};
const store = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
let roadmap = store.get("everlit-roadmap") === "on";
let theme = store.get("everlit-theme") || "system";
let current = null;

const post = (v, msg) => { if (ready[v]) frames[v].contentWindow.postMessage(msg, "*"); else (pending[v] = pending[v] || []).push(msg); };
const broadcast = msg => Object.keys(frames).forEach(v => post(v, msg));

function frame(v) {
  if (frames[v]) return frames[v];
  const f = document.createElement("iframe");
  f.title = TITLES[v]; f.id = "view-" + v; f.hidden = true;
  f.addEventListener("load", () => {
    ready[v] = true;
    f.contentWindow.postMessage({ everlit: "roadmap", on: roadmap }, "*");
    f.contentWindow.postMessage({ everlit: "theme", mode: theme }, "*");
    (pending[v] || []).splice(0).forEach(m => f.contentWindow.postMessage(m, "*"));
  });
  f.srcdoc = JSON.parse(document.getElementById("src-" + v).textContent);
  $("#stage").append(f);
  return frames[v] = f;
}

function show(v, push) {
  if (!VIEWS.includes(v)) v = "executive";
  frame(v);
  VIEWS.forEach(x => { if (frames[x]) frames[x].hidden = x !== v; const t = document.getElementById("tab-" + x); t.setAttribute("aria-selected", String(x === v)); t.tabIndex = x === v ? 0 : -1; });
  document.title = "Everlit · " + TITLES[v];
  current = v;
  if (push !== false && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = (VIEWS.indexOf(current) + (e.key === "ArrowRight" ? 1 : VIEWS.length - 1)) % VIEWS.length;
  show(VIEWS[i]); document.getElementById("tab-" + VIEWS[i]).focus();
});
addEventListener("hashchange", () => show(location.hash.slice(1), false));

function startTour() { show("product"); post("product", { everlit: "tour" }); }
$("#tourBtn").addEventListener("click", startTour);

/* roadmap badges */
const chk = $("#roadmapChk");
function setRoadmap(on) { roadmap = !!on; chk.checked = roadmap; store.set("everlit-roadmap", roadmap ? "on" : "off"); broadcast({ everlit: "roadmap", on: roadmap }); }
chk.checked = roadmap;
chk.addEventListener("change", () => setRoadmap(chk.checked));

/* theme: system → light → dark, shared with every view */
const ICONS = { system: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>', light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>', dark: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' };
function applyTheme(t, tell) {
  theme = ["system", "light", "dark"].includes(t) ? t : "system";
  if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = theme;
  $("#themeBtn").innerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS[theme]}</svg>`;
  $("#themeBtn").setAttribute("aria-label", `Theme: ${theme}. Click to change`);
  store.set("everlit-theme", theme);
  if (tell) broadcast({ everlit: "theme", mode: theme });
}
applyTheme(theme, false);
$("#themeBtn").addEventListener("click", () => applyTheme(["system", "light", "dark"][(["system", "light", "dark"].indexOf(theme) + 1) % 3], true));

/* menu */
const menu = $("#menu"), more = $("#moreBtn");
const openMenu = o => { menu.hidden = !o; more.setAttribute("aria-expanded", String(o)); };
more.addEventListener("click", e => { e.stopPropagation(); openMenu(menu.hidden); });
document.addEventListener("click", e => { if (!menu.contains(e.target)) openMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") openMenu(false); });
addEventListener("blur", () => openMenu(false));

/* messages from the views */
addEventListener("message", e => {
  const d = e.data || {}; if (!d.everlit || !Object.values(frames).some(f => f.contentWindow === e.source)) return;
  if (d.everlit === "view") { show(d.view); if (d.tour) post("product", { everlit: "tour" }); else if (d.anchor) post(d.view, { everlit: "anchor", id: d.anchor }); }
  else if (d.everlit === "tour") startTour();
  else if (d.everlit === "roadmap") setRoadmap(d.on);
  else if (d.everlit === "theme") { applyTheme(d.mode, false); Object.keys(frames).forEach(v => { if (frames[v].contentWindow !== e.source) post(v, { everlit: "theme", mode: theme }); }); }
});

window.__shell = { show, frames, setRoadmap, startTour };
show(location.hash.slice(1) || "executive");
})();
</script>
</body>
</html>
