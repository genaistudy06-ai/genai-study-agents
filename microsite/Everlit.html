ed for every package, the scan didn't fail, the package wasn't skipped, and the same vulnerability isn't still present at another version.\";\n      break;\n    case \"degraded\":\n      steps = [...base, { c: \"warn\", i: \"alert\", t: \"Rescan degraded\", d: \"OSV didn't answer for 3 of 312 packages, so absence can't be proven\", at: today }];\n      status = `\u003cspan class=\"badge tone-warn\">${ic(\"alert\")} Still open · scan degraded\u003c/span>`;\n      sub = \"Nothing was auto-closed. The next healthy scan will decide.\";\n      rule = \"Rule 1 · never report what didn't happen\"; ruleText = \"When the scan couldn't prove absence it's flagged degraded and nothing is auto-closed, even if the fix probably worked.\";\n      break;\n    case \"stillvuln\":\n      steps = [base[0], { c: \"info\", i: \"user\", t: \"Manual upgrade merged\", d: \"lodash 4.17.15 → 4.17.19 (outside Everlit)\", at: addDays(-2) },\n        { c: \"bad\", i: \"x\", t: \"Rescan: still vulnerable\", d: \"CVE-2021-23337 affects \u003c 4.17.21. Finding moved to 4.17.19\", at: today }];\n      status = `\u003cspan class=\"badge tone-bad\">${ic(\"x\")} Open · moved to 4.17.19\u003c/span>`;\n      sub = \"Same finding, history and decisions kept. Not closed and replaced by a new one.\";\n      rule = \"Rule 4 · an upgrade that's still vulnerable isn't a fix\"; ruleText = \"Upgrading to a version that's still vulnerable to the same advisory moves the existing finding to the new version, keeping its history and any decision on it, instead of closing it and opening a brand-new one.\";\n      break;\n    case \"otherver\":\n      steps = [...base, { c: \"bad\", i: \"x\", t: \"Rescan: still present elsewhere\", d: \"lodash 4.17.15 still resolved via some-sdk → lodash@4.17.15\", at: today }];\n      status = `\u003cspan class=\"badge tone-bad\">${ic(\"x\")} Open · present at another version\u003c/span>`;\n      sub = \"The direct dependency is fixed, but the vulnerable code still ships.\";\n      rule = \"Rule 1 · same vulnerability, another version\"; ruleText = \"A finding isn't closed while the same vulnerability is still present at another version of that package anywhere in the tree.\";\n      break;\n    case \"reappears\":\n      steps = [...base, { c: \"good\", i: \"check\", t: \"Rescan: fixed\", d: \"Closed by scanner\", at: today },\n        { c: \"bad\", i: \"refresh\", t: \"Re-detected after a revert\", d: \"lodash back to 4.17.15 on main\", at: addDays(3) }];\n      status = `\u003cspan class=\"badge tone-bad\">${ic(\"refresh\")} Reopened · regression\u003c/span>`;\n      sub = `Keeps its original first-seen date (${fmtShort(first)}), so the SLA isn't reset by the regression.`;\n      rule = \"Rule 3 · regressions reopen\"; ruleText = \"A finding closed as fixed that shows up again is reopened, keeping its original first-seen date, whether the scanner closed it or a person marked it fixed.\";\n      break;\n    case \"exception\":\n      steps = [base[0], { c: \"info\", i: \"user\", t: \"Exception requested\", d: \"Accepted risk requested by the engineering manager\", at: addDays(-3) },\n        { c: \"good\", i: \"users\", t: \"Approved by security\", d: \"Second reviewer (two-person rule) · expires \" + fmtShort(addDays(362)), at: addDays(-2) },\n        { c: \"info\", i: \"refresh\", t: \"Rescan: still present\", d: \"Matched to the existing finding. No duplicate opened\", at: today }];\n      status = `\u003cspan class=\"badge tone-neutral\">${ic(\"users\")} Accepted risk · decision kept\u003c/span>`;\n      sub = \"The human decision survives every rescan until it expires.\";\n      rule = \"Rule 2 · decisions survive rescans\"; ruleText = \"Every existing finding matches its rescan regardless of status, so accepted-risk, false-positive and suppressed decisions survive and are never duplicated by a \\\"new\\\" open finding.\";\n      break;\n  }\n  const fromNote = VER.from ? `\u003cdiv class=\"why-human\" style=\"border-color:var(--info-bd);background:var(--info-bg)\">${ic(\"bot\")}\u003cdiv>\u003cb>From the agent squad:\u003c/b> PR #${VER.from.pr} (${esc(VER.from.title)}) goes through exactly these rules on its next rescan.${VER.from.mitigation ? \" A mitigation leaves the package unchanged, so the finding stays open until security approves the exception.\" : \"\"} Shown here with the lodash example.\u003c/div>\u003c/div>` : \"\";\n  $(\"#vpanel\").innerHTML = fromNote + `\n    \u003cdiv class=\"vhead\">\n      \u003cdiv>\u003ch3>lodash · payments-api\u003c/h3>\u003cdiv class=\"sub\">${esc(sub)}\u003c/div>\u003c/div>\n      \u003cdiv class=\"vstatus\">${status}\u003c/div>\n    \u003c/div>\n    \u003col class=\"tl\">${steps.map((s, i) => `\u003cli class=\"${s.c}\" style=\"--i:${i}\">\u003cspan class=\"tdot\">${ic(s.i)}\u003c/span>\u003cspan>\u003cspan class=\"tt\">${esc(s.t)}\u003cspan class=\"tdate\">${fmtShort(s.at)}\u003c/span>\u003c/span>\u003cbr>\u003cspan class=\"td\">${esc(s.d)}\u003c/span>\u003c/span>\u003c/li>`).join(\"\")}\u003c/ol>\n    \u003cdiv class=\"rulebox\">\u003cspan class=\"label\">${esc(rule)}\u003c/span>${esc(ruleText)}\u003cbr>\u003ccode class=\"muted\">src/lib/reconcile.ts · planReconcile()\u003c/code>\u003c/div>`;\n}\n\n/* ================================================================ DATA SOURCES (same records as the product's Data Sources page) */\nconst SOURCES = [\n  { icon: \"layers\", name: \"OSV.dev\", full: \"Open Source Vulnerabilities database\", by: \"Google · open source, OpenSSF OSV schema\", url: \"https://osv.dev\", label: \"osv.dev\",\n    use: \"Matches every dependency version against exact affected and fixed version ranges. Aggregates the GitHub Advisory Database, PyPA, Go, RustSec and other ecosystem databases.\",\n    trust: \"Open, publicly auditable data in an OpenSSF format that ecosystem maintainers publish to directly. It is the database behind Google's OSV-Scanner.\", cadence: \"Queried live on every scan\" },\n  { icon: \"shield\", name: \"GitHub Advisory Database\", full: \"GitHub Security Advisories (GHSA)\", by: \"GitHub security team\", url: \"https://github.com/advisories\", label: \"github.com/advisories\",\n    use: \"Reviewed, package-level advisories (GHSA IDs) with affected and patched versions, received through OSV.\",\n    trust: \"Curated by GitHub's security team. It is the same data behind GitHub's own security alerts.\", cadence: \"Through OSV on every scan\" },\n  { icon: \"building\", name: \"CVE Program · NIST NVD\", full: \"Common Vulnerabilities and Exposures · National Vulnerability Database\", by: \"CVE: MITRE, sponsored by CISA · NVD: NIST (US government)\", url: \"https://nvd.nist.gov\", label: \"nvd.nist.gov\",\n    use: \"Canonical CVE identifiers, references and a CVSS cross-check for every finding.\",\n    trust: \"CVE IDs are the common language of vendors, scanners and regulators; the NVD is the US government's reference vulnerability database.\", cadence: \"Linked on every finding\" },\n  { icon: \"alert\", name: \"CISA Known Exploited Vulnerabilities\", full: \"KEV catalog\", by: \"US Cybersecurity and Infrastructure Security Agency\", url: \"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\", label: \"cisa.gov/kev\",\n    use: \"Flags vulnerabilities confirmed exploited in the wild: full exploitability points, a +10 bonus and the 7-day fix deadline.\",\n    trust: \"Binding Operational Directive 22-01 makes fixing KEV entries mandatory for US federal civilian agencies. Widely used as the industry's fix-first list.\", cadence: \"Synced daily\" },\n  { icon: \"gauge\", name: \"Exploit Prediction Scoring System\", full: \"EPSS\", by: \"FIRST (Forum of Incident Response and Security Teams)\", url: \"https://www.first.org/epss/\", label: \"first.org/epss\",\n    use: \"Probability that a CVE is exploited in the next 30 days. Drives exploitability points when a CVE isn't on the KEV list.\",\n    trust: \"A data-driven model from the same standards body that maintains CVSS, recalculated daily.\", cadence: \"Synced daily\" },\n  { icon: \"scroll\", name: \"CVSS v3.1\", full: \"Common Vulnerability Scoring System\", by: \"FIRST standard\", url: \"https://www.first.org/cvss/\", label: \"first.org/cvss\",\n    use: \"Base severity, parsed from each advisory's CVSS vector. Worth up to 45 of the 100 priority points.\",\n    trust: \"The industry-standard severity scale used by NVD, vendors and auditors.\", cadence: \"From each advisory\" },\n];\nconst PIPE = [[\"file\", \"Manifest + lockfile\", \"read from the default branch\"], [\"layers\", \"OSV match\", \"exact affected / fixed ranges\"], [\"building\", \"CVE · NVD\", \"identity, references, CVSS\"], [\"gauge\", \"EPSS + KEV\", \"exploit likelihood and evidence\"], [\"search\", \"Import evidence\", \"is the package used in code?\"], [\"shield\", \"Priority 0–100\", \"context-aware score\"], [\"scroll\", \"Policy + SLA\", \"action, gate and deadline\"]];\nfunction renderSources() {\n  $(\"#srcGrid\").innerHTML = SOURCES.map((x, k) => `\u003carticle class=\"card card-pad feature src reveal\" style=\"--i:${k % 3}\">\u003cdiv class=\"ficon\">${ic(x.icon, \"i-lg\")}\u003c/div>\u003ch3>${esc(x.name)}\u003c/h3>\u003cdiv class=\"full\" data-noabbr>${esc(x.full)}\u003c/div>\u003cdiv class=\"by\">${esc(x.by)}\u003c/div>\n    \u003cdiv class=\"lbl2\">What Everlit uses it for\u003c/div>\u003cp>${esc(x.use)}\u003c/p>\u003cdiv class=\"lbl2\">Why it's trusted\u003c/div>\u003cp>${esc(x.trust)}\u003c/p>\n    \u003cdiv class=\"sfoot\">\u003cspan>${esc(x.cadence)}\u003c/span>\u003ca href=\"${x.url}\" target=\"_blank\" rel=\"noopener noreferrer\">${esc(x.label)} ↗\u003c/a>\u003c/div>\u003c/article>`).join(\"\");\n  $(\"#pipe\").innerHTML = PIPE.map(([i, t, d], n) => `\u003cli>\u003cspan class=\"pn\">${String(n + 1).padStart(2, \"0\")}\u003c/span>\u003cb>${ic(i)}${t}\u003c/b>\u003cspan class=\"d\">${d}\u003c/span>\u003c/li>`).join(\"\");\n  $(\"#gloss\").innerHTML = Object.entries(GLOSSARY).sort((a, b) => a[0].localeCompare(b[0], \"en\", { sensitivity: \"base\" })).map(([k, v]) => `\u003cdiv>\u003cdt>${esc(k)}\u003c/dt>\u003cdd>${esc(v)}\u003c/dd>\u003c/div>`).join(\"\");\n}\n\n/* ================================================================ ABBREVIATIONS (same glossary as the product): full form on hover, dotted underline on first use per section */\nconst GLOSSARY = {\n  CVE: \"Common Vulnerabilities and Exposures\", CVSS: \"Common Vulnerability Scoring System\", EPSS: \"Exploit Prediction Scoring System\",\n  KEV: \"Known Exploited Vulnerabilities (CISA catalog)\", CISA: \"Cybersecurity and Infrastructure Security Agency (US)\", NVD: \"National Vulnerability Database\",\n  NIST: \"National Institute of Standards and Technology (US)\", OSV: \"Open Source Vulnerabilities\", GHSA: \"GitHub Security Advisory\",\n  FIRST: \"Forum of Incident Response and Security Teams\", OpenSSF: \"Open Source Security Foundation\", CISO: \"Chief Information Security Officer\",\n  SLA: \"Service Level Agreement (the fix deadline)\", MTTR: \"Mean Time To Remediate\", PR: \"Pull Request\", CI: \"Continuous Integration\",\n  SDLC: \"Software Development Life Cycle\", VEX: \"Vulnerability Exploitability eXchange\", SBOM: \"Software Bill of Materials\", PURL: \"Package URL\",\n  RBAC: \"Role-Based Access Control\", SCA: \"Software Composition Analysis\", SAST: \"Static Application Security Testing\", IaC: \"Infrastructure as Code\",\n  FP: \"False Positive\", POC: \"Point of Contact\", \"PCI-DSS\": \"Payment Card Industry Data Security Standard\", SOX: \"Sarbanes-Oxley Act\",\n  FFIEC: \"Federal Financial Institutions Examination Council\", ITGC: \"IT General Controls\", PyPI: \"Python Package Index\", PyPA: \"Python Packaging Authority\",\n  JNDI: \"Java Naming and Directory Interface\", LDAP: \"Lightweight Directory Access Protocol\", JDBC: \"Java Database Connectivity\", JDK: \"Java Development Kit\",\n  MVC: \"Model-View-Controller\", XSS: \"Cross-Site Scripting\", SSRF: \"Server-Side Request Forgery\", ReDoS: \"Regular Expression Denial of Service\",\n  JWT: \"JSON Web Token\", JSON: \"JavaScript Object Notation\", YAML: \"YAML Ain't Markup Language\", API: \"Application Programming Interface\",\n  URL: \"Uniform Resource Locator\", HTTPS: \"Hypertext Transfer Protocol Secure\", CSV: \"Comma-Separated Values\", PDF: \"Portable Document Format\",\n  SMTP: \"Simple Mail Transfer Protocol\", PAT: \"Personal Access Token\", DB: \"Database\", CLI: \"Command-Line Interface\", RCE: \"Remote Code Execution\",\n  AI: \"Artificial Intelligence\", CWE: \"Common Weakness Enumeration\", SQL: \"Structured Query Language\", TLS: \"Transport Layer Security\",\n  SSO: \"Single Sign-On\", FTE: \"Full-Time Equivalent (one person's working time)\",\n  SPDX: \"Software Package Data Exchange (SBOM standard)\", SHA: \"Secure Hash Algorithm\",\n  BOM: \"Bill of Materials (Maven dependency-version list)\", EXIF: \"Exchangeable Image File Format\", XSRF: \"Cross-Site Request Forgery\", CSRF: \"Cross-Site Request Forgery\",\n};\nconst ABBR_ALIAS = { PRs: \"PR\", SLAs: \"SLA\", APIs: \"API\", CVEs: \"CVE\" };\nconst ABBR_RE = new RegExp(`\\\\b(${[...Object.keys(GLOSSARY), ...Object.keys(ABBR_ALIAS)].sort((a, b) => b.length - a.length).map(k => k.replace(/[-.]/g, \"\\\\$&\")).join(\"|\")})\\\\b(?!-[0-9a-z]{4}-)`, \"g\");\nconst ABBR_SKIP = \"script,style,code,pre,textarea,select,option,abbr,svg,.console,.mono,.tip,[data-noabbr],input,output\";\nfunction abbrify(root) {\n  if (!root || root.closest?.(ABBR_SKIP)) return;\n  const nodes = [];\n  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => !n.nodeValue.trim() || !n.parentElement || n.parentElement.closest(ABBR_SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });\n  while (tw.nextNode()) nodes.push(tw.currentNode);\n  nodes.forEach(n => {\n    const t = n.nodeValue; ABBR_RE.lastIndex = 0;\n    if (!ABBR_RE.test(t)) return;\n    ABBR_RE.lastIndex = 0;\n    const frag = document.createDocumentFragment(); let last = 0, m;\n    while ((m = ABBR_RE.exec(t))) {\n      const key = ABBR_ALIAS[m[1]] || m[1];\n      frag.append(t.slice(last, m.index));\n      const a = document.createElement(\"abbr\"); a.title = GLOSSARY[key]; a.dataset.k = key; a.textContent = m[1];\n      frag.append(a); last = m.index + m[1].length;\n    }\n    frag.append(t.slice(last));\n    // inside flex/grid containers keep the text one item, so the wrapped abbreviations don't pick up the container's gap\n    if (/flex|grid/.test(getComputedStyle(n.parentElement).display)) { const w = document.createElement(\"span\"); w.style.display = \"inline\"; w.append(frag); n.replaceWith(w); } else n.replaceWith(frag);\n  });\n}\nfunction markFirstAbbr() {\n  $$(\"header, main > section, footer\").forEach(sec => { const seen = new Set(); sec.querySelectorAll(\"abbr[data-k]\").forEach(a => { a.classList.toggle(\"ab1\", !seen.has(a.dataset.k)); seen.add(a.dataset.k); }); });\n}\nfunction initAbbr() {\n  abbrify(document.body); markFirstAbbr();\n  const pending = new Set(); let queued = false;\n  const flush = () => {\n    queued = false;\n    pending.forEach(el => { if (el.isConnected) abbrify(el); });\n    pending.clear(); mo.takeRecords(); markFirstAbbr();\n  };\n  const mo = new MutationObserver(ms => {\n    ms.forEach(m => { if (m.type === \"childList\" && m.addedNodes.length) { const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t) pending.add(t); } });\n    if (pending.size && !queued) { queued = true; requestAnimationFrame(flush); }\n  });\n  mo.observe(document.body, { childList: true, subtree: true });\n}\n\n/* ================================================================ PERSONAS */\nconst PERSONAS = [\n  [\"user\", \"Developer\", \"A short, ranked list for my team's repos, and a PR gate that only flags what I introduced.\"],\n  [\"shield\", \"Security engineer\", \"Policy as data, exception reviews, and one score I can defend.\"],\n  [\"users\", \"Engineering manager\", \"Backlog age, SLA risk and MTTR for the teams I run.\"],\n  [\"building\", \"CISO / executive\", \"Trend, exposure and compliance posture without the noise.\"],\n  [\"clipboard\", \"Compliance\", \"An audit trail, control mapping and VEX exports on demand.\"],\n  [\"server\", \"Platform owner\", \"Roles, connectors and adapters, all in one place.\"],\n];\nfunction renderPersonas() {\n  $(\"#personas\").innerHTML = PERSONAS.map(([i, n, d], k) => `\u003cdiv class=\"card persona reveal\" style=\"--i:${k % 3}\">\u003cspan class=\"pav\">${ic(i)}\u003c/span>\u003cspan>\u003cb>${n}\u003c/b>\u003cspan class=\"pd\">${esc(d)}\u003c/span>\u003c/span>\u003c/div>`).join(\"\");\n}\n\n/* ================================================================ chrome: theme, nav, reveal */\nfunction initTheme() {\n  const btn = $(\"#themeBtn\"), modes = [\"system\", \"light\", \"dark\"], icons = { system: \"monitor\", light: \"sun\", dark: \"moon\" };\n  let mode = \"system\";\n  try { mode = localStorage.getItem(\"everlit-theme\") || \"system\"; } catch (_) {}\n  const apply = () => {\n    if (mode === \"system\") document.documentElement.removeAttribute(\"data-theme\");\n    else document.documentElement.setAttribute(\"data-theme\", mode);\n    btn.innerHTML = ic(icons[mode]); btn.setAttribute(\"aria-label\", `Theme: ${mode}. Click to change`);\n    btn.dataset.tip = `Theme: ${mode}`;\n  };\n  apply();\n  btn.addEventListener(\"click\", () => {\n    mode = modes[(modes.indexOf(mode) + 1) % 3];\n    try { localStorage.setItem(\"everlit-theme\", mode); } catch (_) {}\n    apply();\n    if (window.parent !== window) window.parent.postMessage({ everlit: \"theme\", mode }, \"*\");\n  });\n  addEventListener(\"everlit:theme\", e => { mode = e.detail.mode; apply(); });\n  try { if (localStorage.getItem(\"everlit-roadmap\") === \"on\") document.documentElement.dataset.roadmap = \"on\"; } catch (_) {}\n}\nfunction initNav() {\n  const nav = $(\"#nav\");\n  const onScroll = () => nav.classList.toggle(\"scrolled\", scrollY > 8);\n  addEventListener(\"scroll\", onScroll, { passive: true }); onScroll();\n  const links = $$(\".nav-links a\");\n  const map = new Map(links.map(a => [a.getAttribute(\"href\").slice(1), a]));\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(en => {\n      if (en.isIntersecting) { links.forEach(a => a.removeAttribute(\"aria-current\")); const a = map.get(en.target.id); if (a) a.setAttribute(\"aria-current\", \"true\"); }\n    });\n  }, { rootMargin: \"-45% 0px -50% 0px\" });\n  $$(\"main section[id]\").forEach(s => io.observe(s));\n}\nfunction initReveal() {\n  const els = $$(\".reveal\");\n  if (!(\"IntersectionObserver\" in window)) { els.forEach(e => e.classList.add(\"in\")); return; }\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add(\"in\"); io.unobserve(en.target); } });\n  }, { rootMargin: \"0px 0px -60px 0px\" });\n  els.forEach(e => io.observe(e));\n}\n/* start the agent run / comparison re-rank once, when they first scroll into view */\nfunction initAutoplay() {\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(en => {\n      if (!en.isIntersecting) return;\n      if (en.target.id === \"squad\" && !SIM.started) { reduceMotion ? skipSim() : playSim(); }\n      if (en.target.id === \"cmpList\" && !cmpAutoPlayed && !reduceMotion) {\n        cmpAutoPlayed = true;\n        setTimeout(() => { if (cmpBy === \"cvss\") { setRadio(\"rank\", \"everlit\"); cmpBy = \"everlit\"; reorderCompare(); } }, 900);\n      }\n      io.unobserve(en.target);\n    });\n  }, { threshold: 0.35 });\n  io.observe($(\"#squad\")); io.observe($(\"#cmpList\"));\n}\n\n/* ================================================================ self-checks (mirror src/lib/__tests__/scoring) */\nfunction selfCheck() {\n  const base = { cvssScore: 9.8, epss: 0.02, kev: false, reachable: true, reachabilityKnown: true, internetFacing: true, criticalityTier: \"critical\" };\n  const rt = computePriorityScore({ ...base, dependencyScope: \"direct-runtime\" });\n  const dv = computePriorityScore({ ...base, dependencyScope: \"direct-dev\" });\n  const tool = computePriorityScore({ ...base, epss: 0.003, internetFacing: false, criticalityTier: \"low\", dependencyScope: \"direct-runtime\" });\n  const l4s = computePriorityScore(toInput(PRESETS[0].p));\n  console.assert(rt.severityNormalized === \"critical\", \"9.8 runtime on a critical internet-facing repo should be critical\", rt);\n  console.assert(dv.severityNormalized === \"medium\", \"same vuln in a dev dependency should be medium\", dv);\n  console.assert(tool.severityNormalized === \"medium\", \"same CVE in an internal low-tier tool should be medium\", tool);\n  console.assert(posToEpss(epssToPos(1.2)) === 1.2 && epssToPos(1) === 50, \"EPSS slider round-trips\");\n  console.assert(l4s.priorityScore === 100, \"Log4Shell should score 100\", l4s);\n  console.assert(decidePolicy(100, DEFAULT_RULES).action === \"auto_pr\", \"100 → auto_pr\");\n  console.assert(slaDaysFor(\"high\", true, DEFAULT_SLA_DAYS) === 7, \"KEV tightens a high SLA to 7\");\n  console.assert(!roleCan(\"developer\", \"approveSuppression\"), \"developer can't approve exceptions\");\n  console.assert(!canDo(\"sdlc_agent\", \"mergeFixPr\"), \"agent can't merge its own PR\");\n  console.info(\"Everlit microsite self-check complete:\", { runtime: rt.priorityScore, dev: dv.priorityScore, log4shell: l4s.priorityScore });\n}\n\n/* ================================================================ boot */\nhydrateIcons();\ninitTheme();\ninitSegs();\nrenderHero();\ninitLifecycle();\ninitPlayground();\ninitCompare();\ninitAgents();\ninitVerify();\nrenderPersonas();\nrenderSources();\nhydrateIcons();\ninitNav();\ninitReveal();\ninitAutoplay();\ninitAbbr();\nselfCheck();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

e1;font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:10px 12px;max-height:240px;overflow:auto}\n.console div{display:grid;grid-template-columns:64px 1fr;gap:8px}\n.console div:last-child{animation:rv 180ms var(--ease-out-strong)}\n.console .w{color:#94a3b8}\n.console .ok{color:#86efac}.console .err{color:#fda4af}.console .warn{color:#fcd34d}.console .dim{color:#64748b}\n\n/* toasts */\n.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}\n.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#0f172a;color:#f8fafc;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:tin 220ms var(--ease-out-strong);pointer-events:auto;max-width:min(92vw,520px)}\n.toast .i{color:#34d399}\n.toast.err .i{color:#fb7185}\n.toast.out{opacity:0;transform:translateY(6px);transition:opacity 160ms ease,transform 160ms ease}\n@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}\n\n/* login */\n.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--background)}\n.login .box2{width:100%;max-width:384px}\n.login .lh{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:24px}\n.login .lh > .i{width:36px;height:36px;color:var(--indigo)}\n.login .lh h1{font-size:18px;font-weight:600}\n.persona{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;border:1px solid var(--border);background:var(--surface)}\n.persona:hover{border-color:#a5b4fc;background:var(--indigo-soft)}\n.persona .who{flex:1;min-width:0}\n.persona .who b{display:block;font-size:13px;font-weight:600}\n.persona .who span{display:block;font-size:12px;color:var(--muted)}\n.plist > * + *{margin-top:6px}\n\n/* guide */\n.gbtn{position:fixed;right:16px;bottom:16px;z-index:70;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:#0f172a;color:#fff;font-size:13px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}\n:root[data-theme=\"dark\"] .gbtn{background:#e2e8f0;color:#0f172a}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .gbtn{background:#e2e8f0;color:#0f172a}}\n.gpanel{position:fixed;right:16px;bottom:16px;z-index:70;width:min(380px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 100px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px -20px rgba(15,23,42,.45);transform-origin:100% 100%;animation:pop 180ms var(--ease-out-strong)}\n.gpanel .gh{padding:14px 16px;border-bottom:1px solid var(--border)}\n.gpanel .gh b{font-size:14px}\n.gpanel .gb{overflow-y:auto;padding:8px}\n.story{border-radius:10px;padding:10px}\n.story + .story{margin-top:2px}\n.story:hover{background:var(--subtle)}\n.story .st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}\n.story .st .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo-text);font-size:11px;flex:none}\n.story .sd2{margin:4px 0 0 28px;font-size:12px;color:var(--muted)}\n.story .sa{margin:8px 0 0 28px;display:flex;flex-wrap:wrap;gap:6px}\n.gpanel .gf{border-top:1px solid var(--border);padding:12px 16px;display:grid;gap:10px;font-size:12px}\n.tour{animation:tour 1.6s var(--ease-out-strong) 2}\n@keyframes tour{0%{box-shadow:0 0 0 0 rgba(99,102,241,.55)}100%{box-shadow:0 0 0 12px rgba(99,102,241,0)}}\n\n/* roadmap badges: hidden unless the viewer turns them on */\n:root .rm-badge{display:none;align-items:center;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px dashed var(--violet-tx);color:var(--violet-tx);background:var(--violet-bg);font-size:10.5px;font-weight:600;letter-spacing:.02em;line-height:1.5;vertical-align:2px;white-space:nowrap;text-transform:none}\n:root[data-roadmap=\"on\"] .rm-badge{display:inline-flex}\n\n/* noise-reduction funnel */\n.funnel{display:grid;gap:10px}\n.fn-row{display:grid;grid-template-columns:minmax(0,220px) 1fr 48px;align-items:center;gap:12px}\n.fn-row .fl2{font-size:13px;font-weight:500}\n.fn-row .fl2 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}\n.fn-bar{height:28px;border-radius:6px;background:var(--track);overflow:hidden}\n.fn-bar i{display:block;height:100%;border-radius:6px;background:var(--indigo-bar);transition:width 400ms var(--ease-out-strong)}\n.fn-row:nth-child(2) .fn-bar i{background:#f97316}\n.fn-row:nth-child(3) .fn-bar i{background:#e11d48}\n.fn-row .n{font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}\n.fn-note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}\n@media (max-width:640px){.fn-row{grid-template-columns:1fr 40px}.fn-row .fn-bar{grid-column:1 / -1;grid-row:2}}\n\n/* self-running tour */\n.tring{position:fixed;z-index:80;pointer-events:none;border-radius:12px;box-shadow:0 0 0 3px var(--indigo-bar),0 0 0 9999px rgba(15,23,42,.28);transition:top 300ms var(--ease-out-strong),left 300ms var(--ease-out-strong),width 300ms var(--ease-out-strong),height 300ms var(--ease-out-strong)}\n.tcap{position:fixed;z-index:81;left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px -20px rgba(15,23,42,.5);padding:14px 16px 12px;animation:pop 200ms var(--ease-out-strong)}\n.tcap .tk{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo-text)}\n.tcap h4{margin:6px 0 0;font-size:15px;font-weight:600}\n.tcap p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5}\n.tcap .tprog{height:3px;border-radius:3px;background:var(--track);margin-top:12px;overflow:hidden}\n.tcap .tprog i{display:block;height:100%;width:0;background:var(--indigo-bar)}\n.tcap .tprog i.run{animation:tprog linear forwards}\n.tcap.paused .tprog i{animation-play-state:paused}\n@keyframes tprog{from{width:0}to{width:100%}}\n.tcap .tb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}\n.tcap .tdots{display:flex;gap:4px}\n.tcap .tdots span{width:6px;height:6px;border-radius:50%;background:var(--border)}\n.tcap .tdots span.on{background:var(--indigo-bar)}\n.sso-or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}\n.sso-or::before,.sso-or::after{content:\"\";flex:1;height:1px;background:var(--border)}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}\n  button:active,.press:active{transform:none !important}\n}\n@media print{.sidebar,.topbar,.gbtn,.gpanel,.toasts,.tring,.tcap{display:none !important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cdiv class=\"toasts\" id=\"toasts\" aria-live=\"polite\">\u003c/div>\n\u003cdiv id=\"guide\">\u003c/div>\n\u003cdiv id=\"tour\">\u003c/div>\n\n\u003cscript>\n/*\n * Everlit — offline product microsite (single file, no network).\n * UI mirrors src/components (AppShell, Sidebar, Badge, Card, RemediationPanel, PrGateSimulator) and the pages under src/app.\n * Logic mirrored from src/lib — keep in sync:\n *   scoring.ts (computePriorityScore) · types.ts (severityFromScore, cvssToSeverity, EXCEPTION_MAX_DAYS)\n *   policy.ts (decidePolicy) + prisma/seed.ts (default rules, users, repos, manifests)\n *   sla.ts (slaDaysFor) · access.ts (PAGE_ROLES, ACTION_ROLES) · remediation.ts (classifyBump, targetVersionFor, manual reasons)\n *   reconcile.ts (auto-close / reopen rules)\n * Advisory data is a curated sample of e = findings that came back ÷ findings closed.\") +\n        `\u003cdiv class=\"grid g2\" style=\"gap:12px 20px\">${[[\"Fix PRs opened\", String(om.prs)], [\"CI pass rate\", om.ciPass == null ? \"No data yet\" : `${om.ciPass}% (${om.ciKnown} branch${om.ciKnown === 1 ? \"\" : \"es\"})`], [\"PR merge rate\", om.mergeRate == null ? \"No data yet\" : `${om.mergeRate}% (${om.merged} of ${om.prs})`], [\"Median days to verified fix\", om.median == null ? \"No data yet\" : `${om.median.toFixed(0)} days (${om.verified} fix${om.verified === 1 ? \"\" : \"es\"})`], [\"Reopen rate\", `${om.reopenRate}%`], [\"Auto-remediation\", autoRate == null ? \"No data yet\" : `${autoRate}% of eligible`]].map(([l, v]) => `\u003cdiv>\u003cp class=\"xs muted\">${l}\u003c/p>\u003cp class=\"fw6\">${v}\u003c/p>\u003c/div>`).join(\"\")}\u003c/div>`, \"span2\", \"outcomes\")}\n      ${card(ch(\"Weekly digest\", \"Sent to team leads every Monday\", `\u003cspan class=\"ai-tag\">${ic(\"sparkles\", \"i-sm\")} AI summary\u003c/span>`) +\n        `\u003cp class=\"sm\">${total ? `${st0.week} finding${st0.week === 1 ? \"\" : \"s\"} need${st0.week === 1 ? \"s\" : \"\"} fixing this week${kevNames.length ? `, led by ${kevNames.length} known-exploited (${esc(kevNames.slice(0, 2).join(\", \"))}${kevNames.length > 2 ? \"…\" : \"\"})` : \"\"}. ${overdue.length} ${overdue.length === 1 ? \"is\" : \"are\"} past deadline.` : \"Nothing open this week.\"}${plan[0] ? ` The biggest single win is ${esc(plan[0].pkg.split(\":\").pop())} → ${esc(plan[0].target)}, which clears ${plan[0].n} finding${plan[0].n === 1 ? \"\" : \"s\"} across ${plan[0].changes} repo${plan[0].changes === 1 ? \"\" : \"s\"}.` : \"\"}${nextExp ? ` Next exception to expire: ${esc((S.findings.find(x => x.id === nextExp.findingId) || {}).title || \"an exception\")} in ${daysUntil(nextExp.expiresAt)} days.` : \"\"}\u003c/p>\u003cp class=\"xs muted mt2\">Written from the numbers on this page only; every figure links back to its source view.\u003c/p>`)}\n s Everlit's 0-100 score (CVSS, exploitability from EPSS and CISA KEV, import evidence, exposure, criticality; dev-only dependencies scaled down), bucketed. It is not the CVSS severity — each finding shows both.\") +\n        `\u003cdiv class=\"stack-sm\">${[\"critical\", \"high\", \"medium\", \"low\"].map(prioRow).join(\"\")}\u003c/div>`, \"span2\")}\n      ${card(ch(\"Exceptions\", `${active.length} active · ${pending.length} awaiting approval`, roleCanSee(u.role, \"suppressions\") ? `\u003ca href=\"#/suppressions\" class=\"link xs\">Manage →\u003c/a>` : \"\") +\n        (active.length ? `\u003cul class=\"stack-sm\">${active.slice(0, 5).map(s => { const f = S.findings.find(x => x.id === s.findingId); const t = f ? f.title : s.advisory ? s.advisory.title : \"\"; const d = daysUntil(s.expiresAt); return `\u003cli class=\"row between sm\">\u003cspan style=\"min-width:0\">\u003cspan class=\"trunc\" style=\"display:block\">${canF && f ? `\u003ca class=\"flink\" href=\"#/findings/${f.id}\">${esc(t)}\u003c/a>` : esc(t)}\u003c/span>\u003cspan class=\"xs muted trunc\" style=\"display:block\">${esc(repoById(s.repoId).name)} · approved by ${esc(userName(s.approver))}\u003c/span>\u003c/span>${pill(`${d}d left`, d \u003c 7 ? \"rose\" : \"amber\")}\u003c/li>`; }).join(\"\")}\u003c/ul>` : `\u003cp class=\"sm muted\">No active exceptions.\u003c/p>`))}\n    \u003c/div>\n    \u003cdiv class=\"lg3\">\n      ${card(ch(\"Repos needing attention\", \"Known-exploited, overdue and critical/high-priority findings — follow up with the owning team from here\", \"\", \"Ranked by known-exploited count, then overdue, then critical, then high.\") +\n        (attention.length ? `\u003cul class=\"divide\">${attention.map(x => `\u003cli class=\"row between\" style=\"padding:10px 0;gap:12px\">\u003cdiv style=\"min-width:0\">${roleCanSee(u.role, \"repos\") ? `\u003ca class=\"flink\" href=\"#/repos/${x.r.id}\">${esc(x.r.name)}\u003c/a>` : `\u003cspan class=\"fw5\">${esc(x.r.name)}\u003c/span>`}\u003cp i>\n          \u003cli class=\"row between\">\u003cspan class=\"muted\">PR checks pending over 15 min\u003c/span>${wk.stale ? pill(`${wk.stale} · security alerted`, \"rose\") : pill(\"0\", \"emerald\")}\u003c/li>\n          \u003cli class=\"row between\">\u003cspan class=\"muted\">Credential encryption\u003c/span>${pill(`key ${esc(S.keyRing.active)} · rotated ${fmtDate(S.keyRing.rotatedAt)}`, \"emerald\")}\u003c/li>\n        \u003c/ul>\n        ${wk.down ? `\u003cdiv class=\"callout c-rose mt3\">\u003cp class=\"h\">The worker stopped reporting\u003c/p>\u003cp class=\"s\">3 jobs are waiting and customer-portal PR #${prOf(S.repos[1])} has shown \"pending\" for over 15 minutes. Security was alerted; the check stays pending rather than turning green.\u003c/p>\u003c/div>` : \"\"}\n        ${wk.failed.length && can(\"retryJobs\") ? `\u003cdiv class=\"mt3\">\u003cp class=\"fl\" style=\"margin-bottom:6px\">Failed jobs\u003c/p>\u003cul class=\"stack-sm\">${wk.failed.map(j => `\u003cli class=\"box row between wrap\" style=\"gap:8px\">\u003cspan style=\"min-width:0\">\u003cspan class=\"fw5\">${esc(j.queue)} · ${esc(repoById(j.repoId)?.name || \"\")}\u003c/span>\u003cspan class=\"xs muted\" style=\"display:block\">${esc(j.error)} · ${fmtDT(j.at)}\u003c/span>\u003c/span>\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"job-retry\" data-id=\"${j.id}\">${ic(\"refresh\", \"i-sm\")} Retry\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>` : \"\"}${roleCanSee(u.role, \"integrations\") ? `\u003ca href=\"#/integrations\" class=\"link xs mt3\" style=\"display:inline-block\">Manage integrations →\u003c/a>` : \"\"}`) : \"\"}\n    \u003c/div>\n    ${show.ops ? card(ch(\"Vulnerability intelligence\", \"Every finding is matched and enriched against public, industry-standard sources\", `\u003ca href=\"#/intel\" class=\"link xs\">How we source data →\u003c/a>`) +\n      `\u003cdiv class=\"feeds\">${INTEL.filter(x => x.feed).map(x => { const st = feedStatus(x); return `\u003ca class=\"feed\" href=\"#/intel\">\u003cspan class=\"row\" style=\"gap:8px\">${ic(x.icon, \"i-sm\")}\u003cspan class=\"fw5 sm\">${esc(x.short)}\u003c/span>\u003c/span>\u003cspan class=\"row xs\" style=\"gap:6px\">\u003cspan class=\"dot ${st.ok ? \"ok\" : \"warn\"}\">\u003c/span>${esc(st.label)}\u003c/span>\u003c/a>`; }).join(\"\")}\u003c/div>`) : \"\"}\n    ${show.ops ? card(ch(\"Recent scan runs\", \"Ingestion → detection → normalization → scoring → policy\") + scanTable(scans, false)) : \"\"}\n  \u003c/div>`;\n}\n/* noise-reduction funnel: open findings → what policy says to act on → what to fix this week */\nfunction funnelStages(open) {\n  const act = open.filter(o => o.c.action === \"auto_pr\" || o.c.action === \"pr_review\");\n  const week = act.filter(o => o.c.sev === \"critical\" || o.f.kev || (o.c.due - Date.now()) / D \u003c 7);\n  // the same number of findings picked by CVSS alone: how many can wait, how many urgent ones it misses\n  const byCvss = open.slice().sort((a, b) => (b.f.cvss ?? 0) - (a.f.cvss ?? 0)).slice(0, week.length);\n  const canWait = byCvss.filter(o => !week.includes(o)).length, missed = week.filter(o => !byCvss.includes(o)).length;\n  return { total: open.length, act: act.length, week: week.length, canWait, missed };\n}\nfunction funnelCard(open, canF, team) {\n  const st = funnelStages(open), pct = n => st.total ? Math.max(2, Math.round((n / st.total) * 100)) : 0;\n  const row = (label, sub, n, href) => { const inner = `\u003cspan class=\"fl2\">${label}\u003csmall>${sub}\u003c/small>\u003c/span>\u003cspan class=\"fn-bar\">\u003ci style=\"width:${pct(n)}%\">\u003c/i>\u003c/span>\u003cspan class=\"n\">${n}\u003c/span>`; return canF && href ? `\u003ca class=\"fn-row\" href=\"${href}\" style=\"text-decoration:none;color:inherit\">${inner}\u003c/a>` : `\u003cdiv class=\"fn-row\">${inner}\u003c/div>`; };\n  return card(ch(\"From alerts to action\", `How Everlit narrows ${team ? \"the team's\" : \"every\"} open finding down to the work that matters this week`, \"\", \"Act on = the policy action is auto-fix PR or PR review (priority 60 or higher). Fix this week = of those, critical priority, known exploited, or due within 7 days.\") +\n    `\u003cdiv class=\"funnel\">${row(\"Open findings\", \"everything the scanners report\", st.total, \"#/findings\")}${row(\"Policy says act\", \"priority 60+ · fix PR or review\", st.act, \"#/findings?severity=high\")}${row(\"Fix this week\", \"critical, known exploited, or due in 7 days\", st.week, \"#/findings?due=week\")}\u003c/div>\n    \u003cp class=\"fn-note\">${ic(\"gauge\", \"i-sm\")}\u003cspan>${st.week ? `If this week's ${st.week} were picked by CVSS alone, \u003cb>${st.canWait}\u003c/b> of them would be findings that can wait, and \u003cb>${st.missed}\u003c/b> that can't (known exploited, overdue or critical here) would be left out.` : \"Nothing needs fixing this week.\"} Priority adds exploit evidence, import evidence, exposure and criticality to severity.\u003c/span>\u003c/p>`, \"\", \"funnel\");\n}\nfunction scanTable(scans, full) {\n  return `\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Repo\u003c/th>\u003cth>Type\u003c/th>${full ? \"\u003cth>Trigger\u003c/th>\u003cth>Actor\u003c/th>\" : \"\"}\u003cth>Status\u003c/th>\u003cth>Coverage\u003c/th>\u003cth>Findings\u003c/th>\u003cth>Started\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${scans.map(s => `\u003ctr>\u003ctd class=\"fw5\">${esc(repoById(s.repoId)?.name || \"—\")}\u003c/td>\u003ctd class=\"muted\">${s.type === \"pr_gate\" ? `PR gate${s.verdict ? ` · ${esc(s.verdict.replace(/_/g, \" \"))}` : \"\"}` : \"Baseline\"}\u003c/td>${full ? `\u003ctd class=\"muted\">${esc(s.trigger)}\u003c/td>\u003ctd class=\"muted\">${esc(userName(s.actor))}\u003c/td>` : \"\"}\u003ctd>${pill(s.status, scanTone(s.status), s.reason || \"\")}\u003c/td>\u003ctd>${s.coverage ? pill(`${covPct(s.coverage)}%`, covPct(s.coverage) === 100 ? \"emerald\" : \"amber\", `${s.coverage.checked} of ${s.coverage.deps} dependencies checked · ${s.coverage.manifests.length} manifest${s.coverage.manifests.length === 1 ? \"\" : \"s\"}`) : `\u003cspan class=\"xs muted\">—\u003c/span>`}\u003c/td>\u003ctd>${s.findingCount} \u003cspan class=\"muted\">(${s.newFindingCount} new${s.closedCount ? `, ${s.closedCount} closed` : \"\"})\u003c/span>\u003c/td>\u003ctd class=\"muted\">${fmtDT(s.startedAt)}\u003c/td>\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"8\" class=\"empty\">No scans yet. Onboard a repo to get started.\u003c/td>\u003c/tr>`}\n  \u003c/tbody>\u003c/table>\u003c/div>`;\n}\n\n/* ================================================================ findings list (src/app/findings/page.tsx) */\nfunction viewFindings(q) {\n  const u = me();\n  const status = q.get(\"status\") || \"open\", view = q.get(\"view\") === \"packages\" ? \"packages\" : \"list\";\n  const repos = visibleRepos();\n  const team = q.has(\"team\") ? q.get(\"team\") : (u.role === \"engineering_manager\" && u.team ? u.team : \"\");\n  let rows = visibleFindings().map(f => ({ f, c: calc(f), r: repoById(f.repoId) }));\n  const term = (q.get(\"q\") || \"\").toLowerCase();\n  const now = Date.now();\n  rows = rows.filter(({ f, c, r }) =>\n    (status === \"all\" || f.status === status) &&\n    (!q.get(\"severity\") || c.sev === q.get(\"severity\")) &&\n    (!team || r.owningTeam === team) &&\n    (!q.get(\"repoId\") || r.id === q.get(\"repoId\")) &&\n    (!q.get(\"kev\") || f.kev) &&\n    (!q.get(\"reachable\") || String(f.reachable) === q.get(\"reachable\")) &&\n    (q.get(\"assignee\") !== \"me\" || f.assignee === u.email) && (q.get(\"assignee\") !== \"none\" || !f.assignee) &&\n    (q.get(\"due\") !== \"overdue\" || (f.status === \"open\" && c.due \u003c now)) &&\n    (q.get(\"due\") !== \"week\" || (f.status === \"open\" && (c.due - now) / D >= 0 && (c.due - now) / D \u003c 7)) &&\n    (!term || `${f.pkg} ${f.cve} ${f.title}`.toLowerCase().includes(term)));\n  rows.sort((a, b) => (b.f.kev - a.f.kev) || (b.c.score - a.c.score) || a.f.firstSeen.localeCompare(b.f.firstSeen));\n  const teams = [...new Set(S.repos.map(r => r.owningTeam))];\n  const sel = (name, label, val, opts) => `\u003cdiv>\u003clabel class=\"fl\">${label}\u003c/label>\u003cselect class=\"sel\" data-filter=\"${name}\">${opts.map(([v, l]) => `\u003coption value=\"${esc(v)}\" ${v === val ? \"selected\" : \"\"}>${esc(l)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>`;\n  const lv = view === \"list\";\n  return `\u003cdiv class=\"stack\">\n    \u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Findings\u003c/h1>\u003cp class=\"sub\">${isTeamScoped(u.role) ? `Findings in ${esc(u.team)}'s repos. ` : \"\"}${u.role === \"engineering_manager\" && !q.has(\"team\") ? `Showing ${esc(u.team)} — pick \"All teams\" to see everyone. ` : \"\"}Sorted by Everlit priority. Each row shows both the priority and the vulnerability's own CVSS severity.\u003c/p>\u003c/div>\n      \u003cdiv class=\"row wrap\">${can(\"exportFindings\") ? `\u003cbutton class=\"btn btn-outline\" data-act=\"export-findings\">${ic(\"download\")} Export CSV\u003c/button>` : \"\"}\n      \u003cdiv class=\"seg\">\u003cbutton class=\"${lv ? \"on\" : \"\"}\" data-filter-set=\"view=\">By finding\u003c/button>\u003cbutton class=\"${lv ? \"\" : \"on\"}\" data-filter-set=\"view=packages\">By package\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"filters\">\n        \u003cdiv>\u003clabel class=\"fl\">Search\u003c/label>\u003cinput class=\"inp\" style=\"width:224px\" data-filter=\"q\" placeholder=\"package, CVE, title\" value=\"${esc(q.get(\"q\") || \"\")}\">\u003c/div>\n        ${sel(\"status\", \"Status\", status, [[\"open\", \"Open\"], [\"suppressed\", \"Suppressed\"], [\"fixed\", \"Fixed\"], [\"accepted_risk\", \"Accepted risk\"], [\"false_positive\", \"False positive\"], [\"all\", \"All\"]])}\n        ${sel(\"severity\", \"Priority\", q.get(\"severity\") || \"\", [[\"\", \"All\"], [\"critical\", \"Critical\"], [\"high\", \"High\"], [\"medium\", \"Medium\"], [\"low\", \"Low\"]])}\n        ${!isTeamScoped(u.role) ? sel(\"team\", \"Team\", team, [[\"\", \"All teams\"], ...teams.map(t => [t, t])]) : \"\"}\n        ${sel(\"repoId\", \"Repo\", q.get(\"repoId\") || \"\", [[\"\", \"All repos\"], ...repos.map(r => [r.id, r.name])])}\n        ${sel(\"due\", \"Deadline\", q.get(\"due\") || \"\", [[\"\", \"Any\"], [\"overdue\", \"Overdue\"], [\"week\", \"Due within 7 days\"]])}\n        ${sel(\"kev\", \"Exploited\", q.get(\"kev\") || \"\", [[\"\", \"Any\"], [\"true\", \"Known exploited (KEV)\"]])}\n        ${sel(\"assignee\", \"Assignee\", q.get(\"assignee\") || \"\", [[\"\", \"Anyone\"], [\"me\", \"Assigned to me\"], [\"none\", \"Unassigned\"]])}\n        ${sel(\"reachable\", \"Import evidence\", q.get(\"reachable\") || \"\", [[\"\", \"All\"], [\"true\", \"Import found\"], [\"false\", \"None found\"]])}\n        \u003ca href=\"#/findings${view === \"packages\" ? \"?view=packages\" : \"\"}\" class=\"sm fw5 muted\" style=\"padding-bottom:8px\">Reset\u003c/a>\n      \u003c/div>\n      ${lv ? findingRows(rows) : packageRows(rows)}\n    \u003c/div>\u003c/div>`;\n}\nfunction fixPill(f, refs, run) {\n  if (f.status !== \"open\") return \"\";\n  if (refs.cancelled) return pill(\"fix cancelled\", \"neutral\", refs.cancelled.reason || \"\");\n  if (refs.closedUnmerged) return pill(\"PR closed unmerged\", \"amber\", refs.closedUnmerged.note || \"\");\n  if (refs.ciStatus === \"no_ci\") return pill(\"no CI reported\", \"amber\", \"No CI result after 7 days: open the PR by hand\");\n  if (refs.prNumber && !refs.merged) return pill(refs.by === \"agent\" ? \"agent PR open\" : \"fix PR open\", \"blue\");\n  if (refs.branchName && !refs.complexReason && !refs.prNumber) return pill(\"fix branch · awaiting CI\", \"blue\");\n  if (refs.complexReason && !(run && run.status === \"running\")) return pill(\"complex fix\", \"violet\");\n  return \"\";\n}\nfunction findingRows(rows) {\n  return `\u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Severity\u003c/th>\u003cth>Finding\u003c/th>\u003cth>Repo\u003c/th>\u003cth>Status\u003c/th>\u003cth>Deadline\u003c/th>\u003cth>First seen\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${rows.map(({ f, c, r }) => { const run = agentRunFor(f); const refs = f.refs || {}; return `\u003ctr class=\"hov\">\u003ctd>${priorityBadge(c.sev, c.score)}\u003c/td>\u003ctd>${cvssBadge(f.cvss)}\u003c/td>\n      \u003ctd>\u003ca class=\"flink\" href=\"#/findings/${f.id}\">${esc(f.title)}\u003c/a>\u003cp class=\"meta\">\u003cspan>${esc(f.pkg)}@${esc(f.version)} · ${esc(f.cve)}\u003c/span>${f.kev ? kevBadge() : \"\"}${f.scope.startsWith(\"transitive\") ? pill(\"transitive\") : \"\"}${f.scope.endsWith(\"-dev\") ? pill(\"dev only\") : \"\"}${f.assignee ? pill(\"assigned: \" + esc(userName(f.assignee).split(\" · \")[0]), \"neutral\", esc(userName(f.assignee))) : \"\"}${f.reachable ? pill(\"import found\", \"rose\", f.evidence || \"\") : \"\"}${fixPill(f, refs, run)}${refs.merged && f.status === \"open\" ? pill(\"fix merged · awaiting rescan\", \"emerald\") : \"\"}${refs.ciFailed && f.status === \"open\" ? pill(\"fix CI failed\", \"rose\") : \"\"}${run && run.status === \"running\" ? pill(\"agents working\", \"violet\") : \"\"}\u003c/p>\u003c/td>\n      \u003ctd class=\"muted\">${esc(r.name)}\u003c/td>\u003ctd>${statusBadge(f.status)}\u003c/td>\u003ctd>${dueBadge(c.due, f.status)}\u003c/td>\u003ctd class=\"muted\">${fmtDate(f.firstSeen)}\u003c/td>\u003c/tr>`; }).join(\"\") || `\u003ctr>\u003ctd colspan=\"7\" class=\"empty\">No findings match these filters.\u003c/td>\u003c/tr>`}\n  \u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"tfoot\">\u003cspan>${rows.length ? `1–${rows.length} of ${rows.length}` : \"0 findings\"}\u003c/span>\u003cspan>\u003c/span>\u003c/div>`;\n}\nfunction packageRows(rows) {\n  const g = new Map();\n  rows.forEach(({ f, c }) => { const x = g.get(f.pkg) || { name: f.pkg, n: 0, repos: new Set(), versions: new Set(), max: -1, bucket: \"low\", fixes: [] }; x.n++; x.repos.add(f.repoId); x.versions.add(f.version); if (c.score > x.max) { x.max = c.score; x.bucket = c.sev; } if (f.fixed) x.fixes.push(f.fixed); g.set(f.pkg, x); });\n  const list = [...g.values()].sort((a, b) => b.max - a.max || b.n - a.n);\n  return `\u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>Package\u003c/th>\u003cth>Top priority\u003c/th>\u003cth>Findings\u003c/th>\u003cth>Repos\u003c/th>\u003cth>Versions affected\u003c/th>\u003cth>Upgrade to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${list.map(x => { const t = x.fixes.sort(cmpVer).at(-1); return `\u003ctr class=\"hov\">\u003ctd>\u003ca class=\"flink\" href=\"#/findings?q=${encodeURIComponent(x.name)}\">${esc(x.name)}\u003c/a>\u003c/td>\u003ctd>${priorityBadge(x.bucket, x.max)}\u003c/td>\u003ctd>${x.n}\u003c/td>\u003ctd>${x.repos.size}\u003c/td>\u003ctd class=\"xs muted\">${[...x.versions].sort(cmpVer).join(\", \")}\u003c/td>\u003ctd class=\"xs\">${t ? `\u003cspan class=\"fw5\" style=\"color:var(--emerald-tx)\">≥ ${esc(t)}\u003c/span>` : `\u003cspan class=\"muted\">no fix published\u003c/span>`}\u003c/td>\u003c/tr>`; }).join(\"\") || `\u003ctr>\u003ctd colspan=\"6\" class=\"empty\">No findings match these filters.\u003c/td>\u003c/tr>`}\n  \u003c/tbody>\u003c/table>\u003c/div>`;\n}\n\n/* ================================================================ finding detail (src/app/findings/[id]/page.tsx) */\nlet inlineForm = null; // \"exception\" | \"fixed\"\nfunction viewFinding(id) {\n  const f = visibleFindings().find(x => x.id === id);\n  if (!f) return `\u003cdiv class=\"card pad\">\u003cp class=\"fw6\">Finding not found\u003c/p>\u003cp class=\"sm muted mt1\">It doesn't exist, or it belongs to a repo your role can't see.\u003c/p>\u003ca class=\"link sm mt3\" style=\"display:inline-block\" href=\"#/findings\">← Back to findings\u003c/a>\u003c/div>`;\n  const r = repoById(f.repoId), c = calc(f), u = me();\n  const sup = f.suppressionId ? S.suppressions.find(s => s.id === f.suppressionId) : null;\n  const pendingSup = sup && sup.status === \"pending\" ? sup : null;\n  const canReview = pendingSup && can(\"approveSuppression\") && pendingSup.requestedBy !== u.email;\n  const k = c.comps, prov = scoreProvenance(f, c);\n  const assignable = S.users.filter(x => roleCan(x.role, \"assignFinding\") && (x.role !== \"developer\" || x.team === r.owningTeam));\n  return `\u003cdiv class=\"stack\">\n    \u003cdiv>\n      \u003ca class=\"back\" href=\"#/findings\">← Back to findings\u003c/a>\n      \u003cdiv class=\"row wrap mt2\" style=\"gap:12px\">\u003ch1 style=\"font-size:20px;font-weight:600\">${esc(f.title)}\u003c/h1>${priorityBadge(c.sev, c.score)}${cvssBadge(f.cvss)}${f.kev ? kevBadge() : \"\"}${statusBadge(f.status)}${dueBadge(c.due, f.status)}\u003c/div>\n      \u003cp class=\"sm muted mt1\">${esc(f.pkg)}@${esc(f.version)} (${f.scope.replace(/-/g, \" \")}) in ${roleCanSee(u.role, \"repos\") ? `\u003ca class=\"link\" href=\"#/repos/${r.id}\">${esc(r.name)}\u003c/a>` : esc(r.name)}\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"lg3\">\n      \u003cdiv class=\"span2 stack\">\n        ${card(ch(\"Description\") + `\u003cp class=\"sm\">${esc(f.desc)}\u003c/p>\u003cdiv class=\"row wrap mt4\">${pill(esc(f.cve))}\u003ca class=\"link xs\" href=\"https://osv.dev/vulnerability/${encodeURIComponent(f.cve)}\" target=\"_blank\" rel=\"noopener noreferrer\">OSV.dev ↗\u003c/a>\u003ca class=\"link xs\" href=\"https://nvd.nist.gov/vuln/detail/${encodeURIComponent(f.cve)}\" target=\"_blank\" rel=\"noopener noreferrer\">NVD ↗\u003c/a>\u003c/div>`)}\n        ${card(ch(\"Priority score breakdown\", `CVSS ${SCORE_WEIGHTS.cvss} · Exploitability ${SCORE_WEIGHTS.exploit} · Import evidence ${SCORE_WEIGHTS.reachability} · Exposure ${SCORE_WEIGHTS.exposure} · Criticality ${SCORE_WEIGHTS.criticality} · +${KEV_BONUS} if known exploited · ×${DEV_DEPENDENCY_FACTOR} for dev-only dependencies`, \"\", \"Priority is Everlit's own ranking for what to fix first. The CVSS severity badge above is the vulnerability's own rating and is independent of this.\") +\n          `\u003cdiv class=\"row\" style=\"align-items:baseline;margin-bottom:12px\">\u003cspan style=\"font-size:30px;font-weight:700\">${c.score}\u003c/span>\u003cspan class=\"sm muted\">/ 100\u003c/span>\u003cspan class=\"xs muted\" style=\"margin-left:auto\">rule: \"${esc(c.rule)}\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"stack-sm\">\n            ${scoreRow(`CVSS ${f.cvss.toFixed(1)} · advisory rating: ${cvssToSeverity(f.cvss).toUpperCase()}`, k.cvssPoints, SCORE_WEIGHTS.cvss, prov.cvss)}\n            ${scoreRow(f.kev ? \"Known exploited in the wild (CISA KEV): full exploitability points\" : `EPSS ${(f.epss * 100).toFixed(2)}% chance of exploitation in 30 days (band ${epssBand(f.epss).label})`, k.exploitPoints, SCORE_WEIGHTS.exploit, prov.exploit)}\n            ${scoreRow(`Import evidence (${f.reachable ? \"import found in the code\" : f.reachKnown ? \"no import found in the code\" : \"no code sample recorded, scored at the midpoint\"})`, k.reachabilityPoints, SCORE_WEIGHTS.reachability, prov.reach)}\n            ${scoreRow(`Exposure (${r.internetFacing ? \"internet-facing\" : \"internal\"})`, k.exposurePoints, SCORE_WEIGHTS.exposure, prov.declared)}\n            ${scoreRow(`Business criticality (${r.criticalityTier})`, k.criticalityPoints, SCORE_WEIGHTS.criticality, prov.declared)}\n            ${f.kev ? scoreRow(\"Known-exploited bonus\", k.kevBonus, KEV_BONUS, prov.exploit) : \"\"}\n          \u003c/div>\n          \u003cdiv class=\"box mt3 row between wrap\" style=\"gap:8px\">\u003cspan>\u003cb>Confidence: ${prov.confidence}\u003c/b> · ${prov.summary}\u003c/span>\u003cspan class=\"mono\">${prov.math}\u003c/span>\u003c/div>\n          ${k.scopeFactor !== 1 ? `\u003cp class=\"xs muted mt3\">Dev/test-only dependency (${f.scope.replace(/-/g, \" \")}): r\", \"Approved by an account created less than 7 days earlier: shown to compliance for review\")}\u003c/p>` : \"\"}\n          ${canReview ? `\u003cdiv class=\"row\" style=\"margin-bottom:12px\">\u003cbutton class=\"btn btn-emerald btn-xs\" data-act=\"sup-approve\" data-id=\"${sup.id}\">Approve\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"sup-reject\" data-id=\"${sup.id}\">Reject\u003c/button>\u003c/div>` : \"\"}\n          \u003cul class=\"stack-sm\" style=\"border-top:1px solid var(--border);padding-top:12px\">${sup.history.map(h => `\u003cli class=\"xs muted\">\u003cspan class=\"fw5\" style=\"color:var(--foreground)\">${esc(h.action)}\u003c/span> by ${esc(userName(h.actor))} — ${fmtDT(h.at)}${h.note ? ` — ${esc(h.note)}` : \"\"}\u003c/li>`).join(\"\")}\u003c/ul>`) : \"\"}\n        ${investCard(f, r, c)}\n        ${blastCard(f, r)}\n        ${similarCard(f, sup)}\n        ${vexCard(f)}\n      \u003c/div>\n      \u003cdiv class=\"stack\">\n        ${card(ch(\"Disposition\") + `\u003cdl class=\"fields sm\">\n          ${field(\"Status\", statusBadge(f.status))}\n          ${field(\"Policy action\", esc(c.action.replace(/_/g, \" \")) + (c.blocks ? ` \u003cspan class=\"xs muted\">· blocks merge\u003c/span>` : \"\"))}\n          ${field(\"Decided under\", roleCanSee(u.role, \"policy\") ? `\u003ca class=\"link mono\" href=\"#/policy\">policy v${policyV()}\u003c/a>` : `\u003cspan class=\"mono\">policy v${policyV()}\u003c/span>`)}\n          ${field(\"Fix deadline (SLA)\", `\u003cspan class=\"row wrap\">${fmtDT(c.due)} ${dueBadge(c.due, f.status)}\u003c/span>`)}\n          ${field(\"Assignee\", can(\"assignFinding\") && f.status === \"open\" ? `\u003cselect class=\"sel\" data-act-change=\"assign\" data-id=\"${f.id}\" style=\"height:32px;font-size:13px;max-width:100%\">\u003coption value=\"\">Unassigned\u003c/option>${assignable.map(x => `\u003coption value=\"${x.email}\" ${f.assignee === x.email ? \"selected\" : \"\"}>${esc(x.name)}${x.email === u.email ? \" (me)\" : \"\"}\u003c/option>`).join(\"\")}\u003c/select>` : esc(f.assignee ? userName(f.assignee) : \"Unassigned\"))}\n          ${field(\"First seen\", fmtDT(f.firstSeen))}\n          ${field(\"Last seen\", fmtDT(f.lastSeen))}\n          ${field(\"PURL\", `\u003ccode style=\"word-break:break-all\">${esc(purl(r, f))}\u003c/code>`)}\n        \u003c/dl>\n        ${f.status === \"open\" ? `\u003cdiv class=\"row wrap mt4\">${pendingSup ? `\u003cp class=\"xs\" style=\"color:#d97706\">${EXCEPTION_LABELS[pendingSup.kind]} requested by ${esc(userName(pendingSup.requestedBy))} — waiting for a different security reviewer.\u003c/p>` : can(\"requestSuppression\") ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"inline\" data-f=\"exception\">Request exception…\u003c/button>` : \"\"}${can(\"markFixed\") ? `\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"inline\" data-f=\"fixed\">Mark fixed…\u003c/button>` : \"\"}\u003c/div>` : \"\"}\n        ${inlineForm === \"exception\" && f.status === \"open\" && !pendingSup ? exceptionForm(f) : \"\"}\n        ${inlineForm === \"fixed\" && f.status === \"open\" ? `\u003cform class=\"reveal mt3 stack-sm box\" data-submit=\"mark-fixed\" data-id=\"${f.id}\">\u003clabel class=\"fl\">Note (what changed?)\u003c/label>\u003ctextarea class=\"ta\" name=\"note\" rows=\"2\" style=\"font-family:var(--sans);font-size:13px\" placeholder=\"e.g. upgraded in commit abc123\" required>\u003c/textarea>\u003cdiv class=\"row\">\u003cbutton class=\"btn btn-emerald btn-xs\" type=\"submit\">Mark fixed\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" type=\"button\" data-act=\"inline\" data-f=\"\">Cancel\u003c/button>\u003c/div>\u003cp class=\"xs muted\">A rescan reopens it if the vulnerable version is still there.\u003c/p>\u003c/form>` : \"\"}\n        ${f.status !== \"open\" && can(\"reopenFinding\") ? `\u003cdiv class=\"mt4\">\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"reopen\" data-id=\"${f.id}\">${ic(\"undo\" let investOpen = null;\nfunction investigation(f, r, c) {\n  const same = S.findings.filter(x => x.pkg === f.pkg && x.status === \"open\" && x.repoId !== f.repoId);\n  const refs = f.refs || {};\n  const facts = [[`CVSS ${f.cvss.toFixed(1)} (${cvssToSeverity(f.cvss)}) from the advisory`, \"Score breakdown\"],\n    f.kev ? [\"Listed in CISA KEV: exploited in the wild\", \"Sources\"] : [`EPSS ${(f.epss * 100).toFixed(2)}% chance of exploitation in 30 days`, \"Sources\"],\n    f.reachable ? [`Imported in the code sample (${f.evidence})`, \"Evidence\"] : f.reachKnown ? [\"No import of the package found in the code sample\", \"Evidence\"] : null,\n    [`${r.name} is ${r.internetFacing ? \"internet-facing\" : \"internal\"} with ${r.criticalityTier} criticality`, \"Repo settings\"],\n    f.fixed ? [`Fixed upstream in ${f.fixed} (${classifyBump(f.version, f.fixed)} change from ${f.version})`, \"OSV.dev\"] : [\"No fixed version published upstream\", \"OSV.dev\"],\n    same.length ? [`The same package is open in ${new Set(same.map(x => x.repoId)).size} other repo(s)`, \"Blast radius\"] : null].filter(Boolean);\n  const sym = SYMBOLS[f.cve], symLine = sym && r.snippet && r.snippet.split(\"\\n\").find(l => sym[1].test(l));\n  const unknowns = [!symLine ? \"Whether the vulnerable function runs on a path that user input reaches (the code sample shows imports, not call paths)\" : \"Whether user input reaches the call shown in the code sample\", r.internetFacing ? \"Whether an edge control (gateway or firewall rule) already blocks this attack pattern\" : null, refs.complexReason ? \"How much application code the upgrade touches\" : null].filter(Boolean);\n  const action = refs.prNumber && !refs.merged && !refs.closedUnmerged ? `Review and merge PR #${refs.prNumber}, then let the rescan confirm the fix.` : refs.complexReason ? `Plan the coordinated upgrade${refs.ticket ? ` (${refs.ticket})` : \"\"} and let the SDLC agents do the first pass.` : f.fixed ? `Push a CI-gated fix branch to ${targetVersionFor(groupOf(f).length ? groupOf(f) : [f])}.` : \"Request a time-boxed exception with a compensating control, and watch for an upstream fix.\";\n  return { facts, unknowns, action, confidence: f.kev || f.reachable ? \"high\" : \"medium\" };\n}\nfunction investCard(f, r, c) {\n  const run = S.aiRuns.filter(x => x.findingId === f.id && x.kind === \"investigate\").at(-1);\n  const head = ch(\"Investigate\", \"Evidence-backed assessment of what to do next\", `\u003cspan class=\"ai-tag\">${ic(\"sparkles\", \"i-sm\")} AI suggestion\u003c/span>`);\n  if (!run) return card(head + `\u003cp class=\"sm muted\">Reads this finding's record only (advisory, scores, evidence, repo settings, related findings) and writes a cited assessment. It never changes status or priority.\u003c/p>\u003cbutton class=\"btn btn-violet btn-xs mt3\" data-act=\"investigate\" data-id=\"${f.id}\">${ic(\"sparkles\", \"i-sm\")} Investigate this finding\u003c/button>`, \"\", \"investigate\");\n  const x = investigation(f, r, c);\n  return card(head + `\u003cp class=\"fl\" style=\"margin-bottom:6px\">Facts (each cites where it came from)\u003c/p>\u003cul class=\"stack-sm sm\">${x.facts.map(([t, src]) => `\u003cli class=\"row\" style=\"align-items:flex-start;gap:8px\">\u003cspan style=\"color:#059669;display:inline-flex;margin-top:2px\">${ic(\"check\", \"i-sm\")}\u003c/span>\u003cspan>${esc(t)} \u003cspan class=\"xs muted\">[${esc(src)}]\u003c/span>\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>\n    \u003cp class=\"fl mt3\" style=\"margin-bottom:6px\">Unknowns\u003c/p>\u003cul class=\"stack-sm sm\">${x.unknowns.map(t => `\u003cli class=\"row\" style=\"align-items:flex-start;gap:8px\">\u003cspan class=\"muted\" style=\"display:inline-flex;margin-top:2px\">${ic(\"help\", \"i-sm\")}\u003c/span>\u003cspan>${esc(t)}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>\n    \u003cdiv class=\"callout c-violet mt3\">\u003cp class=\"h\">Recommended next step · confidence ${x.confidence}\u003c/p>\u003cp class } ≥ ${esc(target)}\u003c/b>, clears it everywhere.${roleCanSee(me().role, \"dashboard\") ? ` \u003ca class=\"link\" href=\"#/dashboard\">See the remediation plan →\u003c/a>` : \"\"}\u003c/p>` : \"\"}`, \"\", \"blast\");\n}\nfunction similarCard(f, cur) {\n  const vis = new Set(visibleRepos().map(x => x.id));\n  const sx = S.suppressions.filter(s => s !== cur && vis.has(s.repoId) && (() => { const g = S.findings.find(x => x.id === s.findingId); return g && (g.pkg === f.pkg || g.cve === f.cve); })());\n  const fx = S.findings.filter(x => x.id !== f.id && vis.has(x.repoId) && x.pkg === f.pkg && x.refs && (x.refs.merged || x.refs.closedUnmerged));\n  if (!sx.length && !fx.length) return \"\";\n  return card(ch(\"Similar past decisions\", \"Approved history on the same package or advisory, so the same question isn't answered twice\") +\n    `\u003cul class=\"stack-sm sm\">${sx.map(s => { const g = S.findings.find(x => x.id === s.findingId); return `\u003cli>${pill(EXCEPTION_LABELS[s.kind], \"blue\")} \u003cspan class=\"fw5\">${esc(g.pkg.split(\":\").pop())} ${esc(g.version)}\u003c/span> in ${esc(repoById(s.repoId).name)} · ${esc(s.status)}${s.expiresAt ? ` · ${s.status === \"expired\" ? \"expired\" : \"expires\"} ${fmtDate(s.expiresAt)}` : \"\"}\u003cspan class=\"xs muted\" style=\"display:block\">${esc(s.justification)}\u003c/span>\u003c/li>`; }).join(\"\")}${fx.map(x => `\u003cli>${x.refs.merged ? pill(\"fixed by PR\", \"emerald\") : pill(\"PR closed unmerged\", \"amber\")} \u003cspan class=\"fw5\">${esc(x.pkg.split(\":\").pop())} ${esc(x.version)} → ${esc(x.refs.targetVersion)}\u003c/span> in ${esc(repoById(x.repoId).name)} · PR #${x.refs.prNumber}${x.status === \"fixed\" ? \" · verified by rescan\" : \"\"}${x.refs.closedUnmerged ? `\u003cspan class=\"xs muted\" style=\"display:block\">${esc(x.refs.closedUnmerged.note)}\u003c/span>` : \"\"}\u003c/li>`).join(\"\")}\u003c/ul>`, \"\", \"similar\");\n}\nconst VEX_STATES = { affected: \"Affected\", not_affected: \"Not affected\", under_investigation: \"Under investigation\", fixed: \"Fixed\" };\nconst VEX_JUST = { code_not_reachable: \"Vulnerable code not reachable\", vulnerable_code_not_present: \"Vulnerable code not present\", vulnerable_code_not_in_execute_path: \"Vulnerable code not in the execution path\", inline_mitigations_already_exist: \"Inline mitigations already exist\" };\nconst vexOf = f => S.vex.filter(v => v.findingId === f.id && v.status === \"approved\").at(-1);\nconst vexPending = f => S.vex.find(v => v.findingId === f.id && v.status === \"pending\");\nconst derivedVex = f => f.status === \"fixed\" ? \"fixed\" : f.status === \"false_positive\" ? \"not_affected\" : f.status === \"accepted_risk\" ? \"affected\" : \"under_investigation\";\nfunction vexCard(f) {\n  const cur = vexOf(f), pend = vexPending(f), st = cur ? cur.state : derivedVex(f), u = me();\n  const canApprove = pend && can(\"approveVex\") && pend.by !== u.email;\n  return card(ch(\"Applicability (VEX)\", \"The statement published in VEX exports for this finding\", \"\", \"Not affected needs evidence and a second person's approval, the same two-person rule as exceptions. Absence of evidence is recorded as under investigation, never as not affected.\") +\n    `\u003cdiv class=\"row wrap\" style=\"gap:8px\">${pill(VEX_STATES[st], st === \"not_affected\" || st === \"fixed\" ? \"emerald\" : st === \"affected\" ? \"rose\" : \"slate\")}${cur ? `\u003cspan class=\"xs muted\">${cur.justification ? esc(VEX_JUST[cur.justification]) + \" · \" : \"\"}stated by ${esc(roleOfEmail(cur.by))}${cur.approvedBy ? `, approved by ${esc(roleOfEmail(cur.approvedBy))}` : \"\"} · ${fmtDate(cur.approvedAt || cur.at)}\u003c/span>` : `\u003cspan class=\"xs muted\">derived from the finding's status\u003c/span>`}\u003c/div>\n    ${cur && cur.evidence ? `\u003cp class=\"xs mt2\">\u003cb>Evidence:\u003c/b> ${esc(cur.evidence)}\u003c/p>` : \"\"}\n    ${pend ? `\u003cdiv class=\"callout c-amber mt3\">\u003cp class=\"h\">${VEX_STATES[pend.s ied: [\"emerald\", \"Read from the source named in the label\"], Inferred: [\"blue\", \"Derived by Everlit from evidence, not read directly from a source\"], Declared: [\"slate\", \"Set by your organization (repo settings or the service catalog)\"], Default: [\"amber\", \"No value available, so the documented default is used\"] };\nconst provChip = k => k ? `\u003cspan class=\"badge t-${PROV_T[k][0]}\" style=\"padding:0 8px;font-size:11px;margin-left:6px\" title=\"${esc(PROV_T[k][1])}\">${k}\u003c/span>` : \"\";\nconst scoreRow = (label, pts, max, pv) => `\u003cdiv class=\"sr\">\u003cdiv class=\"top\">\u003cspan>${esc(label)}${provChip(pv)}\u003c/span>\u003cspan>${pts.toFixed(1)} / ${max}\u003c/span>\u003c/div>\u003cdiv class=\"bar thin\">\u003ci style=\"width:${Math.min(100, (pts / max) * 100)}%\">\u003c/i>\u003c/div>\u003c/div>`;\n/* where each score input came from, and how sure the score is */\nfunction scoreProvenance(f, c) {\n  const cvss = f.cvss != null ? \"Verified\" : \"Default\";\n  const exploit = f.kev || f.epss != null ? \"Verified\" : \"Default\";\n  const reach = f.reachKnown ? \"Inferred\" : \"Default\";\n  const risk = [cvss, exploit, reach], verified = risk.filter(x => x === \"Verified\").length;\n  const confidence = verified === 3 ? \"high\" : verified === 2 && reach !== \"Default\" ? \"high\" : verified >= 2 ? \"medium\" : \"low\";\n  const k = c.comps, sub = round1(k.cvssPoints + k.exploitPoints + k.reachabilityPoints + k.exposurePoints + k.criticalityPoints + k.kevBonus);\n  const math = `${sub.toFixed(1)}${k.scopeFactor !== 1 ? ` × ${k.scopeFactor}` : \"\"} → ${c.score}${sub * k.scopeFactor > 100 ? \" (capped at 100)\" : \"\"}`;\n  return { cvss, exploit, reach, declared: \"Declared\", confidence, math, summary: `${verified} of 3 risk inputs verified at source${reach === \"Inferred\" ? \", import evidence inferred from the code sample\" : reach === \"Default\" ? \", import evidence at the midpoint\" : \"\"}` };\n}\n/* function-level hint: does the vulnerable function named in the advisory appear in the repo's code sample? */\nconst SYMBOLS = {\n  \"CVE-2021-23337\": [\"template()\", /\\btemplate\\(/], \"CVE-2020-8203\": [\"zipObjectDeep()\", /zipObjectDeep/], \"CVE-2020-28500\": [\"toNumber() / trim() / trimEnd()\", /\\b(toNumber|trimEnd|trim)\\(/],\n  \"CVE-2022-23540\": [\"jwt.verify()\", /jwt\\.verify\\(/], \"CVE-2022-23541\": [\"jwt.verify()\", /jwt\\.verify\\(/], \"CVE-2021-44906\": [\"minimist()\", /minimist\\(/],\n  \"CVE-2020-1747\": [\"yaml.load() / full_load()\", /yaml\\.(full_)?load\\(/], \"CVE-2020-14343\": [\"yaml.load() / full_load()\", /yaml\\.(full_)?load\\(/],\n  \"CVE-2024-29041\": [\"res.redirect() / res.location()\", /\\.(redirect|location)\\(/], \"CVE-2024-43796\": [\"res.redirect()\", /\\.redirect\\(/], \"CVE-2022-0235\": [\"fetch() following a redirect\", /\\bfetch\\(/],\n};\nfunction symbolHint(f, r) {\n  const s = SYMBOLS[f.cve]; if (!s || !r.snippet) return \"\";\n  const line = r.snippet.split(\"\\n\").find(l => s[1].test(l));\n  return `\u003cdiv class=\"box mt3\">\u003cp class=\"fw5 muted\" style=\"margin-bottom:4px\">Function-level hint: ${esc(s[0])}\u003c/p>${line ? `\u003ccode>${esc(line.trim())}\u003c/code>\u003cp class=\"muted mt1\">The function named in the advisory appears in the code sample.${/yaml/.test(s[0]) ? \" In PyYAML before 5.4 a bare yaml.load() uses FullLoader, the affected loader.\" : \"\"}\u003c/p>` : `\u003cp class=\"muted\">The function named in the advisory does not appear in the code sample.\u003c/p>`}\u003cp class=\"xs muted mt1\">A hint for triage, not proof either way: it reads the code sample, not every call path.\u003c/p>\u003c/div>`;\n}\nconst ownersFor = r => [`Engineering Manager · ${r.owningTeam}`, \"Platform Owner\", \"CISO\", \"Security Engineer\"];\nfunction hygieneHint(f) {\n  const past = S.suppressions.filter(s => [\"expired\", \"revoked\", \"rejected\"].includes(s.status) && (() => { const g = S.findings.find(x => x.id === s.findingId \n    \u003cdiv>\u003clabel class=\"fl\">Compensating controls\u003c/label>\u003ctextarea class=\"ta\" name=\"controls\" rows=\"2\" style=\"font-family:var(--sans);font-size:13px\" placeholder=\"What reduces the risk until it's fixed? (gateway rule, feature flag, monitoring)\">\u003c/textarea>\u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton class=\"btn btn-indigo btn-xs\" type=\"submit\">Request exception\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" type=\"button\" data-act=\"inline\" data-f=\"\">Cancel\u003c/button>\u003c/div>\n    \u003cp class=\"xs muted\">A different security reviewer must approve it. Nothing changes until then.\u003c/p>\u003c/form>`;\n}\n\n/* ---------------------------------------------------------------- RemediationPanel (+ proposed SDLC agents) */\nconst groupOf = f => S.findings.filter(x => x.repoId === f.repoId && x.pkg === f.pkg && x.version === f.version && x.status === \"open\");\nconst targetVersionFor = g => g.map(x => x.fixed).filter(Boolean).sort(cmpVer).at(-1) || null;\nconst agentRunFor = f => S.runs.filter(x => x.findingIds.includes(f.id)).at(-1);\n/* fix lifecycle: branch → CI → PR → merge → verified by rescan */\nfunction fixChain(f, refs) {\n  if (!refs.branchName && !refs.prNumber) return \"\";\n  const ciBad = refs.ciFailed || refs.ciStatus === \"failed\" || refs.ciStatus === \"no_ci\";\n  const st = [[\"Branch pushed\", refs.pushedAt, !!refs.branchName, false],\n    [refs.ciStatus === \"no_ci\" ? \"No CI result\" : ciBad ? \"CI failed\" : refs.ciStatus === \"manual\" ? \"Opened by hand\" : \"CI passed\", refs.ciAt, refs.ciStatus === \"passed\" || refs.ciStatus === \"manual\", ciBad],\n    [refs.closedUnmerged ? \"PR closed\" : \"PR opened\", refs.closedUnmerged ? refs.closedUnmerged.at : refs.prAt, !!refs.prNumber && !refs.closedUnmerged, !!refs.closedUnmerged],\n    [\"Merged\", refs.mergedAt, !!refs.merged, false],\n    [\"Verified by rescan\", refs.verifiedAt || (f.status === \"fixed\" && refs.merged ?
