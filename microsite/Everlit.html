good-fg:#6ee7b7; --good-bg:rgba(16,185,129,.12); --good-bd:rgba(16,185,129,.32);\n    --violet-fg:#c4b5fd; --violet-bg:rgba(139,92,246,.12); --violet-bd:rgba(139,92,246,.32);\n    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0b1120; --surface:#111827; --surface-2:#0f172a; --surface-3:#1e293b;\n  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#94a3b8; --faint:#64748b;\n  --border:#1f2937; --border-strong:#334155;\n  --accent:#818cf8; --accent-hover:#a5b4fc; --accent-fg:#0b1120; --accent-soft:rgba(129,140,248,.12); --accent-ring:rgba(129,140,248,.45);\n  --shadow:0 1px 2px rgba(0,0,0,.3);\n  --crit:#f43f5e; --crit-fg:#fda4af; --crit-bg:rgba(244,63,94,.12); --crit-bd:rgba(244,63,94,.32);\n  --med:#f59e0b; --med-fg:#fcd34d; --med-bg:rgba(245,158,11,.12); --med-bd:rgba(245,158,11,.32);\n  --good:#10b981; --good-fg:#6ee7b7; --good-bg:rgba(16,185,129,.12); --good-bd:rgba(16,185,129,.32);\n  --violet-fg:#c4b5fd; --violet-bg:rgba(139,92,246,.12); --violet-bd:rgba(139,92,246,.32);\n  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;\n}\n\n/* comparison by tool category */\n.cmpx-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}\n.cmpx{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:13px}\n.cmpx th,.cmpx td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}\n.cmpx tbody tr:last-child th,.cmpx tbody tr:last-child td{border-bottom:0}\n.cmpx thead th{font-size:12px;font-weight:650;color:var(--muted);background:var(--surface-2);line-height:1.35}\n.cmpx thead th .eg{display:block;margin-top:4px;font-size:11.5px;font-weight:500;color:var(--fg-2);line-height:1.4}\n.cmpx tbody th{font-weight:600;width:20%;position:sticky;left:0;background:var(--surface);z-index:1}\n.cmpx thead th:first-child{position:sticky;left:0;z-index:2}\n.cmpx th{text-transform:none;letter-spacing:normal}\n.cm pe{margin-top:0}\n.node .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--fg-2);flex:none}\n.node b{display:block;font-size:13.5px}\n.node span{color:var(--muted);font-size:12.5px}\n.fcol.core .node .ic{background:var(--accent-soft);color:var(--accent)}\n.node.ai{border-color:var(--violet-bd)} .node.ai .ic{background:var(--violet-bg);color:var(--violet-fg)}\n.node.stop{border-color:var(--good-bd)} .node.stop .ic{background:var(--good-bg);color:var(--good-fg)}\n.core-step{position:relative}\n.core-step+.core-step{margin-top:22px}\n.core-step+.core-step::before{content:\"\";position:absolute;left:50%;top:-18px;width:2px;height:14px;background:var(--accent);transform:translateX(-50%)}\n.farrow{display:grid;place-items:center;color:var(--accent)}\n.farrow svg{width:28px;height:28px}\n@media (max-width:999px){.farrow svg{transform:rotate(90deg)}}\n.loop{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px 16px;border:1px dashed var(--accent-ring);border-radius:12px;font-size:13.5px;color:var(--fg-2);background:var(--surface)}\n.loop .i{color:var(--accent)}\n.sources{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}\n.src{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--fg-2)}\n.src b{font-weight:650;color:var(--fg)}\n\n/* shift-left */\n.shift{padding:20px}\n.pipeline{display:grid;gap:8px;grid-template-columns:repeat(5,1fr);margin-top:6px}\n.ps{text-align:center;font-size:13px;font-weight:600;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}\n.ps span{display:block;font-weight:400;font-size:12px;color:var(--muted)}\n.ps.gate{border:2px solid var(--good);background:var(--good-bg)}\n.costbar{margin-top:14px;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--med),var(--crit))}\n.costlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}\n.markers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}\n.mk{font-size:12.5px;line-height:1.4;padding:10px;border-radius:10px}\n.mk.g{grid-column:2/4;background:var(--good-bg);border:1px solid var(--good-bd);color:var(--good-fg)}\n.mk.r{grid-column:4/6;background:var(--accent-soft);border:1px solid var(--accent-ring);color:var(--fg-2)}\n.mk b{display:block;font-size:13px;color:var(--fg)}\n@media (max-width:640px){.pipeline,.markers{grid-template-columns:1fr}.mk.g,.mk.r{grid-column:auto}.costbar,.costlbl{display:none}}\n\n/* hub */\n.hub{display:grid;gap:12px}\n@media (min-width:820px){.hub{grid-template-columns:repeat(3,1fr)}}\n.ht{padding:16px;position:relative}\n.ht h4{font-size:14.5px;font-weight:650;display:flex;gap:8px;align-items:center;margin-bottom:4px}\n.ht .who{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}\n.ht p{font-size:13.5px;color:var(--fg-2)}\n.ht.sys{border-style:dashed}\n.ht.center{border:2px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);display:grid;place-items:center;text-align:center;gap:6px}\n.ht.center .big{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-fg)}\n.ht.center .big .i{width:26px;height:26px}\n.ht.center h4{justify-content:center;font-size:17px}\n@media (min-width:820px){\n  .ht:not(.center)::after{content:\"\";position:absolute;width:12px;height:2px;background:var(--accent-ring)}\n  .hub>.ht:nth-child(4)::after{right:-12px;top:50%}\n  .hub>.ht:nth-child(6)::after{left:-12px;top:50%}\n  .hub>.ht:nth-child(2)::after{bottom:-12px;left:50%;width:2px;height:12px}\n  .hub>.ht:nth-child(8)::after{top:-12px;left:50%;width:2px;height:12px}\n  .hub>.ht:nth-child(1)::after,.hub>.ht:nth-child(3)::after,.hub>.ht:nth-child(7)::after,.hub>.ht:nth-child(9)::after{display:none}\n}\n\n/* before/after table */\n.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--border);background:var(--surface)}\ntable{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}\nth,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:top}\nth{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}\ntr:last-child td{border-bottom:0}\ntd:first-child{font-weight:600;white-space:nowrap}\ntd.b{color:var(--fg-2)}\ntd.a{color:var(--fg)}\ntd .x{color:var(--crit)} td .ok{color:var(--good)}\n\n/* journey */\n.journey{display:grid;gap:0;position:relative}\n.js{display:grid;grid-template-columns:100px 28px 1fr;gap:12px;align-items:start;padding-bottom:18px;position:relative}\n.js .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:5px;text-align:right;white-space:nowrap}\n.js .dot{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--accent);color:var(--accent);z-index:1}\n.js .dot.g{border-color:var(--good);color:var(--good)} .js .dot.r{border-color:var(--crit);color:var(--crit)} .js .dot.v{border-color:var(--violet-fg);color:var(--violet-fg)}\n.js:not(:last-child)::before{content:\"\";position:absolute;left:125px;top:28px;bottom:0;width:2px;background:var(--border-strong)}\n.js h4{font-size:15px;font-weight:650}\n.js p{font-size:14px;color:var(--muted);margin-top:2px}\n.js .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}\n\n/* metrics */\n.metrics td:nth-child(2){color:var(--muted)}\n.metrics td:nth-child(3){font-weight:650;color:var(--fg)}\n\n/* roadmap */\n.road{display:grid;gap:12px}\n@media (min-width:900px){.road{grid-template-columns:repeat(3,1fr)}}\n.ph{padding:18px;position:relative}\n.ph .when{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}\n.ph h4{font-size:16px;font-weight:650;margin:4px 0 10px}\n.ph li{font-size:13.5px;color:var(--fg-2);display:flex;gap:8px;padding:3px 0}\n.ph li .i{color:var(--accent);margin-top:3px}\n.ph .exit{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}\n.ph .exit b{color:var(--fg)}\n.invest{display:grid;gap:12px;margin-top:12px}\n@media (min-width:820px){.invest{grid-template-columns:repeat(4,1fr)}}\n.inv{padding:16px}\n.inv .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px}\n.inv p{font-size:13px;color:var(--muted);margin-top:2px}\n\n/* risks + decisions */\n.two{display:grid;gap:16px}\n@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}\n.risk{display:grid;grid-template-columns:1fr 1fr;gap:0;font-size:13.5px}\n.risk div{padding:10px 12px;border-bottom:1px solid var(--border)}\n.risk .rh{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}\n.risk div:nth-child(odd){color:var(--fg-2);border-right:1px solid var(--border)}\n.risk div:nth-last-child(-n+2){border-bottom:0}\n.dec li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}\n.dec li:last-child{border-bottom:0}\n.dec .q{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:700;flex:none}\n.dec b{display:block}\n.dec span{color:var(--muted);font-size:13.5px}\n\n/* glossary + footer */\ndetails.gl summary{cursor:pointer;list-style:none;font-weight:600;display:flex;gap:8px;align-items:center}\ndetails.gl summary::-webkit-details-marker{display:none}\n.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 24px;margin-top:14px}\n.gloss div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px}\n.gloss dt{flex:0 0 64px;font-weight:650}\n.gloss dd{color:var(--muted)}\nfooter{padding:40px 0 56px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}\nfooter .row{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}\nfooter a{color:var(--accent);text-decoration:none;font-weight:550}\nabbr{text-decoration:none;cursor:help}\nabbr.ab1{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px;text-decoration-thickness:1px}\n.btn abbr.ab1,h1 abbr.ab1,h2 abbr.ab1,.nav abbr.ab1,th abbr.ab1{text-decoration:none}\n\n/* print: light, no chrome, keep diagrams together */\n@media print{\n  :root{color-scheme:light}\n  .nav,.hero-cta,footer .links{display:none !important}\n  body{background:#fff}\n  section{padding:24px 0;break-inside:auto}\n  .flow,.hub,.journey,.road,.lanes,.shift,.tw{break-inside:avoid}\n  .card,.fcol,.step,.node{box-shadow:none}\n  a{text-decoration:none}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"nav\">\n  \u003cdiv class=\"wrap\">\n    \u003ca class=\"brand\" href=\"#top\">\u003cspan class=\"brand-mark\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>\u003c/svg>\u003c/span>Everlit \u003csmall>· Executive brief\u003c/small>\u003c/a>\n    \u003cnav class=\"nav-links\" aria-label=\"Sections\">\n      \u003ca href=\"#problem\">Problem\u003c/a>\u003ca href=\"#solution\">How it works\u003c/a>\u003ca href=\"#build\">Build vs buy\u003c/a>\u003ca href=\"#measure\">Measuring impact\u003c/a>\u003ca href=\"#decisions\">Decisions\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"nav-right\">\n      \u003cbutton class=\"btn btn-secondary btn-sm hide-sm\" type=\"button\" id=\"printBtn\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 9V2h12v7\"/>\u003cpath d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"/>\u003crect width=\"12\" height=\"8\" x=\"6\" y=\"14\"/>\u003c/svg> Print / PDF\u003c/button>\n      \u003cbutton class=\"icon-btn\" type=\"button\" id=\"themeBtn\" aria-label=\"Theme\">\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n\u003c!-- ============================================================ HERO -->\n\u003csection class=\"hero\" id=\"top\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"eyebrow\">Executive brief · Open-source dependency risk\u003c/div>\n    \u003ch1>Fix what matters first, and stop new risk \u003cspan class=\"accent\">before it ships.\u003c/span>\u003c/h1>\n    \u003cp class=\"sub\">Everlit is our in-house platform for vulnerabilities in the open-source packages our code depends on. It ranks every finding by real business risk, stops risky changes at the pull request, gets fixes made and verified, and gives leadership one trustworthy view of whether we are getting safer.\u003c/p>\n    \u003cdiv class=\"hero-cta\">\n      \u003ca class=\"btn btn-primary\" href=\"product.html\">See the product \u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>\u003c/a>\n      \u003ca class=\"btn btn-secondary tourcta\" href=\"product.html#tour\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 4v16l14-8z\"/>\u003c/svg> Watch the 3-minute tour\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"kpis\">\n      \u003cdiv class=\"card kpi kc1\">\u003cdiv class=\"label\">\u003cspan class=\"kic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 6v6l4 2\"/>\u003c/svg>\u003c/span>Critical fixes\u003c/div>\u003cdiv class=\"v\">≥30% faster \u003cspan class=\"tri\">▲\u003c/span>\u003c/div>\u003cdiv class=\"d\">mean time to remediate (MTTR) within 6 months of launch\u003c/div>\u003cdiv class=\"ev\">Measured: median days from first seen to the rescan that \u003cb>confirms\u003c/b> the fix, against our pilot baseline\u003c/div>\u003c/div>\n      \u003cdiv class=\"card kpi kc2\">\u003cdiv class=\"label\">\u003cspan class=\"kic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 2 10 5-10 5L2 7z\"/>\u003cpath d=\"m2 17 10 5 10-5\"/>\u003cpath d=\"m2 12 10 5 10-5\"/>\u003c/svg>\u003c/span>Old backlog\u003c/div>\u003cdiv class=\"v\">&lt;10% \u003cspan class=\"tri\">▲\u003c/span>\u003c/div>\u003cdiv class=\"d\">of open findings older than 90 days\u003c/div>\u003cdiv class=\"ev\">Measured: share of open findings first seen more than 90 days ago, from \u003cb>scan history\u003c/b>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card kpi kc3\">\u003cdiv class=\"label\">\u003cspan class=\"kic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"/>\u003c/svg>\u003c/span>Fixed automatically\u003c/div>\u003cdiv class=\"v\">≥40% \u003cspan class=\"tri\">▲\u003c/span>\u003c/div>\u003cdiv class=\"d\">of eligible dependency findings, via tested fix PRs\u003c/div>\u003cdiv class=\"ev\">Measured: fix PRs merged and confirmed by a rescan. An independent study saw \u003cb>65%\u003c/b> of automated security-update PRs accepted\u003csup class=\"ref\">\u003ca href=\"#src-5\" aria-label=\"Source 5\">5\u003c/a>\u003c/sup>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card kpi kc4\">\u003cdiv class=\"label\">\u003cspan class=\"kic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"18\" cy=\"18\" r=\"3\"/>\u003ccircle cx=\"6\" cy=\"6\" r=\"3\"/>\u003cpath d=\"M13 6h3a2 2 0 0 1 2 2v7\"/>\u003cpath d=\"M6 9v12\"/>\u003c/svg>\u003c/span>Developer friction\u003c/div>\u003cdiv class=\"v\">&lt;2% \u003cspan class=\"tri\">▲\u003c/span>\u003c/div>\u003cdiv class=\"d\">of PRs blocked by a false positive\u003c/div>\u003cdiv class=\"ev\">By design: only what a PR \u003cb>introduces\u003c/b> can block, and blocking starts switched off\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"note\">\u003cspan class=\"tri\">▲\u003c/span> Minimum targets from the product requirements. Each is judged against our own baseline from pilot weeks 1–2, not against other organizations' results. \u003ca href=\"#measure\" style=\"color:inherit\">How each one is measured →\u003c/a>\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ SUMMARY -->\n\u003csection class=\"band\" style=\"padding-top:40px;padding-bottom:40px\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"guar-h\">\u003ch3>Built to fail safe\u003c/h3>\u003cp>Six rules the product enforces, whatever else changes.\u003c/p>\u003c/div>\n    \u003cdiv class=\"guar\">\u003cdiv class=\"card\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Advisory first\u003c/b>\u003cspan>Nothing is blocked until false positives are under 5%.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Blocks only what a PR introduces\u003c/b>\u003cspan>Existing debt never holds up a merge.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Incomplete is never a pass\u003c/b>\u003cspan>If a source doesn't answer, the check says so instead of going green.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Closed only by a rescan\u003c/b>\u003cspan>Merged isn't fixed until the vulnerable version is gone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Exceptions need two people and expire\u003c/b>\u003cspan>After 90 or 365 days, always.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>A buy fallback with kill criteria\u003c/b>\u003cspan>Agreed before the pilot starts, so a miss has a known next step.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PROBLEM -->\n\u003csection id=\"problem\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">01\u003c/span> The problem\u003c/div>\n      \u003ch2 class=\"title\">We find plenty of vulnerabilities. We struggle to fix the right ones, fast.\u003c/h2>\n      \u003cp class=\"lede\">The gaps are not in detection. They are in prioritization, prevention and follow-through.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"lanes\">\n      \u003cdiv class=\"card lane bad\">\n        \u003cdiv class=\"lane-h\">\u003cspan class=\"tag bad\">Today\u003c/span> Find after the fact, triage by hand\u003c/div>\n        \u003cdiv class=\"steps\">\n          \u003cdiv class=\"step\">\u003cb>Code merges\u003c/b>\u003cspan>no security check on the change itself\u003c/span>\u003c/div>\n          \u003cdiv class=\"step\">\u003cb>Periodic scan\u003c/b>\u003cspan>runs after the code is already on main\u003c/span>\u003c/div>\n          \u003cdiv class=\"step hot\">\u003cb>Long alert list\u003c/b>\u003cspan>ranked by generic CVSS severity only\u003c/span>\u003c/div>\n          \u003cdiv class=\"step hot\">\u003cb>Manual triage\u003c/b>\u003cspan>teams guess what matters to us\u003c/span>\u003c/div>\n          \u003cdiv class=\"step\">\u003cb>Backlog grows\u003c/b>\u003cspan>fixes wait, exceptions never expire\u003c/span>\u003c/div>\n          \u003cdiv class=\"step hot\">\u003cb>No clear trend\u003c/b>\u003cspan>leadership sees counts, not progress\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card lane good\">\n        \u003cdiv class=\"lane-h\">\u003cspan class=\"tag good\">With Everlit\u003c/span> Prevent at the source, fix by risk, prove it\u003c/div>\n        \u003cdiv class=\"steps\">\n          \u003cdiv class=\"step hot\">\u003cb>Pull request gate\u003c/b>\u003cspan>new vulnerable code is stopped before merge\u003c/span>\u003c/div>\n          \u003cdiv class=\"step\">\u003cb>Continuous scans\u003c/b>\u003cspan>on every push and on a schedule\u003c/span>\u003c/div>\n          \u003cdiv class=\"step hot\">\u003cb>Ranked by real risk\u003c/b>\u003cspan>exploitation, exposure, criticality\u003c/span>\u003c/div>\n          \u003cdiv class=\"step\">\u003cb>Fix is made\u003c/b>\u003cspan>tested fix PRs; agents take complex ones\u003c/span>\u003c/div>\n          \u003cdiv class=\"step\">\u003cb>Rescan proves it\u003c/b>\u003cspan>closed only when provably gone\u003c/span>\u003c/div>\n          \u003cdiv class=\"step hot\">\u003cb>Trend you can trust\u003c/b>\u003cspan>fix time, backlog age, auto-fix rate\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card fnl\">\n      \u003ch3>From noise to a short list\u003c/h3>\n      \u003cp class=\"sub2\">The product's sample organization: 5 repositories, 33 open findings. Same data, three questions.\u003c/p>\n      \u003cdiv class=\"fnl-rows\">\n        \u003cdiv class=\"fnl-row\">\u003cdiv>\u003cb>Open findings\u003c/b>\u003cspan class=\"s\">everything the scanners report\u003c/span>\u003c/div>\u003cdiv class=\"fnl-bar\">\u003ci style=\"width:100%\">\u003c/i>\u003c/div>\u003cdiv class=\"n\">33\u003c/div>\u003c/div>\n        \u003cdiv class=\"fnl-row\">\u003cdiv>\u003cb>Policy says act\u003c/b>\u003cspan class=\"s\">priority 60+, fix PR or review\u003c/span>\u003c/div>\u003cdiv class=\"fnl-bar\">\u003ci style=\"width:67%\">\u003c/i>\u003c/div>\u003cdiv class=\"n\">22\u003c/div>\u003c/div>\n        \u003cdiv class=\"fnl-row\">\u003cdiv>\u003cb>Fix this week\u003c/b>\u003cspan class=\"s\">critical, known exploited, or due in 7 days\u003c/span>\u003c/div>\u003cdiv class=\"fnl-bar\">\u003ci style=\"width:27%\">\u003c/i>\u003c/div>\u003cdiv class=\"n\">9\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"foot\">If those 9 had been picked by CVSS severity alone, 4 would be findings that can wait, and 4 that can't would have been left out. The sample is deliberately weighted toward urgent issues. In published data only about 6% of all CVEs have ever been exploited\u003csup class=\"ref\">\u003ca href=\"#src-2\" aria-label=\"Source 2\">2\u003c/a>\u003c/sup>, so real lists usually shrink much further.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ SOLUTION FLOW -->\n\u003csection class=\"band\" id=\"solution\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">02\u003c/span> How it works\u003c/div>\n      \u003ch2 class=\"title\">One decision layer between our code, our tools and our people.\u003c/h2>\n      \u003cp class=\"lede\">Everlit doesn't replace the scanners we already pay for. It brings their results together, adds our business context, decides what to do, and makes sure it gets done.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"flow\" role=\"img\" aria-label=\"Inputs flow into Everlit, which decides priority and policy, then acts through the PR gate, fix PRs, agents and exceptions, producing outcomes for each group\">\n      \u003cdiv class=\"fcol\">\n        \u003ch4>\u003cspan class=\"n\">1\u003c/span> Inputs\u003c/h4>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 3v12\"/>\u003ccircle cx=\"18\" cy=\"6\" r=\"3\"/>\u003ccircle cx=\"6\" cy=\"18\" r=\"3\"/>\u003cpath d=\"M18 9a9 9 0 0 1-9 9\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Our code repositories\u003c/b>\u003cspan>GitHub, GitLab, Bitbucket, Azure DevOps\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 22v-5\"/>\u003cpath d=\"M9 8V2\"/>\u003cpath d=\"M15 8V2\"/>\u003cpath d=\"M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Scanners we already license\u003c/b>\u003cspan>Snyk, JFrog Xray… or built-in open source (OSV.dev)\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/>\u003cpath d=\"M3 5V19A9 3 0 0 0 21 19V5\"/>\u003cpath d=\"M3 12A9 3 0 0 0 21 12\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Trusted public intelligence\u003c/b>\u003cspan>OSV.dev, NVD, CISA KEV, FIRST EPSS\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003crect width=\"16\" height=\"20\" x=\"4\" y=\"2\" rx=\"2\"/>\u003cpath d=\"M9 22v-4h6v4\"/>\u003cpath d=\"M8 6h.01\"/>\u003cpath d=\"M16 6h.01\"/>\u003cpath d=\"M12 6h.01\"/>\u003cpath d=\"M12 10h.01\"/>\u003cpath d=\"M12 14h.01\"/>\u003cpath d=\"M16 10h.01\"/>\u003cpath d=\"M16 14h.01\"/>\u003cpath d=\"M8 10h.01\"/>\u003cpath d=\"M8 14h.01\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Our business context\u003c/b>\u003cspan>service criticality, internet exposure, owning team\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"farrow\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>\u003c/div>\n      \u003cdiv class=\"fcol core\">\n        \u003ch4>\u003cspan class=\"n\">2\u003c/span> Everlit decides\u003c/h4>\n        \u003cdiv class=\"node core-step\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 2 10 5-10 5L2 7z\"/>\u003cpath d=\"m2 17 10 5 10-5\"/>\u003cpath d=\"m2 12 10 5 10-5\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>One finding format\u003c/b>\u003cspan>every tool's results combined and de-duplicated\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node core-step\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 14 4-4\"/>\u003cpath d=\"M3.34 19a10 10 0 1 1 17.32 0\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Priority score 0–100\u003c/b>\u003cspan>severity + real-world exploitation + is it imported + exposure + criticality\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node core-step\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M15 12h-5\"/>\u003cpath d=\"M15 8h-5\"/>\u003cpath d=\"M19 17V5a2 2 0 0 0-2-2H4\"/>\u003cpath d=\"M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Policy we control\u003c/b>\u003cspan>what to do, whether to block, and the fix deadline (SLA)\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node core-step\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003crect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\"/>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/>\u003cpath d=\"m9 14 2 2 4-4\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Coverage receipt\u003c/b>\u003cspan>what every scan checked, so \"nothing found\" means something\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"farrow\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>\u003c/div>\n      \u003cdiv class=\"fcol\">\n        \u003ch4>\u003cspan class=\"n\">3\u003c/span> Everlit acts\u003c/h4>\n        \u003cdiv class=\"node stop\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"m4.9 4.9 14.2 14.2\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Stop at the source\u003c/b>\u003cspan>PR gate blocks new vulnerable dependencies before merge\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node ai\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>AI review of the change\u003cspan class=\"rm-badge\" title=\"Planned for Phase 3 of the rollout\">Phase 3\u003c/span>\u003c/b>\u003cspan>flags risky code with a suggested fix; advises, never blocks\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Fix automatically\u003c/b>\u003cspan>fix PRs opened only after our own CI tests pass; counted fixed only when a rescan proves it\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node ai\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 8V4H8\"/>\u003crect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"/>\u003cpath d=\"M2 14h2\"/>\u003cpath d=\"M20 14h2\"/>\u003cpath d=\"M15 13v2\"/>\u003cpath d=\"M9 13v2\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>SDLC agents for complex fixes\u003cspan class=\"rm-badge\" title=\"Planned for Phase 3 of the rollout\">Phase 3\u003c/span>\u003c/b>\u003cspan>plan, change, test, re-scan; the team reviews and merges\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"4\"/>\u003cpath d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/>\u003cpath d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Exceptions with discipline\u003c/b>\u003cspan>two-person approval, always expire, Jira tickets\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"farrow\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>\u003c/div>\n      \u003cdiv class=\"fcol\">\n        \u003ch4>\u003cspan class=\"n\">4\u003c/span> Outcomes\u003c/h4>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 3v18h18\"/>\u003cpath d=\"m19 9-5 5-4-4-3 3\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Leadership\u003c/b>\u003cspan>fix time, backlog age, auto-fix rate: \"are we improving?\"\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003crect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\"/>\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/>\u003cpath d=\"m9 14 2 2 4-4\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Audit &amp; compliance\u003c/b>\u003cspan>full trail, PCI-DSS / SOX / FFIEC mapping, VEX export\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"m18 16 4-4-4-4\"/>\u003cpath d=\"m6 8-4 4 4 4\"/>\u003cpath d=\"m14.5 4-5 16\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Engineering\u003c/b>\u003cspan>a short ranked list; never blocked on old debt\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"node\">\u003cspan class=\"ic\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003cb>Security\u003c/b>\u003cspan>one defensible score and policy, less manual triage\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"scope\">\u003cb>Scope.\u003c/b> Everlit starts with open-source dependencies across 8 ecosystems (npm, PyPI, Maven, Go, RubyGems, NuGet, Cargo, Composer), where a fix is usually an upgrade that can be tested and proven by a rescan. Containers, code and secrets come next, with built-in open-source scanners (Trivy for containers, Semgrep for code, Gitleaks for secrets) or the scanners we already license, so no vendor connector is required. Container findings use the same score, because they carry CVEs; code and secret findings have no CVE, so they get their own severity rules alongside our exposure and criticality.\u003c/p>\n    \u003cdiv class=\"loop\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 12a9 9 0 0 1 15-6.7L21 8\"/>\u003cpath d=\"M21 3v5h-5\"/>\u003cpath d=\"M21 12a9 9 0 0 1-15 6.7L3 16\"/>\u003cpath d=\"M8 16H3v5\"/>\u003c/svg> Continuous loop: every fix is confirmed by a rescan, and results feed the dashboards and future prioritization.\u003c/div>\n    \u003cdiv class=\"sources\">\u003cspan class=\"label\" style=\"margin-right:4px\">Built on trusted public sources\u003c/span>\u003cspan class=\"src\">\u003cb>OSV.dev\u003c/b> Google\u003c/span>\u003cspan class=\"src\">\u003cb>GitHub Advisory Database\u003c/b>\u003c/span>\u003cspan class=\"src\">\u003cb>NVD\u003c/b> NIST, US government\u003c/span>\u003cspan class=\"src\">\u003cb>KEV catalog\u003c/b> CISA, US government\u003c/span>\u003cspan class=\"src\">\u003cb>EPSS\u003c/b> FIRST\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ SHIFT LEFT -->\n\u003csection id=\"shift\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">03\u003c/span> Stop risk at the source\u003c/div>\n      \u003ch2 class=\"title\">The cheapest vulnerability to fix is the one that never merges.\u003c/h2>\n      \u003cp class=\"lede\">Everlit works at two points in the delivery pipeline: it stops new risk at the pull request, and it finds and fixes existing risk already in our code.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card shift\">\n      \u003cdiv class=\"pipeline\">\n        \u003cdiv class=\"ps\">Code written\u003cspan>developer's branch\u003c/span>\u003c/div>\n        \u003cdiv class=\"ps gate\">Pull request\u003cspan>Everlit gate + AI review\u003c/span>\u003c/div>\n        \u003cdiv class=\"ps\">Merge to main\u003cspan>shared codebase\u003c/span>\u003c/div>\n        \u003cdiv class=\"ps\">Build &amp; release\u003cspan>CI/CD pipeline\u003c/span>\u003c/div>\n        \u003cdiv class=\"ps\">Production\u003cspan>customers exposed\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"costbar\" aria-hidden=\"true\">\u003c/div>\n      \u003cdiv class=\"costlbl\">\u003cspan>Cheapest, least disruptive to fix\u003c/span>\u003cspan>Effort, disruption and exposure grow (illustrative)\u003c/span>\u003cspan>Most costly\u003c/span>\u003c/div>\n      \u003cdiv class=\"markers\">\n        \u003cdiv class=\"mk g\">\u003cb>Prevent: new risk stopped here\u003c/b>Only what the change introduces can block, so teams are never held up by old debt. The AI review flags risky code patterns with a suggested fix while the author is still working on it.\u003c/div>\n        \u003cdiv class=\"mk r\">\u003cb>Cure: existing risk found and fixed here\u003c/b>Scans on every push and on a schedule. Findings are ranked by real risk, fixed by tested PRs or agents, and closed only when a rescan proves it.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ BUILD VS BUY -->\n\u003csection class=\"band\" id=\"build\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">04\u003c/span> Why build this, not buy another tool\u003c/div>\n      \u003ch2 class=\"title\">The tools we have find problems. None of them closes the loop with our context.\u003c/h2>\n      \u003cp class=\"lede\">Each kind of tool on the market does one part well. Everlit is the layer that joins them: it reuses the scanners we already license and adds the decisions and follow-through they leave out.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"cmpv\" id=\"approaches\">\n      \u003cdiv class=\"cmpv-h\">\u003ch3>Same 33 findings, four approaches\u003c/h3>\u003cp>The product's sample organization. Each ranked approach gets the same week-one capacity: the 9 findings Everlit puts in this week. Each card models a category's ranking method, not any one product; the table below names examples.\u003c/p>\u003c/div>\n      \u003cdiv class=\"cmpv-grid\">\u003cdiv class=\"card ap \">\u003cdiv class=\"ap-h\">\u003cb>Dependency update bots\u003c/b>\u003cspan>One upgrade PR per vulnerable package, in no risk order\u003c/span>\u003c/div>\u003cdiv class=\"ap-big\">\u003cspan class=\"n\" data-cv=\"bots-desk\">18\u003c/span>\u003cspan class=\"t\">upgrade PRs at once, each a separate review\u003c/span>\u003c/div>\u003cdiv class=\"mrow\">\u003cspan>Known-exploited caught in week one\u003c/span>\u003cspan class=\"mv\">—\u003c/span>\u003cspan class=\"na\">No ranking, so no week-one list\u003c/span>\u003c/div>\u003cdiv class=\"mrow\">\u003cspan>Week one on business-critical services\u003c/span>\u003cspan class=\"mv\">—\u003c/span>\u003cspan class=\"na\">Every PR looks equally urgent\u003c/span>\u003c/div>\u003cdiv class=\"mrow\">\u003cspan>Week one on code we import\u003c/span>\u003cspan class=\"mv\">—\u003c/span>\u003cspan class=\"na\">Import evidence not used\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card ap \">\u003cdiv class=\"ap-h\">\u003cb>Security scanners\u003c/b>\u003cspan>Ranked by CVSS severity\u003c/span>\u003c/div>\u003cdiv class=\"ap-big\">\u003cspan class=\"n\" data-cv=\"cvss-desk\">33\u003c/span>\u003cspan class=\"t\">alerts, 19 of them rated high or critical\u003c/span>\u003c/div>\u003cdiv class=\"mrow\" title=\"Ranked by CVSS: all 3 known-exploited findings are in the top 9\">\u003cspan>Known-exploited caught in week one\u003c/span>\u003cspan class=\"mv\" data-cv=\"cvss-kev\">3 of 3\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"3 of 3\">\u003ci style=\"width:100%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow\" title=\"Ranked by CVSS: 4 of the top 9 are on business-critical services\">\u003cspan>Week one on business-critical services\u003c/span>\u003cspan class=\"mv\" data-cv=\"cvss-crit\">4 of 9\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"4 of 9\">\u003ci style=\"width:44%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow\" title=\"Ranked by CVSS: 3 of the top 9 have an import confirmed in our code\">\u003cspan>Week one on code we import\u003c/span>\u003cspan class=\"mv\" data-cv=\"cvss-imp\">3 of 9\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"3 of 9\">\u003ci style=\"width:33%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow mneg\" title=\"Ranked by CVSS: 3 of the top 9 are packages our code never imports\">\u003cspan>Picks our code never imports \u003csmall style=\"color:var(--muted)\">(lower is better)\u003c/small>\u003c/span>\u003cspan class=\"mv bad\" data-cv=\"cvss-notimp\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 9v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003cpath d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/>\u003c/svg>3\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card ap \">\u003cdiv class=\"ap-h\">\u003cb>Risk-aggregation platforms\u003c/b>\u003cspan>Modelled: severity plus exploit intelligence, without our context\u003c/span>\u003c/div>\u003cdiv class=\"ap-big\">\u003cspan class=\"n\" data-cv=\"intel-desk\">33\u003c/span>\u003cspan class=\"t\">findings in one ranked list\u003c/span>\u003c/div>\u003cdiv class=\"mrow\" title=\"Modelled: all 3 known-exploited findings are in the top 9\">\u003cspan>Known-exploited caught in week one\u003c/span>\u003cspan class=\"mv\" data-cv=\"intel-kev\">3 of 3\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"3 of 3\">\u003ci style=\"width:100%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow\" title=\"Modelled: 5 of the top 9 are on business-critical services\">\u003cspan>Week one on business-critical services\u003c/span>\u003cspan class=\"mv\" data-cv=\"intel-crit\">5 of 9\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"5 of 9\">\u003ci style=\"width:56%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow\" title=\"Modelled: 4 of the top 9 have an import confirmed in our code\">\u003cspan>Week one on code we import\u003c/span>\u003cspan class=\"mv\" data-cv=\"intel-imp\">4 of 9\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"4 of 9\">\u003ci style=\"width:44%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow mneg\" title=\"Modelled: 2 of the top 9 are packages our code never imports\">\u003cspan>Picks our code never imports \u003csmall style=\"color:var(--muted)\">(lower is better)\u003c/small>\u003c/span>\u003cspan class=\"mv bad\" data-cv=\"intel-notimp\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 9v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003cpath d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/>\u003c/svg>2\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card ap us\">\u003cdiv class=\"ap-h\">\u003cb>Everlit\u003cspan class=\"tagus\">Our build\u003c/span>\u003c/b>\u003cspan>Severity, exploitation, import evidence, exposure and criticality, then policy\u003c/span>\u003c/div>\u003cdiv class=\"ap-big\">\u003cspan class=\"n\" data-cv=\"ev-desk\">9\u003c/span>\u003cspan class=\"t\">to fix this week; 22 have a policy action\u003c/span>\u003c/div>\u003cdiv class=\"mrow\" title=\"Everlit: all 3 known-exploited findings are in this week's 9\">\u003cspan>Known-exploited caught in week one\u003c/span>\u003cspan class=\"mv\" data-cv=\"ev-kev\">3 of 3\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"3 of 3\">\u003ci style=\"width:100%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow\" title=\"Everlit: 6 of this week's 9 are on business-critical services\">\u003cspan>Week one on business-critical services\u003c/span>\u003cspan class=\"mv\" data-cv=\"ev-crit\">6 of 9\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"6 of 9\">\u003ci style=\"width:67%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow\" title=\"Everlit: 6 of this week's 9 have an import confirmed in our code\">\u003cspan>Week one on code we import\u003c/span>\u003cspan class=\"mv\" data-cv=\"ev-imp\">6 of 9\u003c/span>\u003cdiv class=\"mbar\" role=\"img\" aria-label=\"6 of 9\">\u003ci style=\"width:67%\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"mrow mneg\" title=\"Everlit: none of this week's 9 are packages our code never imports\">\u003cspan>Picks our code never imports \u003csmall style=\"color:var(--muted)\">(lower is better)\u003c/small>\u003c/span>\u003cspan class=\"mv ok\" data-cv=\"ev-notimp\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>0\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n      \u003cp class=\"cmpv-note\">Computed from the product's sample data. Scanners are ranked by CVSS score. Risk-aggregation platforms are modelled as severity plus exploit intelligence (KEV and EPSS) without our exposure, criticality or import evidence; that is an assumption, since products vary. All three ranked approaches catch the 3 known-exploited findings here. The difference is what fills the rest of the week.\u003c/p>\n      \u003cdetails>\u003csummary>Show as a table\u003c/summary>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Week one (9 picks)\u003c/th>\u003cth>Update bots\u003c/th>\u003cth>Ranked by CVSS\u003c/th>\u003cth>Risk platform (modelled)\u003c/th>\u003cth>Everlit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Lands on the team at once\u003c/td>\u003ctd class=\"n\">18 PRs\u003c/td>\u003ctd class=\"n\">33 alerts\u003c/td>\u003ctd class=\"n\">33 findings\u003c/td>\u003ctd class=\"n\">9 this week\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Known-exploited caught (of 3)\u003c/td>\u003ctd class=\"n\">no ranking\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>On business-critical services (of 9)\u003c/td>\u003ctd class=\"n\">no ranking\u003c/td>\u003ctd class=\"n\">4\u003c/td>\u003ctd class=\"n\">5\u003c/td>\u003ctd class=\"n\">6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Import confirmed in our code (of 9)\u003c/td>\u003ctd class=\"n\">no ranking\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd class=\"n\">4\u003c/td>\u003ctd class=\"n\">6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Packages our code never imports (of 9)\u003c/td>\u003ctd class=\"n\">no ranking\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd class=\"n\">2\u003c/td>\u003ctd class=\"n\">0\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>\n      \u003cdiv class=\"adv-h\">\u003ch3>What the organization gets\u003c/h3>\u003c/div>\n      \u003cdiv class=\"adv\">\u003cdiv class=\"card\">\u003cdiv class=\"top\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"6\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"2\"/>\u003c/svg>\u003c/span>\u003cspan class=\"big\" data-cv=\"adv-imp\">2×\u003c/span>\u003c/div>\u003cp>more of week one on code we actually import\u003c/p>\u003csmall>6 of 9 picks, against 3 when ranked by CVSS\u003c/small>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"top\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"m4.9 4.9 14.2 14.2\"/>\u003c/svg>\u003c/span>\u003cspan class=\"big\" data-cv=\"adv-notimp\">0\u003c/span>\u003c/div>\u003cp>week-one picks on packages our code never imports\u003c/p>\u003csmall>Ranking by CVSS spends 3 of 9 picks there\u003c/small>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"top\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>\u003c/svg>\u003c/span>\u003cspan class=\"big\" data-cv=\"adv-crit\">+2\u003c/span>\u003c/div>\u003cp>business-critical services in week one\u003c/p>\u003csmall>6 of 9, against 4 when ranked by CVSS\u003c/small>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"top\">\u003cspan class=\"gi\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M22 12h-6l-2 3h-4l-2-3H2\"/>\u003cpath d=\"M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z\"/>\u003c/svg>\u003c/span>\u003cspan class=\"big\" data-cv=\"adv-desk\">9\u003c/span>\u003c/div>\u003cp>findings this week, not 33 alerts or 18 PRs at once\u003c/p>\u003csmall>Same 3 known-exploited issues covered\u003c/small>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"cmpx-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Comparison by tool category\">\u003ctable class=\"cmpx\">\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cspan class=\"sr\">Capability\u003c/span>\u003c/th>\u003cth scope=\"col\">Dependency update bots\u003cspan class=\"eg\">e.g. Dependabot, Renovate\u003c/span>\u003c/th>\u003cth scope=\"col\">Security scanners (SCA, SAST, container)\u003cspan class=\"eg\">e.g. Snyk, Mend.io, Sonatype, JFrog Xray, GitHub Advanced Security, Checkmarx\u003c/span>\u003c/th>\u003cth scope=\"col\">Commercial risk-aggregation platforms\u003cspan class=\"eg\">e.g. ArmorCode, Apiiro, Nucleus Security, Brinqa, Tenable One\u003c/span>\u003c/th>\u003cth scope=\"col\" class=\"us\">Everlit\u003cspan class=\"eg\">our build, on top of the scanners we license\u003c/span>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">What it does well\u003c/th>\u003ctd>\u003csmall class=\"plain\">Keeps packages current with automatic upgrade PRs\u003c/small>\u003c/td>\u003ctd>\u003csmall class=\"plain\">Finds vulnerabilities in code, dependencies and images\u003c/small>\u003c/td>\u003ctd>\u003csmall class=\"plain\">Pulls many scanners' findings into one risk view\u003c/small>\u003c/td>\u003ctd class=\"us\">\u003csmall class=\"plain\">Decides what to fix first with our context, then gets it fixed\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Knows what's exploited now (KEV, EPSS)\u003c/th>\u003ctd>\u003cspan class=\"cm cm-n\">No\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>Both feed every priority score\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Uses our business context\u003c/th>\u003ctd>\u003cspan class=\"cm cm-n\">No\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>Exposure and criticality per repo, import evidence per finding\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Stops new risk at the PR\u003c/th>\u003ctd>\u003cspan class=\"cm cm-n\">No\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-v\">Varies\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>Blocks only what the PR introduces, plus an advisory AI review\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Fixes, tested in our CI\u003c/th>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>PR only after CI passes; complex fixes go to SDLC agents\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Exceptions, SLAs and audit evidence\u003c/th>\u003ctd>\u003cspan class=\"cm cm-n\">No\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>Two-person exceptions that expire, SLAs, audit log, VEX\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Proves what was checked and decided\u003c/th>\u003ctd>\u003cspan class=\"cm cm-n\">No\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>Coverage receipt per scan, policy versions, verified fixes, hash-chained audit log\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Finding types covered\u003c/th>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-f\">Focused\u003c/span>\u003csmall>Open-source dependencies first; containers, code and secrets next, with built-in open-source scanners (Trivy, Semgrep, Gitleaks) or the scanners we already license\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Fully self-hosted or air-gapped\u003c/th>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-v\">Varies\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-p\">Partly\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003csmall>Runs inside our network; no code leaves it\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Vendor support and maturity\u003c/th>\u003ctd>\u003cspan class=\"cm cm-v\">Varies\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"cm cm-y\">Yes\u003c/span>\u003c/td>\u003ctd class=\"us\">\u003cspan class=\"cm cm-f\">In-house\u003c/span>\u003csmall>Our team, our priorities, no vendor lock-in\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Time to first value\u003c/th>\u003ctd>\u003csmall class=\"plain\">Fastest: install and go\u003c/small>\u003c/td>\u003ctd>\u003csmall class=\"plain\">Fast for detection\u003c/small>\u003c/td>\u003ctd>\u003csmall class=\"plain\">An integration project\u003c/small>\u003c/td>\u003ctd class=\"us\">\u003csmall class=\"plain\">8–12 week build, then a pilot\u003c/small>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Cost\u003c/th>\u003ctd>\u003csmall class=\"plain\">Free to low\u003c/small>\u003c/td>\u003ctd>\u003csmall class=\"plain\">Per developer or per scan\u003c/small>\u003c/td>\u003ctd>\u003csmall class=\"plain\">Highest; per developer or per asset\u003c/small>\u003c/td>\u003ctd class=\"us\">\u003csmall class=\"plain\">No licence. Build: 3–4 engineers for 8–12 weeks. Run: 1–2 FTE, plus hosting and AI model usage\u003c/small>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"cmpx-note\">Grades are for each category as a whole; the named products are examples, and capabilities vary by product, tier and configuration. Everlit works alongside the scanners we already own (bring your own) rather than replacing them. Commercial risk-aggregation platforms (for example ArmorCode, Apiiro, Nucleus Security or Brinqa) are the closest alternative, and buying one remains the fallback if the pilot misses its targets.\u003c/p>\n    \u003cdiv class=\"why3\">\n      \u003cdiv class=\"card pad\">\u003ch4>Scanners find. Everlit proves.\u003c/h4>\u003cp>Every scan carries a coverage receipt, every fix is verified by a rescan, and every decision records its policy version in an audit log nobody can quietly edit. That evidence is what auditors and leadership ask for.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card pad\">\u003ch4>The cost moves from licences to people\u003c/h4>\u003cp>Exposure, criticality and ownership live with us, and existing scanner contracts plug in through adapters. In return we carry the build, the hosting and a standing platform team.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card pad\">\u003ch4>A clear exit if it doesn't deliver\u003c/h4>\u003cp>The proposal is to start in advisory mode with one team and measure against our own baseline. If the targets aren't met, we fall back to buying a platform with the requirements already written.\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ BEFORE / AFTER -->\n\u003csection>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">05\u003c/span> What changes\u003c/div>\n      \u003ch2 class=\"title\">Before and after, in one table.\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"tw\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Today\u003c/th>\u003cth>With Everlit\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Prioritization\u003c/td>\u003ctd class=\"b\">Generic CVSS severity; the same score everywhere\u003c/td>\u003ctd class=\"a\">Priority 0–100 using exploitation in the wild, actual use in code, exposure and criticality\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>When risk is caught\u003c/td>\u003ctd class=\"b\">After merge, in periodic scans\u003c/td>\u003ctd class=\"a\">At the pull request, plus scans on every push and on a schedule\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Fixing\u003c/td>\u003ctd class=\"b\">Manual, ticket by ticket\u003c/td>\u003ctd class=\"a\">Tested fix PRs for simple upgrades; SDLC agents prepare complex ones for human review\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Proof of fix\u003c/td>\u003ctd class=\"b\">Someone marks it done\u003c/td>\u003ctd class=\"a\">Closed only when a rescan proves the vulnerable version is gone\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Exceptions\u003c/td>\u003ctd class=\"b\">Open-ended, hard to track\u003c/td>\u003ctd class=\"a\">Two-person approval, justification, always expire (90 or 365 days)\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Deadlines\u003c/td>\u003ctd class=\"b\">Informal\u003c/td>\u003ctd class=\"a\">Fix deadlines (SLAs) by priority; known-exploited issues in 7 days\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Leadership view\u003c/td>\u003ctd class=\"b\">Raw counts per tool\u003c/td>\u003ctd class=\"a\">One trend: fix time, backlog age, auto-fix rate, overdue and exploited items\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Audit\u003c/td>\u003ctd class=\"b\">Evidence assembled by hand\u003c/td>\u003ctd class=\"a\">Every change logged; control mapping and exports available on demand\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ EXAMPLE -->\n\u003csection class=\"band\" id=\"example\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">06\u003c/span> Example\u003c/div>\n      \u003ch2 class=\"title\">One critical vulnerability, from detection to proof.\u003c/h2>\n      \u003cp class=\"lede\">Log4Shell in the order service: the case every team remembers, as it plays out in the product. Illustrative timeline using the product's sample data.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card pad\">\n      \u003col class=\"journey\">\n        \u003cli class=\"js\">\u003cspan class=\"t\">Day 0 · 03:17\u003c/span>\u003cspan class=\"dot r\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"11\" cy=\"11\" r=\"8\"/>\u003cpath d=\"m21 21-4.3-4.3\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003ch4>Scheduled scan finds it\u003c/h4>\u003cp>log4j-core 2.14.1 in order-service matches public advisories for remote code execution.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli class=\"js\">\u003cspan class=\"t\">Day 0\u003c/span>\u003cspan class=\"dot r\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 14 4-4\"/>\u003cpath d=\"M3.34 19a10 10 0 1 1 17.32 0\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003ch4>Scored 100 / 100: fix first\u003c/h4>\u003cp>Exploited in the wild (CISA KEV), on an internet-facing, business-critical service. A 7-day deadline applies, and any new PR that introduces it is blocked.\u003c/p>\u003cdiv class=\"tags\">\u003cspan class=\"tag bad\">Critical priority\u003c/span>\u003cspan class=\"tag bad\">Known exploited\u003c/span>\u003cspan class=\"tag bad\">7-day SLA\u003c/span>\u003c/div>\u003c/div>\u003c/li>\n        \u003cli class=\"js\">\u003cspan class=\"t\">Day 0\u003c/span>\u003cspan class=\"dot v\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 8V4H8\"/>\u003crect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"/>\u003cpath d=\"M15 13v2\"/>\u003cpath d=\"M9 13v2\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003ch4>Complex fix routed to SDLC agents\u003c/h4>\u003cp>The upgrade needs two packages moved together plus a logging-config change, so it isn't a one-line bump. A Jira ticket is opened for the owning team.\u003c/p>\u003cdiv class=\"tags\">\u003cspan class=\"tag ai\">SDLC agents\u003c/span>\u003cspan class=\"tag ai\">Jira ticket\u003c/span>\u003c/div>\u003c/div>\u003c/li>\n        \u003cli class=\"js\">\u003cspan class=\"t\">Day 1\u003c/span>\u003cspan class=\"dot v\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"18\" cy=\"18\" r=\"3\"/>\u003ccircle cx=\"6\" cy=\"6\" r=\"3\"/>\u003cpath d=\"M13 6h3a2 2 0 0 1 2 2v7\"/>\u003cpath d=\"M6 9v12\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003ch4>Agents hand over a tested PR\u003c/h4>\u003cp>Change made, tests passing, branch re-scanned clean, with an evidence pack attached. Agents cannot approve or merge their own work.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli class=\"js\">\u003cspan class=\"t\">Day 1\u003c/span>\u003cspan class=\"dot\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"4\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003ch4>The team reviews and merges\u003c/h4>\u003cp>A human approves through normal branch protection. Everlit never merges for us.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli class=\"js\">\u003cspan class=\"t\">Day 1\u003c/span>\u003cspan class=\"dot g\">\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"/>\u003cpath d=\"m9 11 3 3L22 4\"/>\u003c/svg>\u003c/span>\u003cdiv>\u003ch4>Rescan proves it, dashboards update\u003c/h4>\u003cp>The vulnerable version is gone, so the finding closes automatically. Fix time, backlog and the audit trail update with no manual reporting.\u003c/p>\u003cdiv class=\"tags\">\u003cspan class=\"tag good\">Closed by rescan\u003c/span>\u003cspan class=\"tag good\">Inside SLA\u003c/span>\u003c/div>\u003c/div>\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ MEASURES -->\n\u003csection id=\"measure\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">07\u003c/span> Measuring impact\u003c/div>\n      \u003ch2 class=\"title\">Targets we commit to, judged against our own baseline.\u003c/h2>\n      \u003cp class=\"lede\">We measure our starting point in pilot weeks 1–2 and judge every target against it. The research below shows which way each technique moves the numbers. It was measured elsewhere, under different conditions, so it shows direction, not a forecast.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"evi\">\n      \u003cdiv class=\"card evc\">\u003cdiv class=\"n\">8×\u003c/div>\u003cp>less remediation effort for the same coverage of exploited vulnerabilities: ranking by exploit likelihood meant fixing 7.3% of CVEs, against 58.1% for “CVSS 7 and above”.\u003c/p>\u003cp class=\"us2\">\u003cb>For us:\u003c/b> Everlit uses exploit likelihood as one input of five, so expect the direction, not the full 8×.\u003c/p>\u003cspan class=\"by\">EPSS v3 research, 2023\u003csup class=\"ref\">\u003ca href=\"#src-1\" aria-label=\"Source 1\">1\u003c/a>\u003c/sup>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card evc\">\u003cdiv class=\"n\">~6%\u003c/div>\u003cp>of all published CVEs have ever been exploited in the wild (as of May 2024). Most of a severity-ranked list can safely wait.\u003c/p>\u003cp class=\"us2\">\u003cb>For us:\u003c/b> why known-exploited findings get a 7-day deadline and most others don't.\u003c/p>\u003cspan class=\"by\">Cyentia and FIRST, 2024\u003csup class=\"ref\">\u003ca href=\"#src-2\" aria-label=\"Source 2\">2\u003c/a>\u003c/sup>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card evc\">\u003cdiv class=\"n\">&lt;9.5%\u003c/div>\u003cp>of open-source dependency vulnerabilities have a call path from the application to the vulnerable code, across the seven languages studied.\u003c/p>\u003cp class=\"us2\">\u003cb>For us:\u003c/b> import evidence is a first, coarser cut at the same idea. A package our code never imports scores lower.\u003c/p>\u003cspan class=\"by\">Endor Labs, 2024\u003csup class=\"ref\">\u003ca href=\"#src-3\" aria-label=\"Source 3\">3\u003c/a>\u003c/sup>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card evc\">\u003cdiv class=\"n\">3×\u003c/div>\u003cp>faster median fix with AI-assisted remediation: 28 minutes against 1.5 hours by hand, on code-scanning alerts in pull requests. Vendor data.\u003c/p>\u003cp class=\"us2\">\u003cb>For us:\u003c/b> relevant to the Phase 3 AI review. None of the targets below depend on it.\u003c/p>\u003cspan class=\"by\">GitHub, 2024\u003csup class=\"ref\">\u003ca href=\"#src-4\" aria-label=\"Source 4\">4\u003c/a>\u003c/sup>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card evc\">\u003cdiv class=\"n\">65%\u003c/div>\u003cp>of automated security-update pull requests were accepted, often merged within a day; only 3.2% of those examined broke the build.\u003c/p>\u003cp class=\"us2\">\u003cb>For us:\u003c/b> the closest match to Everlit's fix PRs, which open only after our own CI passes.\u003c/p>\u003cspan class=\"by\">MSR 2021 study\u003csup class=\"ref\">\u003ca href=\"#src-5\" aria-label=\"Source 5\">5\u003c/a>\u003c/sup>\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"tw\">\n      \u003ctable class=\"metrics\">\n        \u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Minimum target\u003c/th>\u003cth>What moves it, and how it's measured\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Fix time (MTTR), critical\u003c/td>\u003ctd>\u003cspan class=\"tgt\">−30% within 6 months \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>One ranked list, 7-day deadlines for critical and known-exploited issues, and tested fix PRs. Measured from the confirming rescan, not from ticket status\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Fix time (MTTR), high\u003c/td>\u003ctd>\u003cspan class=\"tgt\">−25% within 6 months \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>The same drivers, with a 30-day deadline\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Backlog age: open findings &gt;90 days\u003c/td>\u003ctd>\u003cspan class=\"tgt\">&lt;10% within 6 months \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>Effort goes to what is exploitable first\u003csup class=\"ref\">\u003ca href=\"#src-1\" aria-label=\"Source 1\">1\u003c/a>\u003c/sup>, and exceptions expire instead of parking findings for good\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Auto-remediation rate\u003c/td>\u003ctd>\u003cspan class=\"tgt\">≥40% of eligible dependency findings \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>Fix PRs open only after CI passes, so reviewers see a green build. An independent study saw 65% of such PRs accepted\u003csup class=\"ref\">\u003ca href=\"#src-5\" aria-label=\"Source 5\">5\u003c/a>\u003c/sup>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>False-positive rate (blocking-eligible)\u003c/td>\u003ctd>\u003cspan class=\"tgt\">&lt;5% before org-wide blocking \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>Exact affected-version ranges from OSV.dev; blocking stays off until the target is met\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>PR gate friction\u003c/td>\u003ctd>\u003cspan class=\"tgt\">&lt;2% of PRs blocked by a false positive \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>Only findings the PR introduces can block; existing debt never does\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Exception hygiene\u003c/td>\u003ctd>\u003cspan class=\"tgt\">100% have an expiry; ≥95% re-reviewed in time \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>Enforced by the product: every exception needs a second approver and an expiry date\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Adoption\u003c/td>\u003ctd>\u003cspan class=\"tgt\">≥80% of the first team's repos onboarded \u003cspan class=\"tri\">▲\u003c/span>\u003c/span>\u003c/td>\u003ctd>Repos onboard from the GitHub organization in one step, with a baseline scan right away\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"note\">\u003cspan class=\"tri\">▲\u003c/span> Minimum targets from the product requirements, ratified against the pilot baseline before any results are read. Published figures come from independent studies and vendors' own data, measured in other organizations.\u003c/p>\n    \u003col class=\"srcs\">\u003cli id=\"src-1\">Jacobs, Romanosky, Suciu, Edwards, Sarabi. “Enhancing Vulnerability Prioritization: Data-Driven Exploit Predictions with Community-Driven Insights” (EPSS v3), 2023. \u003ca href=\"https://arxiv.org/abs/2302.14172\" target=\"_blank\" rel=\"noopener noreferrer\">arxiv.org/abs/2302.14172\u003c/a>\u003c/li>\u003cli id=\"src-2\">Cyentia Institute and FIRST. “A Visual Exploration of Exploitation in the Wild: The Inaugural Study of EPSS Data and Performance”, July 2024. \u003ca href=\"https://www.cyentia.com/epss-study/\" target=\"_blank\" rel=\"noopener noreferrer\">www.cyentia.com/epss-study\u003c/a>\u003c/li>\u003cli id=\"src-3\">Endor Labs. “2024 Dependency Management Report”, September 2024. \u003ca href=\"https://www.endorlabs.com/\" target=\"_blank\" rel=\"noopener noreferrer\">www.endorlabs.com\u003c/a>\u003c/li>\u003cli id=\"src-4\">GitHub. “Found means fixed: Secure code more than three times faster with Copilot Autofix”, August 2024 (vendor data from its public beta). \u003ca href=\"https://github.blog/news-insights/product-news/secure-code-more-than-three-times-faster-with-copilot-autofix/\" target=\"_blank\" rel=\"noopener noreferrer\">github.blog/news-insights/product-news/secure-code-more-than-three-times-faster-with-copilot-autofix\u003c/a>\u003c/li>\u003cli id=\"src-5\">Alfadel, Costa, Shihab, Mkhallalati. “On the Use of Dependabot Security Pull Requests”, MSR 2021. \u003ca href=\"https://2021.msrconf.org/details/msr-2021-technical-papers/25/On-the-Use-of-Dependabot-Security-Pull-Requests\" target=\"_blank\" rel=\"noopener noreferrer\">2021.msrconf.org/details/msr-2021-technical-papers/25/On-the-Use-of-Dependabot-Security-Pull-Requests\u003c/a>\u003c/li>\u003c/ol>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ VALUE CALCULATOR -->\n\u003c!-- Hidden until the pilot baseline gives sourced inputs: remove \"hidden\" to restore. -->\n\u003csection id=\"value\" hidden>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">07b\u003c/span> What it's worth\u003c/div>\n      \u003ch2 class=\"title\">Put in our numbers. The model shows its working.\u003c/h2>\n      \u003cp class=\"lede\">A transparent estimate of engineering time returned by automated triage and tested fix PRs, against the cost of building, hosting and running the platform. Every input is editable; the defaults are placeholders, not benchmarks.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"calc\">\n      \u003cdiv class=\"card pad\">\n        \u003cdiv class=\"calc-in\" id=\"calcIn\">\n          \u003cp class=\"calc-hint\">Defaults are placeholders: replace them with our own volumes and rates. \u003cspan class=\"tri\">▲\u003c/span> marks a target from the product requirements.\u003c/p>\n          \u003cdiv class=\"grp\">Triage\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cFind\">New findings per month\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cFind\" type=\"number\" inputmode=\"decimal\" value=\"1500\" step=\"1\" min=\"0\">\u003cspan class=u>/ month\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cTri\">Minutes to triage one finding by hand\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cTri\" type=\"number\" inputmode=\"decimal\" value=\"10\" step=\"1\" min=\"0\">\u003cspan class=u>min\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cWait\">Share no longer triaged by hand\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cWait\" type=\"number\" inputmode=\"decimal\" value=\"50\" step=\"1\" min=\"0\" max=100>\u003cspan class=u>%\u003c/span>\u003c/div>\u003csmall>Ranked “can wait” with the evidence attached\u003c/small>\u003c/div>\n          \u003cdiv class=\"grp\">Fixing\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cElig\">Dependency fixes needed per month\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cElig\" type=\"number\" inputmode=\"decimal\" value=\"300\" step=\"1\" min=\"0\">\u003cspan class=u>/ month\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cHrs\">Engineer hours per manual fix\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cHrs\" type=\"number\" inputmode=\"decimal\" value=\"2.5\" step=\"0.5\" min=\"0\">\u003cspan class=u>hours\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cAuto\">Fixed automatically\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cAuto\" type=\"number\" inputmode=\"decimal\" value=\"40\" step=\"1\" min=\"0\" max=100>\u003cspan class=u>%\u003c/span>\u003c/div>\u003csmall>▲ Target from the product requirements\u003c/small>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cRev\">Minutes to review one automatic fix PR\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cRev\" type=\"number\" inputmode=\"decimal\" value=\"15\" step=\"1\" min=\"0\">\u003cspan class=u>min\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"grp\">Cost\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cCost\">Loaded cost per engineer hour\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cCost\" type=\"number\" inputmode=\"decimal\" value=\"85\" step=\"1\" min=\"0\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cCur\">Currency symbol\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cCur\" type=\"text\" value=\"$\" maxlength=\"3\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cRun\">Platform team to run it\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cRun\" type=\"number\" inputmode=\"decimal\" value=\"1.5\" step=\"0.5\" min=\"0\">\u003cspan class=u>FTE\u003c/span>\u003c/div>\u003csmall>1–2 FTE in the product requirements\u003c/small>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cBuild\">Build effort\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cBuild\" type=\"number\" inputmode=\"decimal\" value=\"35\" step=\"1\" min=\"0\">\u003cspan class=u>engineer-weeks\u003c/span>\u003c/div>\u003csmall>3–4 engineers × 8–12 weeks in the product requirements\u003c/small>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cYears\">Spread the build over\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cYears\" type=\"number\" inputmode=\"decimal\" value=\"3\" step=\"1\" min=\"1\">\u003cspan class=u>years\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"cInfra\">Hosting and AI model cost per year\u003c/label>\u003cdiv class=\"in\">\u003cinput id=\"cInfra\" type=\"number\" inputmode=\"decimal\" value=\"0\" step=\"1000\" min=\"0\">\u003c/div>\u003csmall>Placeholder: sized once the hosting decision is made\u003c/small>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"calc-out\" aria-live=\"polite\">\n        \u003cdiv class=\"card big\">\u003cdiv class=\"label\">Net value per year\u003c/div>\u003cdiv class=\"v\" id=\"oNet\">—\u003c/div>\u003cp id=\"oNetNote\">\u003c/p>\u003c/div>\n        \u003cdiv class=\"card calc-rows\">\n          \u003cdiv>\u003cspan>Triage hours returned\u003c/span>\u003cb id=\"oTri\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Fixing hours returned\u003c/span>\u003cb id=\"oFix\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Total hours returned\u003c/span>\u003cb id=\"oHrs\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Equivalent engineers\u003c/span>\u003cb id=\"oFte\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Value of hours returned\u003c/span>\u003cb id=\"oVal\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Cost of the platform team\u003c/span>\u003cb id=\"oRunC\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Build cost per year\u003c/span>\u003cb id=\"oBuildC\">—\u003c/b>\u003c/div>\n          \u003cdiv>\u003cspan>Hosting and AI model cost\u003c/span>\u003cb id=\"oInfraC\">—\u003c/b>\u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"card pad\">\n          \u003csummary>How this is calculated\u003c/summary>\n          \u003cul>\n            \u003cli>\u003ccode>triage hours = findings × share × minutes ÷ 60 × 12\u003c/code>\u003c/li>\n            \u003cli>\u003ccode>fixing hours = fixes × automatic share × (hours − review minutes ÷ 60) × 12\u003c/code>\u003c/li>\n            \u003cli>\u003ccode>engineers = total hours ÷ 1,680\u003c/code> (one FTE year: 40 hours × 42 working weeks)\u003c/li>\n            \u003cli>\u003ccode>build per year = engineer-weeks × 40 × hourly cost ÷ years\u003c/code>\u003c/li>\n            \u003cli>\u003ccode>net = total hours × hourly cost − platform FTE × 1,680 × hourly cost − build per year − hosting and model cost\u003c/code>\u003c/li>\n          \u003c/ul>\n          \u003cp class=\"note\">Not counted: incidents prevented at the pull request, audit preparation time, and reduced exposure from fixing known-exploited issues within 7 days. Those are real but hard to price honestly, so they are left out.\u003c/p>\n        \u003c/details>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============================================================ PLAN -->\n\u003c!-- Hidden on request (2026-10-11): remove \"hidden\" and restore the nav link and the 09 numbering on Risks and decisions to show it again. -->\n\u003csection class=\"band\" id=\"plan\" hidden>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">08\u003c/span> Rollout and investment\u003c/div>\n      \u003ch2 class=\"title\">Start small, prove the signal, then enforce and scale.\u003c/h2>\n      \u003cp class=\"lede\">Only Phase 1 is asked for now. Each later phase is costed and approved at the previous exit, so the scope can't grow faster than the team that runs it.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"road\">\n      \u003cdiv class=\"card ph\">\u003cdiv class=\"when\">Phase 1 · 8–12 week build, 4–6 week pilot\u003c/div>\u003ch4>Build the core, pilot with one team\u003c/h4>\u003cul>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Open-source dependencies, on one Git provider and one CI platform\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Onboard the pilot team's repos and one scanner source\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>Priority scoring, policy and fix deadlines\u003c/li>\n        \u003cli>\u003csvg class=\"i\" viewBox=\"0 0 24 24\">\u003cpath d=
