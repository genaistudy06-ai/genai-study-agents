\">This finding is ${esc(titleCase(f.status).toLowerCase())}.\u003c/p>`;\n  const reopenable = refs.cancelled || refs.closedUnmerged;\n  if (refs.ciStatus === \"no_ci\" && f.status === \"open\") h += `\u003cdiv class=\"callout c-amber\">\u003cp class=\"h\">No CI result after 7 days on ${esc(refs.branchName)}\u003c/p>\u003cp class=\"s\">Everlit stopped waiting and handed it to ${esc(r.owningTeam)}: open the PR by hand from the branch. The finding still closes only when a rescan stops seeing the vulnerable version.\u003c/p>${canRem ? `\u003cbutton class=\"btn btn-outline btn-xs mt2\" data-act=\"rem-open-manual\" data-id=\"${f.id}\">${ic(\"pr\", \"i-sm\")} Open the PR by hand\u003c/button>` : \"\"}\u003c/div>`;\n  if (refs.closedUnmerged && f.status === \"open\") h += `\u003cdiv class=\"callout c-amber\">\u003cp class=\"h\">PR #${refs.prNumber} was closed without merging\u003c/p>\u003cp class=\"s\">${esc(roleOfEmail(refs.closedUnmerged.by))} · ${fmtDate(refs.closedUnmerged.at)} · \"${esc(refs.closedUnmerged.note)}\". The finding is back with a person and its deadline keeps running.\u003c/p>\u003c/div>`;\n  if (refs.cancelled && f.status === \"open\") h += `\u003cdiv class=\"callout c-slate\">\u003cp class=\"h\">Fix cancelled by ${esc(roleOfEmail(refs.cancelled.by))}\u003c/p>\u003cp class=\"s\">${esc(refs.cancelled.reason)} · ${fmtDate(refs.cancelled.at)}. The branch is kept for reference.\u003c/p>\u003c/div>`;\n  const canStart = canRem && f.fixed && !refs.complexReason && ((!refs.branchName && !refs.prNumber) || reopenable);\n  if (canStart) h += `\u003cdiv>\u003cbutton class=\"btn btn-emerald\" data-act=\"rem-start\" data-id=\"${f.id}\">${reopenable ? \"Push a new fix branch\" : \"Push fix branch\"} (bump to ${esc(target)})\u003c/button>\u003c/div>`;\n  else if (!refs.branchName && !refs.prNumber && !refs.complexReason && f.status === \"open\" && !can(\"remediate\")) h += `\u003cp class=\"xs muted\">Starting a fix is done by security, engineering managers or the platform owner.\u003c/p>`;\n  if (refs.branchName && !refs.prNumber && !refs.complexReason && refs.ciStatus !== \"no_ci\" && !refs.cancelled) {\n    h += `\u003cdiv class=\"callout c-blue\">\u003cp class=\"h\">Fix branch pushed — waiting on the repo's CI${covers}\u003c/p>\u003cp class=\"s\">Branch: ${esc(refs.branchName)} → ${esc(refs.targetVersion)}\u003c/p>\u003cp class=\"s\">Everlit re-checks CI automatically on every maintenance run and opens the PR as soon as it passes.\u003c/p>${canRem ? `\u003cbutton class=\"btn btn-blue btn-xs mt2\" data-act=\"rem-check\" data-id=\"${f.id}\">Check now\u003c/button>` : \"\"}\u003c/div>`;\n  }\n  if (refs.prNumber && !refs.closedUnmerged && !refs.cancelled) {\n    const agent = refs.by === \"agent\";\n    h += `\u003cdiv class=\"callout c-emerald\">\u003cp class=\"h\">${agent ? \"Fix PR opened by SDLC agents after CI passed\" : \"Fix PR opened after CI passed\"}${covers}\u003c/p>\n      \u003cp class=\"s mono\">https://github.com/${esc(r.remote)}/pull/${refs.prNumber}\u003c/p>\n      \u003cp class=\"s\">Confidence: ${esc(refs.confidence || \"medium\")} · ${esc(refs.rollbackNote || \"Revert the PR.\")}\u003c/p>\u003c/div>` + (refs.targetVersion ? changelogNote(f, refs) : \"\");\n    if (agent && run) h += evidencePack(run);\n    if (!refs.merged) {\n      const canMerge = roleCan(me().role, \"mergeFixPr\");\n      h += `\u003cdiv class=\"row wrap\">${canMerge ? `\u003cbutton class=\"btn btn-indigo btn-xs\" data-act=\"pr-merge\" data-id=\"${f.id}\">${ic(\"merge\", \"i-sm\")} Approve &amp; merge on GitHub\u003c/button>` : \"\"}\u003cspan class=\"xs muted\">${agent ? \"Agents can't approve or merge their own PRs. \" : \"\"}Needs an approving review from ${esc(r.owningTeam)} (branch protection).\u003c/span>\u003c/div>`;\n    } else if (f.status === \"open\") {\n      h += `\u003cdiv class=\"callout c-slate\">\u003cp class=\"h\">Merged to ${esc(r.branch)} — waiting for a rescan to confirm\u003c/p>\u003cp class=\"s\">Everlit only closes the finding when a scan can see the vulnerable version is gone.\u003c/p>${can(\"scan\") ? `\u003cbutton class=\"btn btn-outline btn-xs mt2\" data-act=\"scan\" data-id=\"${r.id}\">${ic(\"refresh\", \"i-sm\")} Rescan ${esc(r.name)} now\u003c/button>` : \"\"}\u003c/div>`;\n    } else {\n      h += `\u003cdiv class=\"callout c-emerald\">\u003cp class=\"h\">${ic(\"checkCircle\", \"i-sm\")} Confirmed by rescan\u003c/p>\u003cp class=\"s\">The scan after the merge no longer detects ${esc(f.cve)}, so the scanner closed this finding.\u003c/p>\u003c/div>`;\n    }\n  }\n  if (canRem && refs.branchName && !refs.merged && !refs.cancelled && !refs.closedUnmerged && !refs.complexReason) h += inlineForm === \"cancel-fix\" ? `\u003cform class=\"reveal stack-sm box\" data-submit=\"rem-cancel\" data-id=\"${f.id}\">\u003clabel class=\"fl\">Why cancel this fix?\u003c/label>\u003cinput class=\"inp\" name=\"reason\" required style=\"width:100%\" placeholder=\"e.g. superseded by the framework upgrade\">\u003cdiv class=\"row\">\u003cbutton class=\"btn btn-outline btn-xs\" type=\"submit\">Cancel the fix\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" type=\"button\" data-act=\"inline\" data-f=\"\">Keep it\u003c/button>\u003c/div>\u003c/form>` : `\u003cdiv>\u003cbutton class=\"link xs\" data-act=\"inline\" data-f=\"cancel-fix\">Cancel this fix…\u003c/button>\u003c/div>`;\n  if (refs.ciFailed && f.status === \"open\") h += `\u003cdiv class=\"box\">\u003cp class=\"fw5 row\" style=\"gap:6px\">${ic(\"sparkles\", \"i-sm\")} CI failure triage \u003cspan class=\"xs muted\" style=\"font-weight:400\">AI suggestion\u003c/span>\u003c/p>\u003cp class=\"mt1\">The branch changes one thing, the ${esc(f.pkg.split(\":\").pop())} bump to ${esc(refs.targetVersion || \"\")}, and its base on ${esc(r.branch)} was green, so the failure is most likely caused by the bump rather than a flaky test. The failing log goes to the agents with the plan.\u003c/p>\u003c/div>`;\n  if (refs.complexReason && f.status === \"open\") {\n    const head = `\u003cp class=\"h row\" style=\"gap:8px\">${ic(\"bot\")} Complex fix · routed to SDLC agents${rm(3)}\u003c/p>\u003cp class=\"s\">${esc(refs.complexReason)}\u003c/p>${refs.ticket ? `\u003cp class=\"s\" style=\"opacity:.75\">Tracked in Jira ${esc(refs.ticket)} · ${esc(r.owningTeam)}\u003c/p>` : \"\"}`;\n    if (run && run.status === \"running\") h += `\u003cdiv class=\"callout c-violet\">${head}\u003c/div>` + agentWidget(run);\n    else if (run && run.status === \"failed\") h += `\u003cdiv class=\"callout c-violet\">${head}\u003c/div>` + agentWidget(run) + (canRem ? `\u003cdiv>\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"agent-start\" data-id=\"${f.id}\">${ic(\"refresh\", \"i-sm\")} Run the agents again\u003c/button>\u003c/div>` : \"\");\n    else h += `\u003cdiv class=\"callout c-violet\">${head}${canRem ? `\u003cp class=\"s mt2\">A planner, fixer, tester and security verifier work it on a branch and open a PR with an evidence pack once CI passes. Your team still reviews and merges.\u003c/p>\u003cdiv class=\"row wrap mt2\">\u003cbutton class=\"btn btn-violet btn-xs\" data-act=\"agent-start\" data-id=\"${f.id}\" data-tour=\"agent-start\">${ic(\"play\", \"i-sm\")} Start agents\u003c/button>\u003c/div>` : `\u003cp class=\"s mt2\" style=\"opacity:.75\">Agents are started by security, engineering managers or the platform owner.\u003c/p>`}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"stack-sm\">${h}\u003c/div>`;\n}\nfunction evidencePack(run) {\n  if (!run.evidence) return \"\";\n  return `\u003cdetails class=\"box\" open>\u003csummary class=\"fw5\" style=\"cursor:pointer\">Evidence pack from the agents\u003c/summary>\u003cul class=\"stack-sm mt2\">${run.evidence.map(([k, v]) => `\u003cli class=\"row\" style=\"align-items:flex-start;gap:8px\">\u003cspan style=\"color:#059669\">${ic(\"check\", \"i-sm\")}\u003c/span>\u003cspan>\u003cb>${esc(k)}:\u003c/b> ${esc(v)}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>\u003ca class=\"link xs mt2\" style=\"display:inline-block\" href=\"#/agents/${run.id}\">Open the full agent run →\u003c/a>\u003c/details>`;\n}\n\n/* ================================================================ SDLC agent runs (proposed) */\nconst AGENTS = [[\"planner\", \"Planner\", \"search\"], [\"fixer\", \"Fixer\", \"wrench\"], [\"tester\", \"Tester\", \"flask\"], [\"verifier\", \"Verifier\", \"shieldCheck\"], [\"handoff\", \"Hand-off\", \"pr\"]];\nfunction agentScript(run, f, r) {\n  const from = f.version, to = run.to, short = f.pkg.split(\":\").pop();\n  const br = `everlit-agent/${short}-${to}`;\n  let plan, attempts, evidence;\n  if (r.ecosystem === \"Maven\") {\n    plan = [`Ecosystem: Maven (${r.manifestFilename}). log4j-api and log4j-core must stay aligned`, `Advisories on ${short} ${from}: ${run.cves.join(\", \")}`, `Dependency tree: ${short} declared directly; no conflicting versions`, `Plan: bump to ${to}, verify the resolved version everywhere · risk: medium`];\n    attempts = [{ fix: [`Branch ${br}`, `${r.manifestFilename}: ${short} ${from} → ${to}`, `mvn dependency:tree: ${short} resolves to ${to}`], test: [\"mvn verify: 1,204 tests, 1 failure\", \"LoggingConfigTest › custom lookup plugin no longer registered\"], ok: false },\n                { fix: [\"Replaced the deprecated lookup plugin with a MapMessage layout\"], test: [\"mvn verify: 1,205 tests, 0 failures (+1 regression test)\", `Repo CI (${ciName(r)}) on branch: passed`], ok: true }];\n    evidence = [[\"Diff\", `${r.manifestFilename} version bump + 1 logging config class`], [\"Behaviour change handled\", \"lookup plugin replaced, output format unchanged\"], [\"Tests\", \"1,205/1,205 passing · 1 new regression test\"], [\"Security\", \"branch rescan clean · PR gate: nothing new introduced\"], [\"Rollback\", \"revert the PR. No data migrations\"]];\n  } else if (f.refs.ciFailed) {\n    plan = [`Picked up the bot branch ${f.refs.branchName}`, \"CI log: 2 failures in profile.spec.ts\", `Cause: ${to} stops forwarding Cookie/Authorization on cross-host redirects; tests asserted the old behaviour`, \"Plan: keep the bump, send auth explicitly to internal-api, update fixtures · risk: low\"];\n    attempts = [{ fix: [\"Reused the bot branch (no duplicate PR)\", \"src/profile.js: explicit Authorization for internal-api calls\", \"Updated 2 fixtures to the new redirect behaviour\"], test: [\"npm ci ✓ · npm test: 388 passed, 0 failed\", \"+2 regression tests: headers sent same-host, never cross-host\", `Repo CI (${ciName(r)}) on branch: passed`], ok: true }];\n    evidence = [[\"Diff\", \"1 source change, 2 fixtures updated, the bot's bump kept\"], [\"Why CI failed\", `intended security behaviour change in ${to}`], [\"Tests\", \"388/388 passing · 2 new regression tests\"], [\"Security\", \"branch rescan clean\"], [\"Rollback\", \"revert the PR\"]];\n  } else {\n    plan = [`Reading advisories + ${to} changelog: 3 breaking changes`, \"Import evidence: 4 call sites (src/auth/*.ts and the code sample)\", \"Breaking: verify() no longer defaults algorithms; insecure key sizes rejected\", `Plan: bump to ^${to}, pin algorithms explicitly at every call site · risk: medium`];\n    attempts = [{ fix: [`Branch ${br}`, `package.json ^${from} → ^${to} · lockfile regenerated`, \"Pinned { algorithms: ['RS256'] } at every verify() call\"], test: [\"npm ci ✓\", \"npm test: 212 passed, 2 failed\", \"auth.spec.ts › rejects legacy HS256 token: expected 401, got 500\"], ok: false },\n                { fix: [\"Mapped JsonWebTokenError → 401 in auth middleware\"], test: [\"npm test: 214 passed, 0 failed\", \"+6 regression tests for the patched call sites · coverage 81.2% → 82.0%\", `Repo CI (${ciName(r)}) on branch: passed`], ok: true }];\n    evidence = [[\"Diff\", \"package.json, lockfile, verify() call sites, 1 middleware change\"], [\"Breaking changes handled\", \"algorithm pinning, error-to-401 mapping\"], [\"Tests\", \"214/214 passing · 6 new regression tests · coverage +0.8%\"], [\"Security\", \"branch rescan clean · PR gate: nothing new introduced\"], [\"Rollback\", \"revert the PR. No data migrations\"]];\n  }\n  const ev = [], Ag = (k, s, x = {}) => ev.push({ t: \"agent\", k, s, ...x }), L = (k, text, kind = \"\") => ev.push({ t: \"log\", k, text, kind });\n  Ag(\"planner\", \"run\"); plan.forEach(x => L(\"planner\", x)); Ag(\"planner\", \"done\");\n  const att = run.fail ? [0, 1, 2].map(n => ({ fix: attempts[Math.min(n, attempts.length - 1)].fix.slice(0, n ? 1 : undefined), test: [\"Tests still failing: 3 failures in the integration suite\", \"e2e › checkout flow times out after the upgrade\"], ok: false })) : attempts;\n  att.forEach((a, n) => {\n    if (n) L(\"fixer\", `Attempt ${n + 1}/3: addressing the failing tests`, \"warn\");\n    Ag(\"fixer\", \"run\", { attempt: n + 1 }); a.fix.forEach(x => L(\"fixer\", x)); Ag(\"fixer\", \"done\");\n    Ag(\"tester\", \"run\"); a.test.forEach((x, j) => L(\"tester\", x, j === a.test.length - 1 ? (a.ok ? \"ok\" : \"err\") : \"\")); Ag(\"tester\", a.ok ? \"done\" : \"fail\");\n  });\n  if (run.fail) {\n    Ag(\"verifier\", \"skip\"); Ag(\"handoff\", \"run\");\n    L(\"handoff\", \"Stopped after 3 attempts. Tests are still failing. No PR opened.\", \"err\");\n    L(\"handoff\", `Escalated to ${r.owningTeam} with the plan, 3 attempted diffs and the failing test output`, \"warn\");\n    Ag(\"handoff\", \"fail\"); ev.push({ t: \"end\", ok: false });\n  } else {\n    Ag(\"verifier\", \"run\"); L(\"verifier\", `Rescan of branch: ${short} ${to}. Advisories not present`); L(\"verifier\", \"Scan healthy (every package answered), so not degraded\"); L(\"verifier\", \"PR gate on branch: 0 new findings introduced\", \"ok\"); Ag(\"verifier\", \"done\");\n    Ag(\"handoff\", \"run\"); L(\"handoff\", `Opened PR #${run.pr} with the evidence pack attached`, \"ok\"); L(\"handoff\", `Requested review from ${r.owningTeam} · 1 human approval required`); L(\"handoff\", \"Agents can't approve or merge their own PRs. Waiting for the team\", \"dim\"); Ag(\"handoff\", \"done\"); ev.push({ t: \"end\", ok: true });\n  }\n  return { ev, evidence };\n}\nfunction startAgentRun(f, fail) {\n  const r = repoById(f.repoId), g = groupOf(f);\n  const run = { id: \"run\" + (S.seq++), repoId: r.id, findingIds: g.map(x => x.id), pkg: f.pkg, from: f.version, to: f.refs.targetVersion || targetVersionFor(g), cves: g.map(x => x.cve), fail: Boolean(fail), status: \"running\", startedAt: iso(Date.now()), startedBy: S.session, pr: S.prSeq++, shown: 0, state: {}, attempt: 1, log: [] };\n  const sc = agentScript(run, f, r);\n  run.events = sc.ev; run.evidence = sc.evidence;\n  S.runs.push(run);\n  g.forEach(x => fhist(x, \"agents started\", `SDLC agents started on ${x.pkg} ${x.version} → ${run.to}`));\n  audit(\"agent\", \"agent.run_started\", `SDLC agents started on ${f.pkg} ${f.version} → ${run.to} (${r.name})`, r.id, run.id);\n  save(); setTimeout(tickRuns, 300);\n  return run;\n}\nlet runTimer = 0;\nfunction tickRuns() {\n  clearTimeout(runTimer);\n  const active = S.runs.filter(x => x.status === \"running\");\n  if (!active.length) return;\n  let finished = false;\n  active.forEach(run => {\n    const steps = reduceMotion ? run.events.length : 1;\n    for (let n = 0; n \u003c steps && run.shown \u003c run.events.length; n++) applyRunEvent(run, run.events[run.shown++]);\n    if (run.status !== \"running\") finished = true;\n  });\n  save();\n  if (finished) render();\n  else active.forEach(run => {\n    $$(`[data-run=\"${run.id}\"]`).forEach(el => { el.outerHTML = agentWidget(run); });\n    $$(`[data-run=\"${run.id}\"] .console`).forEach(log => { log.scrollTop = log.scrollHeight; });\n  });\n  if (S.runs.some(x => x.status === \"running\")) runTimer = setTimeout(tickRuns, 520);\n}\nfunction applyRunEvent(run, e) {\n  if (e.t === \"agent\") { run.state[e.k] = e.s; if (e.attempt) run.attempt = e.attempt; }\n  else if (e.t === \"log\") run.log.push({ k: e.k, text: e.text, kind: e.kind });\n  else if (e.t === \"end\") {\n    run.status = e.ok ? \"succeeded\" : \"failed\"; run.endedAt = iso(Date.now());\n    const r = repoById(run.repoId);\n    run.findingIds.forEach(id => {\n      const f = S.findings.find(x => x.id === id); if (!f) return;\n      if (e.ok) { f.refs = { by: \"agent\", agentRunId: run.id, branchName: `everlit-agent/${run.pkg.split(\":\").pop()}-${run.to}`, targetVersion: run.to, ciStatus: \"passed\", prNumber: run.pr, coversFindingIds: run.findingIds, confidence: \"medium\", rollbackNote: \"Revert the PR; no data migrations.\", previousReason: f.refs.complexReason, ticket: f.refs.ticket }; fhist(f, \"agent PR opened\", `PR #${run.pr} with evidence pack · awaiting ${r.owningTeam} review`); }\n      else fhist(f, \"agents escalated\", \"Stopped after 3 attempts; handed back to the team with diffs and failing tests\");\n    });\n    audit(\"agent\", e.ok ? \"agent.pr_opened\" : \"agent.escalated\", e.ok ? `SDLC agents opened PR #${run.pr} (${run.pkg} → ${run.to}) after CI passed` : `SDLC agents stopped after 3 attempts on ${run.pkg}; escalated to ${r.owningTeam}`, r.id, run.id);\n    toast(e.ok ? `Agents opened PR #${run.pr} for ${run.pkg.split(\":\").pop()} → ${run.to}` : `Agents stopped after 3 attempts and escalated to ${r.owningTeam}`, !e.ok);\n  }\n}\nfunction agentWidget(run) {\n  const st = AGENTS.map(([k, n, i]) => { const s = run.state[k] || \"queued\"; const lbl = { queued: \"Queued\", run: \"Running\", done: \"Done\", fail: \"Failed\", skip: \"Skipped\" }[s]; return `\u003cdiv class=\"ag\" data-s=\"${s}\">\u003cdiv class=\"an\">${ic(i, \"i-sm\")}${n}${k === \"fixer\" && run.attempt > 1 ? ` \u003cspan class=\"xs\" style=\"color:var(--amber-tx);font-weight:500\">${run.attempt}/3\u003c/span>` : \"\"}\u003c/div>\u003cdiv class=\"as\">${s === \"run\" ? `\u003cspan class=\"pulse\">\u003c/span>` : \"\"}${lbl}\u003c/div>\u003c/div>`; }).join(\"\");\n  const logs = run.log.map(l => `\u003cdiv>\u003cspan class=\"w\">${l.k}\u003c/span>\u003cspan class=\"${l.kind}\">${esc(l.text)}\u003c/span>\u003c/div>`).join(\"\");\n  const head = run.status === \"running\" ? `\u003cspan class=\"badge t-violet\">${ic(\"bot\", \"i-sm\")} Agents working\u003c/span>` : run.status === \"failed\" ? `\u003cspan class=\"badge t-rose\">${ic(\"xCircle\", \"i-sm\")} Escalated to a human · no PR opened\u003c/span>` : `\u003cspan class=\"badge t-emerald\">${ic(\"checkCircle\", \"i-sm\")} PR #${run.pr} opened\u003c/span>`;\n  return `\u003cdiv data-run=\"${run.id}\">\u003cdiv class=\"row between wrap\" style=\"margin-bottom:8px\">${head}\u003ca class=\"link xs\" href=\"#/agents/${run.id}\">Run details →\u003c/a>\u003c/div>\u003cdiv class=\"agents\">${st}\u003c/div>\u003cdiv class=\"console\" aria-live=\"polite\">${logs || `\u003cdiv>\u003cspan class=\"w\">everlit\u003c/span>\u003cspan class=\"dim\">Starting…\u003c/span>\u003c/div>`}\u003c/div>\u003c/div>`;\n}\nfunction viewRuns() {\n  const vr = new Set(visibleRepos().map(r => r.id));\n  const runs = S.runs.filter(x => vr.has(x.repoId)).slice().reverse();\n  const li = (icon, color, t) => `\u003cli class=\"row\" style=\"align-items:flex-start\">\u003cspan style=\"color:${color};display:inline-flex;margin-top:2px\">${ic(icon, \"i-sm\")}\u003c/span>\u003cspan>${t}\u003c/span>\u003c/li>`;\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Agent runs${rm(3)}\u003c/h1>\u003cp class=\"sub\">When a fix isn't a one-line bump (major versions, failed CI, coordinated multi-artifact upgrades), SDLC agents plan, fix, test and re-scan on a branch, then hand your team a PR with an evidence pack. Agents can't approve or merge their own work, accept risk, edit policy, or mark findings fixed — only a rescan can.\u003c/p>\u003c/div>\u003c/div>\n    ${card(`\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Run\u003c/th>\u003cth>Repo\u003c/th>\u003cth>Change\u003c/th>\u003cth>Status\u003c/th>\u003cth>Started by\u003c/th>\u003cth>Started\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${runs.map(x => `\u003ctr>\u003ctd>\u003ca class=\"flink\" href=\"#/agents/${x.id}\">${x.id}\u003c/a>\u003c/td>\u003ctd>${esc(repoById(x.repoId).name)}\u003c/td>\u003ctd class=\"mono\">${esc(x.pkg.split(\":\").pop())} ${esc(x.from)} → ${esc(x.to)}\u003c/td>\u003ctd>${x.status === \"running\" ? pill(\"running\", \"violet\") : x.status === \"failed\" ? pill(\"escalated\", \"rose\") : pill(`PR #${x.pr}`, \"emerald\")}\u003c/td>\u003ctd class=\"muted\">${esc(userName(x.startedBy))}\u003c/td>\u003ctd class=\"muted\">${fmtDT(x.startedAt)}\u003c/td>\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"6\" class=\"empty\">No agent runs yet. Complex fixes (for example jsonwebtoken in payments-api, or log4j-core in order-service) can be handed to the agents from the finding page.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`)}\n    \u003cdiv class=\"lg3\">${card(ch(\"The agent identity can\") + `\u003cul class=\"stack-sm sm\">${[\"Run scans and read findings for repos it's assigned\", \"Push a fix branch and open a PR after CI passes\", \"Comment, attach evidence, request review from the owning team\"].map(t => li(\"check\", \"#059669\", t)).join(\"\")}\u003c/ul>`)}\n    ${card(ch(\"It can never\") + `\u003cul class=\"stack-sm sm\">${[\"Approve or merge its own PR\", \"Approve exceptions or accept risk\", \"Edit policy, repo exposure or criticality\", \"Mark a finding fixed. Only a rescan can\"].map(t => li(\"x\", \"#e11d48\", t)).join(\"\")}\u003c/ul>`)}\n    ${card(ch(\"Guardrails\") + `\u003cul class=\"stack-sm sm\">${[\"Sandboxed; at most 3 fix ↔ test attempts, then escalates\", \"Every step lands in the audit log\", \"Never reports a success that didn't happen\", \"Runs on your approved model deployment; code never leaves your boundary\"].map(t => li(\"shieldCheck\", \"var(--indigo)\", t)).join(\"\")}\u003c/ul>`)}\u003c/div>\n  \u003c/div>`;\n}\nfunction viewRun(id) {\n  const run = S.runs.find(x => x.id === id);\n  if (!run || !visibleRepos().some(r => r.id === run.repoId)) return `\u003cdiv class=\"card pad\">Run not found. \u003ca class=\"link\" href=\"#/agents\">Back\u003c/a>\u003c/div>`;\n  const r = repoById(run.repoId);\n  const f = S.findings.find(x => x.id === run.findingIds[0]);\n  return `\u003cdiv class=\"stack\">\u003cdiv>\u003ca class=\"back\" href=\"#/agents\">← Agent runs\u003c/a>\u003cdiv class=\"row wrap mt2\" style=\"gap:12px\">\u003ch1 style=\"font-size:20px;font-weight:600\">${esc(run.pkg.split(\":\").pop())} ${esc(run.from)} → ${esc(run.to)}${rm(3)}\u003c/h1>\u003c/div>\u003cp class=\"sm muted mt1\">${esc(r.name)} · covers ${run.findingIds.length} finding${run.findingIds.length === 1 ? \"\" : \"s\"} (${run.cves.map(esc).join(\", \")}) · started by ${esc(userName(run.startedBy))} ${fmtDT(run.startedAt)}\u003c/p>\u003c/div>\n    \u003cdiv class=\"lg3\">\u003cdiv class=\"span2\">${card(ch(\"Run\", \"Planner → Fixer ↔ Tester → Security verifier → Hand-off\") + agentWidget(run))}\u003c/div>\n    \u003cdiv class=\"stack\">${card(ch(\"Result\") + (run.status === \"succeeded\" ? `\u003cp class=\"sm\" style=\"margin-bottom:12px\">PR #${run.pr} is waiting for ${esc(r.owningTeam)} to review.\u003c/p>` + evidencePack(run) : run.status === \"failed\" ? `\u003cp class=\"sm\">Stopped after 3 attempts and escalated to ${esc(r.owningTeam)} with the plan, the attempted diffs and the failing tests. The finding stays open; its SLA clock keeps running.\u003c/p>` : `\u003cp class=\"sm muted\">Still running…\u003c/p>`) + (f ? `\u003ca class=\"link xs mt3\" style=\"display:inline-block\" href=\"#/findings/${f.id}\">Open the finding →\u003c/a>` : \"\"))}\u003c/div>\u003c/div>\u003c/div>`;\n}\n\n/* ================================================================ repos (src/app/repos) */\nfunction viewRepos() {\n  const repos = visibleRepos();\n  return `\u003cdiv class=\"stack\">\u003cdiv class=\"ph\">\u003cdiv>\u003ch1>Repositories\u003c/h1>\u003cp class=\"sub\">Each repo carries the context the priority score uses: owning team, internet exposure and business criticality.\u003c/p>\u003c/div>${can(\"onboardRepo\") ? `\u003ca class=\"btn btn-indigo\" href=\"#/repos/new\" data-tour=\"onboard\">${ic(\"plus\")} Onboard repo\u003c/a>` : \"\"}\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>Repository\u003c/th>\u003cth>Team\u003c/th>\u003cth>Ecosystem\u003c/th>\u003cth>Exposure\u003c/th>\u003cth>Criticality\u003c/th>\u003cth>Open findings\u003c/th>\u003cth>Merge blocking\u003c/th>\u003cth>Last scan\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${repos.map(r => { const o = S.findings.filter(f => f.repoId === r.id && f.status === \"open\").map(calc); const crit = o.filter(c => c.sev === \"critical\").length; const last = S.scans.filter(s => s.repoId === r.id).map(s => s.startedAt).sort().at(-1); return `\u003ctr class=\"hov\">\u003ctd>\u003ca class=\"flink\" href=\"#/repos/${r.id}\">${esc(r.name)}\u003c/a>\u003cp class=\"meta\">${ic(\"branch\", \"i-sm\")} ${esc(r.remote)}\u003c/p>\u003c/td>\u003ctd class=\"muted\">${esc(r.owningTeam)}\u003c/td>\u003ctd>${pill(esc(r.ecosystem))}\u003c/td>\u003ctd>${r.internetFacing ? pill(\"internet-facing\", \"rose\") : pill(\"internal\")}\u003c/td>\u003ctd>${esc(titleCase(r.criticalityTier))}\u003c/td>\u003ctd>\u003cspan class=\"row\" style=\"gap:6px\">${o.length}${crit ? pill(`${crit} critical`, \"rose\") : \"\"}\u003c/span>\u003c/td>\u003ctd class=\"muted\">${r.mergeBlocking === \"inherit\" ? `inherit (${S.mergeBlockingEnabled ? \"on\" : \"off\"})` : r.mergeBlocking}\u003c/td>\u003ctd class=\"muted\">${last ? fmtDT(last) : \"—\"}\u003c/td>\u003c/tr>`; }).join(\"\") || `\u003ctr>\u003ctd colspan=\"8\" class=\"empty\">No repos yet.\u003c/td>\u003c/tr>`}\n    \u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/div>`;\n}\nlet scanProg = null; // { repoId, step }\nfunction viewRepo(id) {\n  const r = visibleRepos().find(x => x.id === id);\n  if (!r) return `\u003cdiv class=\"card pad\">\u003cp class=\"fw6\">Repository not found\u003c/p>\u003cp class=\"sm muted mt1\">It doesn't exist, or your role can't see it.\u003c/p>\u003c/div>`;\n  const u = me();\n  const fs = S.findings.filter(f => f.repoId === r.id && [\"open\", \"suppressed\", \"accepted_risk\"].includes(f.status)).map(f => ({ f, c: calc(f) })).sort((a, b) => b.c.score - a.c.score);\n  const scans = S.scans.filter(s => s.repoId === r.id).sort((a, b) => b.startedAt.localeCompare(a.startedAt));\n  const riskEdit = can(\"editRepoRisk\"), basicEdit = can(\"editRepo\") && (u.role !== \"engineering_manager\" || u.team === r.owningTeam);\n  const changes = S.audit.filter(a => a.repoId === r.id && a.category === \"repo\");\n  return `\u003cdiv class=\"stack\">\n    \u003cdiv>\u003ca class=\"back\" href=\"#/repos\">← Repositories\u003c/a>\n      \u003cdiv class=\"ph mt2\">\u003cdiv>\u003cdiv class=\"row wrap\" style=\"gap:10px\">\u003ch1>${esc(r.name)}\u003c/h1>${pill(esc(r.ecosystem))}${r.internetFacing ? pill(\"internet-facing\", \"rose\") : pill(\"internal\")}${pill(`${titleCase(r.criticalityTier)} criticality`)}\u003c/div>\n        \u003cp class=\"sub\">${esc(r.owningTeam)} · GitHub · ${esc(r.remote)} @ ${esc(r.branch)}${r.source === \"sbom\" ? \" · inventory from a CycloneDX SBOM uploaded by CI\" : \"\"}\u003c/p>\u003c/div>\n        \u003cdiv class=\"row wrap\">${can(\"scan\") ? `\u003cbutton class=\"btn btn-indigo\" data-act=\"scan\" data-id=\"${r.id}\" ${scanProg ? \"disabled\" : \"\"} data-tour=\"scan\">${ic(\"refresh\")} ${scanProg && scanProg.repoId === r.id ? \"Scanning…\" : \"Scan now\"}\u003c/button>` : \"\"}\u003ca class=\"btn btn-outline\" href=\"#/repos/${r.id}/pr-gate\" data-tour=\"prgate\">${ic(\"pr\")} PR gate\u003c/a>${can(\"exportVex\") ? `\u003cbutton class=\"btn btn-outline\" data-act=\"vex\" data-id=\"${r.id}\">${ic(\"download\")} VEX\u003c/button>` : \"\"}\u003c/div>\u003c/div>\u003c/div>\n    ${scanProg && scanProg.repoId === r.id ? card(`\u003cdiv class=\"row between wrap\">\u003cspan class=\"fw5 sm\">Scanning ${esc(r.name)}\u003c/span>\u003cdiv class=\"steps\">${[\"Ingestion\", \"Detection\", \"Normalization\", \"Scoring\", \"Policy\"].map((s, i) => `\u003cspan class=\"step ${i \u003c scanProg.step ? \"done\" : i === scanProg.step ? \"run\" : \"\"}\">\u003cspan class=\"sd\">${i \u003c scanProg.step ? ic(\"check\") : \"\"}\u003c/span>${s}\u003c/span>`).join(\"\")}\u003c/div>\u003c/div>`) : \"\"}\n    \u003cdiv class=\"lg3\">\n      \u003cdiv class=\"span2 stack\">\n        ${receiptCard(r)}\n        ${card(ch(\"Open & suppressed findings\") + `\u003cdiv class=\"tw\">\u003ctable class=\"t compact\">\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Severity\u003c/th>\u003cth>Finding\u003c/th>\u003cth>Status\u003c/th>\u003cth>Deadline\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${fs.map(({ f, c }) => `\u003ctr>\u003ctd>${priorityBadge(c.sev, c.score)}\u003c/td>\u003ctd>${cvssBadge(f.cvss)}\u003c/td>\u003ctd>${roleCanSee(u.role, \"findings\") ? `\u003ca class=\"flink\" href=\"#/findings/${f.id}\">${esc(f.title)}\u003c/a>` : esc(f.title)}\u003cp class=\"meta\">${esc(f.pkg)}@${esc(f.version)} · ${esc(f.cve)} ${f.kev ? kevBadge() : \"\"}\u003c/p>\u003c/td>\u003ctd>${statusBadge(f.status)}\u003c/td>\u003ctd>${dueBadge(c.due, f.status)}\u003c/td>\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"5\" class=\"empty\">No open findings. 🎉\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`)}\n        ${card(ch(\"SBOM source\", `${esc(r.manifestFilename)} · what the last scan read`) + `\u003cpre class=\"ta\" style=\"margin:0;max-height:260px;overflow:auto;white-space:pre\">${esc(r.manifest)}\u003c/pre>`)}\n        ${card(ch(\"Scan history\") + scanTable(scans, true))}\n      \u003c/div>\n      \u003cdiv class=\"stack\">\n        ${card(ch(\"Repo details\", \"Ownership, exposure and criticality drive priority; merge blocking drives the PR gate\") + `\u003cform class=\"stack-sm\" data-submit=\"repo-edit\" data-id=\"${r.id}\">\n          \u003cdiv>\u003clabel class=\"fl\">Owning team\u003c/label>\u003cinput class=\"inp\" name=\"owningTeam\" value=\"${esc(r.owningTeam)}\" style=\"width:100%\" ${riskEdit ? \"\" : \"disabled\"}>\u003c/div>\n          \u003cdiv>\u003clabel class=\"fl\">Team POC email\u003c/label>\u003cinput class=\"inp\" name=\"poc\" value=\"${esc(r.pocTeamEmail)}\" style=\"width:100%\" ${basicEdit ? \"\" : \"disabled\"}>\u003c/div>\n          \u003cdiv>\u003clabel class=\"fl\">Criticality tier\u003c/label>\u003cselect class=\"sel\" name=\"tier\" style=\"width:100%\" ${riskEdit ? \"\" : \"disabled\"}>${[\"critical\", \"high\", \"medium\", \"low\"].map(t => `\u003coption ${t === r.criticalityTier ? \"selected\" : \"\"}>${t}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\n          \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" name=\"internet\" ${r.internetFacing ? \"checked\" : \"\"} ${riskEdit ? \"\" : \"disabled\"}>\u003cspan class=\"tr\">\u003c/span>\u003cspan class=\"sm\">Internet-facing\u003c/span>\u003c/label>\n          \u003cdiv>\u003clabel class=\"fl\">Merge blocking\u003c/label>\u003cselect class=\"sel\" name=\"mb\" style=\"width:100%\" ${basicEdit ? \"\" : \"disabled\"}>${[[\"inherit\", `Inherit org setting (${S.mergeBlockingEnabled ? \"on\" : \"off\"})`], [\"block\", \"Block\"], [\"warn\", \"Warn only\"]].map(([v, l]) => `\u003coption value=\"${v}\" ${v === r.mergeBlocking ? \"selected\" : \"\"} ${!riskEdit && v !== \"block\" && v !== r.mergeBlocking ? \"disabled\" : \"\"}>${l}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\n          ${basicEdit || riskEdit ? `\u003cbutton class=\"btn btn-indigo btn-xs\" type=\"submit\">Save changes\u003c/button>` : \"\"}\n          \u003cp class=\"xs muted\">${riskEdit ? \"Changes re-score every finding in this repo and are recorded in the change history.\" : basicEdit ? \"Owning team, criticality, exposure and loosening merge blocking are security-only.\" : \"Read-only for your role.\"}\u003c/p>\u003c/form>`)}\n        ${card(ch(\"Scan settings\", \"When this repo is scanned automatically\") +\n          (can(\"scan\") ? `\u003cselect class=\"sel\" data-act-change=\"scan-freq\" data-id=\"${r.id}\" style=\"height:34px\" data-tour=\"scan-freq\">${[[\"manual\", \"Manual only\"], [\"daily\", \"Daily\"], [\"weekly\", \"Weekly\"]].map(([v, l]) => `\u003coption value=\"${v}\" ${v === r.freq ? \"selected\" : \"\"}>${l}\u003c/option>`).join(\"\")}\u003c/select>` : `\u003cp class=\"sm fw5\">${r.freq === \"manual\" ? \"Manual only\" : esc(titleCase(r.freq))}\u003c/p>`) +\n          `\u003cp class=\"xs muted mt1\">${r.freq === \"manual\" ? \"Nothing runs automatically — only the Scan now button on this page triggers a scan.\" : `Next scheduled scan: \u003cstrong>${fmtDT(r.nextScanAt || Date.now() + (r.freq === \"daily\" ? 1 : 7) * D)}\u003c/strong>. Pushes to ${esc(r.branch)} also trigger a scan.`}\u003c/p>\n          \u003cdiv style=\"border-top:1px solid var(--border);margin:16px 0\">\u003c/div>\n          \u003cdl class=\"fields sm\">${field(\"Default branch\", esc(r.branch))}${field(\"Connector\", \"GitHub (acme) · push and pull_request webhooks\")}${field(\"Last scan\", scans[0] ? `${fmtDT(scans[0].startedAt)} · ${esc(scans[0].trigger)}` : \"—\")}\u003c/dl>`)}\n        ${overridesCard(r)}\n        ${card(ch(\"Change history\", \"Who changed this repo's ownership, scoring inputs, branch, manifest or schedule\") + (changes.length ? `\u003cul class=\"stack-sm\">${changes.slice(0, 8).map(a => `\u003cli class=\"xs muted\">\u003cspan class=\"fw5\" style=\"color:var(--foreground)\">${esc(a.what)}\u003c/span>\u003cbr>${esc(userName(a.actor))} — ${fmtDT(a.at)}\u003c/li>`).join(\"\")}\u003c/ul>` : `\u003cp class=\"sm muted\">No changes recorded.\u003c/p>`))}\n      \u003c/div>\n    \u003c/div>\u003c/div>`;\n}\nfunction receiptCard(r) {\n  const sc = latestScan(r); if (!sc || !sc.coverage) return \"\";\n  const c = sc.coverage, pct = covPct(c);\n  return card(ch(\"Coverage receipt\", `What the latest scan checked · ${fmtDT(sc.startedAt)}`, pill(`${pct}% covered`, pct === 100 ? \"emerald\" : \"amber\"), \"Every scan records what it read and whether each source answered. A finding only auto-closes when coverage is complete, so a gap can never hide a vulnerability.\") +\n    `\u003cdiv class=\"receipt\">\n      \u003cdiv>\u003cp class=\"k\">Manifests\u003c/p>\u003cp class=\"v\">${c.manifests.length} scanned\u003c/p>\u003cp class=\"xs muted\">${c.manifests.map(esc).join(\", \")}\u003c/p>\u003c/div>\n      \u003cdiv>\u003cp class=\"k\">Dependencies\u003c/p>\u003cp class=\"v\">${c.checked} of ${c.deps} checked\u003c/p>\u003cp class=\"xs muted\">exact versions resolved\u003c/p>\u003c/div>\n      \u003cdiv>\u003cp class=\"k\">OSV.dev\u003c/p>\u003cp class=\"v\">${c.osvComplete ? \"Every package answered\" : `${c.waiting} awaiting answer`}\u003c/p>\u003cp class=\"xs muted\">affected and fixed ranges\u003c/p>\u003c/div>\n      \u003cdiv>\u003cp class=\"k\">FIRST EPSS\u003c/p>\u003cp class=\"v\">${c.epssOk ? \"Scores for every CVE\" : \"Retrying\"}\u003c/p>\u003cp class=\"xs muted\">exploit probability\u003c/p>\u003c/div>\n      \u003cdiv>\u003cp class=\"k\">CISA KEV\u003c/p>\u003cp class=\"v\">Synced ${c.kevAgeHours} h earlier\u003c/p>\u003cp class=\"xs muted\">daily catalog sync\u003c/p>\u003c/div>\n      \u003cdiv>\u003cp class=\"k\">Policy\u003c/p>\u003cp class=\"v mono\">v${esc(sc.policyVersion || policyV())}\u003c/p>\u003cp class=\"xs muted\">rules this scan applied\u003c/p>\u003c/div>\n    \u003c/div>${c.osvComplete ? `\u003cp class=\"xs muted mt3\">${ic(\"checkCircle\", \"i-sm\")} Every package got an answer, so findings that disappeared were allowed to auto-close.\u003c/p>` : `\u003cdiv class=\"callout c-amber mt3\">\u003cp class=\"s\">${c.waiting} packages are awaiting the OSV.dev answer · retried automatically on the next run · nothing was auto-closed in the meantime.\u003c/p>\u003c/div>`}`, \"\", \"coverage\");\n}\nfunction overridesCard(r) {\n  const u = me(), list = S.overrides.filter(o => o.repoId === r.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt));\n  const st = o => o.status === \"active\" && new Date(o.expiresAt) \u003c= Date.now() ? \"expired\" : o.status;\n  return card(ch(\"Gate overrides\", \"Break-glass for a blocked or incomplete PR: approved by a second person, always expires\", \"\", \"Requested from the PR gate. A different security engineer or platform owner approves it. While active, the PR check passes with the override named on it; the PR comment still shows the real verdict.\") +\n    (list.length ? `\u003cul class=\"divide\">${list.map(o => { const s2 = st(o); return `\u003cli style=\"padding:10px 0\">\u003cdiv class=\"row between wrap\" style=\"gap:8px\">\u003cspan class=\"fw5\">PR #${o.pr} · ${esc(o.verdict.replace(/_/g, \" \"))}\u003c/span>${pill(s2, s2 === \"active\" ? \"amber\" : s2 === \"pending\" ? \"blue\" : \"neutral\")}\u003c/div>\u003cp class=\"xs mt1\">${esc(o.reason)}\u003c/p>\u003cp class=\"xs muted mt1\">Requested by ${esc(roleOfEmail(o.requestedBy))} · ${o.hours} h${o.approvedBy ? ` · approved by ${esc(roleOfEmail(o.approvedBy))}` : \"\"}${s2 === \"active\" ? ` · until ${fmtDT(o.expiresAt)}` : \"\"}\u003c/p>\n      ${s2 === \"pending\" && can(\"approveGateOverride\") && o.requestedBy !== u.email ? `\u003cdiv class=\"row mt2\">\u003cbutton class=\"btn btn-emerald btn-xs\" data-act=\"ovr-approve\" data-id=\"${o.id}\">Approve override\u003c/button>\u003cbutton class=\"btn btn-outline btn-xs\" data-act=\"ovr-reject\" data-id=\"${o.id}\">Reject\u003c/button>\u003c/div>` : s2 === \"pending\" && o.requestedBy === u.email ? `\u003cp class=\"xs mt1\" style=\"color:var(--amber-tx)\">Waiting for a different security reviewer.\u003c/p>` : \"\"}\n      ${s2 === \"active\" && can(\"approveGateOverride\") ? `\u003cbutton class=\"btn btn-outline btn-xs mt2\" data-act=\"ovr-revoke\" data-id=\"${o.id}\">Revoke now\u003c/button>` : \"\"}\u003c/li>`; }).joi g-bottom:6px\">\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" name=\"internet\" ${can(\"editRepoRisk\") ? \"\" : \"disabled\"}>\u003cspan class=\"tr\">\u003c/span>\u003cspan class=\"sm\">Internet-facing\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n      \u003cdiv>\u003clabel class=\"fl\">SBOM (CycloneDX JSON or SPDX)\u003c/label>\u003ctextarea class=\"ta\" name=\"sbom\" rows=\"12\" spellcheck=\"false\">${esc(SAMPLE_SBOM)}\u003c/textarea>\u003c/div>\n      \u003cdetails class=\"box\">\u003csummary class=\"xs fw5\" style=\"cursor:pointer\">Add this step to the build (GitHub Actions)\u003c/summary>\u003cpre class=\"ta mt2\" style=\"white-space:pre;overflow:auto;margin-bottom:0\">- name: Send SBOM to Everlit\n  run: |\n    curl -sf -X POST https://everlit.acme.example/api/sbom/\\${{ github.repository }} \\\\\n      -H \"Authorization: Bearer \\${{ secrets.EVERLIT_SBOM_TOKEN }}\" \\\\\n      --data-binary @bom.cdx.json\u003c/pre>\u003c/details>\n      \u003cdiv class=\"row wrap\">\u003cbutton class=\"btn btn-indigo\" type=\"submit\">${ic(\"upload\")} Onboard &amp; scan SBOM\u003c/button>\u003cspan class=\"xs muted\">Every later upload rescans automatically.\u003c/span>\u003c/div>\n    \u003c/form>`)}\u003c/div>`;\n  const avail = GH_REPOS.filter(g => !S.repos.some(r => r.remote === g.remote));\n  const head = `\u003cdiv>\u003ca class=\"back\" href=\"#/repos\">← Repositories\u003c/a>\u003cdiv class=\"ph mt2\">\u003cdiv>\u003ch1>Onboard repo\u003c/h1>\u003cp class=\"sub\">Pick a repository from your connected GitHub organization. Everlit reads its manifest and lockfile from the default branch, registers webhooks and runs a baseline scan right away.\u003c/p>\u003c/div>\u003c/div>\u003c/div>${seg}`;\n  if (!avail.length) return `\u003cdiv class=\"stack\" style=\"max-width:820px\">${head}${card(`\u003cp class=\"sm\">Every repository in \u003cb>acme\u003c/b> is already onboarded.\u003c/p>`)}\u003c/div>`;\n  const g0 = avail[0];\n  return `\u003cdiv class=\"stack orders/OrderController.java\n+++ b/src/main/java/com/acme/orders/OrderController.java\n@@ -55,2 +55,10 @@ public class OrderController {\n+  @PostMapping(\"/orders/import\")\n+  public Order importOrder(HttpServletRequest request) throws Exception {\n+    log.info(\"Import requested by \" + request.getHeader(\"X-User\"));\n+    ObjectInputStream in = new ObjectInputStream(request.getInputStream());\n+    Order order = (Order) in.readObject();\n+    jdbc.execute(\"UPDATE orders SET status='IMPORTED' WHERE id=\" + request.getParameter(\"id\"));\n+    return order;\n+  }\n`,\n};\nconst openPkg = (r, pkg) => S.findings.some(f => f.repoId === r.id && f.pkg === pkg && f.status === \"open\");\nconst AI_CHECKS = [\n  { id: \"sqli\", re: /\\b(SELECT|INSERT|UPDATE|DELETE)\\b.*(\\$\\{|[\"']\\s*\\+\\s*(req|request)\\b)/i, cwe: \"CWE-89\", conf: \"high\", title: \"SQL query built from request input\",\n    why: () => \"The query text is assembled from a value the caller controls, so a crafted value can change what the query does (SQL injection).\",\n    fix: r => r.ecosystem === \"Maven\" ? `jdbc.update(\"UPDATE orders SET status='IMPORTED' WHERE id = ?\", request.getParameter(\"id\"));` : `const [refund] = await db.query('SELECT * FROM refunds WHERE id = $1', [req.params.id]);` },\n  { id: \"eval\", re: /\\beval\\s*\\(/, cwe: \"CWE-95\", conf: \"high\", title: \"Dynamic code execution on caller input\",\n    why: () => \"eval() runs whatever text it receives. If that text can come from a user or a job file, it is remote code execution.\",\n    fix: r => r.ecosystem === \"PyPI\" ? \"result = ast.literal_eval(user_expr)  # literals only, never code\" : \"const value = JSON.parse(input);  // data only, never code\" },\n  { id: \"proto\", re: /(_\\.merge|_\\.defaultsDeep|Object\\.assign)\\s*\\(.*req\\.body/, cwe: \"CWE-1321\", conf: \"high\", title: \"Deep merge of the request body (prototype pollution)\",\n    why: r => \"Merging an untrusted object deep into your defaults lets a epo's PyYAML version also has open code-execution advisories.\" : \"\"),\n    fix: () => \"job = yaml.safe_load(f)\" },\n  { id: \"shell\", re: /shell\\s*=\\s*True|Runtime\\.getRuntime\\(\\)\\.exec|child_process\\.exec\\(/, cwe: \"CWE-78\", conf: \"high\", title: \"Shell command built from data\",\n    why: () => \"A file name containing ; or $(...) would run extra commands on the host.\",\n    fix: () => \"subprocess.run(['tar', '-xf', job['archive']], check=True)\" },\n  { id: \"tls\", re: /verify\\s*=\\s*False|rejectUnauthorized\\s*:\\s*false/, cwe: \"CWE-295\", conf: \"high\", title: \"TLS certificate checks turned off\",\n    why: () => \"Anyone on the network path can impersonate the callback server and read or alter the traffic.\",\n    fix: () => 'requests.get(job[\"callback\"], verify=\"/etc/ssl/certs/acme-internal-ca.pem\", timeout=10)' },\n  { id: \"deser\", re: /ObjectInputStream|\\.readObject\\(/, cwe: \"CWE-502\", conf: \"high\", title: \"Java deserialization of request data\",\n    why: () => \"Deserializing a request body with ObjectInputStream lets a crafted payload run code through gadget classes on the classpath.\",\n    fix: () => \"Order order = objectMapper.readValue(request.getInputStream(), OrderImportDto.class).toOrder();\" },\n  { id: \"logi\", re: /log\\.(info|warn|error|debug)\\(.*\\+\\s*(request|req)\\./, cwe: \"CWE-117\", conf: \"high\", title: \"Caller input written straight to the log\",\n    why: r => \"Header values go into the log unescaped, so they can forge log lines.\" + (openPkg(r, \"org.apache.logging.log4j:log4j-core\") ? \" With log4j-core 2.14.1 still on this service, a ${jndi:...} header would trigger Log4Shell.\" : \"\"),\n    fix: () => 'log.info(\"Import requested by {}\", sanitize(request.getHeader(\"X-User\")));' },\n];\nconst INJECTION_RE = /ignore (all |any )?(previous|prior) instructions|approve this (pr|pull request)/i;\nfunction parseDiff(text) {\n  const out = []; let file = \"\", line = 0;\n  text.split(/\\r?\\ h would contain)\u003c/label>\u003ctextarea class=\"ta\" rows=\"14\" id=\"gateManifest\" data-tour=\"gate-text\">${esc(draft)}\u003c/textarea>\n      \u003cp class=\"xs muted mt1\">${r.ecosystem === \"npm\" ? `Try adding \u003ccode>\"node-fetch\": \"2.6.0\"\u003c/code> to dependencies, or bumping \u003ccode>lodash\u003c/code> to \u003ccode>4.17.21\u003c/code>.` : r.ecosystem === \"PyPI\" ? `Try bumping \u003ccode>pyyaml\u003c/code> to \u003ccode>5.4\u003c/code>, or adding \u003ccode>jinja2==2.10\u003c/code>.` : `Try bumping log4j-core to \u003ccode>2.17.1\u003c/code>.`}\u003c/p>\u003c/div>\n      \u003cdiv data-tour=\"gate-diff\">\u003clabel class=\"fl\">Code change in this PR (unified diff) · reviewed by the AI pass ${S.aiReview.enabled ? \"\" : \"(AI review is off on the Policy page)\"}${rm(3)}\u003c/label>\u003ctextarea class=\"ta\" rows=\"12\" id=\"gateDiff\" spellcheck=\"false\">${esc(mine && gateResult.diff != null ? gateResult.diff : SAMPLE_DIFF[r.ecosystem] || SAMPLE_DIFF.npm)}\u003c/textarea>\n      \u003cp class=\"xs muted mt1\">Only this diff is sent to the review model, never the rest of the repository. Try fixing a flagged line and running the gate again. Any other manifest this diff adds or edits (for example \u003ccode>services/worker/${esc(r.manifestFilename)}\u003c/code>) is scanned too.\u003c/p>\u003c/div>\n      \u003cdiv>\u003cbutton class=\"btn btn-indigo btn-lg\" data-act=\"gate-run\" data-id=\"${r.id}\" ${mine && gateResult.pending ? \"disabled\" : \"\"}>${mine && gateResult.pending ? \"Scanning both branches…\" : \"Run pre-merge gate check\"}\u003c/button>\u003c/div>\n      ${mine && gateResult.error ? `\u003cp class=\"sm\" style=\"color:#e11d48\">${esc(gateResult.error)}\u003c/p>` : \"\"}\n      ${mine && gateResult.res ? gatePanel(gateResult.res, r) : \"\"}\u003c/div>`)}\u003c/div>`;\n}\nconst MANIFEST_FILES = [\"package.json\", \"package-lock.json\", \"requirements.txt\", \"poetry.lock\", \"Pipfile.lock\", \"pom.xml\", \"go.mod\", \"Gemfile.lock\", \"Cargo.lock\", \"composer.lock\", \"packages.lock.json\"];\n/* every other manifest the PR touches is scanned too (monorepos): its added lines are parsed like the main manifest */\nfunction diffManifests(r, diff) {\n  const by = new Map();\n  parseDiff(diff || \"\").forEach(a => { const base = a.file.split(\"/\").pop(); if (!MANIFEST_FILES.includes(base) || a.file === r.manifestFilename) return; by.set(a.file, (by.get(a.file) || []).concat(a.code)); });\n  return [...by].map(([file, lines]) => {\n    const deps = [], txt = lines.join(\"\\n\");\n    if (r.ecosystem === \"npm\") { const re = /\"([@\\w./-]+)\"\\s*:\\s*\"[\\^~>=\u003c\\s]*(\\d[^\"]*)\"/g; let m; while ((m = re.exec(txt))) if (![\"version\", \"name\"].includes(m[1])) deps.push({ name: m[1], version: m[2], scope: \"direct-runtime\" }); }\n    else if (r.ecosystem === \"PyPI\") txt.split(\"\\n\").forEach(l => { const m = l.trim().match(/^([A-Za-z0-9_.\\-]+)\\s*==\\s*([0-9][^\\s;#]*)/); if (m) deps.push({ name: m[1].toLowerCase(), version: m[2], scope: \"direct-runtime\" }); });\n    else { try { deps.push(...parseManifest(r.ecosystem, txt)); } catch (_) {} }\n    return { file, deps };\n  });\n}\nfunction runGate(r, text, diff = \"\") {\n  const fake = { ...r, manifest: text };\n  const base = detect(r), next = detect(fake);\n  const key = m => `${m.pkg}|${m.cve}`;\n  const baseKeys = new Set(base.map(key));\n  const accepted = new Set(S.findings.filter(f => f.repoId === r.id && [\"suppressed\", \"accepted_risk\", \"false_positive\"].includes(f.status)).map(f => `${f.pkg}|${f.cve}`).concat(S.suppressions.filter(x => x.repoId === r.id && x.advisory && x.status === \"active\").map(x => `${x.advisory.pkg}|${x.advisory.cve}`)));\n  const enrich = m => { const b = computePriorityScore({ cvssScore: m.cvss, epss: m.epss, kev: m.kev, reachable: m.ev.reachable, reachabilityKnown: m.ev.known, internetFacing: r.internetFacing, criticalityTier: r.criticalityTier, dependencyScope: m.scope }); const d = decidePolicy(b.priorityScore, enabledRules(), { kev: m.kev, internet: r.internetFacing }); return { ...m, score: b.priorityScore, sev: b.severityNormalized, comps: b.components, rule: d.ruleName, action: d.action, blocks: d.blocksMerge, manifest: m.manifest || r.manifestFilename }; };\n  const extras = diffManifests(r, diff);\n  const extraHits = extras.flatMap(x => x.deps.flatMap(d => ADV.filter(a => a.eco === r.ecosystem && a.pkg === d.name && affects(a, d.version)).map(a => ({ ...a, version: d.version, scope: d.scope, ev: importEvidence(r, d), manifest: x.file }))));\n  const newF = next.filter(m => !baseKeys.has(key(m)) && !accepted.has(key(m))).concat(extraHits.filter(m => !accepted.has(key(m)))).map(enrich);\n  const acc = next.filter(m => !baseKeys.has(key(m)) && accepted.has(key(m))).concat(extraHits.filter(m => accepted.has(key(m)))).map(enrich);\n  const pre = next.filter(m => baseKeys.has(key(m))).map(enrich);\n  const nextKeys = new Set(next.map(key));\n  const resolved = base.filter(m => !nextKeys.has(key(m))).length;\n  const blocking = newF.filter(m => m.blocks).length;\n  const incomplete = S.ui.osvOutage || S.ui.engineError;\n  const gateStatus = incomplete ? \"incomplete\" : blocking && blockingFor(r) ? \"blocked\" : newF.length ? \"pass_with_comments\" : \"pass\";\n  let deps = 0; try { deps = parseManifest(r.ecosystem, text).length; } catch (_) {}\n  deps += extras.reduce((a, x) => a + x.deps.length, 0);\n  const waiting = S.ui.osvOutage ? Math.min(2, deps) : S.ui.engineError ? deps : 0;\n  const coverage = { deps, checked: deps - waiting, waiting, manifests: [r.manifestFilename, ...extras.map(x => x.file)], osvComplete: !S.ui.osvOutage, epssOk: true, kevAgeHours: scanCoverage(r, false).kevAgeHours };\n  return { newF, acc, pre, resolved, blocking, gateStatus, coverage, pr: prOf(r), mergeBase: sha256(r.id + r.branch + \"merge-base\").slice(0, 7), text, why: S.ui.engineError ? \"engine\" : S.ui.osvOutage ? \"osv\" : \"\" };\n}\n/* the check run Everlit version} brings ${m.cve}, priority ${m.score} (${pts(m)}). Rule \"${m.rule}\" blocks merges on ${r.name}. Options: ${m.fixed ? `use ${m.fixed} or later` : \"wait for an upstream fix\"}, or dispute the verdict as an exception.`);\n  if (res.gateStatus === \"pass_with_comments\") return res.newF.map(m => `${m.pkg.split(\":\").pop()} ${m.version} brings ${m.cve}, priority ${m.score} (${pts(m)}). Rule \"${m.rule}\" ${m.blocks ? \"would block, but merge blocking is off for this repo\" : \"comments without blocking\"}.`);\n  return [\"Nothing new: every vulnerable dependency in this change was already on the target branch, or none was added.\"];\n}\nlet aiDismissOpen = null;\nfunction aiPanel(ai, r) {\n  const dep = S.aiReview.deployment === \"self_hosted\" ? \"Self-hosted model\" : \"Approved cloud model (org opt-in)\";\n  const items = ai.found.map((x, i) => `\u003cli class=\"ai-item ${x.state !== \"open\" ? \"done\" : \"\"}\">\n      \u003cdiv class=\"row between wrap\" style=\"gap:8px\">\u003cdiv class=\"row wrap\" style=\"gap:8px\">\u003cspan class=\"ai-tag\">${ic(\"sparkles\", \"i-sm\")} AI suggestion\u003c/span>\u003cspan class=\"fw5\">${esc(x.title)}\u003c/span>\u003c/div>\u003cspan class=\"xs muted\">${esc(x.cwe)} · confidence ${esc(x.conf)}\u003c/span>\u003c/div>\n      \u003cp class=\"xs mono mt2\">\u003cb>${esc(x.file)}:${x.line}\u003c/b>${x.also.length ? ` \u003cspan class=\"muted\">(also line ${x.also.join(\", \")})\u003c/span>` : \"\"}\u003c/p>\n      \u003cpre class=\"ai-code\">${esc(x.code)}\u003c/pre>\n      \u003cp class=\"sm mt2\">${esc(x.why)}\u003c/p>\n      \u003cp class=\"fl mt2\" style=\"margin-bottom:4px\">Suggested change\u003c/p>\u003cpre class=\"ai-code fix\">${esc(x.fix)}\u003c/pre>\n      \u003cdiv class=\"row wrap mt2\" style=\"gap:8px\">${x.state === \"open\" ? (aiDismissOpen === i ? `\u003cform class=\"row wrap\" style=\"gap:8px\" data-submit=\"ai-dismiss\" data-i=\"${i}\">\u003cselect class=\"sel\" name=\"reason\" style=\"height:30px;fon
